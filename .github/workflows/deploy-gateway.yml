name: Build & Push Gateway Image

# Publishes the FastAPI gateway image to Docker Hub (default: rkhoja/aleph).
# Auth uses the same secret names as ualberta-rcg/warewulf-rke2-hami:
#   DOCKER_HUB_USER, DOCKER_HUB_TOKEN
# Optional override for the image name:
#   DOCKER_HUB_REPO secret or repository Variable (default: rkhoja/aleph)

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: 'Immutable image tag override (default: gateway-<shortsha>)'
        required: false
        default: ''
      STABLE_TAG:
        description: 'Stable moving tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    name: Build & Push Gateway
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image repository
        id: repo
        env:
          SECRET_REPO: ${{ secrets.DOCKER_HUB_REPO }}
          VAR_REPO: ${{ vars.DOCKER_HUB_REPO }}
        run: |
          set -euo pipefail
          REPO="${SECRET_REPO}"
          if [ -z "${REPO}" ]; then
            REPO="${VAR_REPO}"
          fi
          if [ -z "${REPO}" ]; then
            REPO="rkhoja/aleph"
          fi
          echo "IMAGE_REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_REPO=${REPO}"

      - name: Resolve tags
        id: tags
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.IMAGE_TAG }}
          INPUT_STABLE_TAG: ${{ github.event.inputs.STABLE_TAG }}
          VAR_STABLE_TAG: ${{ vars.STABLE_TAG }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_TAG="${INPUT_IMAGE_TAG}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="gateway-${SHORT_SHA}"
          fi

          STABLE_TAG="${INPUT_STABLE_TAG}"
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="${VAR_STABLE_TAG}"
          fi
          if [ -z "${STABLE_TAG}" ]; then
            STABLE_TAG="latest"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "STABLE_TAG=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using IMAGE_TAG=${IMAGE_TAG}"
          echo "Using STABLE_TAG=${STABLE_TAG}"

      - name: Login to DockerHub
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --no-cache \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}" \
            -t "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}" \
            gateway

      - name: Push image to DockerHub
        run: |
          set -euo pipefail
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.IMAGE_TAG }}"
          docker push "${{ steps.repo.outputs.IMAGE_REPO }}:${{ steps.tags.outputs.STABLE_TAG }}"
