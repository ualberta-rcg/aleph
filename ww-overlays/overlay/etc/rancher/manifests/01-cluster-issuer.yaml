# Let's Encrypt ClusterIssuer — RKE2 auto-deploy manifest.
#
# APPLIES TO: all nodes (cluster-wide component).
# SITE VALUES: __ACME_EMAIL__  (see ww-overlays/SITE-VALUES.md)
#
# cert-manager ACME, HTTP-01 challenge served on port 80 through the Traefik ingress class.
# This issues the endpoint TLS certs from within the cluster (no external certbot machine,
# unlike cluster 232's manual flow) and auto-renews them.
#
# READY STATE: cert-manager (00-cert-manager.yaml) must be up first, and port 80 must be
# reachable at the endpoint (Traefik must be exposed). Until then the issuer shows Ready=False
# with a challenge/solver reason, which is expected.
# POST-DEPLOY: add a Certificate CR per endpoint hostname once Traefik + port 80 are wired
# (see ww-overlays/post-deploy/certificate.example.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production ACME directory.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            # Uses the Traefik ingress class (the bundled rke2-traefik).
            ingressClassName: traefik
