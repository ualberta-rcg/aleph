# HAMi — RKE2 auto-deploy manifest (vGPU scheduler + device plugin).
#
# APPLIES TO: GPU nodes (the device-plugin DaemonSet only schedules on nodes labeled gpu=on).
#             The chart objects are cluster-wide but only do work where GPUs + the label exist.
# SITE VALUES: __K8S_VERSION__  (see ww-overlays/SITE-VALUES.md)
#
# Source: cluster 230's /etc/rancher/manifests/hami.yaml. Replaces both nvidia-device-plugin
# and the NVIDIA GPU Operator: HAMi provides the device plugin + the fractional-GPU scheduler
# (binpack GPU policy; each L40S split into 10 vGPU slices).
#
# PREREQUISITES — handled by the Warewulf node image, NOT by this manifest:
#   - NVIDIA driver + nvidia-container-cli on the GPU nodes.
#   - containerd "nvidia" runtime + nvidia RuntimeClass (the rke2-gpu overlay sets these).
#   - GPU nodes labeled  gpu=on  (baked by the WW image; without it the device-plugin
#     DaemonSet won't schedule and nvidia.com/gpu stays absent).
#
# SITE-CONFIG: scheduler.kubeScheduler.imageTag MUST match the cluster's Kubernetes version
# (HAMi ships a patched kube-scheduler). Set __K8S_VERSION__ to e.g. v1.36.1.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: hami
  namespace: kube-system
spec:
  targetNamespace: kube-system
  chart: hami
  repo: https://project-hami.github.io/HAMi/
  valuesContent: |-
    scheduler:
      kubeScheduler:
        imageTag: "__K8S_VERSION__"
    # Host provides the NVIDIA driver + toolkit; the WW GPU overlay sets the
    # containerd default runtime to "nvidia".
    devicePlugin:
      runtimeClassName: "nvidia"
