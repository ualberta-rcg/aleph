# Istio + Kubeflow mesh scaffolding — RKE2 auto-deploy manifest (Job).
#
# APPLIES TO: all nodes (cluster-wide serving stack). No site values to fill.
#
# One of the per-component serving-stack Jobs (split out of the old monolithic
# kubeflow-bootstrap). Applies the Istio slice of kubeflow/manifests v1.11-branch — the SAME
# overlays running on 230/232 — plus the Kubeflow namespace/roles/Istio-resources scaffolding
# that the rest of the stack (Knative, KServe) depends on.
#
# Installs: cert-manager kubeflow issuer, Istio (CRDs + namespace + control plane +
# cluster-local-gateway), kubeflow namespace + roles + Istio Gateway/VS resources.
#
# Prerequisite: cert-manager (00-cert-manager.yaml). This Job waits for it, then proceeds.
# Re-run:  kubectl delete job istio-bootstrap -n kube-system  (then re-touch the file).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-bootstrap
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istio-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: istio-bootstrap
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: istio-bootstrap
  namespace: kube-system
  annotations:
    description: "Installs Istio + Kubeflow mesh scaffolding from kubeflow/manifests v1.11"
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: istio-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.2
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== Istio + mesh scaffolding bootstrap ==="

              # Wait for cert-manager to be GENUINELY ready (namespace exists + pods Ready).
              # `kubectl wait --all` returns immediately on an empty namespace, which at a cold
              # boot (cert-manager HelmChart still installing) breaks the intended ordering — so
              # loop until it is really up instead of no-oping through.
              echo "--- Waiting for cert-manager ---"
              for i in $(seq 1 60); do
                if kubectl get namespace cert-manager >/dev/null 2>&1 && \
                   kubectl wait --for=condition=Ready pods --all -n cert-manager --timeout=5s >/dev/null 2>&1; then
                  break
                fi
                echo "  [$i/60] cert-manager not ready, retrying in 10s..."
                sleep 10
              done

              # Clone kubeflow manifests, retrying until outbound egress/DNS is ready. At a cold
              # boot the cluster DNS forwarder lags the Job start by a minute or two, so the first
              # clone(s) fail with "Could not resolve host: github.com" and — with no retry — the
              # Job exhausts backoffLimit and stays Failed forever. Retry instead of dying.
              cd /tmp
              echo "--- Cloning kubeflow/manifests v1.11-branch (retries until egress ready) ---"
              for i in $(seq 1 40); do
                rm -rf /tmp/manifests
                if git clone --depth=1 --branch v1.11-branch https://github.com/kubeflow/manifests.git; then
                  break
                fi
                echo "  [$i/40] clone failed (egress/DNS not ready?), retrying in 15s..."
                sleep 15
              done
              if [ ! -d /tmp/manifests/.git ]; then
                echo "ERROR: could not clone kubeflow/manifests after retries"; exit 1
              fi
              cd /tmp/manifests

              # 1. Kubeflow namespace FIRST. common/istio/istio-install/base and
              #    common/istio/kubeflow-istio-resources/base both contain objects in the
              #    `kubeflow` namespace, so it must exist before they are applied — otherwise
              #    "namespaces kubeflow not found" aborts the whole Job under `set -e`.
              echo "--- Step 1: Kubeflow namespace ---"
              kubectl apply -k common/kubeflow-namespace/base

              # 2. cert-manager issuer (Kubeflow internal TLS).
              echo "--- Step 2: cert-manager kubeflow issuer ---"
              kubectl apply -k common/cert-manager/kubeflow-issuer/base

              # 3. Istio CRDs + namespace + control plane.
              echo "--- Step 3: Istio ---"
              kubectl apply -k common/istio/istio-crds/base
              kubectl apply -k common/istio/istio-namespace/base
              kubectl apply -k common/istio/istio-install/base
              kubectl wait --for=condition=Ready pods --all -n istio-system --timeout=600s || true

              # 4. cluster-local-gateway (the Knative mesh gateway).
              echo "--- Step 4: cluster-local-gateway ---"
              kubectl apply -k common/istio/cluster-local-gateway/base

              # 5. Kubeflow roles + Istio Gateway/VS scaffolding (ns created in step 1).
              echo "--- Step 5: Kubeflow roles + Istio resources ---"
              kubectl apply -k common/kubeflow-roles/base
              kubectl apply -k common/istio/kubeflow-istio-resources/base

              echo ""
              echo "=== Istio + mesh scaffolding bootstrap complete ==="
          resources:
            requests: { cpu: "500m", memory: 512Mi }
            limits:   { cpu: "2", memory: 1Gi }
