# inotify limits — common overlay (OPTIONAL polish).
#
# APPLIES TO: all nodes.
# TARGET PATH on node: /etc/sysctl.d/90-inotify.conf   Apply: sysctl --system
# SITE VALUES: none.
#
# Why: the default fs.inotify.max_user_instances (128) is low for nodes running many
# pods (KServe/Knative/Istio sidecars each open watches). Exhaustion shows up as
# "too many open files" / failed watches and flaky pod startup. 1024 instances is a
# safe headroom bump; max_user_watches is already high in the base image.
#
# To remove this polish, delete this file from the overlay.
fs.inotify.max_user_instances = 1024
