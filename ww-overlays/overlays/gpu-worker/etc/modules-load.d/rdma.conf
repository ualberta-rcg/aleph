# RDMA / RoCE kernel modules for GPU workers (NCCL over RoCE).
# NODE TYPE: GPU workers only.
#
# Without these, the RoCE device does not appear under /sys/class/infiniband
# the way the device plugin expects, and `rdma/roce` is never advertised.
#
# bnxt_re (Broadcom RoCE) auto-loads with bnxt_en, so it is not listed here.
# ib_umad is the piece commonly missing on a fresh image — it is required for
# the device plugin to enumerate the HCA; ib_uverbs provides user verbs that
# NCCL uses at runtime.
ib_core
ib_uverbs
ib_umad
rdma_cm
rdma_ucm
