# Edge routing for inference.vulcan.alliancecan.ca — POST-DEPLOY (apply once, not auto-deployed).
# Reconstructed 2026-08-22 after the WW reprovision wiped etcd (the live .71-era objects
# were never committed to the repo — only the retired kubeflow backup host's were).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inference-vulcan-https
  namespace: tyk
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`inference.vulcan.alliancecan.ca`) && PathPrefix(`/`)
      services:
        - name: gateway-svc-tyk-oss-tyk-gateway
          port: 8080
  tls:
    secretName: inference-vulcan-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inference-vulcan-http-redirect
  namespace: tyk
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`inference.vulcan.alliancecan.ca`) && PathPrefix(`/`)
      priority: 1
      middlewares:
        - name: inference-redirect-https
      services:
        - name: gateway-svc-tyk-oss-tyk-gateway
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inference-redirect-https
  namespace: tyk
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inference-vulcan-tls
  namespace: tyk
spec:
  secretName: inference-vulcan-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - inference.vulcan.alliancecan.ca
