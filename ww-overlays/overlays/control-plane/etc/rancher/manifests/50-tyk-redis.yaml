# Tyk Redis (Bitnami) — RKE2 auto-deploy manifest.
#
# APPLIES TO: all nodes (cluster-wide component). No site values to fill.
#
# Tyk OSS requires Redis for rate limiting / API-key storage. Deployed into ns `tyk`, ahead
# of Tyk (51-tyk.yaml). Standalone, auth enabled. Persistence is REQUIRED: API keys live
# only in Redis and cannot be re-derived from hashes. A Redis pod eviction without a PVC
# would destroy every key.
#
# Release name `tyk-redis` produces Service `tyk-redis-master` and Secret `tyk-redis`
# (key `redis-password`) — both referenced by the Tyk values in 51-tyk.yaml.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: tyk-redis
  namespace: kube-system
spec:
  targetNamespace: tyk
  createNamespace: true
  chart: redis
  repo: https://charts.bitnami.com/bitnami
  failurePolicy: abort
  valuesContent: |-
    auth:
      enabled: true
    architecture: standalone
    master:
      persistence:
        enabled: true
        storageClass: nfs-models
        size: 2Gi
        accessModes:
          - ReadWriteOnce
    replica:
      replicaCount: 0
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 128Mi }
