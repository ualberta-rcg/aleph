# model-gateway — RKE2 auto-deploy manifest (RBAC + Service + Deployment).
#
# APPLIES TO: all nodes (cluster-wide; runs on control-plane VMs only via nodeSelector).
# No site values to fill — image is published to Docker Hub by CI on every gateway/** push.
#
# The model-gateway is the card-driven FastAPI inference gateway:
#   MetalLB VIP :80 → Tyk (auth) → model-gateway :8080 → KServe pods (HAMi vGPU)
#
# IMAGE: pinned to an immutable CI build tag rkhoja/aleph:gateway-<sha> (NOT :latest — avoids
#        silent drift / accidental rollbacks). CI auto-builds the gateway-<sha> tag on every
#        gateway/** push (~4 min). Bump this tag here after each gateway commit that you want
#        live, then let the addon reconcile the Deployment.
#        imagePullPolicy: IfNotPresent (immutable tag — no re-pull needed).
#
# PREREQUISITE: the `models` namespace is created by 62-kserve.yaml. If this manifest
# applies before that Job completes, k8s will retry — safe, converges automatically.
#
# The gateway is pinned to control-plane (non-GPU) VMs so it never competes with model pods
# for GPU-node resources. Stateless: all state is in K8s ConfigMaps/ISVCs via K8s Watches.
#
# SIZING (sized for ~200 concurrent streaming users): 3 replicas spread across the 3 CP
# nodes (podAntiAffinity), 2 cores / 1Gi each. The original 1×(500m/512Mi) replica CFS-
# throttled its single uvicorn event loop under load, which made the 1s /healthz liveness
# probe time out → kubelet killed the healthy pod → CrashLoopBackOff → the whole inference
# edge went dark (it is the only front door for all models). Probes are now lenient enough
# (3s liveness + a 3-min startupProbe) that card-seeding and transient stalls never trip it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-gateway
  namespace: models
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-gateway
  namespace: models
rules:
  # Cards: the gateway watches model detail ConfigMaps for live routing table updates.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Live model state (ready, replicas, host).
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Predictor pods: map a model -> the node it landed on (for usage/accounting).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-gateway
  namespace: models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-gateway
subjects:
  - kind: ServiceAccount
    name: model-gateway
    namespace: models
---
# Cluster-scoped: read node hardware labels (aleph.gpu/product etc) so usage
# records can attribute requests to a concrete GPU SKU / node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-gateway-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-gateway-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-gateway-nodes
subjects:
  - kind: ServiceAccount
    name: model-gateway
    namespace: models
---
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: models
  labels:
    app: model-gateway
spec:
  type: ClusterIP
  selector:
    app: model-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-gateway-usage-logs
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: models
  labels:
    app: model-gateway
spec:
  replicas: 3
  # Edge: never drop below desired during a rollout, so restarts/updates are zero-downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: model-gateway
      # Pinned to control-plane (non-GPU) nodes — covers all CP VMs (HA or single).
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: NotIn
                    values: ["on"]
        # Spread the replicas across control-plane nodes so a node loss or a restart
        # never drops the inference edge, and so we don't stack replicas on whichever
        # CP node is already CPU-limit-overcommitted.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: model-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: rkhoja/aleph:gateway-b37897c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODELS_NAMESPACE
              value: models
            # Fairshare/accounting: site tag stamped on every usage record.
            # Set per cluster (e.g. "aleph-vulcan"); defaults to "aleph".
            - name: SITE_NAME
              value: aleph
            # Usage/accounting log on RWX NFS so it survives pod replacement.
            # subPathExpr isolates each replica into its own directory.
            - name: GATEWAY_USAGE_LOG
              value: /var/log/aleph/usage.log
            # Long generations (large-context reasoning models) exceed the 300s
            # httpx default; match Tyk's 600s proxy/read/write timeouts end-to-end.
            - name: UPSTREAM_TIMEOUT
              value: "600"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: usage-log
              mountPath: /var/log/aleph
              subPathExpr: $(POD_NAME)
          resources:
            # Sized for ~200 concurrent streaming users. Async (I/O-bound) proxy, so
            # 2 cores/replica x 3 replicas is comfortable headroom. Request 500m
            # guarantees each pod a half-core so the probe is never starved.
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          # startupProbe owns the boot window: /healthz stays 503 until the ~187 model
          # cards + ISVCs seed from the K8s API. 18 x 10s = 3min budget so a slow seed
          # never trips liveness.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        # Usage/accounting log on shared NFS (RWX). Each replica writes under
        # $(POD_NAME)/ via subPathExpr so files never interleave. Tail with:
        #   kubectl exec -n models deploy/model-gateway -c gateway -- tail -f /var/log/aleph/usage.log
        - name: usage-log
          persistentVolumeClaim:
            claimName: model-gateway-usage-logs
