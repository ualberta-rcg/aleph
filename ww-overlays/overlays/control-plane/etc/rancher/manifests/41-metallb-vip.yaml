# MetalLB VIP pool — RKE2 auto-deploy manifest (IPAddressPool + L2Advertisement).
#
# APPLIES TO: CONTROL-PLANE nodes (the VIP is L2-advertised out the public NIC of whichever
#             control-plane node MetalLB elects leader). SITE VALUES: 129.128.190.71, enp6s20
#             (see SITE-VALUES.md)
#
# Tells MetalLB which IP to own and on which NIC to L2-advertise it. Paired with:
#   - 40-metallb.yaml .................. installs MetalLB (must run first; provides the CRDs)
#   - etc/netplan/60-public-vip.yaml ... numbers the public NIC per-node + preferred default route
#   - 42-traefik-loadbalancer.yaml ..... the public LoadBalancer Service (rke2-traefik-public)
#                                        that consumes this pool — the real public edge
#
# A type=LoadBalancer Service with no loadBalancerIP gets the (single) IP from this pool, so the
# Traefik public edge ends up on 129.128.190.71 automatically. (Tyk is intentionally ClusterIP-internal,
# behind Traefik — see 52-tyk-loadbalancer.yaml.)
#
# THE VIP FLOATS — it is NOT bound to any one node. Each control-plane node carries its OWN real
# public IP (__PUBLIC_NIC_IP__, from etc/netplan/60-public-vip.yaml, all in the 129.128.190.71 /28); the
# VIP (129.128.190.71) is a SEPARATE address MetalLB advertises from the elected leader and moves on
# failover. No VIP-on-`lo`; the per-node public IP gives the leader a symmetric return path.
#
# nodeSelectors restricts L2 advertisement to control-plane nodes (only they carry the public
# NIC enp6s20) — this is also what makes the VIP HA across the 3 control-plane VMs.
#
# 2026-07-20: edge moved to 129.128.190.71 (.71) on public NIC enp6s20 (enp6s19, .64/28,
# per-node .67/.68/.69, gw .65); all 3 control-plane VMs are numbered, so any can L2-own and
# reply for the VIP. (Live temporarily ran the public NIC as enp6s20 — runtime TLC while the
# real IPs were nailed down; the reprovision/image NIC is enp6s20 = enp6s19.)
#
# !! CRD-RACE (expected, benign) !! These are metallb.io/v1beta1 custom resources that can only
# apply AFTER 40-metallb.yaml's HelmChart installs the MetalLB CRDs. At a cold boot RKE2 applies
# this file before the chart finishes, so the first apply logs "no matches for kind IPAddressPool"
# -- RKE2's addon reconciler retries until the CRDs exist and it converges. No manual step.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-vip
  namespace: metallb-system
spec:
  addresses:
    - 129.128.190.71/32                   # a single IP (a.b.c.d/32) or a range; see SITE-VALUES.md
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-vip
  interfaces:
    - enp6s20               # the control-plane public NIC (enp6s19); see SITE-VALUES.md
  nodeSelectors:                   # only control-plane nodes carry the public NIC -> advertise there (HA across the 3 CP VMs)
    - matchLabels:
        node-role.kubernetes.io/control-plane: "true"
