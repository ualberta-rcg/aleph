# RDMA shared device plugin (Mellanox k8s-rdma-shared-dev-plugin)
# -----------------------------------------------------------------------------
# Exposes the GPU nodes' RoCE NIC into pods as the schedulable resource
# `rdma/roce`, so NCCL can run collectives over RDMA instead of TCP sockets.
#
# NODE TYPE: advertises only on GPU workers (nodeSelector gpu=on).
# Auto-deploy: lands on the first control-plane only; applies cluster-wide.
#
# REQUIREMENTS on each GPU worker (see gpu-worker overlay):
#   - RoCE NIC up with an IP (the NCCL out-of-band / RoCE interface)
#   - kernel modules loaded: ib_uverbs, ib_umad, rdma_ucm, rdma_cm
#     (baked via overlays/gpu-worker/etc/modules-load.d/rdma.conf)
#   - bnxt_re loads automatically with bnxt_en for Broadcom NICs
#
# IMPORTANT (container side): the device being injected is NOT enough. NCCL
# also needs a userspace verbs provider in the container that matches the host
# kernel driver ABI. For Broadcom bnxt_re (out-of-tree, ABI 8) the inbox
# rdma-core provider only speaks ABI 1 and NCCL falls back to TCP. See
# ww-overlays/NCCL-ROCE.md for the per-pod provider-injection recipe.
#
# `rdmaHcaMax` is how many pods on a node may share the single RoCE HCA.
# `ifNames` selects the active RoCE interface; set to __ROCE_IFNAME__ for
# this site (the NIC that carries the RoCE GID / is PORT_ACTIVE).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rdma-devices
  namespace: kube-system
data:
  config.json: |
    {
      "configList": [
        {
          "resourceName": "roce",
          "rdmaHcaMax": 63,
          "selectors": { "ifNames": ["__ROCE_IFNAME__"] }
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rdma-shared-dp-ds
  namespace: kube-system
  labels:
    app: rdma-shared-dp
spec:
  selector:
    matchLabels:
      app: rdma-shared-dp
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rdma-shared-dp
    spec:
      hostNetwork: true
      nodeSelector:
        gpu: "on"
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: rdma-shared-dp
          image: ghcr.io/mellanox/k8s-rdma-shared-dev-plugin:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /k8s-rdma-shared-dev-plugin
            - name: devs
              mountPath: /dev/
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: config
          configMap:
            name: rdma-devices
            items:
              - key: config.json
                path: config.json
        - name: devs
          hostPath:
            path: /dev/
