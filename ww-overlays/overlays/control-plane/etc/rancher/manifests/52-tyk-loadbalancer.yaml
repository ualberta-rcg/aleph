# Tyk internal exposure — RKE2 auto-deploy manifest.
#
# APPLIES TO: all nodes (cluster-wide Service). No site values to fill.
#
# NAME NOTE: the Service keeps the historical `tyk-gateway-nodeport` name so older scripts that
# reference it do not break, but it is now ClusterIP-only. Public traffic enters through Traefik
# (42-traefik-loadbalancer.yaml), which terminates TLS and proxies to Tyk internally.
#
# The tyk-oss chart also creates `gateway-svc-tyk-oss-tyk-gateway`; both Services select the same
# pod. This compatibility Service is intentionally not public.
#
# ORDER: Traefik owns the single MetalLB VIP from 41-metallb-vip.yaml. Tyk must not be a
# LoadBalancer or it will consume the only address in the pool.
apiVersion: v1
kind: Service
metadata:
  name: tyk-gateway-nodeport
  namespace: tyk
  labels:
    app: gateway-tyk-oss-tyk-gateway
spec:
  type: ClusterIP
  selector:
    app: gateway-tyk-oss-tyk-gateway
    release: tyk-oss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
