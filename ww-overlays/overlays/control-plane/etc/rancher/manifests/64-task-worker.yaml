# ---------------------------------------------------------------------------
# 64-task-worker.yaml — Asynchronous Task System (/v1/tasks)
#
# Standalone manifest so existing Warewulf files (63-model-gateway.yaml)
# remain untouched. Copy to /etc/rancher/manifests/64-task-worker.yaml on
# control-plane nodes.
#
# Optional site SMTP settings are read from ConfigMap/aleph-task-config
# (created manually on the cluster, never committed to git).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aleph-tasks
  namespace: models
  labels:
    app: aleph-task-worker
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aleph-task-worker
  namespace: models
  labels:
    app: aleph-task-worker
spec:
  selector:
    app: aleph-task-worker
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aleph-task-worker
  namespace: models
  labels:
    app: aleph-task-worker
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aleph-task-worker
  template:
    metadata:
      labels:
        app: aleph-task-worker
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: model-gateway
      terminationGracePeriodSeconds: 660
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: aleph-task-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: task-worker
          image: rkhoja/aleph:gateway-5b1c20b@sha256:40b3f2df7d1be5ad3cdecefba4ba3d95c67c3e5f78dfeaeccc3e9bd2a0d811ef
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "task_worker:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aleph-task-config
                optional: true
          env:
            - name: MODELS_NAMESPACE
              value: models
            - name: SITE_NAME
              value: aleph
            - name: TASKS_DIR
              value: /tasks
            - name: TASK_STORAGE_MODE
              value: local
            - name: TASK_WORKER_LOCAL
              value: "1"
            - name: REDIS_URL
              value: redis://tyk-redis.tyk.svc.cluster.local:6379
            - name: UPSTREAM_TIMEOUT
              value: "600"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: tasks-storage
              mountPath: /tasks
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: tasks-storage
          persistentVolumeClaim:
            claimName: aleph-tasks
