# netplan — public VIP interface for MetalLB.
#
# APPLIES TO: HEAD/edge nodes ONLY (the nodes that own the public NIC / advertise the VIP).
#             Do NOT bake this onto GPU workers.
# TARGET PATH on node: /etc/netplan/60-public-vip.yaml   Apply: netplan apply
# SITE VALUES: __PUBLIC_NIC__, __PUBLIC_SUBNET__, __PUBLIC_GW__, __VIP__  (see SITE-VALUES.md)
#
# Recipe (proven in production): public NIC UP but IP-free (unnumbered) — MetalLB owns the VIP at
# L2; public subnet on-link via the NIC (DESTINATION routing — replies to public hosts route out
# the NIC by destination, which is what actually works).
#
# NOTE: the VIP itself is NOT carried here. netplan cannot address `lo`, and the `dummy:` /
# `dummy-devices:` key is rejected on this netplan build (the whole file fails to parse), so the
# VIP-as-local-address piece lives in a systemd oneshot instead:
#   etc/systemd/system/metallb-vip-lo.service  → `ip address add __VIP__/32 dev lo`
# This file now does only the NIC plumbing (IP-free + on-link route).
#
# Fallback if the on-link route is rejected on your distro:
#   ip route add __PUBLIC_SUBNET__ dev __PUBLIC_NIC__
network:
  version: 2
  ethernets:
    __PUBLIC_NIC__:
      dhcp4: false
      dhcp6: false
      addresses: []                # IP-free (unnumbered) — MetalLB owns the VIP at L2
      routes:
        - to: __PUBLIC_SUBNET__    # on-link via this NIC (destination routing)
          scope: link
        # Optional — EXTERNAL (Internet) clients only: make this NIC the default gw.
        # Safe: the cluster subnet stays on the cluster NIC's connected route.
        # - to: default
        #   via: __PUBLIC_GW__
