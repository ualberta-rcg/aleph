# sysctl — MetalLB public VIP.
#
# APPLIES TO: HEAD/edge nodes ONLY (those that own the public NIC). Not GPU workers.
# TARGET PATH on node: /etc/sysctl.d/99-public-vip.conf   Apply: sysctl --system
#
# Uses `all.*` so no interface name is hard-coded. For production you may prefer to scope
# arp_ignore / arp_announce to ONLY the public NIC (e.g. net.ipv4.conf.<PUBLIC_NIC>.arp_ignore)
# to avoid touching the cluster NIC / Calico. rp_filter MUST stay 0 regardless of scope.

# rp_filter MUST be 0: the reverse path for public sources is asymmetric (in the public NIC,
# reverse via the cluster NIC), so strict/loose silently drops the inbound SYN.
net.ipv4.conf.all.rp_filter = 0

# Only the MetalLB-elected leader may answer ARP for the VIP (multi-head: prevents every head
# answering -> ARP conflict).
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
