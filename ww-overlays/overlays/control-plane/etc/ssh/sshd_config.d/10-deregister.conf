# Let sshd accept the node-deregister forced-command key IN ADDITION to the normal per-user keys.
# We add an extra AuthorizedKeysFile path rather than editing root's ~/.ssh/authorized_keys, so the
# admin/Warewulf keys already in place are never clobbered. Ubuntu's sshd Includes this drop-in dir.
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2 /etc/ssh/deregister.authorized_keys
