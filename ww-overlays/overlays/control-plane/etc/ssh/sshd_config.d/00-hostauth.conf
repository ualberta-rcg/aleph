# Enable sshd hostbased authentication so the Vulcan login nodes — trusted via
# /etc/ssh/shosts.equiv plus their host keys in /etc/ssh/ssh_known_hosts — can SSH to an Aleph
# control-plane node WITHOUT a per-node key. This is how the aleph-tyk-pam PAM hook (running on
# each login node at session open) reaches tyk-admin.sh HERE to auto-provision every user's
# personal Tyk API key on login (see ~/login-node-working/aleph-tyk-pam/). Without this drop-in
# the hook cannot authenticate and key provisioning silently no-ops.
#
# IgnoreRhosts yes keeps per-user ~/.rhosts / ~/.shosts OFF — only the SYSTEM files
# /etc/hosts.equiv and /etc/ssh/shosts.equiv are honored — so individual users cannot
# self-authorize a host; trust is cluster-managed only.
#
# Drop-in loaded by Ubuntu's sshd (Include /etc/ssh/sshd_config.d/*.conf). The 00- prefix loads
# it before the 10-deregister.conf AuthorizedKeysFile line; the two are independent mechanisms
# (this = hostbased trust for login nodes; deregister = forced-command key for node self-delete).
HostbasedAuthentication yes
IgnoreRhosts yes
