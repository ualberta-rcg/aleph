# Kubeflow Inference Stack Bootstrap — RKE2 Auto-Deploy Manifest
#
# Place this file at: /var/lib/rancher/rke2/server/manifests/kubeflow-bootstrap.yaml
# RKE2 watches this directory and applies any YAML on startup.
#
# This Job installs the inference stack from kubeflow/manifests v1.11-branch:
#   - Istio (CRDs, namespace, control plane, ingress gateway, cluster-local-gateway)
#   - Knative Serving
#   - KServe (InferenceService CRD + controller)
#   - Kubeflow Profiles
#
# Skipped (Tyk handles auth, no UI needed):
#   - Dex, oauth2-proxy, Central Dashboard, Pipelines, Katib, Jupyter
#
# PRE-REQUISITES (other RKE2 auto-deploy manifests):
#   - cert-manager
#   - NFS provisioner (nfs-client StorageClass)
#   - HAMi scheduler + device plugin (gpu=on label on GPU nodes)
#   - NVIDIA drivers + container toolkit on GPU nodes (Warewulf overlay)
#
# Monitor: kubectl logs -n kube-system job/kubeflow-bootstrap -f
# Re-run:  kubectl delete job kubeflow-bootstrap -n kube-system
#          Then re-apply this manifest (or touch the file)
#
# After bootstrap, run 02-post-install.sh from install-kubeflow/ to patch configs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeflow-bootstrap
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubeflow-bootstrap
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubeflow-bootstrap
  namespace: kube-system
  annotations:
    description: "Installs Kubeflow inference stack (Istio, Knative, KServe, Profiles) from kubeflow/manifests v1.11"
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: kubeflow-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.2
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "=== Kubeflow Inference Stack Bootstrap ==="
              echo "K8s: $(kubectl version --output=json 2>/dev/null | grep gitVersion | head -1 || echo unknown)"
              echo ""

              # Wait for cert-manager (deployed via RKE2 HelmChart)
              echo "--- Waiting for cert-manager ---"
              kubectl wait --for=condition=Ready pods --all -n cert-manager --timeout=300s || true

              # Clone kubeflow manifests
              cd /tmp
              echo "--- Cloning kubeflow/manifests v1.11-branch ---"
              git clone --depth=1 --branch v1.11-branch https://github.com/kubeflow/manifests.git
              cd /tmp/manifests

              # 1. cert-manager issuer
              echo "--- Step 1: cert-manager issuer ---"
              kubectl apply -k common/cert-manager/kubeflow-issuer/base

              # 2. Istio
              echo "--- Step 2: Istio ---"
              kubectl apply -k common/istio/istio-crds/base
              kubectl apply -k common/istio/istio-namespace/base
              kubectl apply -k common/istio/istio-install/base
              kubectl wait --for=condition=Ready pods --all -n istio-system --timeout=300s || true

              # 3. Knative Serving + cluster-local-gateway
              echo "--- Step 3: Knative Serving ---"
              kubectl apply -k common/knative/knative-serving/overlays/gateways
              kubectl apply -k common/istio/cluster-local-gateway/base
              kubectl wait --for=condition=Ready pods --all -n knative-serving --timeout=300s || true

              # 4. Kubeflow namespace + roles + Istio resources
              echo "--- Step 4: Kubeflow namespace + roles ---"
              kubectl apply -k common/kubeflow-namespace/base
              kubectl apply -k common/kubeflow-roles/base
              kubectl apply -k common/istio/kubeflow-istio-resources/base

              # 5. KServe (server-side apply required — CRDs too large for normal apply)
              echo "--- Step 5: KServe ---"
              kubectl apply --server-side --force-conflicts -k applications/kserve/kserve
              kubectl wait --for=condition=Ready pods -n kubeflow -l app=kserve --timeout=300s || true

              # 6. Kubeflow Profiles
              echo "--- Step 6: Profiles ---"
              kubectl apply -k applications/profiles/upstream/overlays/kubeflow

              # 7. models namespace
              echo "--- Step 7: models namespace ---"
              kubectl create namespace models --dry-run=client -o yaml | kubectl apply -f -
              kubectl label namespace models istio-injection=enabled --overwrite

              echo ""
              echo "=== Bootstrap complete! ==="
              echo "Next: Apply post-install configs (Knative patches, KServe config)"
              echo "  Run 02-post-install.sh from the install-kubeflow/ directory"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
