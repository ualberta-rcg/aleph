## Tyk OSS Gateway - Minimal values for reverse proxy to Istio IngressGateway
## Architecture: user -> LB -> Tyk Gateway -> Istio IngressGateway -> KServe InferenceServices
##
## Redis IS required by Tyk OSS (used for rate limiting, API key storage, clustering).
## We deploy Bitnami Redis in the same namespace.

# -- Disable pump (no analytics backend needed for pure reverse proxy)
global:
  components:
    pump: false
    operator: false

  # -- Set a strong API secret for Tyk Gateway admin API
  secrets:
    APISecret: "CHANGEME-set-a-strong-secret-here"

  # -- Redis connection (Bitnami Redis deployed in same namespace)
  redis:
    addrs:
      - tyk-redis-master.tyk.svc.cluster.local:6379
    passSecret:
      name: tyk-redis
      keyName: redis-password
    enableCluster: false

  tls:
    gateway: false

  servicePorts:
    gateway: 8080

# -- Gateway configuration
tyk-gateway:
  gateway:
    # -- We run behind a LoadBalancer / Traefik, so ClusterIP is fine
    kind: Deployment
    replicaCount: 1
    hostName: ""

  service:
    type: ClusterIP
    port: 8080

  # -- No ingress needed (Tyk sits behind Traefik or a LoadBalancer)
  ingress:
    enabled: false

  # -- Resource limits for gateway pod
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # -- Allow the gateway to run on any node
  tolerations: []
  nodeSelector: {}

  # -- Enable access logs for debugging
  log:
    level: "info"
  gateway:
    enablePathPrefixMatching: true

# -- Pump disabled (no analytics)
tyk-pump:
  enabled: false
