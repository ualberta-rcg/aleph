# Default StorageClass for the cluster, on the OneFS/Isilon NFS backend.
#
# WHY MANUALLY MANAGED (not Helm): the nfs-subdir-external-provisioner chart
# (4.0.18) has no `mountOptions` value, so it cannot set the OneFS-safe mount
# options. We therefore set `storageClass.create=false` on the Helm release
# (so Helm only runs the provisioner Deployment) and manage this SC ourselves.
#
# WHY THESE OPTIONS: OneFS (manage.storage.data.vulcan.local) returns EIO on
# COMMIT for >128Ki write RPCs over NFSv4.1/4.2, so multi-GB writes (model
# weights, pip wheels, ONNX exports) fail at close(). Capping rsize/wsize to
# 128Ki + a hard mount makes large writes reliable. These are the same options
# that used to live only on `nfs-models` — now they are the cluster default, so
# every PVC gets reliable large writes and there's no need to pick a special SC.
#
# To (re)apply: `kubectl apply -f storage/nfs-client-storageclass.yaml`
# `nfs-models` is kept for backward-compat with already-bound PVCs but is now
# redundant (identical mount options).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    app: nfs-subdir-external-provisioner
provisioner: cluster.local/nfs-provisioner-nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "true"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - rsize=131072
  - wsize=131072
  - hard
  - timeo=600
  - retrans=2
