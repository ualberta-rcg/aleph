# MetalLB VIP config — SITE-SPECIFIC. Apply per-cluster with kubectl (NOT auto-deployed).
#
# This is the IPAddressPool + L2Advertisement that tell MetalLB which IP to own and on
# which NIC to advertise it. Intentionally NOT in rke2-manifests/ — the VIP and NIC
# differ per site. The MetalLB install itself is in ../rke2-manifests/40-metallb.yaml.
#
# Substitute (230 examples shown):
#   VIP=129.128.190.55   (the public IP MetalLB will own)
#   PUBLIC_NIC=enp6s19   (the head's public NIC — L2 advertises here)
#
# Then:  kubectl apply -f metallb-vip.example.yaml
# Verify: kubectl get ipaddresspool,l2advertisement -n metallb-system
#         kubectl get svc <your-loadbalancer-service>   # -> EXTERNAL-IP = <VIP>
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: public-vip
  namespace: metallb-system
spec:
  addresses:
    - 129.128.190.55/32            # VIP — change to your public IP (or a range)
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: public-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - public-vip
  interfaces:
    - enp6s19                      # PUBLIC_NIC — change to your public NIC
