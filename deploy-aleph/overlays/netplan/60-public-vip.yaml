# netplan — public VIP interface for MetalLB.  SITE-SPECIFIC: edit before use.
# Target: /etc/netplan/60-public-vip.yaml on each head/edge node. Apply: netplan apply.
#
# Substitute (230 examples shown):
#   VIP=129.128.190.55   PUBLIC_SUBNET=129.128.190.48/28   PUBLIC_GW=129.128.190.49
#   PUBLIC_NIC=enp6s19   (the head's NIC on the public VLAN — rename the key below)
#
# netplan cannot address `lo`, so the VIP rides a dummy interface (dummy0) — a local
# address equivalent to loopback. If this netplan rejects `dummy`, fall back to a
# one-line post-install:   ip addr add <VIP>/32 dev lo
#
# If netplan rejects an on-link route on an IP-less interface, fall back to:
#   ip route add <PUBLIC_SUBNET> dev <PUBLIC_NIC>
network:
  version: 2
  ethernets:
    enp6s19:                       # PUBLIC_NIC — rename to your public NIC
      dhcp4: false
      dhcp6: false
      addresses: []                # IP-free (unnumbered) — MetalLB owns the VIP at L2
      routes:
        - to: 129.128.190.48/28    # PUBLIC_SUBNET — on-link via this NIC (destination routing)
          scope: link
        # Optional — EXTERNAL (Internet) clients only: make this NIC the default gw.
        # Safe: the cluster subnet stays on the cluster NIC's connected route.
        # - to: default
        #   via: 129.128.190.49    # PUBLIC_GW
  dummy:
    dummy0:
      addresses:
        - 129.128.190.55/32        # VIP — local address so replies source from it
