# MetalLB — RKE2 auto-deploy manifest (L2 load-balancer for a public VIP).
#
# This installs MetalLB ONLY. The actual VIP (IPAddressPool) and its L2Advertisement
# are SITE-SPECIFIC — the public IP and the NIC it lives on differ per cluster, and
# some clusters won't use MetalLB at all — so they are NOT committed here. See
# ../overlays/metallb-vip.example.yaml: copy it, fill in your VIP + NIC, apply.
#
# Speaker + controller are pinned to control-plane nodes (and tolerate the CP taint)
# so frr runs only on the heads — where the public NIC is — and NOT on GPU workers.
# Lesson from the 230 POC: frr on a small (8-vCPU) head alongside the full serving
# stack starved the control plane -> CrashLoop. Pair this with adequately-sized heads
# (>=16 vCPU) or dedicated edge nodes. If this cluster won't use MetalLB, delete this
# file (it is optional, like 63-profiles was).
#
# frr runs as a SIDECAR in the speaker (frr.enabled: true, frrk8s.enabled: false), so
# it is constrained together with the speaker by the nodeSelector below — no separate,
# unconstrained frr-k8s DaemonSet.
#
# PREREQUISITE (node overlay, ../overlays/): on each head the public NIC must be UP
# and IP-free, the VIP present as a local address, the public subnet routed via that
# NIC, and rp_filter/arp sysctls set — else inbound traffic is silently dropped and/or
# ARP collides. See ../overlays/README.md and memory `metallb-public-vip-recipe`.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: metallb
  namespace: kube-system
spec:
  repo: https://metallb.github.io/metallb
  chart: metallb
  targetNamespace: metallb-system
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
    # frr as a sidecar inside the speaker (constrained via speaker.nodeSelector).
    frr:
      enabled: true
    frrk8s:
      enabled: false
    speaker:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
    controller:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
