# Traefik ingress controller — RKE2 auto-deploy manifest (INSTALLED, NOT site-configured).
#
# Source: cluster 230/232's traefik.yaml with the macvlan public-IP binding STRIPPED. This
# deploys Traefik into ns `traefik` with default entrypoints (0.0.0.0:80 and :443) and its
# Service enabled. It is intentionally generic: the site-specific front door — macvlan NIC
# with a dedicated public IP, hostname, and TLS — is a POST-DEPLOY customization step (see
# README). The manifests "will get better"; this round just makes Traefik available.
#
# KNOWN INTERACTION: RKE2 bundles its own Traefik (`rke2-traefik`, DaemonSet in kube-system).
# Deploying this chart means TWO ingress controllers sharing class `traefik`. The recommended
# follow-up (not done here) is to disable the bundled one via the RKE2 server config
# (Warewulf overlay):   disable: [rke2-traefik]
# so only this managed Traefik serves the endpoint. See README §Follow-ups.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  targetNamespace: traefik
  createNamespace: true
  chart: traefik
  repo: https://traefik.github.io/charts
  version: 39.0.2
  valuesContent: |-
    # Default entrypoints (web :80, websecure :443 on 0.0.0.0). Site-specific binding
    # (macvlan public IP / hostname / TLS cert refs) is layered on post-deploy.
    service:
      enabled: true
