# NodePort to reach Tyk from the internal network (NodePort fallback).
# Primary access is via MetalLB VIP (129.128.190.55:80).
# NodePort: http://<node-ip>:30808  e.g. http://172.26.92.43:30808
apiVersion: v1
kind: Service
metadata:
  name: tyk-gateway-nodeport
  namespace: tyk
spec:
  type: NodePort
  selector:
    app: gateway-tyk-oss-tyk-gateway
    release: tyk-oss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
