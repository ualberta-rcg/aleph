# NodePort to reach Tyk from outside the cluster (no LB / public IP).
# Hit it at http://<node-ip>:30808  e.g. http://172.26.92.230:30808
apiVersion: v1
kind: Service
metadata:
  name: tyk-gateway-nodeport
  namespace: tyk
spec:
  type: NodePort
  selector:
    app: gateway-tyk-oss-tyk-gateway
    release: tyk-oss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
