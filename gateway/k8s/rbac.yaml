apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-gateway
  namespace: models
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-gateway
  namespace: models
rules:
  # Cards: the gateway reads model details from ConfigMaps (NEW vs POC).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Live model state.
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-gateway
  namespace: models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-gateway
subjects:
  - kind: ServiceAccount
    name: model-gateway
    namespace: models
