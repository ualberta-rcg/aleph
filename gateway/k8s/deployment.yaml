apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: models
  labels:
    app: model-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: model-gateway
      # Run only on control-plane (non-GPU) VMs. This selector auto-covers all
      # future control-plane nodes (going to 3 VMs) and keeps the gateway off the
      # GPU workers so it never competes with model pods for GPU-node resources.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: NotIn
                    values: ["on"]
      # Gateway image is published by CI to Docker Hub (rkhoja/aleph). Pin a tag in
      # deployment.yaml or override at deploy time: GATEWAY_IMAGE=rkhoja/aleph:gateway-<sha>
      containers:
        - name: gateway
          image: rkhoja/aleph:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODELS_NAMESPACE
              value: models
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
