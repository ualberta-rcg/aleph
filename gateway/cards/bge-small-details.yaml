apiVersion: v1
kind: ConfigMap
metadata:
  name: bge-small-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "bge-small",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "bge-small",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "always-on",
        "cold_start_estimate": "20-40 seconds"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "custom_params": {
        "schema": {
          "encoding_format": { "type": "string", "default": "float" }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "BAAI bge-small-en-v1.5 text embeddings (TEI, CPU)",
        "owned_by": "BAAI",
        "source": "BAAI/bge-small-en-v1.5",
        "license": "MIT",
        "framework": "text-embeddings-inference",
        "domain": "nlp",
        "subdomain": "embedding",
        "gpu": false,
        "embedding_dimensions": 384,
        "max_input_tokens": 512,
        "pooling": "cls",
        "tags": ["embedding", "text", "cpu"]
      }
    }
