apiVersion: v1
kind: ConfigMap
metadata:
  name: timer-s1-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "timer-s1",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "timer-s1",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 2880
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "max_replicas": 1,
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false
      },
      "defaults": {
        "forecast": {
          "prediction_length": 96,
          "max_prediction_length": 256
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Timer-S1: 8.3B-param MoE time-series foundation model (0.75B active) with quantile forecasting.",
        "description": "Timer-S1 from Tsinghua THUML (2026) is a decoder-only MoE transformer (8.3B total, 0.75B active per token) for zero-shot time-series forecasting. Produces 9 quantile forecasts (0.1-0.9). SOTA on GIFT-Eval. Apache 2.0.",
        "owned_by": "thuml",
        "source": "thuml/Timer-S1",
        "source_url": "https://huggingface.co/thuml/Timer-S1",
        "framework": "transformers (AutoModelForCausalLM, trust_remote_code) + PyTorch",
        "domain": "time-series",
        "subdomain": "forecasting",
        "parameters": "8.3B (0.75B active MoE)",
        "tags": ["science", "timeseries", "forecast", "zero-shot", "quantile", "moe", "gpu", "thuml", "tsinghua"]
      },
      "input_map": {
        "time_series": "array of numeric values (min 96, max 2880)",
        "prediction_length": "future steps to forecast (default 96, max 256)"
      },
      "output_map": {
        "forecast.mean": "median prediction array",
        "forecast.quantiles": "dict of 9 quantile forecasts (0.1-0.9)",
        "model": "timer-s1",
        "input_length": "number of input values",
        "prediction_length": "forecast horizon"
      }
    }
