apiVersion: v1
kind: ConfigMap
metadata:
  name: clinical-longformer-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "clinical-longformer",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": {
        "k8s_name": "clinical-longformer",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 4096, "max_input_tokens": 4096 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "10m",
        "cold_start_estimate": "<1 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Clinical text / long document (up to 4096 tokens); [CLS]-pooled with Longformer global attention."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim [CLS]-pooled embeddings (global attention on CLS)" },
        "model": { "type": "string", "description": "Model name (clinical-longformer)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "Clinical-Longformer — 768-dim embeddings of long clinical documents, 4096 ctx (GPU, scale-to-zero)",
        "description": "Clinical-Longformer (yikuan8/Clinical-Longformer): Longformer-base pre-trained on MIMIC-III clinical notes. Handles long clinical documents up to 4096 tokens — superior to ClinicalBERT for long texts. Produces 768-dim [CLS]-pooled embeddings with global attention on the CLS token. Served via a custom transformers FastAPI server on a HAMi GPU slice (10 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "yikuan8",
        "source": "yikuan8/Clinical-Longformer",
        "source_url": "https://huggingface.co/yikuan8/Clinical-Longformer",
        "license": "Apache-2.0",
        "parameters": "149M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "clinical-nlp",
        "gpu": true,
        "embedding_dimensions": 768,
        "pooling": "cls (global attention)",
        "max_input_tokens": 4096,
        "tags": ["embedding", "biomedical", "clinical", "longformer", "long-context", "nlp"]
      }
    }
