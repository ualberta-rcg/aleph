# ESMFold: protein folding (facebook/esmfold_v1) via Transformers + FastAPI.
# GPU accelerated on L40S.
# API: POST /v1/structure (JSON in/out)
apiVersion: v1
kind: ConfigMap
metadata:
  name: esmfold-server
  namespace: models
data:
  server.py: |
    """ESMFold protein structure prediction server."""
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")
    MODEL_NAME = "esmfold"

    app = FastAPI()
    tokenizer = None
    model = None

    def load():
        global tokenizer, model
        import torch
        from transformers import AutoTokenizer, EsmForProteinFolding
        print(f"Loading {MODEL_NAME} from {MODEL_DIR}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR)
        device = "cuda" if torch.cuda.is_available() else "cpu"
        model = EsmForProteinFolding.from_pretrained(MODEL_DIR).to(device)
        model.eval()
        print(f"{MODEL_NAME} loaded on {device}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "facebook", "type": "structure"}]}

    def _infer(seq):
        import torch
        device = next(model.parameters()).device
        inputs = tokenizer([seq], return_tensors="pt", add_special_tokens=False).to(device)
        with torch.no_grad():
            output = model(**inputs)
        pdb = model.output_to_pdb(output)[0]
        return {"pdb": pdb, "plddt": output["plddt"][0].cpu().numpy().mean().item()}

    @app.post("/v1/structure")
    async def predict_structure(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        seq = request.get("sequence", "")
        if not seq:
            return JSONResponse({"error": "sequence required"}, 400)
        result = await asyncio.get_event_loop().run_in_executor(None, _infer, seq)
        return {"model": MODEL_NAME, **result}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: esmfold
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 150
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
              /data/venv/bin/pip install "numpy<2" torch transformers protobuf fastapi uvicorn huggingface_hub
            else
              echo "venv exists"
            fi
            if [ ! -f /data/model/config.json ]; then
              echo "Downloading ESMFold..."
              mkdir -p /data/model
              /data/venv/bin/python -c "
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(repo_id='facebook/esmfold_v1', local_dir='/data/model', local_dir_use_symlinks=False, token=os.environ.get('HF_TOKEN'))
            "
            else
              echo "Model exists"
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "30720" }
          limits: { cpu: "4", memory: 32Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "30720" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 180
          periodSeconds: 20
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 40
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: esmfold-data }
      - name: app
        configMap: { name: esmfold-server }
