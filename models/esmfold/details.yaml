apiVersion: v1
kind: ConfigMap
metadata:
  name: esmfold-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esmfold",
      "status": "production",
      "type": "structure",
      "endpoints": {
        "primary": "/v1/structure",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "esmfold",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1022
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 minutes (ESMFold ~690M load + first fold)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "sequence": {
          "type": "string",
          "required": true,
          "max_length": 1022,
          "description": "amino-acid sequence in single-letter codes (^[ACDEFGHIKLMNPQRSTVWY]+$); max 1022 residues"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "pdb": {"type": "string", "description": "predicted 3D structure in PDB format"},
        "plddt": {"type": "number", "description": "mean per-residue pLDDT confidence score (0-100)"}
      },
      "catalog": {
        "description_short": "ESMfold end-to-end protein structure prediction from sequence (Meta).",
        "description": "ESMfold (Meta, facebook/esmfold_v1) predicts 3D protein structures directly from an amino-acid sequence — single-sequence, no MSA/external DB lookup. Based on the ESM-2 backbone (~690M params). Returns a PDB-format structure plus a mean per-residue pLDDT confidence. Max 1022 residues. fp32.",
        "owned_by": "Meta",
        "source": "facebook/esmfold_v1",
        "source_url": "https://huggingface.co/facebook/esmfold_v1",
        "license": "MIT",
        "parameters": "~690M",
        "precision": "fp32",
        "framework": "transformers (EsmForProteinFolding) + torch",
        "domain": "proteomics",
        "subdomain": "structure-prediction",
        "tags": ["science", "protein", "folding", "structure", "gpu"]
      }
    }
