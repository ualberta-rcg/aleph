apiVersion: v1
kind: ConfigMap
metadata:
  name: zoobot-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "zoobot-15m",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/vision/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "zoobot",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG galaxy image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (zoobot-15m)"},
        "task": {"type": "string", "description": "Always \"embed\""},
        "embedding": {"type": "array", "description": "640-dim float embedding vector for galaxy morphology"},
        "dim": {"type": "integer", "description": "Embedding dimension (640)"}
      },
      "catalog": {
        "description_short": "Zoobot ConvNeXt-Nano galaxy morphology encoder (640-dim embedding, CPU)",
        "description": "Zoobot encoder by M. Walmsley (15.6M params, ConvNeXt-Nano). Pre-trained on Galaxy Zoo volunteer classifications from millions of galaxies. Produces 640-dim embeddings for galaxy morphology classification, clustering, and similarity search. Uses timm with HF Hub weights. CPU inference via PyTorch.",
        "owned_by": "mwalmsley",
        "source": "mwalmsley/zoobot-encoder-convnext_nano",
        "source_url": "https://huggingface.co/mwalmsley/zoobot-encoder-convnext_nano",
        "license": "Apache-2.0",
        "parameters": "15.6M",
        "precision": "fp32",
        "framework": "pytorch",
        "domain": "astronomy",
        "subdomain": "galaxy-morphology",
        "tags": ["vision", "embedding", "astronomy", "galaxy", "science", "cpu"],
        "embedding_dimensions": 640
      }
    }
