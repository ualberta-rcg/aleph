# Zoobot: galaxy morphology encoder (timm + mwalmsley/zoobot-encoder-convnext_nano)
# API: POST /v1/vision/embed or /v1/vision/classify
apiVersion: v1
kind: ConfigMap
metadata:
  name: zoobot-server
  namespace: models
data:
  server.py: |
    """Zoobot galaxy morphology encoder server."""
    import os, io, base64, asyncio
    import numpy as np
    from PIL import Image
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_NAME = os.environ.get("MODEL_NAME", "zoobot-15m")
    INPUT_SIZE = 224

    app = FastAPI()
    model = None
    transform = None

    MEAN = np.array([0.485, 0.456, 0.406], dtype=np.float32)
    STD = np.array([0.229, 0.224, 0.225], dtype=np.float32)

    def load():
        global model, transform
        import timm
        import torch
        print(f"Loading {MODEL_NAME}...", flush=True)
        model = timm.create_model("hf_hub:mwalmsley/zoobot-encoder-convnext_nano", pretrained=True)
        model.eval()
        print(f"{MODEL_NAME} loaded", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "mwalmsley", "type": "embed"}]}

    def _infer(img_bytes):
        import torch
        img = Image.open(io.BytesIO(img_bytes)).convert("RGB").resize((INPUT_SIZE, INPUT_SIZE))
        arr = np.array(img, dtype=np.float32) / 255.0
        arr = (arr - MEAN) / STD
        arr = arr.transpose(2, 0, 1)[np.newaxis]
        tensor = torch.from_numpy(arr)
        with torch.no_grad():
            emb = model(tensor).numpy()[0]
        return emb.tolist()

    @app.post("/v1/vision/embed")
    async def embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        b64 = request.get("image", "")
        if "," in b64: b64 = b64.split(",", 1)[1]
        emb = await asyncio.get_event_loop().run_in_executor(None, _infer, base64.b64decode(b64))
        return {"model": MODEL_NAME, "task": "embed", "embedding": emb, "dim": len(emb)}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: zoobot
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 180
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
              /data/venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                timm torch torchvision fastapi uvicorn pillow
            else
              echo "venv exists"
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_NAME, value: zoobot-15m }
          - { name: HF_HOME, value: /data/hf-hub }
          - { name: TORCH_HOME, value: /data/torch }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 2Gi }
          limits: { cpu: "4", memory: 4Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: zoobot-data }
      - name: app
        configMap: { name: zoobot-server }
