# Chronos-Bolt: zero-shot time series forecasting (amazon/chronos-bolt-base).
# Apache-2.0. CPU-only. Weights + venv cached on PVC. API: POST /v1/forecast.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-bolt-server
  namespace: models
data:
  server.py: |
    """
    Chronos-Bolt: zero-shot time series forecasting (amazon/chronos-bolt-base).
    Weights downloaded at startup, cached on PVC. CPU inference.
    API: POST /v1/forecast — returns probabilistic forecasts.
    """
    import os, json, asyncio
    from pathlib import Path
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn
    
    MODEL_DIR = os.environ.get("MODEL_DIR", "/data")
    
    app = FastAPI()
    pipeline = None
    
    def load():
        global pipeline
        import torch
        from chronos import BaseChronosPipeline
        print("Loading chronos-bolt-base...", flush=True)
        pipeline = BaseChronosPipeline.from_pretrained(
            MODEL_DIR,
            device_map="cpu",
            torch_dtype=torch.float32,
        )
        print(f"[ok] chronos-bolt-base loaded", flush=True)
    
    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)
    
    @app.get("/health")
    async def health():
        return {"status": "ok" if pipeline else "loading", "model": "chronos-bolt"}
    
    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "chronos-bolt", "object": "model", "created": 1700000000,
             "owned_by": "amazon", "type": "forecast"}
        ]}
    
    @app.post("/v1/forecast")
    async def forecast(request: dict):
        if pipeline is None:
            return JSONResponse({"error": "model loading"}, 503)
    
        values = request.get("values") or request.get("time_series") or request.get("series")
        if not values or not isinstance(values, list):
            return JSONResponse({"error": "'values' field required — list of numeric time series observations"}, 400)
    
        horizon = request.get("horizon", 12)
        num_samples = request.get("num_samples", 20)
        quantile_levels = request.get("quantile_levels", [0.1, 0.5, 0.9])
    
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _predict, values, horizon, num_samples, quantile_levels)
            return result
        except Exception as e:
            return JSONResponse({"error": str(e)}, 500)
    
    def _predict(values, horizon, num_samples, quantile_levels):
        import torch
        ctx = torch.tensor([values], dtype=torch.float32)
        forecasts = pipeline.predict(ctx, prediction_length=horizon)
        import numpy as np
        s = forecasts.numpy().squeeze()
        if s.ndim == 1:
            s = s.reshape(1, -1)
    
        result = {"model": "chronos-bolt", "horizon": horizon, "samples": s.shape[0]}
    
        result["quantiles"] = {}
        for q in quantile_levels:
            qval = np.quantile(s, q, axis=0).tolist()
            result["quantiles"][str(q)] = qval
    
        result["median"] = np.median(s, axis=0).tolist()
        result["mean"] = np.mean(s, axis=0).tolist()
        return result
    
    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)

---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: chronos-bolt
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Step 1: Download model weights (skips if present)
            if [ -f /data/config.json ]; then
                echo "Chronos-Bolt weights already on PVC, skipping download."
            else
                pip install -q huggingface_hub
                python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            print("Downloading amazon/chronos-bolt-base ...", flush=True)
            snapshot_download(
                repo_id="amazon/chronos-bolt-base",
                local_dir="/data",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi

            # Step 2: Create venv (skips if present)
            if [ -d /data/venv/bin ]; then
                echo "venv already exists, skipping install."
            else
                echo "Creating venv and installing chronos-forecasting..."
                python3 -m venv /data/venv
                . /data/venv/bin/activate
                pip install -U pip
                pip install chronos-forecasting fastapi uvicorn
                echo "Install done."
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: chronos-bolt
            mountPath: /data
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command:
          - bash
          - -c
        args:
          - |
            . /data/venv/bin/activate
            exec python3 /app/server.py
        env:
          - name: MODEL_DIR
            value: /data
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - name: chronos-bolt
            mountPath: /data
          - name: app
            mountPath: /app
    volumes:
      - name: chronos-bolt
        persistentVolumeClaim:
          claimName: chronos-bolt
      - name: app
        configMap:
          name: chronos-bolt-server
