apiVersion: v1
kind: ConfigMap
metadata:
  name: pangu-weather-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "pangu-weather",
      "status": "production",
      "type": "forecast",
      "endpoints": { "primary": "/v1/science/forecast", "health": "/health" },
      "routing": { "k8s_name": "pangu-weather", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "3-6 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": { "lead_hours": 24 },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "date": "ISO datetime of the ERA5 analysis to initialize from, e.g. 2018-01-01T00:00:00 (snapped to nearest 6h; range 1959-01-01 .. 2023-01-10). Omit for demo mode.",
        "lead_hours": "forecast lead time, multiple of 6 (6,12,...,72); default 24. The 6h ONNX model is rolled forward this many steps.",
        "coords": "optional list of {lat, lon} points to return forecast values for, e.g. [{\"lat\":53.5,\"lon\":-113.5}]",
        "demo": "true to run a no-network smoke test with synthetic ERA5-like input"
      },
      "output_map": {
        "init_time": "ISO datetime of the ERA5 analysis used (null in demo)",
        "valid_time": "ISO datetime of the forecast = init_time + lead_hours (null in demo)",
        "lead_hours": "forecast lead time in hours",
        "source": "weatherbench2-era5 (real) or demo",
        "summary": "global mean/min/max of {t2m_K, msl_Pa, t_850hPa_K, z_500hPa_m2s2} over the forecast grid",
        "points": "per-coord forecast values (t2m, msl, u10, v10, t@850/500hPa, z@500hPa); present only if coords requested"
      },
      "catalog": {
        "description_short": "Huawei Pangu-Weather 3D neural network — global medium-range forecast at 0.25°, initialized from live ERA5.",
        "description": "Pangu-Weather (Huawei, Nature 2023) is a 3D neural network for global medium-range weather forecasting at 0.25° resolution (721x1440), 13 pressure levels (50-1000 hPa). Served as ONNX (6-hour model, rolled forward for longer leads). Initial conditions are pulled live from ERA5 via the public WeatherBench2 Zarr on GCS (gs://weatherbench2, 1959-2023) and cached on PVC — so a researcher sends a date (and optional lat/lon points) and gets a real forecast. BY-NC-SA-4.0 license.",
        "owned_by": "huawei", "source": "huawei-weather/pangu-weather", "source_url": "https://github.com/SpuriousCorrelations/Pangu-Weather",
        "license": "BY-NC-SA-4.0", "parameters": "~256M", "precision": "fp32",
        "framework": "onnxruntime-gpu (6h ONNX model, autoregressive roll for lead time)",
        "domain": "weather-climate", "subdomain": "forecasting",
        "tags": ["science", "weather", "forecast", "atmospheric", "gpu", "onnx", "era5", "weatherbench2", "nature-2023"]
      }
    }
