apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "aurora",
      "status": "production",
      "type": "forecast",
      "endpoints": { "primary": "/v1/science/forecast", "health": "/health" },
      "routing": { "k8s_name": "aurora", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "surf_vars": {
          "2t": "2m temperature (K), shape [lat, lon]",
          "10u": "10m u-wind (m/s), shape [lat, lon]",
          "10v": "10m v-wind (m/s), shape [lat, lon]",
          "msl": "mean sea-level pressure (Pa), shape [lat, lon]"
        },
        "atmos_vars": {
          "t": "temperature at pressure levels, shape [level, lat, lon]",
          "u": "u-wind at pressure levels",
          "v": "v-wind at pressure levels",
          "q": "specific humidity at pressure levels",
          "z": "geopotential at pressure levels"
        },
        "lat": "[90, ..., -90] float array",
        "lon": "[0, ..., 359.75] float array",
        "time": "ISO datetime e.g. 2024-01-01T00:00:00",
        "atmos_levels": "[50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]"
      },
      "output_map": {
        "surf_vars": "same structure as input, 6h ahead",
        "atmos_vars": "same structure as input, 6h ahead",
        "step": "6h"
      },
      "catalog": {
        "description_short": "Microsoft Aurora 1.3B atmospheric foundation model — global weather at 0.25°, 6h steps.",
        "description": "Microsoft Aurora (microsoft/aurora, Nature 2025, ~1.3B) is a foundation model for the Earth system. Predicts global weather (wind, temperature, humidity, pressure) at 0.25° resolution in 6-hour steps. Accepts surface vars (2t, 10u, 10v, msl) + atmospheric vars (t, u, v, q, z) at 13 pressure levels (50-1000 hPa). Transformer with spherical harmonics. Served via microsoft-aurora pip (AuroraSmallPretrained).",
        "owned_by": "microsoft", "source": "microsoft/aurora", "source_url": "https://huggingface.co/microsoft/aurora",
        "license": "MIT", "parameters": "~1.3B", "precision": "fp32",
        "framework": "microsoft-aurora + torch (transformer + spherical harmonics)",
        "domain": "weather-climate", "subdomain": "forecasting",
        "tags": ["science", "weather", "forecast", "atmospheric", "gpu", "era5", "medium-range"]
      }
    }
