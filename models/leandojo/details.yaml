apiVersion: v1
kind: ConfigMap
metadata:
  name: leandojo-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "leandojo",
      "status": "production",
      "type": "retrieve",
      "endpoints": {
        "primary": "/v1/science/retrieve",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "leandojo",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "goal": {
          "type": "string",
          "required": true,
          "description": "Lean 4 tactic state / theorem statement, e.g. \"∀ n : ℕ, n + 0 = n\""
        },
        "num_premises": {
          "type": "integer",
          "required": false,
          "default": 5,
          "description": "number of premises to retrieve"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "premises": {"type": "array", "description": "ranked premises: [{name, score}]"}
      },
      "catalog": {
        "description_short": "LeanDojo Lean 4 premise retriever (ByT5-small, 125M) for retrieval-augmented theorem proving.",
        "description": "LeanDojo (NeurIPS 2023) is a system for automated theorem proving in Lean 4. This deployment uses the ByT5-small (125M) premise retriever: given a proof goal (tactic state), it retrieves relevant premises from Lean's Mathlib, ranked by relevance score. Used for retrieval-augmented theorem provers and mathematical-reasoning tools.",
        "owned_by": "lean-dojo",
        "source": "kaiyuy/leandojo-lean4-retriever-byt5-small",
        "source_url": "https://huggingface.co/kaiyuy/leandojo-lean4-retriever-byt5-small",
        "license": "Apache-2.0",
        "parameters": "125M",
        "precision": "fp32",
        "framework": "transformers (AutoModelForSeq2SeqLM) + torch",
        "domain": "mathematics",
        "subdomain": "theorem-proving",
        "tags": ["science", "retrieve", "mathematics", "theorem-proving", "lean4", "retrieval"]
      }
    }
