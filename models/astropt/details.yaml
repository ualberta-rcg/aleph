apiVersion: v1
kind: ConfigMap
metadata:
  name: astropt-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "astropt",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "astropt",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "image": "[[[R,G,B],...],...] — (H,W,3) galaxy image float [0,1] (patchified by GalaxyImageDataset)",
        "demo": "boolean — returns (16,512) synthetic embeddings"
      },
      "output_map": {
        "embeddings": "[[float]] or [float] — patch latents [N,512] (demo) or 768-dim flat vector (real)",
        "shape": "[N, D] — embedding shape",
        "model": "astropt-095m",
        "demo": "boolean — present if demo mode used"
      },
      "catalog": {
        "description_short": "AstroPT v2.0 95M autoregressive galaxy-image transformer — patch latent embeddings [N,512].",
        "description": "AstroPT v2.0 (95M, UniverseTBD/Smith42) is an autoregressive GPT trained on 8.6M galaxy images from SDSS/DESI. It patchifies a galaxy image and runs a causal-attention forward pass. The server returns a single 768-dim embedding vector (empirically verified 2026-06-19; the docstring/old card claimed [N,512] patch latents but the real output is a flat 768-dim vector — the demo path still returns a [16,512] synthetic array). Suitable for galaxy morphology, redshift estimation, similarity search. Non-text domain model: galaxy image input, does NOT expose OpenAI /v1/embeddings; stays on /v1/science/embed.",
        "owned_by": "Smith42/UniverseTBD",
        "source": "Smith42/astroPT_v2.0",
        "source_url": "https://huggingface.co/Smith42/astroPT_v2.0",
        "license": "MIT",
        "parameters": "95M",
        "precision": "fp32",
        "framework": "astropt + PyTorch (cu126)",
        "domain": "astronomy",
        "subdomain": "galaxy-images",
        "tags": ["embedding", "science", "astronomy", "galaxy", "autoregressive", "gpt", "sdss", "desi", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "input_format": {
          "model": "astropt",
          "image": "[[[R,G,B],...],...] — (H,W,3) galaxy image float [0,1] (patchified by GalaxyImageDataset)",
          "demo": "boolean — returns (16,512) synthetic embeddings"
        },
        "embedding_dimensions": 768,
        "pooling": "flat vector (server returns shape [768,1])"
      }
    }
