apiVersion: v1
kind: ConfigMap
metadata:
  name: saprot-650m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "saprot-650m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "saprot-650m",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 1024, "max_input_tokens": 1024 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes (venv + model cached on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Protein sequence(s) as 1-letter AA codes (SaProt also accepts interleaved foldseek 3Di structure tokens); truncated to 1024 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 1280]" }, "description": "1280-dim mean-pooled structure-aware protein embeddings" },
        "model": { "type": "string", "description": "Model name (saprot-650m)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (residue counts)" }
      },
      "catalog": {
        "description_short": "SaProt 650M — structure-aware protein LM (AA+3Di vocab), 1280-dim (GPU, scale-to-zero)",
        "description": "SaProt 650M (westlake-repl/SaProt_650M_AF2): structure-aware protein language model trained on a fused amino-acid + 3Di (foldseek structure) vocabulary, so it captures both sequence and structure. ESM-2 650M backbone; produces 1280-dim mean-pooled embeddings for function/structure/variant tasks. Max 1024 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (10 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "Westlake University (westlake-repl)",
        "source": "westlake-repl/SaProt_650M_AF2",
        "source_url": "https://huggingface.co/westlake-repl/SaProt_650M_AF2",
        "license": "MIT",
        "parameters": "650M",
        "precision": "fp16 (GPU)",
        "framework": "transformers EsmModel (custom FastAPI server)",
        "domain": "proteomics",
        "subdomain": "protein-language-model",
        "gpu": true,
        "embedding_dimensions": 1280,
        "pooling": "mean",
        "max_input_tokens": 1024,
        "tags": ["embedding", "science", "proteomics", "protein", "structure-aware", "saprot"]
      }
    }
