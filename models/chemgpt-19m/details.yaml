apiVersion: v1
kind: ConfigMap
metadata:
  name: chemgpt-19m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chemgpt-19m",
      "status": "production",
      "type": "generate",
      "endpoints": {
        "primary": "/v1/science/generate",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "chemgpt-19m",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 2048,
        "max_input_tokens": 2048
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "smiles": {
          "type": "string",
          "required": false,
          "default": "C",
          "description": "SMILES prefix to continue (e.g. 'CC', 'C1=CC=CC=C1')"
        },
        "num_return_sequences": {
          "type": "int",
          "required": false,
          "default": 5,
          "min": 1,
          "max": 20,
          "description": "Number of molecule sequences to generate"
        },
        "max_length": {
          "type": "int",
          "required": false,
          "default": 256,
          "min": 1,
          "max": 2048,
          "description": "Maximum SMILES length to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 0.7,
          "min": 0.1,
          "max": 2.0,
          "description": "Sampling temperature"
        }
      },
      "output_map": {
        "model": {
          "type": "string",
          "description": "Model name (chemgpt-19m)"
        },
        "sequences": {
          "type": "array",
          "description": "Generated SMILES strings (may be invalid \u2014 tiny model)"
        },
        "num_sequences": {
          "type": "int",
          "description": "Number of sequences returned"
        }
      },
      "catalog": {
        "description_short": "ChemGPT-19M, a lightweight GPT-Neo style model trained on SMILES for de-novo molecule generation.",
        "description": "ChemGPT-19M, a lightweight GPT-Neo style model trained on SMILES for de-novo molecule generation. Given a SMILES prefix it samples novel molecules. Tiny (~19M params). Served on a HAMi sub-GPU slice.",
        "owned_by": "ncfrey",
        "source": "ncfrey/ChemGPT-19M",
        "source_url": "https://huggingface.co/ncfrey/ChemGPT-19M",
        "license": "MIT",
        "parameters": "19M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "chemistry",
        "subdomain": "molecule-generation",
        "tags": [
          "generate",
          "science",
          "chemistry",
          "molecules",
          "smiles",
          "tiny",
          "gpu"
        ],
        "gpu": true,
        "max_input_tokens": 2048,
        "input_format": {
          "model": "chemgpt-19m",
          "smiles": "SMILES prefix, e.g. 'CC'",
          "num_return_sequences": "int (default 5)"
        }
      }
    }
