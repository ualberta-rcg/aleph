apiVersion: v1
kind: ConfigMap
metadata:
  name: specter2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "specter2-110m",
      "type": "embedding",
      "description_short": "SPECTER2 — scientific paper embeddings (768-dim)",
      "description": "SPECTER2 by Allen AI. 110M params. Scientific paper embedding model trained on 6M citation triplets across 23 scientific fields. Takes title+abstract as input, produces 768-dimensional dense embeddings. Ideal for paper search, citation recommendation, and document clustering. Based on SciBERT backbone with additional pre-training on citation graphs. Max sequence length 512 tokens.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "allenai",
      "source": "allenai/specter2_base",
      "source_url": "https://huggingface.co/allenai/specter2_base",
      "license": "Apache-2.0",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "k8s_name": "specter2",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "nlp",
      "subdomain": "scientific-text-embeddings",
      "tags": ["embedding", "science", "nlp", "papers", "citation"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Paper text: 'Title: <title>. Abstract: <abstract>' or arbitrary text"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 768]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 512,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 768
      }
    }
