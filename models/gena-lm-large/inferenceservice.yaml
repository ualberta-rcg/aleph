# GENA-LM-large: Large DNA BERT for long genomic sequences (AIRI-Institute/gena-lm-bert-large-t2t)
# 340M params, Apache 2.0. 1,925 downloads. Trained on hg38+T2T human genome, handles up to 36kb.
# Upgrade from gena-lm-base for complex genomic element classification.
# API: POST /v1/science/embed  (DNA sequence → embedding)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gena-lm-large-server
  namespace: models
data:
  server.py: |
    """
    GENA-LM-large: Large DNA BERT for long genomic sequences.
    API: POST /v1/science/embed -> {"sequence": "ATCG..."} -> {"embedding": [...]}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")
    app = FastAPI()
    tokenizer = None
    model = None
    DEVICE = "cpu"

    def load():
        global tokenizer, model, DEVICE
        import torch
        from transformers import AutoTokenizer, AutoModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading GENA-LM-large on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR, trust_remote_code=True)
        model = AutoModel.from_pretrained(MODEL_DIR, trust_remote_code=True).to(DEVICE)
        model.eval()
        print(f"GENA-LM-large ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "gena-lm-large"}

    @app.get("/v1/models")
    async def list_models():
        return {"models": [{"id": "gena-lm-large", "description": "GENA-LM-large DNA BERT 340M (T2T genome, 36kb context)"}]}

    @app.post("/v1/science/embed")
    async def embed(payload: dict):
        import torch
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        seqs = payload.get("sequences") or ([payload.get("sequence")] if payload.get("sequence") else None)
        if not seqs:
            return JSONResponse({"error": "provide sequence or sequences"}, 400)
        enc = tokenizer(seqs, return_tensors="pt", padding=True, truncation=True, max_length=512)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc, output_hidden_states=True)
        # GENA-LM returns MaskedLMOutput; use sequence_output or hidden_states[-1]
        if hasattr(out, 'last_hidden_state'):
            hidden = out.last_hidden_state
        elif hasattr(out, 'hidden_states') and out.hidden_states:
            hidden = out.hidden_states[-1]
        else:
            # sequence_output is first element for BERT-style models
            hidden = out[0]
        embeddings = hidden[:, 0, :].cpu().tolist()
        return {"embeddings": embeddings, "model": "gena-lm-large", "dim": len(embeddings[0])}

    @app.post("/v1/embeddings")
    async def openai_embeddings(payload: dict):
        import torch
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        inp = payload.get("input")
        if inp is None:
            inp = payload.get("sequences") or ([payload.get("sequence")] if payload.get("sequence") else None)
        seqs = [inp] if isinstance(inp, str) else list(inp or [])
        if not seqs or not seqs[0]:
            return JSONResponse({"error": "provide 'input' (DNA sequence string or list)"}, 400)
        enc = tokenizer(seqs, return_tensors="pt", padding=True, truncation=True, max_length=512)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc, output_hidden_states=True)
        if hasattr(out, 'last_hidden_state'):
            hidden = out.last_hidden_state
        elif hasattr(out, 'hidden_states') and out.hidden_states:
            hidden = out.hidden_states[-1]
        else:
            hidden = out[0]
        emb = hidden[:, 0, :].cpu().tolist()   # [CLS]
        data = [{"object": "embedding", "index": i, "embedding": e} for i, e in enumerate(emb)]
        pt = sum(len(s) for s in seqs)
        return JSONResponse({"object": "list", "data": data, "model": payload.get("model", "gena-lm-large"),
                             "usage": {"prompt_tokens": pt, "total_tokens": pt}})

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gena-lm-large
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "10m"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 1
    scaleMetric: concurrency
    nodeSelector:
      gpu: "on"
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: gena-lm-large-data
      - name: server-code
        configMap:
          name: gena-lm-large-server
    initContainers:
      - name: model-setup
        image: python:3.11-slim
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
          - name: model-data
            mountPath: /data
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HOME
            value: /data/hf_cache
        command: ["bash", "-c"]
        args:
          - |
            set -e
            VENV=/data/venv
            if [ ! -f "$VENV/bin/python" ] || ! $VENV/bin/python -c "from transformers.pytorch_utils import find_pruneable_heads_and_indices; import fastapi" 2>/dev/null; then
              python -m venv $VENV --clear
              $VENV/bin/pip install --quiet --upgrade pip
              $VENV/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
              $VENV/bin/pip install --quiet "transformers<4.45" huggingface_hub fastapi uvicorn
              echo "Venv ready"
            else
              echo "Venv OK"
            fi
            if [ ! -f /data/model/config.json ]; then
              $VENV/bin/python -c "
            from huggingface_hub import snapshot_download; import os
            snapshot_download(repo_id='AIRI-Institute/gena-lm-bert-large-t2t', local_dir='/data/model', token=os.environ['HF_TOKEN'], ignore_patterns=['*.msgpack','flax_model*','tf_model*'])
            print('Done')
            "
            fi
    containers:
      - name: kserve-container
        image: python:3.11-slim
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "10240"
          limits:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "10240"
        volumeMounts:
          - name: model-data
            mountPath: /data
          - name: server-code
            mountPath: /app
        env:
          - name: MODEL_DIR
            value: /data/model
          - name: HF_HOME
            value: /data/hf_cache
          - name: HF_HUB_OFFLINE
            value: "1"
        command: ["bash", "-c"]
        args:
          - |
            /data/venv/bin/python /app/server.py
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 10
