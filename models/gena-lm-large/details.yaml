apiVersion: v1
kind: ConfigMap
metadata:
  name: gena-lm-large-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gena-lm-large",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": { "k8s_name": "gena-lm-large", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "10m", "cold_start_estimate": "30-60 seconds (venv + model on PVC)" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {}, "custom_params": { "passthrough": true }, "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "DNA sequence(s); truncated to 512 tokens." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 1024]" }, "description": "1024-dim [CLS]-pooled DNA embeddings" },
        "model": { "type": "string", "description": "Model name (gena-lm-large)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (sequence lengths)" }
      },
      "catalog": {
        "description_short": "GENA-LM-large — 1024-dim DNA embeddings, BERT-large on T2T genome (GPU, scale-to-zero)",
        "description": "GENA-LM-large (AIRI-Institute/gena-lm-bert-large-t2t, 340M): a BERT-large DNA model trained on the hg38+T2T human genome for long genomic sequences. Produces 1024-dim [CLS]-pooled DNA embeddings for complex genomic-element classification. Max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (10 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "AIRI Institute",
        "source": "AIRI-Institute/gena-lm-bert-large-t2t",
        "source_url": "https://huggingface.co/AIRI-Institute/gena-lm-bert-large-t2t",
        "license": "Apache-2.0",
        "parameters": "340M",
        "precision": "fp32",
        "framework": "transformers AutoModel (custom FastAPI server, trust_remote_code)",
        "domain": "genomics", "subdomain": "dna-embeddings",
        "gpu": true, "embedding_dimensions": 1024, "pooling": "cls", "max_input_tokens": 512,
        "tags": ["embedding", "science", "genomics", "dna", "bert-large"]
      }
    }
