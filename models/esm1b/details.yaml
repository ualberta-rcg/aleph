apiVersion: v1
kind: ConfigMap
metadata:
  name: esm1b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esm1b",
      "status": "production",
      "type": "embedding",
      "description_short": "ESM-1b 650M protein language model from Meta",
      "description": "ESM-1b is a 650M parameter protein language model from Meta (Facebook). Produces per-residue and mean-pooled embeddings for protein sequences. Trained on UniRef50. 1024 residue context. Uses fp16 on GPU. Predecessor to ESM-2 but still widely used.",
      "context_window": 1024,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "meta",
      "source": "facebook/esm1b_t33_650M_UR50S",
      "source_url": "https://huggingface.co/facebook/esm1b_t33_650M_UR50S",
      "license": "MIT",
      "parameters": "650M",
      "precision": "float16 (GPU) / float32 (CPU)",
      "architecture": "ESM-1b (Transformer)",
      "framework": "transformers + torch",
      "deployment": {"image": "python:3.11-slim", "gpu": true, "min_replicas": 0, "max_replicas": 5, "cpu_request": "2", "memory_request": "4Gi", "pvc": "esm1b-data", "pvc_size": "5Gi", "node_selector": "NVIDIA-L40S-SHARED", "timeout": 120},
      "routing": {"kserve_custom": true, "path_prefix": "/v1/", "isvc_name": "esm1b", "api_name": "esm1b"},
      "compatibility": {"openai_embeddings": true, "input_fields": ["input", "sequences"]},
      "domain": "proteomics",
      "subdomain": "protein-embedding",
      "tags": ["embedding", "science", "proteomics", "protein", "meta", "gpu"],
      "content_types": ["text"],
      "languages": ["protein"],
      "input_map": {"input": "amino acid sequence(s)", "sequences": "alias for input"},
      "output_map": {"object": "list", "data": "[{object: embedding, index: int, embedding: [float]}]", "model": "esm1b"},
      "tier": 2
    }
