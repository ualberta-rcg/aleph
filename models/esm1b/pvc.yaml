# Venv + HF cache persist on NFS (ReadWriteMany) so scale-from-zero cold starts skip the
# re-download, and so the ISVC's scaleTarget:5 can mount >1 pod concurrently. Split out of
# inferenceservice.yaml 2026-06-19; migrated RWO→RWX the same day (stop ISVC → delete PVC →
# re-apply this; reclaim policy is Delete, so it triggered a one-time ~2.5GB re-download).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esm1b-data
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
