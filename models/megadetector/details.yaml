apiVersion: v1
kind: ConfigMap
metadata:
  name: megadetector-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "megadetector",
      "status": "production",
      "type": "detect",
      "endpoints": {
        "primary": "/v1/vision/detect",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "megadetector",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": false,
          "format": "base64",
          "description": "Single base64-encoded JPEG/PNG camera trap image"
        },
        "images": {
          "type": "array",
          "required": false,
          "description": "Array of base64-encoded images for batch mode (alternative to 'image')"
        },
        "threshold": {
          "type": "float",
          "required": false,
          "default": 0.2,
          "description": "Confidence threshold for detections (0-1)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (megadetector)"},
        "threshold": {"type": "float", "description": "Threshold used for this request"},
        "detections": {
          "type": "array",
          "description": "Nested array — one sub-array per input image, each containing detection objects",
          "items": {
            "type": "array",
            "items": {
              "category": "string — animal|human|vehicle",
              "bbox": "[x, y, w, h] normalized 0-1 coordinates",
              "conf": "float — confidence 0-1"
            }
          }
        }
      },
      "catalog": {
        "description_short": "Microsoft MegaDetector v5 — wildlife camera trap detector (animal/human/vehicle, GPU)",
        "description": "MegaDetector v5 by Microsoft AI for Earth (~87M params, YOLOv5-based). Detects animals, humans, and vehicles in camera trap images. Widely used in ecology and conservation. Supports single or batch image input with configurable confidence threshold. GPU inference via PyTorch.",
        "owned_by": "microsoft",
        "source": "microsoft/MegaDetector",
        "source_url": "https://github.com/microsoft/CameraTraps",
        "license": "MIT",
        "parameters": "~87M",
        "precision": "fp32",
        "framework": "pytorch",
        "domain": "ecology",
        "subdomain": "wildlife-monitoring",
        "tags": ["science", "ecology", "wildlife", "detect", "camera-trap", "gpu"]
      }
    }
