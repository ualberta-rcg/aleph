apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-35b-a3b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen36-35b-a3b",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen36-35b-a3b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 32768, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "~3 minutes (70 GB BF16 MoE, 2x L40S)"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none", "low": "none",
            "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "high", "max": "high"
          },
          "on": { "chat_template_kwargs": { "enable_thinking": true } },
          "off": { "chat_template_kwargs": { "enable_thinking": false } }
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.6, "top_p": 0.95, "max_tokens": 32768, "thinking": { "enabled": true, "effort": "medium" } },
        "meta_tasks": {
          "title":     { "max_tokens": 80, "thinking": { "enabled": false } },
          "tags":      { "max_tokens": 60, "thinking": { "enabled": false } },
          "followups": { "max_tokens": 220, "thinking": { "enabled": false } }
        }
      },
      "custom_params": {
        "schema": {
          "top_k": { "type": "integer", "default": 20 },
          "presence_penalty": { "type": "number", "default": 1.5, "min": 0.0, "max": 2.0 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Qwen3.6-35B-A3B — hybrid Gated-DeltaNet MoE (3B active), thinking + tools + vision (2x L40S)",
        "description": "Qwen3.6-35B-A3B is a hybrid architecture combining 30 Gated DeltaNet (linear attention) layers with 10 full softmax attention layers. 35B total parameters with 3B active per token (256 experts, 8+1 routed). Supports thinking mode (qwen3 parser), tool calling (qwen3_coder parser), and vision (images + video). 256K native context deployed at 32K. Requires vLLM >= 0.19.0.",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen3.6-35B-A3B",
        "source_url": "https://huggingface.co/Qwen/Qwen3.6-35B-A3B",
        "license": "Apache-2.0",
        "parameters": "35B MoE (3B active)",
        "precision": "bf16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "hybrid-attention-moe",
        "tags": ["chat", "llm", "moe", "gated-deltanet", "reasoning", "tool-calling", "vision", "multimodal"]
      }
    }
