# Qwen3.6-35B-A3B MoE (3B active), Gated-DeltaNet hybrid (needs newer vLLM).
# Weights (~70 GB) persist on NFS (nfs-models) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-35b-a3b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 120Gi
