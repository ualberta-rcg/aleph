apiVersion: v1
kind: ConfigMap
metadata:
  name: prithvi-eo-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "prithvi-eo",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/embed"],
        "health": "/health"
      },
      "routing": { "k8s_name": "prithvi-eo", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 minutes (venv-on-PVC; weights already downloaded)" },
      "behavior": { "supports_vision": true, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "catalog": {
        "description_short": "IBM/NASA Prithvi-EO-2.0-300M — 1024-dim CLS embeddings from 6-band multi-temporal HLS satellite imagery.",
        "description": "Prithvi-EO-2.0-300M (IBM/NASA/JSC, 300M) is an earth-observation foundation model: a 3D ViT MAE pretrained on NASA HLS V2 satellite imagery. Accepts 6-band multispectral data (Blue, Green, Red, NIR, SWIR, SWIR2) with multi-temporal input (T time steps; a single (H,W,6) frame is replicated to T=1). forward_features extracts a 1024-dim CLS embedding (plus per-patch features). Use cases: land classification, change detection, environmental monitoring. Non-text domain model: image-cube input, does NOT expose OpenAI /v1/embeddings; primary is /v1/science/embed (/v1/embed kept as secondary). Output returns the full `embeddings`/`cls_embedding` (1024) + summary fields.",
        "owned_by": "ibm-nasa-geospatial",
        "source": "ibm-nasa-geospatial/Prithvi-EO-2.0-300M",
        "source_url": "https://huggingface.co/ibm-nasa-geospatial/Prithvi-EO-2.0-300M",
        "license": "Apache-2.0",
        "parameters": "300M",
        "precision": "fp32",
        "framework": "terratorch (BACKBONE_REGISTRY) + PyTorch",
        "domain": "earth-observation",
        "subdomain": "remote-sensing",
        "tags": ["embedding", "science", "earth-observation", "satellite", "hls", "vit-mae", "prithvi", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "input_format": {
          "model": "prithvi-eo",
          "image": "[[[band,...],...],...] shape (H,W,6) or (T,H,W,6) — 6-band Blue/Green/Red/NIR/SWIR/SWIR2; (H,W,6) replicated to T=1"
        },
        "embedding_dimensions": 1024,
        "pooling": "cls_token (forward_features)"
      }
    }
