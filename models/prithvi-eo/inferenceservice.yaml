# Prithvi-EO-2.0-300M: Earth Observation Foundation Model (IBM × NASA)
# ibm-nasa-geospatial/Prithvi-EO-2.0-300M — Apache 2.0
# 3D ViT MAE pretrained on HLS V2 (6 bands: Blue, Green, Red, NIR, SWIR, SWIR2)
# Uses terratorch BACKBONE_REGISTRY for model loading + forward_features for embeddings
# API: POST /v1/embed {image: [[6 floats], ...], height: 224, width: 224}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prithvi-eo-server
  namespace: models
data:
  server.py: |
    """
    Prithvi-EO-2.0-300M: IBM × NASA Earth Observation Foundation Model.
    Uses terratorch BACKBONE_REGISTRY for loading and forward_features for embeddings.
    Input: 6-band multispectral imagery (Blue, Green, Red, NIR, SWIR, SWIR2).
    API: POST /v1/embed
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print("Loading Prithvi-EO-2.0-300M via BACKBONE_REGISTRY...", flush=True)
        from terratorch.registry import BACKBONE_REGISTRY

        model = BACKBONE_REGISTRY.build("prithvi_eo_v2_300", pretrained=True)
        model = model.to(DEVICE).eval()
        print(f"Prithvi-EO-2.0-300M ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "prithvi-eo-300m"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "prithvi-eo-300m", "object": "model",
             "owned_by": "ibm-nasa-geospatial", "type": "earth-observation-embedding"}
        ]}

    @app.post("/v1/embed")
    @app.post("/v1/science/embed")
    async def embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(req):
        import torch, numpy as np

        image = req.get("image")
        if image is None:
            raise ValueError("image required: (T, H, W, 6) or (H, W, 6) array")

        img_np = np.array(image, dtype=np.float32)
        # (H, W, 6) → replicate to (T=1, H, W, 6)
        if img_np.ndim == 3:
            img_np = img_np[np.newaxis, ...]  # (1, H, W, 6)
        # (T, H, W, 6) → (1, 6, T, H, W)
        T, H, W, C = img_np.shape
        tensor = torch.tensor(img_np).permute(3, 0, 1, 2).unsqueeze(0)  # (1, 6, T, H, W)
        tensor = tensor.to(DEVICE)

        with torch.no_grad():
            features = model.forward_features(tensor)

        # features is list of tensors from each transformer block
        # Last entry: (1, 1+num_patches, embed_dim=1024)
        final = features[-1]
        cls_emb = final[:, 0, :].squeeze(0).cpu().float().numpy()  # (1024,)
        patch_emb = final[:, 1:, :].squeeze(0).cpu().float().numpy()  # (num_patches, 1024)

        # Return the full CLS embedding (1024 floats ~8KB — fine) + summary fields.
        return {
            "model": "prithvi-eo-300m",
            "embeddings": cls_emb.tolist(),
            "cls_embedding": cls_emb.tolist(),
            "cls_embedding_dim": len(cls_emb),
            "cls_mean": float(cls_emb.mean()),
            "cls_sample": cls_emb[:10].tolist(),
            "num_patches": patch_emb.shape[0],
            "patch_embedding_dim": patch_emb.shape[1],
            "input_shape": [T, H, W, C],
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: prithvi-eo
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline-seconds: "1800"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 180
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.prithvi-eo-ready-v5
            if [ -f "$SENTINEL" ]; then echo "Already set up."; exit 0; fi
            echo "Installing system deps for GDAL/rasterio..."
            apt-get update -qq && apt-get install -y -qq gcc g++ git libgdal-dev gdal-bin
            echo "Creating venv..."
            rm -rf /data/venv
            python3 -m venv /data/venv
            /data/venv/bin/pip install -q -U pip
            echo "Installing torch + terratorch..."
            /data/venv/bin/pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cu126
            /data/venv/bin/pip install -q terratorch huggingface_hub fastapi uvicorn
            echo "Pre-downloading Prithvi-EO weights..."
            HF_HOME=/data/hf_cache /data/venv/bin/python -c "
            from terratorch.registry import BACKBONE_REGISTRY
            m = BACKBONE_REGISTRY.build('prithvi_eo_v2_300', pretrained=True)
            print('Prithvi-EO-2.0-300M downloaded and cached.')
            "
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "4", memory: 16Gi }
          limits: { cpu: "8", memory: 32Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            apt-get update -qq && apt-get install -y -qq libexpat1 2>&1 | tail -1
            exec /data/venv/bin/python /app/server.py
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "16384" }
          limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "16384" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: prithvi-eo-data }
      - name: app
        configMap: { name: prithvi-eo-server }
