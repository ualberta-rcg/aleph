# Stable Diffusion 3 Medium: 2B MMDiT text-to-image (stabilityai/stable-diffusion-3-medium).
# Standard KServe InferenceService custom predictor (diffusers FastAPI server), wired exactly
# like kandinsky-3 / flux-1-dev: gateway-discovered, reachable at sd3-medium-predictor, Knative
# scale-to-zero on the 5m/15m policy. GATED model -> requires the hf-token secret.
#
# diffusers loads the *-diffusers* repo (stable-diffusion-3-medium-diffusers). fp16 resident is
# ~16 GB (2B MMDiT + T5-XXL + CLIP-G/L + VAE), so a HAMi vGPU SLICE fits (shareable) rather than a
# whole card: nvidia.com/gpu: 1 + nvidia.com/gpumem: 24576. Deps + weights stage once onto the PVC.
# API: POST /v1/images/generations (OpenAI-style) -> {data:[{b64_json}]}.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sd3-medium-server
  namespace: models
data:
  server.py: |
    """Stable Diffusion 3 Medium diffusers server (KServe custom predictor).

    OpenAI-style image API:
      POST /v1/images/generations  {prompt, negative_prompt, n, size, num_inference_steps,
                                     guidance_scale, max_sequence_length, seed}
      POST /v1/images/edits        {prompt, image(b64), strength, ...}
      GET  /v1/models
      GET  /health
    """
    import os, io, base64, time, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/sd3-medium")
    app = FastAPI()
    t2i = None
    i2i = None

    def parse_size(size_str):
        try:
            w, h = str(size_str).lower().split("x")
            return int(w), int(h)
        except Exception:
            return 1024, 1024

    def load():
        global t2i, i2i
        import torch
        from diffusers import AutoPipelineForText2Image, AutoPipelineForImage2Image
        print(f"Loading Stable Diffusion 3 Medium from {MODEL_DIR} ...", flush=True)
        t2i = AutoPipelineForText2Image.from_pretrained(
            MODEL_DIR, torch_dtype=torch.float16
        ).to("cuda")
        try:
            i2i = AutoPipelineForImage2Image.from_pipe(t2i)
        except Exception as e:
            print(f"img2img init failed: {e}", flush=True)
            i2i = None
        print("Stable Diffusion 3 Medium ready.", flush=True)

    @app.on_event("startup")
    async def _startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        # 503 until the pipeline is resident so Knative gates traffic on real readiness.
        if t2i is None:
            return JSONResponse({"status": "loading", "model": "sd3-medium"}, 503)
        return {"status": "ok", "model": "sd3-medium"}

    @app.get("/v1/models")
    async def models():
        return {"object": "list", "data": [
            {"id": "sd3-medium", "object": "model", "owned_by": "stabilityai"}
        ]}

    def _png_b64(img):
        buf = io.BytesIO()
        img.save(buf, format="PNG")
        return base64.b64encode(buf.getvalue()).decode()

    def _gen(req):
        import torch
        prompt = req.get("prompt", "")
        negative = req.get("negative_prompt", "")
        n = min(int(req.get("n", 1)), 4)
        width, height = parse_size(req.get("size", "1024x1024"))
        width = int(req.get("width", width))
        height = int(req.get("height", height))
        steps = int(req.get("num_inference_steps", 28))
        guidance = float(req.get("guidance_scale", 7.0))
        max_seq = int(req.get("max_sequence_length", 256))
        seed = req.get("seed")
        out = []
        for i in range(n):
            kwargs = dict(prompt=prompt, negative_prompt=negative,
                          num_inference_steps=steps, guidance_scale=guidance,
                          width=width, height=height, max_sequence_length=max_seq)
            if seed is not None:
                kwargs["generator"] = torch.Generator(device="cpu").manual_seed(int(seed) + i)
            with torch.inference_mode():
                img = t2i(**kwargs).images[0]
            out.append(_png_b64(img))
        return out

    def _edit(req):
        import torch
        from PIL import Image
        if i2i is None:
            raise RuntimeError("img2img pipeline not available")
        prompt = req.get("prompt", "")
        negative = req.get("negative_prompt", "")
        image_b64 = req.get("image", "")
        if image_b64.startswith("data:"):
            image_b64 = image_b64.split(",", 1)[1]
        image = Image.open(io.BytesIO(base64.b64decode(image_b64))).convert("RGB")
        n = min(int(req.get("n", 1)), 4)
        steps = int(req.get("num_inference_steps", 28))
        strength = float(req.get("strength", 0.6))
        guidance = float(req.get("guidance_scale", 7.0))
        max_seq = int(req.get("max_sequence_length", 256))
        seed = req.get("seed")
        out = []
        for i in range(n):
            kwargs = dict(prompt=prompt, negative_prompt=negative, image=image,
                          num_inference_steps=steps, strength=strength,
                          guidance_scale=guidance, max_sequence_length=max_seq)
            if seed is not None:
                kwargs["generator"] = torch.Generator(device="cpu").manual_seed(int(seed) + i)
            with torch.inference_mode():
                img = i2i(**kwargs).images[0]
            out.append(_png_b64(img))
        return out

    @app.post("/v1/images/generations")
    async def generations(request: dict):
        if t2i is None:
            return JSONResponse({"error": "model loading"}, 503)
        try:
            imgs = await asyncio.get_event_loop().run_in_executor(None, _gen, request)
            return {"created": int(time.time()),
                    "data": [{"b64_json": b, "revised_prompt": None} for b in imgs]}
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    @app.post("/v1/images/edits")
    async def edits(request: dict):
        if t2i is None:
            return JSONResponse({"error": "model loading"}, 503)
        try:
            imgs = await asyncio.get_event_loop().run_in_executor(None, _edit, request)
            return {"created": int(time.time()),
                    "data": [{"b64_json": b, "revised_prompt": None} for b in imgs]}
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sd3-medium
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 3
    scaleTarget: 1
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.sd3-medium-ready-v1
            VENV=/data/venv
            if [ ! -f "$SENTINEL" ] || [ ! -x "$VENV/bin/python" ]; then
              echo "Building venv + downloading weights ..."
              rm -rf "$VENV"
              python3 -m venv "$VENV"
              "$VENV/bin/pip" install -q -U pip
              "$VENV/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cu126
              "$VENV/bin/pip" install -q \
                "diffusers>=0.31.0" "transformers>=4.43.0" "accelerate>=0.31.0" \
                "huggingface_hub>=0.24.0" pillow sentencepiece safetensors protobuf \
                fastapi uvicorn
              "$VENV/bin/python" - <<'PY'
            import os
            from pathlib import Path
            from huggingface_hub import snapshot_download
            d = Path("/data/sd3-medium")
            if (d / "model_index.json").is_file():
                print("weights present, skipping download", flush=True)
            else:
                d.mkdir(parents=True, exist_ok=True)
                print("downloading stabilityai/stable-diffusion-3-medium-diffusers ...", flush=True)
                snapshot_download(repo_id="stabilityai/stable-diffusion-3-medium-diffusers",
                                  local_dir=str(d), token=os.environ.get("HF_TOKEN"))
                print("download finished", flush=True)
            PY
              touch "$SENTINEL"
              echo "setup complete"
            else
              echo "venv + weights already present"
            fi
        resources:
          requests: { cpu: "2", memory: 6Gi }
          limits: { cpu: "4", memory: 12Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/sd3-medium }
          - { name: HF_HOME, value: /tmp/hf }
        ports:
          - containerPort: 8080
            protocol: TCP
        # Single GPU (TP=1) -> HAMi vGPU slice. fp16 SD3-medium is ~16 GB resident; 24 GB slice.
        resources:
          requests: { cpu: "2", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "24576" }
          limits: { cpu: "8", memory: 32Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "24576" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 50
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 70
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: sd3-medium-data }
      - name: app
        configMap: { name: sd3-medium-server }
