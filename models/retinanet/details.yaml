apiVersion: v1
kind: ConfigMap
metadata:
  name: retinanet-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "retinanet-resnet50",
      "type": "detect",
      "description_short": "RetinaNet ResNet-50 FPN v2 — single-stage COCO detector (80 classes)",
      "description": "RetinaNet ResNet-50 FPN v2 from torchvision. 37.7M params. Single-stage detector using focal loss for dense object detection. 80 COCO classes. Runs on CPU via PyTorch (no ONNX export — uses torchvision weights directly). Returns bounding boxes with class labels and confidence scores. 41.5 mAP@50-95 on COCO.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/vision/detect",
        "health": "/health"
      },
      "owned_by": "torchvision",
      "source": "torchvision.models.detection.retinanet_resnet50_fpn_v2",
      "source_url": "https://pytorch.org/vision/stable/models/retinanet.html",
      "license": "BSD-3-Clause",
      "parameters": "37.7M",
      "parameter_count": 37700000,
      "precision": "fp32",
      "architecture": "cnn",
      "framework": "pytorch",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 60,
        "container_image": "python:3.11-slim",
        "timeout": 180
      },
      "routing": {
        "k8s_name": "retinanet",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": true,
        "reasoning_model": false
      },
      "domain": "computer-vision",
      "subdomain": "object-detection",
      "tags": ["vision", "detect", "coco", "single-stage", "onnx", "cpu"],
      "content_types": ["image"],
      "tier": "production",
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "media_types": ["image/jpeg", "image/png"],
          "max_size_bytes": 10485760,
          "description": "Base64-encoded JPEG or PNG image"
        }
      },
      "output_map": {
        "model": "string",
        "task": "string",
        "detections": {
          "type": "array",
          "items": {
            "label": "string (COCO class name)",
            "score": "float (0-1 confidence)",
            "box": "[x1, y1, x2, y2] pixel coordinates"
          }
        }
      },
      "server_config": {
        "inference_backend": "pytorch",
        "confidence_threshold": 0.5,
        "framework_version": "torchvision",
        "weights": "DEFAULT (COCO_V2)"
      }
    }
