apiVersion: v1
kind: ConfigMap
metadata:
  name: retinanet-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "retinanet-resnet50",
      "status": "production",
      "type": "detect",
      "endpoints": {
        "primary": "/v1/vision/detect",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "retinanet",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (retinanet-resnet50)"},
        "task": {"type": "string", "description": "Always \"detect\""},
        "detections": {
          "type": "array",
          "items": {
            "label": "string — COCO class name (80 classes)",
            "score": "float — confidence 0-1",
            "box": "[x1, y1, x2, y2] pixel coordinates"
          },
          "description": "Detections with score >= 0.5 (hardcoded threshold)"
        }
      },
      "catalog": {
        "description_short": "RetinaNet ResNet-50 FPN v2 — single-stage COCO detector (80 classes, PyTorch, CPU)",
        "description": "RetinaNet ResNet-50 FPN v2 from torchvision (37.7M params). Single-stage detector using focal loss for dense object detection. 80 COCO classes. PyTorch CPU inference (no ONNX). Confidence threshold 0.5 (hardcoded). 41.5 mAP@50-95 on COCO.",
        "owned_by": "torchvision",
        "source": "torchvision.models.detection.retinanet_resnet50_fpn_v2",
        "source_url": "https://pytorch.org/vision/stable/models/retinanet.html",
        "license": "BSD-3-Clause",
        "parameters": "37.7M",
        "precision": "fp32",
        "framework": "pytorch",
        "domain": "computer-vision",
        "subdomain": "object-detection",
        "tags": ["vision", "detect", "coco", "single-stage", "cpu"]
      }
    }
