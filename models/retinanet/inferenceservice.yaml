# RetinaNet: Object detection (torchvision retinanet_resnet50_fpn_v2)
# API: POST /v1/vision/detect
apiVersion: v1
kind: ConfigMap
metadata:
  name: retinanet-server
  namespace: models
data:
  server.py: |
    """RetinaNet object detection server."""
    import os, io, base64, asyncio
    import numpy as np
    from PIL import Image
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_NAME = os.environ.get("MODEL_NAME", "retinanet-resnet50")
    CONF_THRESH = 0.5

    COCO_CLASSES = ['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat',
        'traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse',
        'sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie',
        'suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove',
        'skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon',
        'bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut',
        'cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse',
        'remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book',
        'clock','vase','scissors','teddy bear','hair drier','toothbrush']

    app = FastAPI()
    model = None

    def load():
        global model
        import torch, torchvision
        model = torchvision.models.detection.retinanet_resnet50_fpn_v2(weights="DEFAULT")
        model.eval()
        print(f"{MODEL_NAME} loaded", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "torchvision", "type": "detect"}]}

    def _infer(img_bytes):
        import torch
        img = Image.open(io.BytesIO(img_bytes)).convert("RGB")
        arr = np.array(img, dtype=np.float32) / 255.0
        tensor = torch.from_numpy(arr.transpose(2, 0, 1)).unsqueeze(0)
        with torch.no_grad():
            preds = model(tensor)[0]
        results = []
        for i, score in enumerate(preds["scores"].numpy()):
            if score < CONF_THRESH: continue
            label_id = int(preds["labels"][i])
            results.append({"label": COCO_CLASSES[label_id-1] if 1<=label_id<=len(COCO_CLASSES) else str(label_id),
                           "score": float(score), "box": preds["boxes"][i].numpy().tolist()})
        return results

    @app.post("/v1/vision/detect")
    async def detect(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        b64 = request.get("image", "")
        if "," in b64: b64 = b64.split(",", 1)[1]
        results = await asyncio.get_event_loop().run_in_executor(None, _infer, base64.b64decode(b64))
        return {"model": MODEL_NAME, "task": "detect", "detections": results}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: retinanet
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 180
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
              /data/venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                torch torchvision pillow numpy fastapi uvicorn
            else
              echo "venv exists"
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_NAME, value: retinanet-resnet50 }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: retinanet-data }
      - name: app
        configMap: { name: retinanet-server }
