apiVersion: v1
kind: ConfigMap
metadata:
  name: biot5-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biot5",
      "type": "science-generate",
      "status": "production",
      "status_note": "Verified 2026-06-05: mol2text + text2mol both correct (task-specific checkpoints + SELFIES).",
      "endpoints": {
        "primary": "/v1/science/generate",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "biot5",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {
        "task": "mol2text"
      },
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "task": {
          "type": "string",
          "required": false,
          "default": "mol2text",
          "enum": [
            "mol2text",
            "text2mol",
            "caption"
          ],
          "description": "Task to perform: mol2text=molecule\u2192caption, text2mol=text\u2192SELFIES molecule, caption=scientific captioning"
        },
        "input": {
          "type": "string",
          "required": true,
          "description": "SELFIES string (for mol2text) or text description (for text2mol/caption)"
        }
      },
      "output_map": {
        "model": {
          "type": "string",
          "description": "Model name (biot5)"
        },
        "task": {
          "type": "string",
          "description": "Task performed"
        },
        "output": {
          "type": "string",
          "description": "Generated text (caption) or SELFIES string (molecule)"
        },
        "input": {
          "type": "string",
          "description": "Echo of input"
        }
      },
      "catalog": {
        "description_short": "BioT5 \u2014 cross-modal biology+chemistry T5 (SELFIES)",
        "description": "BioT5-base (QizhiPei/biot5-base, 0.3B): cross-modal biology+chemistry T5. Tasks via /v1/science/generate: molecule captioning (mol2text), text-conditioned molecule generation (text2mol, SELFIES), and scientific captioning. Uses SELFIES for valid molecule generation. CPU.",
        "owned_by": "QizhiPei",
        "source": "QizhiPei/biot5-base",
        "source_url": "https://huggingface.co/QizhiPei/biot5-base",
        "license": "MIT",
        "parameters": "0.3B",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "biochemistry",
        "subdomain": "molecule-text",
        "tags": [
          "science",
          "chemistry",
          "biology",
          "molecule",
          "t5",
          "cpu"
        ],
        "gpu": false,
        "max_input_tokens": 512,
        "input_format": {
          "model": "biot5",
          "task": "mol2text|text2mol|caption",
          "input": "SELFIES or text (task-dependent)"
        },
        "output_format": {
          "task": "str",
          "output": "generated text or SELFIES"
        }
      }
    }
