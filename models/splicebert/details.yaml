apiVersion: v1
kind: ConfigMap
metadata:
  name: splicebert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "splicebert-86m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "splicebert",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 510, "max_input_tokens": 510 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "30-60 seconds (venv + model on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "RNA/DNA sequence(s) (6-mer tokenized); truncated to 510 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled (attention-masked) embeddings" },
        "model": { "type": "string", "description": "Model name (splicebert-86m)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "SpliceBERT — RNA splice-site embeddings (768-dim, CPU, scale-to-zero)",
        "description": "SpliceBERT (zhihan1996/SpliceBERT, Zhou et al.): ~86M BERT pre-trained on ~2M RNA sequences across multiple species for splice-site prediction and RNA analysis. Initialized from the DNA_bert_6 checkpoint (6-mer tokenization); requires trust_remote_code. Produces 768-dim mean-pooled embeddings for splicing analysis, alternative-splicing prediction, and transcriptomics. Max 510 tokens. Served CPU-only via a custom transformers FastAPI server, scale-to-zero.",
        "owned_by": "Zhihan Zhou (zhihan1996)",
        "source": "zhihan1996/SpliceBERT",
        "source_url": "https://huggingface.co/zhihan1996/SpliceBERT",
        "license": "Apache-2.0",
        "parameters": "86M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server, trust_remote_code)",
        "domain": "genomics",
        "subdomain": "rna-embeddings",
        "gpu": false,
        "embedding_dimensions": 768,
        "pooling": "mean (attention-masked)",
        "max_input_tokens": 510,
        "tags": ["embedding", "science", "genomics", "rna", "splicing", "transcriptomics", "cpu"]
      }
    }
