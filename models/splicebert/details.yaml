apiVersion: v1
kind: ConfigMap
metadata:
  name: splicebert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "splicebert-86m",
      "type": "embedding",
      "description_short": "SpliceBERT — RNA splice-site embeddings (768-dim)",
      "description": "SpliceBERT by Zhihan Zhou et al. 86M params. BERT-based model pre-trained on 2 million RNA sequences across multiple species for splice site prediction and RNA analysis. Trained on DNA_bert_6 checkpoint (6-mer tokenization). Produces 768-dimensional embeddings for RNA splicing analysis, alternative splicing prediction, and transcriptomics. Requires trust_remote_code. Max sequence length 510 tokens.",
      "context_window": 510,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "zhihan1996",
      "source": "zhihan1996/DNA_bert_6",
      "source_url": "https://huggingface.co/zhihan1996/DNA_bert_6",
      "license": "Apache-2.0",
      "parameters": "86M",
      "parameter_count": 86000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "k8s_name": "splicebert",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "genomics",
      "subdomain": "rna-embeddings",
      "tags": ["embedding", "science", "genomics", "rna", "splicing", "transcriptomics"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "RNA/DNA sequence string(s)"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 768]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace, trust_remote_code=True)",
        "max_seq_length": 510,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 768,
        "tokenizer": "6-mer (DNA_bert_6)"
      }
    }
