# Venv + Geneformer weights persist on NFS (ReadWriteMany, nfs-models). Split out of the ISVC
# 2026-06-19 (was inline + RWO). Migrated RWO→RWX by copying the venv + weights from the old
# RWO PVC (geneformer-data) into this new RWX PVC (geneformer-data-rwx) — preserves the venv.
# Old geneformer-data PVC deleted after the copy + repoint.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geneformer-data-rwx
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-models
  resources:
    requests:
      storage: 8Gi
