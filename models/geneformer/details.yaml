apiVersion: v1
kind: ConfigMap
metadata:
  name: geneformer-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "geneformer",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/embed"],
        "health": "/health"
      },
      "routing": { "k8s_name": "geneformer", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 4096, "max_input_tokens": 4096 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "1-2 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "catalog": {
        "description_short": "Geneformer V2 (NIH NCI, 104M) — cell-level embeddings from single-cell gene expression.",
        "description": "Geneformer (NIH NCI) is a context-aware foundation model pretrained on 30M single-cell transcriptomes. Takes ranked gene tokens (gene names + expression values) and produces a cell-level embedding (mean-pooled hidden states). For cell-type classification, gene network analysis, and in silico perturbation. Non-text domain model: gene-expression input, does NOT expose OpenAI /v1/embeddings; primary is /v1/science/embed (/v1/embed kept as secondary).",
        "owned_by": "nih-nci",
        "source": "nih-nci/geneformer-v2-104M",
        "source_url": "https://huggingface.co/nih-nci/geneformer-v2-104M",
        "license": "BSD-2-Clause",
        "parameters": "104M (V2)",
        "precision": "fp32",
        "framework": "transformers + PyTorch",
        "domain": "transcriptomics",
        "subdomain": "single-cell",
        "tags": ["embedding", "science", "transcriptomics", "single-cell", "gene", "foundation", "cpu"],
        "gpu": false,
        "max_input_tokens": 4096,
        "input_format": {
          "model": "geneformer",
          "genes": "[\"TP53\",\"BRCA1\",...] — gene names (ranked/tokenized by the server)",
          "expression": "[1.2, 0.5, ...] — per-gene expression values"
        },
        "embedding_dimensions": 768,
        "pooling": "mean-pool over token hidden states"
      }
    }
