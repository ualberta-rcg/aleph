# GLM-Z1-32B-0414 reasoning variant: R1-style thinking, distinct lineage.
# Weights (~65 GB) persist on NFS (nfs-client) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glm-z1-32b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
