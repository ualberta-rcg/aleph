# ArcFace: Face recognition embeddings (onnxmodelzoo/arcface-lfw)
# API: POST /v1/vision/face
apiVersion: v1
kind: ConfigMap
metadata:
  name: arcface-server
  namespace: models
data:
  server.py: |
    """ArcFace face embedding server."""
    import os, io, base64, asyncio
    import numpy as np
    from PIL import Image
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_NAME = os.environ.get("MODEL_NAME", "arcface-resnet100")
    MODEL_FILE = os.environ.get("MODEL_FILE", "/data/model/arcface.onnx")
    INPUT_SIZE = 112

    app = FastAPI()
    session = None

    def load():
        global session
        import onnxruntime as ort
        opts = ort.SessionOptions()
        opts.intra_op_num_threads = 4
        session = ort.InferenceSession(MODEL_FILE, sess_options=opts, providers=["CPUExecutionProvider"])
        print(f"{MODEL_NAME} loaded", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if session else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "deepinsight", "type": "face"}]}

    def _infer(img_bytes):
        img = Image.open(io.BytesIO(img_bytes)).convert("RGB").resize((INPUT_SIZE, INPUT_SIZE))
        arr = np.array(img, dtype=np.float32)[:, :, ::-1]  # RGB to BGR
        arr = (arr - 127.5) / 128.0
        arr = arr[np.newaxis]  # NHWC format: [1, 112, 112, 3]
        emb = session.run(None, {session.get_inputs()[0].name: arr})[0][0]
        return (emb / np.linalg.norm(emb)).tolist()

    @app.post("/v1/vision/face")
    async def face_embed(request: dict):
        if session is None:
            return JSONResponse({"error": "model loading"}, 503)
        b64 = request.get("image", "")
        if "," in b64: b64 = b64.split(",", 1)[1]
        emb = await asyncio.get_event_loop().run_in_executor(None, _infer, base64.b64decode(b64))
        return {"model": MODEL_NAME, "task": "face", "embedding": emb}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: arcface
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 120
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
              /data/venv/bin/pip install "onnxruntime==1.19.2" pillow numpy fastapi uvicorn huggingface_hub
            else
              echo "venv exists"
            fi
            if [ ! -f /data/model/arcface.onnx ]; then
              echo "Downloading arcface model..."
              /data/venv/bin/python -c "
            from huggingface_hub import hf_hub_download
            import os; os.makedirs('/data/model', exist_ok=True)
            hf_hub_download(repo_id='onnx-community/arcface-onnx', filename='arcface.onnx', local_dir='/data/model')
            "
            else
              echo "Model exists"
            fi
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "2", memory: 4Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_NAME, value: arcface-resnet100 }
          - { name: MODEL_FILE, value: /data/model/arcface.onnx }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "1", memory: 1Gi }
          limits: { cpu: "2", memory: 2Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: arcface-data }
      - name: app
        configMap: { name: arcface-server }
