apiVersion: v1
kind: ConfigMap
metadata:
  name: moirai-large-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "moirai-large",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/science/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "moirai-large",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 4096,
        "max_input_tokens": 4096
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min (venv + 311M load + first forecast)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "context": {
          "type": "array",
          "required": true,
          "description": "numeric observations (the time series); up to 4096 context length"
        },
        "prediction_length": {
          "type": "integer",
          "required": false,
          "default": 24,
          "description": "future steps to forecast"
        },
        "freq": {
          "type": "string",
          "required": false,
          "default": "h",
          "description": "pandas frequency alias (e.g. 'h', 'D')"
        },
        "num_samples": {
          "type": "integer",
          "required": false,
          "default": 100,
          "description": "number of forecast samples (for quantile estimation)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "prediction_length": {"type": "integer", "description": "horizon returned"},
        "mean": {"type": "array", "description": "mean forecast (length = prediction_length)"},
        "quantiles": {"type": "object", "description": "{0.1, 0.5, 0.9} quantile forecasts"}
      },
      "catalog": {
        "description_short": "Salesforce Moirai 1.1-R-Large (311M) universal zero-shot time-series forecasting.",
        "description": "Moirai-Large (Salesforce/moirai-1.1-R-large, 311M) is the larger variant of the Moirai foundation model for universal time-series forecasting — any-variate, zero-shot, configurable prediction/context length (up to 4096) + automatic patch size. Returns probabilistic forecasts (mean + quantiles). Served via `uni2ts` + GluonTS.",
        "owned_by": "Salesforce",
        "source": "Salesforce/moirai-1.1-R-large",
        "source_url": "https://huggingface.co/Salesforce/moirai-1.1-R-large",
        "license": "Apache-2.0",
        "parameters": "311M",
        "precision": "fp32",
        "framework": "uni2ts + torch + GluonTS",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "salesforce", "gpu"]
      }
    }
