apiVersion: v1
kind: ConfigMap
metadata:
  name: moirai-large-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "moirai-large",
      "status": "production",
      "type": "forecast",
      "description_short": "Salesforce Moirai 1.1-R-Large (311M) universal zero-shot time-series forecasting model.",
      "description": "Moirai-Large is the larger variant (311M params) of Salesforce's Moirai foundation model for universal time-series forecasting. It supports any-variate, zero-shot forecasting with configurable prediction length, context length (up to 4096), and automatic patch size selection. Provides probabilistic forecasts with quantile outputs. Apache 2.0 license.",
      "context_window": 4096,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/forecast",
        "health": "/health"
      },
      "owned_by": "Salesforce",
      "source": "Salesforce/moirai-1.1-R-large",
      "source_url": "https://huggingface.co/Salesforce/moirai-1.1-R-large",
      "license": "Apache-2.0",
      "parameters": "311M",
      "precision": "float32",
      "architecture": "Moirai 1.1-R (patch-based transformer with auto patch size)",
      "framework": "uni2ts + PyTorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "gpu_type": "L40S-SHARED",
        "min_replicas": 0,
        "max_replicas": 5,
        "timeout": 120,
        "pvc": "moirai-large-data",
        "image": "python:3.11-slim",
        "venv": true
      },
      "routing": {
        "kserve_custom": true,
        "k8s_name": "moirai-large",
        "api_name": "moirai-large",
        "gateway_type": "forecast"
      },
      "compatibility": {
        "openai_compatible": false,
        "streaming": false
      },
      "domain": "time-series",
      "subdomain": "forecasting",
      "tags": ["science", "timeseries", "forecast", "zero-shot", "gpu", "salesforce", "moirai"],
      "content_types": ["application/json"],
      "tier": 2,
      "input_map": {
        "context": "array of numeric values (historical time series)",
        "prediction_length": "number of future steps (default: 24)",
        "freq": "frequency string e.g. 'H' (default: 'H')",
        "patch_size": "\"auto\" | int (default: auto)",
        "num_samples": "number of probabilistic samples (default: 100)"
      },
      "output_map": {
        "mean": "mean forecast values",
        "quantiles": {"0.1": "10th percentile", "0.5": "median", "0.9": "90th percentile"}
      },
      "server_config": {
        "port": 8080,
        "health_path": "/health",
        "model_path": "/data/model",
        "hf_model_id": "Salesforce/moirai-1.1-R-large"
      }
    }
