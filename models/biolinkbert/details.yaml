apiVersion: v1
kind: ConfigMap
metadata:
  name: biolinkbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biolinkbert",
      "status": "production",
      "type": "embedding",
      "description_short": "BioLinkBERT — biomedical link prediction embeddings (768-dim)",
      "description": "BioLinkBERT by Stanford. 110M params. BERT-base model leveraging document link structure (citation links, hyperlinks) for enhanced biomedical text understanding. Produces 768-dimensional dense embeddings that capture inter-document relationships. Outperforms BioBERT on biomedical NER and relation extraction benchmarks. Max sequence length 512 tokens.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "michiyasunaga",
      "source": "michiyasunaga/BioLinkBERT-base",
      "source_url": "https://huggingface.co/michiyasunaga/BioLinkBERT-base",
      "license": "MIT",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "min_replicas": 0,
        "max_replicas": 5,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "path_prefix": "/v1/",
        "serialize": false,
        "no_stream": false
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "biomedical",
      "subdomain": "biomedical-text-embeddings",
      "tags": ["embedding", "biomedical", "nlp", "link-prediction", "citation", "biology"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text — abstracts, clinical descriptions"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 768]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 512,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 768
      }
    }
