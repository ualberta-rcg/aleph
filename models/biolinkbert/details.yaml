apiVersion: v1
kind: ConfigMap
metadata:
  name: biolinkbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biolinkbert",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "biolinkbert",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text; truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled (attention-masked) embeddings" },
        "model": { "type": "string", "description": "Model name (biolinkbert)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "BioLinkBERT-base — 768-dim biomedical embeddings (GPU, always-on)",
        "description": "BioLinkBERT-base (michiyasunaga/BioLinkBERT-base, Stanford): BERT pre-trained with a linked-document objective on PubMed, improving biomedical NLP tasks that benefit from document context (entity linking, relation extraction, retrieval). Produces 768-dim mean-pooled dense embeddings, max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (8 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "Michihiro Yasunaga (Stanford)",
        "source": "michiyasunaga/BioLinkBERT-base",
        "source_url": "https://huggingface.co/michiyasunaga/BioLinkBERT-base",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp16",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "biomedical-nlp",
        "gpu": true,
        "embedding_dimensions": 768,
        "pooling": "mean",
        "max_input_tokens": 512,
        "tags": ["embedding", "biomedical", "nlp", "link-prediction", "bert"]
      }
    }
