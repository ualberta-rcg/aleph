apiVersion: v1
kind: ConfigMap
metadata:
  name: granite-geospatial-ocean-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "granite-geospatial-ocean",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "granite-geospatial-ocean",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "5-10 minutes (pip install on boot; no venv-on-PVC)"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "image": "[[[16 floats], ...], ...] — (C=16, H=42, W=42) Sentinel-3 bands",
        "demo": "boolean — returns synthetic 768-dim embeddings"
      },
      "output_map": {
        "embeddings": "[[float]] — (N, 768) embeddings",
        "shape": "[N, D] — embedding shape",
        "model": "granite-geospatial-ocean",
        "demo": "boolean — present if demo mode used"
      },
      "catalog": {
        "description_short": "IBM Granite Geospatial Ocean — Sentinel-3 ocean color foundation model. 16 bands, ViT MAE.",
        "description": "IBM Granite Geospatial Ocean is a ViT MAE foundation model pretrained on 512K Sentinel-3 OLCI+SLSTR ocean images. It uses 16 spectral bands: OL1-OL12, OL16, OL17, OL18, OL21 + SLSTR SST. The 42x42 patch-based model generates 768-dim embeddings suitable for ocean color analysis, chlorophyll estimation, and water quality monitoring. Developed by IBM and STFC. Apache 2.0 license.",
        "owned_by": "ibm-granite",
        "source": "ibm-granite/granite-geospatial-ocean",
        "source_url": "https://huggingface.co/ibm-granite/granite-geospatial-ocean",
        "license": "Apache-2.0",
        "parameters": "N/A (ViT-Base scale)",
        "precision": "fp32",
        "framework": "terratorch + PyTorch",
        "domain": "earth-observation",
        "subdomain": "ocean",
        "tags": ["embedding", "science", "earth-observation", "ocean", "sentinel-3", "olci", "slstr", "ocean-color", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "embedding_dimensions": 768,
        "pooling": "patch embeddings (ViT MAE)"
      }
    }
