apiVersion: v1
kind: ConfigMap
metadata:
  name: efficientnet-b0-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "efficientnet-b0",
      "status": "production",
      "type": "classify",
      "endpoints": {
        "primary": "/v1/vision/classify",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "efficientnet-b0",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "<1 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        },
        "top_k": {
          "type": "integer",
          "required": false,
          "default": 5,
          "description": "Number of top predictions to return (1-1000)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (efficientnet-b0)"},
        "task": {"type": "string", "description": "Always \"classify\""},
        "predictions": {
          "type": "array",
          "items": {
            "rank": "int — 1-based rank",
            "class_id": "int — ImageNet class index (0-999)",
            "label": "string — ImageNet class name",
            "score": "float — softmax probability 0-1"
          },
          "description": "Top-k predictions sorted by confidence"
        }
      },
      "catalog": {
        "description_short": "EfficientNet-Lite4 ImageNet classifier (1000 classes, ONNX Runtime, CPU)",
        "description": "EfficientNet-Lite4 from ONNX Model Zoo (13M params). 1000 ImageNet classes with softmax probabilities. Preprocesses via aspect-ratio resize + center-crop to 224x224. ONNX Runtime on CPU. Returns ranked class predictions with confidence scores.",
        "owned_by": "google",
        "source": "onnx/EfficientNet-Lite4",
        "source_url": "https://huggingface.co/onnx/EfficientNet-Lite4",
        "license": "Apache-2.0",
        "parameters": "13M",
        "precision": "fp32",
        "framework": "onnxruntime",
        "domain": "computer-vision",
        "subdomain": "image-classification",
        "tags": ["vision", "classify", "imagenet", "onnx", "cpu"]
      }
    }
