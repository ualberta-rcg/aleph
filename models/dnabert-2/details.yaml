apiVersion: v1
kind: ConfigMap
metadata:
  name: dnabert-2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "dnabert-2-117m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "dnabert-2",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "DNA sequence(s) over the ACGT alphabet (BPE-tokenized internally); truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled (attention-masked) DNA embeddings" },
        "model": { "type": "string", "description": "Model name (dnabert-2-117m)" },
        "usage": { "type": "object", "description": "{prompt_tokens (sequence length), total_tokens: 0}" }
      },
      "catalog": {
        "description_short": "DNABERT-2 (117M) multi-species DNA foundation model — 768-dim embeddings (CPU, scale-to-zero)",
        "description": "DNABERT-2 (zhihan1996/DNABERT-2-117M, Zhou et al. 2023): ~117M-param DNA foundation model that uses BPE tokenization (not fixed k-mers), trained on genomes from multiple species. Produces 768-dim mean-pooled embeddings for variant-effect prediction, genome annotation, regulatory-element analysis, and epigenomic prediction. Max 512 tokens. Custom remote-code model: requires trust_remote_code, a pad_token_id patch, low_cpu_mem_usage=False, and is pinned to torch 2.5.1+cpu / transformers 4.40.2 (custom ops break on torch>=2.6) with TORCHDYNAMO_DISABLE=1 and TORCH_COMPILE_DISABLE=1. Served CPU-only via a custom transformers FastAPI server, scale-to-zero.",
        "owned_by": "Zhihan Zhou (zhihan1996)",
        "source": "zhihan1996/DNABERT-2-117M",
        "source_url": "https://huggingface.co/zhihan1996/DNABERT-2-117M",
        "paper_url": "https://arxiv.org/abs/2306.15006",
        "license": "Apache-2.0",
        "parameters": "117M",
        "precision": "fp32",
        "framework": "transformers 4.40.2 (custom FastAPI server, trust_remote_code)",
        "domain": "genomics",
        "subdomain": "dna-embeddings",
        "gpu": false,
        "embedding_dimensions": 768,
        "pooling": "mean (attention-masked)",
        "max_input_tokens": 512,
        "tags": ["embedding", "science", "genomics", "dna", "multi-species", "cpu"]
      }
    }
