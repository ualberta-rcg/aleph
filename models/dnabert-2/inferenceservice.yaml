# DNABERT-2: DNA sequence embeddings (zhihan1996/DNABERT-2-117M)
# API: POST /v1/embeddings
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnabert-2-server
  namespace: models
data:
  server.py: |
    """Embedding server for DNABERT-2."""
    import os, asyncio, numpy as np
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR  = os.environ.get("MODEL_DIR", "/data/model")
    MODEL_NAME = os.environ.get("MODEL_NAME", "dnabert-2-117m")
    MAX_LEN    = int(os.environ.get("MAX_LEN", "512"))

    app = FastAPI()
    tokenizer = None
    pt_model  = None

    def load():
        global tokenizer, pt_model
        import torch
        from transformers import AutoTokenizer, AutoModel, AutoConfig
        # Patch missing pad_token_id in custom BertConfig before model init.
        config = AutoConfig.from_pretrained(MODEL_DIR, trust_remote_code=True)
        if not hasattr(config, 'pad_token_id') or config.pad_token_id is None:
            config.pad_token_id = 0
        tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR, trust_remote_code=True)
        # low_cpu_mem_usage=False avoids meta-device initialization — newer
        # transformers defaults to True which conflicts with DNABERT-2's custom
        # ops fake-impl registration (raises "Tensor on device meta != cpu").
        pt_model = AutoModel.from_pretrained(
            MODEL_DIR, config=config, trust_remote_code=True,
            torch_dtype=torch.float32, low_cpu_mem_usage=False
        )
        pt_model.eval()
        print(f"{MODEL_NAME} loaded", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if pt_model else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "zhihan1996", "type": "embedding"}]}

    def _infer(texts):
        import torch
        enc = tokenizer(texts, padding=True, truncation=True, max_length=MAX_LEN, return_tensors="pt")
        with torch.no_grad():
            raw = pt_model(**enc)
            # DNABERT-2 custom model may return tuple instead of ModelOutput
            hs = raw.last_hidden_state if hasattr(raw, 'last_hidden_state') else raw[0]
            out = hs.numpy()
        mask = enc["attention_mask"].numpy().astype(np.float32)
        m = mask[:, :, np.newaxis]
        return (out * m).sum(1) / m.sum(1)

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if pt_model is None:
            return JSONResponse({"error": "model loading"}, 503)
        inputs = request.get("input", "")
        if isinstance(inputs, str):
            inputs = [inputs]
        emb = await asyncio.get_event_loop().run_in_executor(None, _infer, inputs)
        data = [{"object": "embedding", "index": i, "embedding": e.tolist()} for i, e in enumerate(emb)]
        return {"object": "list", "model": MODEL_NAME, "data": data,
                "usage": {"prompt_tokens": sum(len(s) for s in inputs), "total_tokens": 0}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: dnabert-2
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 120
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            # Sentinel ensures venv is rebuilt when torch version is pinned.
            # DNABERT-2 custom ops break on torch>=2.6 (meta-device fake dispatch).
            if [ ! -f /data/venv/.pin-torch251 ]; then
              echo "Creating/rebuilding venv with pinned torch 2.5.1+cpu ..."
              rm -rf /data/venv
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip --quiet
              /data/venv/bin/pip install -q \
                --extra-index-url https://download.pytorch.org/whl/cpu \
                "torch==2.5.1+cpu" "transformers==4.40.2" \
                einops fastapi uvicorn huggingface_hub
              touch /data/venv/.pin-torch251
            else
              echo "venv exists with pinned torch"
            fi
            if [ ! -f /data/model/config.json ]; then
              echo "Downloading DNABERT-2..."
              /data/venv/bin/python -c "
            import os; from huggingface_hub import snapshot_download
            snapshot_download(repo_id='zhihan1996/DNABERT-2-117M', local_dir='/data/model', local_dir_use_symlinks=False, token=os.environ.get('HF_TOKEN'))
            "
            else
              echo "Model exists"
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
          - { name: MODEL_NAME, value: dnabert-2-117m }
          - { name: TORCHDYNAMO_DISABLE, value: "1" }
          - { name: TORCH_COMPILE_DISABLE, value: "1" }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 2Gi }
          limits: { cpu: "4", memory: 4Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: dnabert-2-data }
      - name: app
        configMap: { name: dnabert-2-server }
