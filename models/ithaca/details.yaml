apiVersion: v1
kind: ConfigMap
metadata:
  name: ithaca-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ithaca",
      "status": "production",
      "type": "predict",
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "ithaca",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 750,
        "max_input_tokens": 750
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "text": {
          "type": "string",
          "required": true,
          "description": "ancient Greek inscription text (uppercase), 50-750 chars; mark damaged/unknown chars with ? (the predictingthepast gap char)"
        },
        "contextualize": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "opt-in retrieval search over the training corpus (~2 min, CPU/IO-bound); default response is restoration + date + geo attribution"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "input": {"type": "string", "description": "input text"},
        "restoration": {"type": "object", "description": "restored text predictions for the gap spans"},
        "attribution": {"type": "object", "description": "chronological date (BCE) + geographic region/subregion attribution"}
      },
      "catalog": {
        "description_short": "Ithaca — ancient Greek inscription restoration, dating, and geolocation (DeepMind, Nature 2022).",
        "description": "Ithaca (DeepMind × UCL × Venice, Nature 2022) is a JAX/Flax transformer that restores damaged ancient Greek inscriptions, attributes a chronological date (BCE), and predicts geographic origin. Input is ancient Greek text (50-750 chars) with gaps marked `[---]`. Served via the `predictingthepast` library (dm-haiku/optax) with `jax[cuda12]` for GPU inference; weights from GCS. The optional `contextualize` flag adds a corpus retrieval search (~2 min).",
        "owned_by": "deepmind",
        "source": "google-deepmind/predictingthepast",
        "source_url": "https://github.com/google-deepmind/predictingthepast",
        "license": "Apache-2.0",
        "parameters": "JAX/Flax transformer",
        "precision": "fp32",
        "framework": "jax + dm-haiku + optax (predictingthepast)",
        "domain": "digital-humanities",
        "subdomain": "epigraphy",
        "tags": ["science", "ancient-greek", "digital-humanities", "classics", "epigraphy", "restoration", "deepmind"]
      }
    }
