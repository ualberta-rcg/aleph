apiVersion: v1
kind: ConfigMap
metadata:
  name: esmc-300m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esmc-300m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "esmc-300m",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 2048, "max_input_tokens": 2048 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes (GPU, model cached on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Protein sequence(s) as 1-letter amino-acid codes (alias: 'sequences'); truncated to 2048 residues."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "description": "One {object:'embedding', index, embedding:[float x 960]} per input (mean-pooled over residues)" },
        "model": { "type": "string", "description": "Model name (esmc-300m)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (residue counts)" }
      },
      "catalog": {
        "description_short": "EvolutionaryScale ESM-C 300M (Cambrian) protein LM — 960-dim embeddings (GPU, scale-to-zero)",
        "description": "ESM-C 300M (Cambrian, EvolutionaryScale/esmc-300m-2024-12): next-generation protein language model from EvolutionaryScale (Meta spinoff) — a drop-in replacement for ESM-2 with improved performance. 300M params; uses the esm SDK for encoding. Produces 960-dim mean-pooled per-protein embeddings of amino-acid sequences (up to 2048 residues). Served via a custom FastAPI server on a HAMi GPU slice. Scale-to-zero.",
        "owned_by": "EvolutionaryScale",
        "source": "EvolutionaryScale/esmc-300m-2024-12",
        "source_url": "https://huggingface.co/EvolutionaryScale/esmc-300m-2024-12",
        "license": "MIT",
        "parameters": "300M",
        "precision": "fp32",
        "framework": "esm SDK + torch (custom FastAPI server)",
        "domain": "proteomics",
        "subdomain": "protein-language-model",
        "gpu": true,
        "embedding_dimensions": 960,
        "pooling": "mean",
        "max_input_tokens": 2048,
        "tags": ["embedding", "science", "proteomics", "protein", "evolutionaryscale", "gpu"]
      }
    }
