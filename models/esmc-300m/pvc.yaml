# Venv + model persist on NFS (ReadWriteMany, nfs-models) so scale-from-zero cold starts skip the
# re-download and the ISVC can mount >1 pod. Migrated RWO→RWX 2026-06-19 (was bound ReadWriteOnce,
# immutable → delete+recreate; reclaim=Delete triggered a one-time re-download).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esmc-300m
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-models
  resources:
    requests:
      storage: 5Gi
