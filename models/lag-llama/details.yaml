apiVersion: v1
kind: ConfigMap
metadata:
  name: lag-llama-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "lag-llama",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/science/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "lag-llama",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 10000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min (venv + Lag-Llama load + first forecast)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "context": {
          "type": "array",
          "required": true,
          "description": "numeric observations (the time series)"
        },
        "prediction_length": {
          "type": "integer",
          "required": false,
          "default": 24,
          "description": "future steps to forecast"
        },
        "num_samples": {
          "type": "integer",
          "required": false,
          "default": 100,
          "description": "number of forecast samples (for quantile estimation)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "mean": {"type": "array", "description": "mean forecast (length = prediction_length)"},
        "quantiles": {"type": "object", "description": "{0.1, 0.9} quantile forecasts"},
        "samples": {"type": "array", "description": "raw forecast samples"}
      },
      "catalog": {
        "description_short": "Lag-Llama — probabilistic zero-shot time-series foundation model (200M).",
        "description": "Lag-Llama (time-series-foundation-models/Lag-Llama, ~200M) is a probabilistic foundation model for zero-shot time-series forecasting — lag-based tokenization + a decoder-only transformer. Returns mean + quantile forecasts via GluonTS sampling.",
        "owned_by": "time-series-foundation-models",
        "source": "time-series-foundation-models/Lag-Llama",
        "source_url": "https://huggingface.co/time-series-foundation-models/Lag-Llama",
        "license": "Apache-2.0",
        "parameters": "~200M",
        "precision": "fp32",
        "framework": "torch + GluonTS (lag-based decoder transformer)",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "probabilistic", "gpu"]
      }
    }
