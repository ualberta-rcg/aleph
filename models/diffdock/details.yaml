apiVersion: v1
kind: ConfigMap
metadata:
  name: diffdock-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "diffdock",
      "status": "production",
      "type": "dock",
      "endpoints": {
        "primary": "/v1/dock",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "diffdock",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min (weights + ESM2 cache on PVC; first dock runs the DiffDock CLI)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "protein_pdb": {
          "type": "string",
          "required": true,
          "description": "protein structure in PDB format"
        },
        "ligand_smiles": {
          "type": "string",
          "required": true,
          "description": "ligand as a SMILES string e.g. CC(=O)Oc1ccccc1C(=O)O (aspirin)"
        },
        "num_poses": {
          "type": "integer",
          "required": false,
          "default": 10,
          "description": "number of docked poses to generate"
        },
        "inference_steps": {
          "type": "integer",
          "required": false,
          "default": 20,
          "description": "diffusion inference steps"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "ligand_smiles": {"type": "string", "description": "input SMILES"},
        "num_poses": {"type": "integer", "description": "number of poses returned"},
        "poses": {"type": "array", "description": "ranked poses: {rank, confidence, sdf}"}
      },
      "catalog": {
        "description_short": "DiffDock-L diffusion-based protein-ligand docking (gcorso/DiffDock v1.1.3).",
        "description": "DiffDock-L (gcorso/DiffDock v1.1.3) is a diffusion-based generative model for protein-ligand docking. Given a protein structure (PDB) and a small molecule (SMILES), it predicts docked 3D poses with confidence scores. Served from the official `rbgcsail/diffdock` image (rdkit, ESM-2, torch-geometric pre-built) via a subprocess call to the DiffDock CLI (`inference.py`); weights + the ESM2 cache live on the PVC. Returns ranked SDF poses. GPU required.",
        "owned_by": "gcorso",
        "source": "gcorso/DiffDock",
        "source_url": "https://github.com/gcorso/DiffDock",
        "license": "MIT",
        "parameters": "20M (score + confidence models)",
        "precision": "fp32",
        "framework": "DiffDock (diffusion score + confidence) + ESM-2 + torch-geometric, via subprocess CLI",
        "domain": "structural-biology",
        "subdomain": "molecular-docking",
        "tags": ["science", "dock", "drug-discovery", "protein", "ligand", "diffusion", "gpu"]
      }
    }
