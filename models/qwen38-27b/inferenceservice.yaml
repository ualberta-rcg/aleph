# Qwen/Qwen3.8-27B-FP8 — dense 27B hybrid-attention VLM (16x Gated DeltaNet + 1x Gated
# Attention), FP8 weights (~28 GB), image + video input, thinking with real effort levels
# (xhigh default / medium / low) + preserve_thinking. TP2 on L40S per the official vLLM
# recipe (recipes.vllm.ai/Qwen/Qwen3.8-27B): kv-cache fp8, prefix caching, MTP spec decode.
#
# HAMi TP>=2 recipe: request whole GPUs via nvidia.com/gpu=2, DO NOT set gpumem,
# and --disable-custom-all-reduce (L40S NODE topology: custom all-reduce stalls; NCCL fast).
# Attention backend: vLLM picks FlashInfer (SM89; FA3 unavailable) + Triton/FLA for the
# GDN prefill — logged at startup. The old VLLM_ATTENTION_BACKEND env is dropped: this
# build ignores it (0.20.2 logged "Unknown vLLM environment variable").
#
# Image: vLLM v0.29.0 digest (upgraded 2026-09-15 from the fleet 0.20.2 pin — see
# CHANGELOG): lifts the OpenAI effort-enum so real xhigh works (model accepts
# low/medium/xhigh only; "high" stays a card alias to xhigh), accepts max_tokens up to
# 131072, and accounts CUDA-graph memory inside the util budget (default since v0.21).
# KV: nvfp4 has no attention backend on SM89 (tested, rejected 2026-09-15) but
# int4_per_token_head works via TRITON_ATTN and gives 1.78x the fp8 pool; context is
# YaRN-scaled 2x to 512K (probe-verified marker recall at 522,240 tokens).
#
# Always-on (popular model): minReplicas 1 = one warm TP2 replica (2 whole L40S);
# maxReplicas 6 (12 L40S at peak, taken only under real concurrency). scaleTarget 16
# < max-num-seqs 64 leaves per-pod burst headroom (oss-120b lesson: max-num-seqs is
# the real per-pod cap).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen38-27b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 1
    maxReplicas: 6
    scaleTarget: 16
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub hf_transfer
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "Qwen3.8-27B-FP8 weights already on PVC, skipping download."
            else
                echo "Downloading Qwen/Qwen3.8-27B-FP8 (~28 GB) ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="Qwen/Qwen3.8-27B-FP8",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
                ignore_patterns=["*.pt", "*.pth", "original/*", "*.gguf"],
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: qwen38-27b
            mountPath: /data
    containers:
      - name: kserve-container
        image: index.docker.io/vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=qwen38-27b
          - --tensor-parallel-size=2
          - --max-model-len=524288
          # YaRN 2x rope scaling -> 512K context (native 262144). Preserves the
          # checkpoint's mrope fields; factor 2.0 per HF card guidance for ~512K.
          - --hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000,"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":262144}}}
          - --dtype=auto
          - --gpu-memory-utilization=0.90
          - --max-num-seqs=64
          - --max-num-batched-tokens=16384
          # fp8 KV: keeps the FlashInfer attention backend -> fastest giant prefills
          # (~2 min at 262K vs 6-9 min on int4/Triton). Pool ~1.3-1.4M tokens/TP-group
          # at util 0.90 (~2.6 concurrent 512K sessions; ~13 concurrent 100K sessions).
          # Capacity fallback if queueing ever bites: --kv-cache-dtype=int4_per_token_head
          # gives 1.78x the pool (2.44M tokens, TRITON_ATTN) at the cost of slower
          # one-shot giant prefills. Quality-verified 2026-09-15 both ways.
          - --kv-cache-dtype=fp8
          - --enable-prefix-caching
          - '--limit-mm-per-prompt={"image": 64, "video": 4}'
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          # MTP speculative decoding (recipe: method "mtp", 3 tokens). If the build
          # rejects it or it conflicts with prefix caching, drop this line first.
          - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
          # TP>=2 on HAMi/L40S: custom all-reduce busy-waits on a stalled P2P path; NCCL native.
          - --disable-custom-all-reduce
          - --port=8080
        env:
          # Required for max-model-len above the checkpoint's native 262144.
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: OMP_NUM_THREADS
            value: "1"
          # Memory hardening: 0.20.2 OOM-died at util 0.92 under a 16k-token prefill
          # batch (532MB GEMM output alloc + fragmentation). Since v0.21 CUDA-graph
          # memory is accounted INSIDE the util budget, so 0.90 on 0.29 ≈ 0.893
          # effective — below the 0.92 crash point; pressure-verified 2026-09-15
          # (24k chunked prefill + 8x8k burst + 20-mix clean). expandable_segments
          # stops fragmentation drift.
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet: { path: /v1/models, port: 8080 }
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet: { path: /v1/models, port: 8080 }
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 60
        # Fast self-heal: a dead engine (e.g. an OOM) must recycle in ~1-2 min, not wedge
        # for hours holding whole GPUs on the shared cluster (2026-08-26 postmortem).
        livenessProbe:
          httpGet: { path: /v1/models, port: 8080 }
          initialDelaySeconds: 180
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 2
        volumeMounts:
          - name: qwen38-27b
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: qwen38-27b
        persistentVolumeClaim:
          claimName: qwen38-27b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
