# kokoro-82m — TTS card. Routes to the shared `speaches` ISVC predictor (speaches-ai/Kokoro-82M).
# Paired with whisper-large-v3 (details-whisper.yaml); both carry routing.k8s_name: speaches.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kokoro-82m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "kokoro-82m",
      "status": "production",
      "type": "tts",
      "endpoints": { "primary": "/v1/audio/speech", "health": "/health" },
      "routing": {
        "k8s_name": "speaches",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": "speaches-ai/Kokoro-82M-v1.0-ONNX-fp16"
      },
      "limits": { "max_completion_tokens": 0, "context_window": 0 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "always-on",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "custom_params": {
        "schema": {
          "input": { "type": "string", "required": true },
          "voice": { "type": "string", "default": "af_heart", "description": "Kokoro voice preset" }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Kokoro-82M TTS (speaches-ai/Kokoro-82M-v1.0-ONNX-fp16) — OpenAI-style /v1/audio/speech",
        "description": "Kokoro-82M text-to-speech served by the speaches server (ONNX Runtime, fp16). OpenAI-style POST /v1/audio/speech {model,input,voice} -> audio bytes. Shares one GPU slice + one pod with whisper-large-v3 STT via the speaches InferenceService. Voices: af, af_bella, af_sky, am_adam, am_michael, bf_emma, bm_george, etc.",
        "owned_by": "speaches-ai",
        "source": "speaches-ai/Kokoro-82M-v1.0-ONNX-fp16",
        "source_url": "https://huggingface.co/speaches-ai/Kokoro-82M-v1.0-ONNX-fp16",
        "license": "Apache-2.0",
        "parameters": "82M",
        "precision": "fp16 (ONNX)",
        "framework": "speaches (ONNX Runtime)",
        "domain": "audio",
        "subdomain": "text-to-speech",
        "gpu": true,
        "output_format": "audio/wav",
        "voices": ["af", "af_bella", "af_sky", "am_adam", "am_michael", "bf_emma", "bm_george"],
        "tags": ["tts", "audio", "speech-synthesis", "gpu", "kokoro"]
      }
    }
