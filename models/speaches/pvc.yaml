apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speaches-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      # HF hub cache for faster-whisper-large-v3 + Kokoro ONNX (~7Gi observed; room to grow)
      storage: 30Gi
