apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma-4-26b-a4b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gemma-4-26b-a4b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "gemma-4-26b-a4b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 131072,
        "max_completion_tokens": 8192
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "~3 minutes (FP8 MoE, 1x L40S)"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": true
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "low", "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "xhigh", "max": "max"
          },
          "effort_map": {
            "none":  {"reasoning_effort": "none"},
            "low":   {"reasoning_effort": "low"},
            "medium":{"reasoning_effort": "medium"},
            "high":  {"reasoning_effort": "high"},
            "xhigh": {"reasoning_effort": "high"},
            "max":   {"reasoning_effort": "high"}
          },
          "default_effort": "medium",
          "disabled_effort": "none"
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 1.0,
          "top_p": 0.95,
          "top_k": 64,
          "max_tokens": 4096,
          "thinking": {"enabled": true, "effort": "medium"}
        },
        "meta_tasks": {
          "title":     {"max_tokens": 80, "thinking": {"effort": "none"}},
          "tags":      {"max_tokens": 60, "thinking": {"effort": "none"}},
          "followups": {"max_tokens": 220, "thinking": {"effort": "none"}}
        }
      },
      "custom_params": {
        "schema": {
          "top_k": {"type": "integer", "default": 64, "min": 0, "max": 256}
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "required": true,
          "description": "Chat messages [{role: 'user'|'system'|'assistant', content: str|array}]. Content can include image_url objects."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 4096,
          "max": 8192,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature (HF recommends 1.0 for Gemma 4)"
        },
        "top_p": {
          "type": "float",
          "required": false,
          "default": 0.95,
          "description": "Nucleus sampling threshold (HF recommends 0.95)"
        },
        "top_k": {
          "type": "integer",
          "required": false,
          "default": 64,
          "description": "Top-K sampling (HF recommends 64 for Gemma 4)"
        },
        "stream": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Enable streaming responses"
        },
        "frequency_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "description": "Frequency penalty (0-2)"
        },
        "image": {
          "type": "string",
          "required": false,
          "description": "Base64-encoded image or URL. Up to 16 images per prompt."
        }
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model name"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (may include reasoning_content and image analysis)"},
        "usage": {"type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)"}
      },
      "catalog": {
        "description_short": "Google Gemma 4 26B A4B MoE — reasoning + vision + tools, FP8 (1x L40S)",
        "description": "Google Gemma 4 26B A4B MoE instruction-tuned. 25.2B total / 3.8B active params (128 experts, 8 active + 1 shared). Configurable thinking mode via reasoning_effort, multimodal (text+image+video), 256K native context (deployed at 131K), native function calling via gemma4 parser. FP8 quantization on 1x L40S GPU. Hybrid attention (sliding window + global layers). Native system prompt support. vLLM v0.20.2 with gemma4 tool/reasoning parsers.",
        "owned_by": "Google",
        "source": "google/gemma-4-26B-A4B-it",
        "source_url": "https://huggingface.co/google/gemma-4-26B-A4B-it",
        "license": "Apache-2.0",
        "parameters": "25.2B MoE (3.8B active)",
        "precision": "fp8",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "tags": ["chat", "llm", "reasoning", "moe", "vision", "multimodal", "tools", "google", "gemma4"]
      }
    }
