apiVersion: v1
kind: ConfigMap
metadata:
  name: aion-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "aion-base",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "info": "/v1/science/info",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "aion",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "AION-base 300M astronomical multimodal foundation model",
        "description": "AION-base (Polymathic AI, 2025): 300M-parameter astronomical multimodal foundation model trained on 39 data types (images, spectra, photometry, catalogs) from DESI, SDSS, Gaia and HSC. Encoder-decoder transformer (768-dim). Exposes /v1/science/embed and /v1/science/info. CPU. NOTE: /v1/science/embed expects modality-specific AION-tokenized inputs; the generic path is best-effort.",
        "owned_by": "Polymathic AI",
        "source": "polymathic-ai/aion-base",
        "source_url": "https://huggingface.co/polymathic-ai/aion-base",
        "license": "MIT",
        "parameters": "300M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "astronomy",
        "subdomain": "multimodal-foundation",
        "tags": [
          "embedding",
          "science",
          "astronomy",
          "multimodal",
          "cpu"
        ],
        "gpu": false,
        "max_input_tokens": 0,
        "input_format": {
          "model": "aion-base",
          "modality": "spectrum|image|photometry|...",
          "data": "list of floats (modality-specific)"
        },
        "embedding_dimensions": 768,
        "pooling": "mean"
      }
    }
