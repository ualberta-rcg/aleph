apiVersion: v1
kind: ConfigMap
metadata:
  name: aion-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "aion",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/science/info"],
        "health": "/health"
      },
      "routing": {
        "k8s_name": "aion",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "modality": "legacy_image | hsc_image | photometry (default legacy_image)",
        "flux": "[[[band,...],...],...] — [4,H,W] multiband galaxy image (legacy_image modality)",
        "bands": "[string] — band names e.g. ['DES-G','DES-R','DES-I','DES-Z']",
        "num_encoder_tokens": "int — encoder token count (default 600)",
        "flux_g": "float — g-band flux (photometry modality)",
        "flux_r": "float — r-band flux (photometry modality)",
        "flux_i": "float — i-band flux (photometry modality)",
        "flux_z": "float — z-band flux (photometry modality)"
      },
      "output_map": {
        "embedding": "[float] — 768-dim object-level embedding",
        "embeddings": "[float] — alias for embedding",
        "dims": "int — embedding dimensionality (768)",
        "modality": "string — modality used",
        "model": "aion-base"
      },
      "catalog": {
        "description_short": "AION-base 300M astronomical multimodal foundation model — 768-dim embeddings (images, spectra, photometry).",
        "description": "AION-base (300M, Polymathic AI) is an astronomical multimodal foundation model trained on 39 astronomical data types across DESI Legacy Survey, SDSS, Gaia, HSC Wide. An encoder-decoder transformer (12 blocks, 768-dim, 12 heads) with a CodecManager that encodes typed modality objects (multiband images, optical spectra, photometry, catalogs) into a shared 768-dim embedding space (object-level vector = mean-pool over tokens). Non-text domain model: astronomical-array input, does NOT expose OpenAI /v1/embeddings; stays on /v1/science/embed. Output returns both `embedding`/`embeddings` (alias) + `dims`.",
        "owned_by": "polymathic-ai",
        "source": "polymathic-ai/aion-base",
        "source_url": "https://huggingface.co/polymathic-ai/aion-base",
        "license": "MIT",
        "parameters": "300M",
        "precision": "fp32",
        "framework": "transformers + polymathic-aion (CodecManager)",
        "domain": "astronomy",
        "subdomain": "multimodal",
        "tags": ["embedding", "science", "astronomy", "multimodal", "galaxy", "photometry", "desi", "sdss", "gaia", "cpu"],
        "gpu": false,
        "max_input_tokens": 0,
        "input_format": {
          "model": "aion",
          "modality": "legacy_image | hsc_image | photometry (default legacy_image)",
          "image": "[[[band,...],...],...] multiband image (legacy: 4-band 96x96; resized if needed)",
          "photometry": "scalar flux/magnitude vector (any subset)"
        },
        "embedding_dimensions": 768,
        "pooling": "object-level mean-pool over tokens"
      }
    }
