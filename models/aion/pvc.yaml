# Venv + AION-base weights persist on NFS (ReadWriteMany, nfs-client). Split out of the ISVC
# 2026-06-19 (was inline + RWO). Migrated RWO→RWX by copying the venv + weights from the old
# RWO PVC (aion-data) into this new RWX PVC (aion-data-rwx) — preserves the venv, no re-download.
# Old aion-data PVC deleted after the copy + repoint.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aion-data-rwx
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 8Gi
