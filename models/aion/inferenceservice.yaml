# AION-base 300M: Astronomical multimodal foundation model (Polymathic AI)
# HuggingFace: polymathic-ai/aion-base (MIT). Package: polymathic-aion (import: aion)
# Real API: AION.from_pretrained + CodecManager.encode(modality) -> model.encode(tokens)
# API: POST /v1/science/embed  — astronomical modality data -> 768-dim object embedding
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aion-server
  namespace: models
data:
  server.py: |
    """
    AION-base 300M astronomical multimodal foundation model (Polymathic AI).
    Uses the real `aion` package: AION + CodecManager + typed modality objects.

    Endpoints:
      GET  /health              -> {"status":"ok","model":"aion-base"}
      GET  /v1/models           -> model card
      GET  /v1/science/info     -> capabilities + supported modalities
      POST /v1/science/embed    -> object-level 768-dim embedding from astronomical data
        body (legacy-survey image):
          {"model":"aion","modality":"legacy_image",
           "flux":[[[...96x96...]]x4],            # [4,H,W] g,r,i,z (auto-cropped to 96x96)
           "num_encoder_tokens":600}
        body (scalar photometry, any subset):
          {"model":"aion","modality":"photometry",
           "flux_g":1.2,"flux_r":2.3,"flux_i":3.1,"flux_z":4.0}
    """
    import os, asyncio
    from fastapi import FastAPI, HTTPException
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = os.environ.get("MODEL_ID", "polymathic-ai/aion-base")
    DEVICE = "cpu"

    app = FastAPI()
    S = {}

    def load():
        import torch
        from aion import AION
        from aion.codecs import CodecManager
        print(f"Loading AION from {MODEL_ID} on {DEVICE}...", flush=True)
        model = AION.from_pretrained(MODEL_ID).to(DEVICE).eval()
        cm = CodecManager(device=DEVICE)
        S["model"] = model
        S["cm"] = cm
        S["torch"] = torch
        print("AION-base + CodecManager loaded.", flush=True)

    @app.on_event("startup")
    async def startup():
        loop = asyncio.get_event_loop()
        try:
            await loop.run_in_executor(None, load)
        except Exception as e:
            import traceback; traceback.print_exc()
            S["error"] = str(e)

    @app.get("/health")
    async def health():
        ready = "model" in S and "error" not in S
        return {"status": "ok" if ready else "loading", "model": "aion-base"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "aion-base", "object": "model", "owned_by": "polymathic-ai",
             "type": "astronomy-multimodal", "license": "MIT",
             "description": "AION-base 300M astronomical multimodal FM; 39 data types"}
        ]}

    @app.get("/v1/science/info")
    async def info():
        return {
            "model": "aion-base", "params": "300M", "embedding_dim": 768,
            "num_modalities": 39,
            "supported_modalities": ["legacy_image", "hsc_image", "photometry",
                                     "desi_spectrum", "sdss_spectrum"],
            "training_surveys": ["DESI Legacy Survey", "SDSS", "Gaia", "HSC Wide"],
            "paper": "arXiv:2510.17960", "license": "MIT",
        }

    def _build_modality(req):
        """Construct an aion typed modality object from the request body."""
        torch = S["torch"]
        modality = req.get("modality", "legacy_image")
        if modality in ("legacy_image", "image"):
            from aion.modalities import LegacySurveyImage
            flux = req.get("flux") or req.get("data")
            if flux is None:
                # default: zero 4-band 96x96 image (deterministic smoke input)
                t = torch.zeros(1, 4, 96, 96, dtype=torch.float32)
            else:
                t = torch.tensor(flux, dtype=torch.float32)
                if t.dim() == 3:
                    t = t.unsqueeze(0)            # [4,H,W] -> [1,4,H,W]
            # AION Legacy image codec expects 96x96 (576 tokens); resize to be forgiving.
            if t.shape[-1] != 96 or t.shape[-2] != 96:
                t = torch.nn.functional.interpolate(
                    t, size=(96, 96), mode="bilinear", align_corners=False)
            bands = req.get("bands", ["DES-G", "DES-R", "DES-I", "DES-Z"])
            return [LegacySurveyImage(flux=t, bands=bands)]
        if modality in ("photometry", "flux"):
            import aion.modalities as M
            out = []
            mapping = {"flux_g": "LegacySurveyFluxG", "flux_r": "LegacySurveyFluxR",
                       "flux_i": "LegacySurveyFluxI", "flux_z": "LegacySurveyFluxZ"}
            for key, cls in mapping.items():
                if key in req and hasattr(M, cls):
                    val = torch.tensor([float(req[key])], dtype=torch.float32)
                    out.append(getattr(M, cls)(value=val))
            if not out:
                raise HTTPException(400, "photometry needs at least one of flux_g/r/i/z")
            return out
        raise HTTPException(400, f"unsupported modality '{modality}'")

    @app.post("/v1/science/embed")
    async def embed(request: dict):
        if "model" not in S:
            raise HTTPException(503, "Model not loaded yet")
        if "error" in S:
            raise HTTPException(500, f"Load failed: {S['error']}")
        torch = S["torch"]
        n_tok = int(request.get("num_encoder_tokens", 600))
        try:
            modalities = _build_modality(request)
            def run():
                tokens = S["cm"].encode(*modalities)
                emb = S["model"].encode(tokens, num_encoder_tokens=n_tok)
                # object-level vector: mean-pool over token dim
                if emb.dim() == 3:
                    emb = emb.mean(dim=1)
                return emb[0].detach().cpu().float().tolist()
            loop = asyncio.get_event_loop()
            vec = await loop.run_in_executor(None, run)
        except HTTPException:
            raise
        except Exception as e:
            import traceback; traceback.print_exc()
            raise HTTPException(500, f"Embedding failed: {str(e)[:300]}")
        return JSONResponse({
            "model": "aion-base",
            "modality": request.get("modality", "legacy_image"),
            "embedding": vec, "dims": len(vec),
        })

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aion-data
  namespace: models
spec:
  storageClassName: nfs-client
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: aion
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "600s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 600
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            VENV=/data/venv
            export HF_HOME=/data/hf_cache
            if [ ! -d $VENV/bin ] || ! $VENV/bin/python -c 'import aion, fastapi' 2>/dev/null; then
              echo "Building venv (aion)..."
              python3 -m venv --clear $VENV
              $VENV/bin/pip install -U pip
              $VENV/bin/pip install \
                --extra-index-url https://download.pytorch.org/whl/cpu \
                torch==2.5.1 torchvision==0.20.1 fastapi uvicorn polymathic-aion
              echo "venv done"
            else
              echo "venv OK"
            fi
            # Pre-download model + codec weights into the HF cache (init has egress;
            # the runtime container runs offline). Warm a real encode to pull image codec.
            if [ ! -f /data/hf_cache/.aion-warm2 ]; then
              echo "Warming AION model + codecs (image + photometry)..."
              $VENV/bin/python - <<'PY'
            import torch
            from aion import AION
            from aion.codecs import CodecManager
            import aion.modalities as M
            m = AION.from_pretrained('polymathic-ai/aion-base').eval()
            cm = CodecManager(device='cpu')
            # image codec
            img = M.LegacySurveyImage(flux=torch.zeros(1,4,96,96),
                                      bands=['DES-G','DES-R','DES-I','DES-Z'])
            e = m.encode(cm.encode(img), num_encoder_tokens=600)
            print('warm image embed', tuple(e.shape), flush=True)
            # photometry codecs (cache each flux codec for offline use)
            for cls in ['LegacySurveyFluxG','LegacySurveyFluxR','LegacySurveyFluxI','LegacySurveyFluxZ']:
                if hasattr(M, cls):
                    try:
                        mod = getattr(M, cls)(value=torch.tensor([1.0]))
                        _ = cm.encode(mod)
                        print('warm', cls, flush=True)
                    except Exception as ex:
                        print('warn', cls, ex, flush=True)
            open('/data/hf_cache/.aion-warm2','w').write('ok')
            PY
            else
              echo "model+codecs cached"
            fi
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_ID, value: "polymathic-ai/aion-base" }
          - { name: HF_HOME, value: "/data/hf_cache" }
          - { name: HF_HUB_OFFLINE, value: "1" }
        ports:
          - { containerPort: 8080, protocol: TCP }
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits:   { cpu: "4", memory: 8Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 40
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: server-config, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: aion-data }
      - name: server-config
        configMap:
          name: aion-server
