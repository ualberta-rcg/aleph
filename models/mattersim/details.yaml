apiVersion: v1
kind: ConfigMap
metadata:
  name: mattersim-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "mattersim",
      "status": "production",
      "type": "force-field",
      "endpoints": {
        "primary": "/v1/science/predict",
        "secondary": "/v1/science/relax",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "mattersim",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "predict": {
          "type": "object",
          "description": "{elements:[\"Si\",\"Si\"], positions:[[x,y,z],...], lattice?(3x3)}. The \"model\" field is the gateway routing id (= mattersim); the server ignores it."
        },
        "relax": {
          "type": "object",
          "description": "{elements, positions, lattice, fmax?(0.05 eV/A), steps?(200)} — BFGS structure relaxation."
        }
      },
      "output_map": {
        "predict": {
          "type": "object",
          "description": "{energy_ev, energy_per_atom_ev, forces_ev_per_angstrom [n][3], stress_ev_per_angstrom3, stress_gpa (periodic only)}"
        },
        "relax": {
          "type": "object",
          "description": "{converged, steps, energy_ev, energy_per_atom_ev, relaxed_positions, relaxed_cell, forces_ev_per_angstrom}"
        }
      },
      "catalog": {
        "description_short": "Microsoft MatterSim universal atomistic ML force field — energy/forces/stress + structure relaxation.",
        "description": "MatterSim (Microsoft Research, arXiv 2405.04967) is a universal deep-learning atomistic force field trained across elements, temperatures, and pressures. Predicts energy, per-atom forces, and stress from an atomic structure, and exposes a `/v1/science/relax` endpoint for BFGS structure relaxation. Uses the `mattersim` pip package (MatterSimCalculator ASE interface) + torch_geometric.",
        "owned_by": "microsoft",
        "source": "microsoft/mattersim",
        "source_url": "https://huggingface.co/microsoft/mattersim",
        "license": "MIT",
        "parameters": "~1M",
        "precision": "float32",
        "framework": "mattersim + ASE + torch + torch_geometric",
        "domain": "materials-science",
        "subdomain": "atomistic-force-fields",
        "tags": ["science", "materials", "force-field", "molecular-dynamics", "structure-relaxation", "gpu", "microsoft"]
      }
    }
