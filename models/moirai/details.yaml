apiVersion: v1
kind: ConfigMap
metadata:
  name: moirai-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "moirai",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "moirai",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 10000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "values": {
          "type": "array",
          "required": true,
          "description": "numeric observations (univariate)"
        },
        "horizon": {
          "type": "integer",
          "required": false,
          "default": 12,
          "description": "prediction length"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "forecast": {"type": "object", "description": "{mean, quantile_10, quantile_90}, each length=horizon"}
      },
      "catalog": {
        "description_short": "Salesforce Moirai (base) universal zero-shot time-series forecasting.",
        "description": "Moirai (Salesforce Research, moirai-1.0-R-base, ~91M) is a universal time-series forecasting foundation model — any-variate, zero-shot, with configurable prediction/context length and patch size. Served via the `uni2ts` library (MoiraiForecast pipeline) + GluonTS. Returns mean + quantile forecasts.",
        "owned_by": "Salesforce",
        "source": "Salesforce/moirai-1.0-R-base",
        "source_url": "https://huggingface.co/Salesforce/moirai-1.0-R-base",
        "license": "Apache-2.0",
        "parameters": "~91M",
        "precision": "fp32",
        "framework": "uni2ts + torch + GluonTS",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "salesforce", "gpu"]
      }
    }
