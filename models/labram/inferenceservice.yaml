# LaBraM: Large Brain Model for EEG signals (braindecode/labram-pretrained)
# ICLR 2024 spotlight. CPU-capable, scale-to-zero.
# API: POST /v1/science/embed  Input: {"eeg": [[ch1_t0,...],...], "ch_names": ["Fp1",...]}
# BSD-3-Clause, braindecode/Tsinghua
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: labram-server
  namespace: models
data:
  server.py: |
    """
    LaBraM: Large Brain Model pretrained on EEG signals (ICLR 2024).
    Accepts multi-channel EEG windows + optional channel names, returns embeddings.
    API: POST /v1/science/embed
    Input: {"eeg": [[ch1_t0, ch1_t1, ...], ...], "ch_names": ["Fp1", "Fp2", ...], "sfreq": 200}
    Returns: {"embeddings": [...], "model": "labram"}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    # Default 21-channel subset from standard 10-20 (common BCI setup)
    DEFAULT_CH_NAMES = [
        "Fp1", "Fp2", "F3", "F4", "C3", "C4", "P3", "P4",
        "O1", "O2", "F7", "F8", "T3", "T4", "T5", "T6",
        "Fz", "Cz", "Pz", "Oz", "A2"
    ]

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading LaBraM on {DEVICE}...", flush=True)
        from braindecode.models import Labram

        # Find checkpoint file
        ckpt_path = None
        import glob
        for pattern in ["braindecode_labram_base.pt", "*.pt", "**/*.pt"]:
            pts = glob.glob(os.path.join(MODEL_DIR, pattern), recursive=True)
            if pts:
                ckpt_path = pts[0]
                break

        if ckpt_path:
            try:
                state = torch.load(ckpt_path, map_location=DEVICE, weights_only=False)
                n_chans = len(DEFAULT_CH_NAMES)
                m = Labram(n_times=1600, n_chans=n_chans, n_outputs=2)
                m.load_state_dict(state, strict=False)
                m.to(DEVICE).eval()
                model = m
                print(f"LaBraM loaded from {ckpt_path}", flush=True)
                return
            except Exception as e:
                print(f"Manual load failed: {e}", flush=True)

        # Fallback: from_pretrained
        try:
            m = Labram.from_pretrained("braindecode/labram-pretrained")
            m.to(DEVICE).eval()
            model = m
            print("LaBraM loaded via from_pretrained", flush=True)
            return
        except Exception as e:
            print(f"from_pretrained failed: {e}", flush=True)

        # Last resort: untrained model (for API testing)
        m = Labram(n_times=200, n_chans=len(DEFAULT_CH_NAMES), n_outputs=2)
        m.to(DEVICE).eval()
        model = m
        print("WARNING: LaBraM loaded WITHOUT pretrained weights", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "labram"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": "labram", "object": "model",
                 "owned_by": "braindecode/Tsinghua", "type": "eeg-foundation"}]}

    @app.post("/v1/science/embed")
    async def embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        eeg = request.get("eeg")
        if not eeg:
            return JSONResponse({"error": "eeg field required (list of channels, each a list of samples)"}, 400)

        def _infer():
            import torch
            import numpy as np
            arr = np.array(eeg, dtype=np.float32)
            n_chans, n_times_raw = arr.shape

            ch_names = request.get("ch_names", DEFAULT_CH_NAMES[:n_chans])

            # Pad/truncate to model's expected n_times
            n_times = 1600
            if n_times_raw < n_times:
                arr = np.pad(arr, ((0, 0), (0, n_times - n_times_raw)), mode='edge')
            elif n_times_raw > n_times:
                arr = arr[:, :n_times]

            tensor = torch.tensor(arr, dtype=torch.float32).unsqueeze(0).to(DEVICE)
            with torch.no_grad():
                features = model(tensor, ch_names=ch_names, return_features=True)
                emb = features["cls_token"].squeeze(0).cpu().numpy().tolist()
            return {
                "embeddings": emb,
                "model": "labram",
                "dim": len(emb),
                "n_channels": n_chans,
                "n_times_raw": n_times_raw,
                "n_times_used": n_times,
                "ch_names": ch_names
            }

        result = await asyncio.get_event_loop().run_in_executor(None, _infer)
        return result

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labram-data
  namespace: models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: labram
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 300
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ] || ! /data/venv/bin/python -c 'import braindecode, fastapi, safetensors' 2>/dev/null; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip --quiet
              /data/venv/bin/pip install --quiet \
                torch \
                braindecode huggingface_hub safetensors \
                fastapi uvicorn
            else
              echo "Venv exists"
            fi

            if [ ! -d /data/model ] || [ -z "$(ls -A /data/model 2>/dev/null)" ]; then
              echo "Downloading LaBraM..."
              /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            snapshot_download('braindecode/labram-pretrained', local_dir='/data/model')
            print('Download complete')
            "
            else
              echo "Model already downloaded"
            fi
            echo "Setup complete"
        resources:
          requests: { cpu: "4", memory: 4Gi }
          limits:   { cpu: "8", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
          - { name: HF_HUB_OFFLINE, value: "1" }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "4", memory: 4Gi }
          limits:   { cpu: "8", memory: 8Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: labram-data }
      - name: app
        configMap: { name: labram-server }
