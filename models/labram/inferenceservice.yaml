# LaBraM: Large Brain Model for EEG signals (braindecode/labram-pretrained)
# ICLR 2024 spotlight. CPU-capable, scale-to-zero.
# API: POST /v1/science/embed  Input: {"eeg": [[ch1_t0,...],...], "ch_names": ["Fp1",...]}
# BSD-3-Clause, braindecode/Tsinghua
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: labram-server
  namespace: models
data:
  server.py: |
    """
    LaBraM: Large Brain Model pretrained on EEG signals (ICLR 2024, braindecode 1.5.2).
    Accepts multi-channel EEG windows + optional channel names, returns 200-dim [CLS]
    embeddings. Loaded via Labram.from_pretrained(<local MODEL_DIR>) — the HF snapshot
    (model.safetensors + config.json) is pre-downloaded by the init container, so this
    works fully offline (HF_HUB_OFFLINE=1).

    API: POST /v1/science/embed
    Input: {"eeg": [[ch1_t0, ch1_t1, ...], ...], "ch_names": ["Fp1", "Fp2", ...]}
    Returns: {"embeddings": [...], "model": "labram", "dim": 200}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    model = None
    DEVICE = "cpu"
    N_TIMES = None  # set at load time from the pretrained model (3000 for base)
    CHANNEL_ORDER = None  # canonical 128-ch 10-20 order; imported at load time

    def load():
        global model, DEVICE, N_TIMES
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading LaBraM on {DEVICE}...", flush=True)
        from braindecode.models import Labram
        # The HF snapshot (model.safetensors + config.json) is pre-downloaded to MODEL_DIR
        # by the init container. Load from the LOCAL directory path so this works fully
        # offline (HF_HUB_OFFLINE=1). The old code globbed for a *.pt that does not exist
        # in this repo and fell through to an untrained random model — fixed here.
        try:
            m = Labram.from_pretrained(MODEL_DIR)
            m = m.to(DEVICE).eval()
            model = m
            N_TIMES = m.n_times
            # Canonical 128-ch 10-20 order — lives in the labram submodule, NOT re-exported
            # at braindecode.models (importing it there raises ImportError in 1.5.2).
            from braindecode.models.labram import LABRAM_CHANNEL_ORDER
            CHANNEL_ORDER = list(LABRAM_CHANNEL_ORDER)
            print(f"LaBraM ready on {DEVICE} via from_pretrained({MODEL_DIR}) "
                  f"(n_times={m.n_times}, n_chans={m.n_chans}, embed_dim={m.embed_dim}).",
                  flush=True)
        except Exception as e:
            import traceback; traceback.print_exc()
            # Do NOT fall back to an untrained model (would serve random embeddings).
            # Leave model=None so the pod stays not-ready / endpoint returns 503.
            print(f"LaBraM load FAILED ({e}); not serving (model=None).", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "labram"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": "labram", "object": "model",
                 "owned_by": "Jiang et al. (SJTU), via braindecode", "type": "eeg-foundation"}]}

    @app.post("/v1/science/embed")
    async def embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        eeg = request.get("eeg")
        if not eeg:
            return JSONResponse({"error": "eeg field required (list of channels, each a list of samples)"}, 400)

        def _infer():
            import torch
            import numpy as np
            arr = np.array(eeg, dtype=np.float32)
            if arr.ndim != 2:
                raise ValueError("eeg must be 2D: [n_channels][n_times]")
            n_chans, n_times_raw = arr.shape

            # Default to the canonical 128-channel order (any subset is valid); the model
            # matches channel names case-insensitively to select position embeddings.
            ch_names = request.get("ch_names") or CHANNEL_ORDER[:n_chans]
            ch_names = list(ch_names)
            if len(ch_names) != n_chans:
                raise ValueError(f"len(ch_names)={len(ch_names)} != n_channels={n_chans}")

            # Pad/truncate to the pretrained model's expected n_times (3000 for the base
            # checkpoint) — NOT a hardcoded value, which mismatched the learned embeddings.
            n_times = N_TIMES or model.n_times
            if n_times_raw < n_times:
                arr = np.pad(arr, ((0, 0), (0, n_times - n_times_raw)), mode='edge')
            elif n_times_raw > n_times:
                arr = arr[:, :n_times]

            tensor = torch.tensor(arr, dtype=torch.float32).unsqueeze(0).to(DEVICE)
            with torch.no_grad():
                features = model(tensor, ch_names=ch_names, return_features=True)
                emb = features["cls_token"].squeeze(0).cpu().numpy().tolist()
            return {
                "embeddings": emb,
                "model": "labram",
                "dim": len(emb),
                "n_channels": n_chans,
                "n_times_raw": n_times_raw,
                "n_times_used": n_times,
                "ch_names": ch_names,
            }

        try:
            result = await asyncio.get_event_loop().run_in_executor(None, _infer)
            return result
        except ValueError as e:
            return JSONResponse({"error": str(e)}, 400)
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: labram
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 300
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ] || ! /data/venv/bin/python -c 'import braindecode, fastapi, safetensors' 2>/dev/null; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip --quiet
              /data/venv/bin/pip install --quiet \
                torch \
                braindecode huggingface_hub safetensors \
                fastapi uvicorn
            else
              echo "Venv exists"
            fi

            if [ ! -d /data/model ] || [ -z "$(ls -A /data/model 2>/dev/null)" ]; then
              echo "Downloading LaBraM..."
              /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            snapshot_download('braindecode/labram-pretrained', local_dir='/data/model')
            print('Download complete')
            "
            else
              echo "Model already downloaded"
            fi
            echo "Setup complete"
        resources:
          requests: { cpu: "4", memory: 4Gi }
          limits:   { cpu: "8", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
          - { name: HF_HUB_OFFLINE, value: "1" }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "4", memory: 4Gi }
          limits:   { cpu: "8", memory: 8Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: labram-data-rwx }
      - name: app
        configMap: { name: labram-server }
