# Venv + LaBraM weights persist on NFS (ReadWriteMany, nfs-models). Split out of the ISVC
# 2026-06-19 (was inline + RWO). Migrated RWO→RWX by copying the venv + HF snapshot
# (model.safetensors + config.json) from the old RWO PVC (labram-data) into this new RWX
# PVC (labram-data-rwx) — NOT re-downloaded, to preserve the slow torch+braindecode venv.
# The old labram-data PVC is deleted after the copy + repoint.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labram-data-rwx
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-models
  resources:
    requests:
      storage: 5Gi
