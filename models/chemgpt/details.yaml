apiVersion: v1
kind: ConfigMap
metadata:
  name: chemgpt-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chemgpt",
      "status": "production",
      "type": "generate",
      "endpoints": {
        "primary": "/v1/science/generate",
        "secondary": "/v1/science/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "chemgpt",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min (venv + ChemGPT-1.2B load on CPU)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "smiles": {
          "type": "string",
          "required": false,
          "description": "SMILES prompt for molecule completion (the server reads the `smiles` field, not `model`)"
        },
        "max_new_tokens": {
          "type": "integer",
          "required": false,
          "default": 100,
          "description": "max new tokens to generate (≤500)"
        },
        "num_return_sequences": {
          "type": "integer",
          "required": false,
          "default": 1,
          "description": "number of molecules to sample (≤5)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "generated": {"type": "array", "description": "generated SMILES strings"},
        "prompt": {"type": "string", "description": "input prompt"}
      },
      "catalog": {
        "description_short": "ChemGPT-1.2B — autoregressive SMILES molecule generation (ncfrey).",
        "description": "ChemGPT-1.2B (ncfrey) is a 1.2B-param GPT-Neo model trained on PubChem SMILES for autoregressive molecule generation/completion — generates valid drug-like SMILES. Also exposes a `/v1/science/embed` endpoint (hidden-state molecular embeddings). CPU-served (1.2B). Max 512 tokens.",
        "owned_by": "ncfrey",
        "source": "ncfrey/ChemGPT-1.2B",
        "source_url": "https://huggingface.co/ncfrey/ChemGPT-1.2B",
        "license": "MIT",
        "parameters": "1.2B",
        "precision": "fp32",
        "framework": "transformers (GPT-Neo) + torch (CPU)",
        "domain": "chemistry",
        "subdomain": "molecule-generation",
        "tags": ["science", "generate", "chemistry", "smiles", "molecules", "drug-discovery", "gpt-neo"]
      }
    }
