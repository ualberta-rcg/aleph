# command-r-7b (CohereForAI/c4ai-command-r7b-12-2024) on HAMi. TP1 (1 vGPU slice, 32GB gpumem;
# 7B bf16 ~15GB so a <40GB slice is correct). Tools OFF (Cohere's <|START_ACTION|> format needs
# cohere_melody, absent from the stock image — card keeps supports_tools=false).
# Persisted helper venv + weights on RWX PVC (gemma-4 pattern); scale-to-zero, 15m idle.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: command-r-7b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    autoscaling.knative.dev/initial-scale: "0"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 1
    maxReplicas: 5
    scaleMetric: concurrency
    scaleTarget: 5
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "command-r-7b weights already on PVC, skipping download."
            else
                echo "Downloading CohereForAI/c4ai-command-r7b-12-2024 ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="CohereForAI/c4ai-command-r7b-12-2024",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: command-r-7b
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=command-r-7b
          - --port=8080
          - --tensor-parallel-size=1
          - --max-model-len=65536
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "32768"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: command-r-7b
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: command-r-7b
        persistentVolumeClaim:
          claimName: command-r-7b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
