apiVersion: v1
kind: ConfigMap
metadata:
  name: command-r-7b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "command-r-7b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "command-r-7b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 8192, "context_window": 65536 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "<1 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.3, "max_tokens": 4096 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": {
        "schema": {
          "top_p": { "type": "float", "default": 0.9, "min": 0.0, "max": 1.0 },
          "top_k": { "type": "integer", "default": 0, "min": 0, "max": 100 },
          "repetition_penalty": { "type": "float", "default": 1.0, "min": 0.9, "max": 2.0 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "items": {"role": "string", "content": "string"},
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant)"
        },
        "max_tokens": {"type": "integer", "default": 4096, "max": 8192, "description": "Maximum tokens to generate"},
        "temperature": {"type": "float", "default": 0.3, "min": 0.0, "max": 2.0, "description": "Sampling temperature"},
        "top_p": {"type": "float", "default": 0.9, "min": 0.0, "max": 1.0, "description": "Nucleus sampling probability"},
        "top_k": {"type": "integer", "default": 0, "min": 0, "max": 100, "description": "Top-K sampling (0 = disabled)"},
        "repetition_penalty": {"type": "float", "default": 1.0, "min": 0.9, "max": 2.0, "description": "Repetition penalty"},
        "stream": {"type": "boolean", "default": false, "description": "Stream responses via SSE"},
        "stop": {"type": "string|array", "description": "Stop sequences"},
        "frequency_penalty": {"type": "float", "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty for repetition"}
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model identifier"},
        "choices": {"type": "array", "items": {"message": {"role": "string", "content": "string"}, "finish_reason": "string"}, "description": "Generated chat completions"},
        "usage": {"prompt_tokens": "int", "completion_tokens": "int", "total_tokens": "int"}
      },
      "catalog": {
        "description_short": "Cohere Command R 7B, RAG-optimized chat (multilingual)",
        "owned_by": "CohereForAI",
        "source": "CohereForAI/c4ai-command-r7b-12-2024",
        "license": "CC-BY-NC",
        "parameters": "7B",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "rag",
        "tags": ["chat", "llm", "rag", "code", "multilingual"]
      }
    }
