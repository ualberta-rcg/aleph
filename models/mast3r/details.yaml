apiVersion: v1
kind: ConfigMap
metadata:
  name: mast3r-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "schema_version": 2,
      "id": "mast3r",
      "type": "3d",
      "description_short": "MASt3R (ECCV 2024): grounding image matching in 3D with metric depth and feature matching for visual localization.",
      "description": "MASt3R (Matching And Stereo 3D Reconstruction) from NAVER extends DUSt3R with precise feature matching and metric depth estimation (ECCV 2024). It takes 2+ images and returns 3D point correspondences with metric depth, enabling accurate camera pose estimation and visual localization. State-of-the-art for image matching and 3D reconstruction. Uses AsymmetricMASt3R architecture. Requires cloned mast3r repo.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/reconstruct",
        "health": "/health"
      },
      "owned_by": "naver",
      "source": "naver/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric",
      "source_url": "https://huggingface.co/naver/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric",
      "license": "CC-BY-NC-4.0",
      "parameters": "~300M",
      "precision": "float32",
      "architecture": "AsymmetricMASt3R (ViT-Large + catmlpdpt metric head)",
      "framework": "mast3r + dust3r (custom) + PyTorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "gpu_type": "L40S-SHARED",
        "min_replicas": 0,
        "max_replicas": 5,
        "timeout": 120,
        "pvc": "mast3r-data",
        "image": "python:3.11-slim",
        "venv": true
      },
      "routing": {
        "kserve_custom": true,
        "k8s_name": "mast3r",
        "api_name": "mast3r",
        "gateway_type": "3d"
      },
      "compatibility": {
        "openai_compatible": false,
        "streaming": false
      },
      "domain": "3d-vision",
      "subdomain": "matching-reconstruction",
      "tags": ["science", "3d", "matching", "reconstruction", "metric-depth", "vision", "gpu"],
      "content_types": ["application/json"],
      "tier": 2,
      "input_map": {
        "images": "array of 2+ base64-encoded JPEG/PNG images"
      },
      "output_map": {
        "reconstruct": "3D point clouds with metric depth",
        "match": "feature correspondences between image pairs"
      },
      "server_config": {
        "port": 8080,
        "health_path": "/health",
        "model_path": "/data/model",
        "repo_path": "/data/model/repo",
        "dust3r_repo_path": "/data/model/repo/dust3r"
      }
    }
