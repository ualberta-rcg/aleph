# Evo2-40b: Arc Institute genome modeling NIM (biology/genomics)
# NVIDIA NIM container — pre-built
# NIM: nvcr.io/nim/arc/evo2-40b
# API: POST /biology/arc/evo2/generate
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: evo2-40b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline-seconds: "1200"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: nvcr.io/nim/arc/evo2-40b:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ngc-api-key
                key: NGC_API_KEY
          - name: HOME
            value: /opt/nim/.cache
          - name: XDG_CACHE_HOME
            value: /opt/nim/.cache
          - name: EVO2_PIPELINE_PARALLEL
            value: "1"
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "43008"
          limits:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "43008"
        readinessProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 60
        startupProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 120
        volumeMounts:
          - name: evo2-40b
            mountPath: /opt/nim/.cache
          - name: shm
            mountPath: /dev/shm
    imagePullSecrets:
      - name: ngc-registry-secret
    volumes:
      - name: evo2-40b
        persistentVolumeClaim:
          claimName: evo2-40b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
