# Weights persist on NFS (nfs-models default SC = OneFS-safe 128Ki wsize) so scale-from-zero
# cold starts skip the ~8.5GB re-download. See storage/nfs-models-storageclass.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-3-4b-it
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 20Gi
