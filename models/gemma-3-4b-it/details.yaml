apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma-3-4b-it-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gemma-3-4b-it",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "gemma-3-4b-it",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 8192, "context_window": 65536 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 1.0, "top_p": 0.95, "top_k": 64, "max_tokens": 2048 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": {
        "schema": {
          "top_p": { "type": "float", "default": 0.95, "min": 0.0, "max": 1.0 },
          "top_k": { "type": "integer", "default": 64, "min": 0, "max": 100 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "required": true,
          "description": "Chat messages [{role: 'user'|'system'|'assistant', content: str|array}]. Content can include image_url objects."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 2048,
          "max": 8192,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature"
        },
        "top_p": {
          "type": "float",
          "required": false,
          "default": 0.95,
          "description": "Nucleus sampling threshold"
        },
        "top_k": {
          "type": "integer",
          "required": false,
          "default": 64,
          "description": "Top-K sampling"
        },
        "stream": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Enable streaming responses"
        },
        "frequency_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "description": "Frequency penalty"
        },
        "presence_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "description": "Presence penalty"
        },
        "stop": {
          "type": "array|string",
          "required": false,
          "description": "Stop sequence(s)"
        },
        "seed": {
          "type": "integer",
          "required": false,
          "description": "Random seed for reproducibility"
        },
        "image": {
          "type": "string",
          "required": false,
          "description": "Base64-encoded image or URL via image_url in messages. Up to 8 images per prompt."
        }
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model name"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (may include image analysis)"},
        "usage": {"type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)"}
      },
      "catalog": {
        "description_short": "Google Gemma 3 4B instruction-tuned, multimodal (text + image, multilingual)",
        "description": "Google Gemma 3 4B Instruct. Lightweight open multimodal model (SigLIP vision tower) accepting text + images in OpenAI chat format, with a 128K-capable context (served at 64K here) and strong multilingual instruction-following for its size. Served on a HAMi vGPU slice (20 GiB). No tool calling or reasoning mode.",
        "owned_by": "Google",
        "source": "google/gemma-3-4b-it",
        "source_url": "https://huggingface.co/google/gemma-3-4b-it",
        "license": "gemma",
        "parameters": "4B",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "instruct",
        "tags": ["chat", "llm", "vision", "multimodal", "multilingual", "lightweight"]
      }
    }
