apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma-3-4b-it-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gemma-3-4b-it",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "gemma-3-4b-it",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 8192, "context_window": 65536 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 1.0, "top_p": 0.95, "top_k": 64, "max_tokens": 2048 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": {
        "schema": {
          "top_p": { "type": "float", "default": 0.95, "min": 0.0, "max": 1.0 },
          "top_k": { "type": "integer", "default": 64, "min": 0, "max": 100 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Google Gemma 3 4B instruction-tuned, multimodal (text + image, multilingual)",
        "description": "Google Gemma 3 4B Instruct. Lightweight open multimodal model (SigLIP vision tower) accepting text + images in OpenAI chat format, with a 128K-capable context (served at 64K here) and strong multilingual instruction-following for its size. Served on a HAMi vGPU slice.",
        "owned_by": "Google",
        "source": "google/gemma-3-4b-it",
        "source_url": "https://huggingface.co/google/gemma-3-4b-it",
        "license": "gemma",
        "parameters": "4B",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "instruct",
        "tags": ["chat", "llm", "vision", "multimodal", "multilingual", "lightweight"]
      }
    }
