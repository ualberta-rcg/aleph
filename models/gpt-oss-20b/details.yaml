apiVersion: v1
kind: ConfigMap
metadata:
  name: gpt-oss-20b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gpt-oss-20b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "gpt-oss-20b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 32768, "context_window": 131072 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": true
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "on":  { "reasoning_effort": "medium" },
          "off": { "reasoning_effort": "low" }
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 1.0, "top_p": 1.0, "max_tokens": 16384 },
        "meta_tasks": {
          "title":     { "max_tokens": 80,  "thinking": { "enabled": false } },
          "tags":      { "max_tokens": 60,  "thinking": { "enabled": false } },
          "followups": { "max_tokens": 220, "thinking": { "enabled": false } }
        }
      },
      "custom_params": {
        "schema": {
          "reasoning_effort": { "type": "string", "enum": ["low","medium","high"], "default": "medium" }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "OpenAI GPT-OSS 20B MoE, configurable reasoning + native tools (lightweight)",
        "owned_by": "openai",
        "source": "openai/gpt-oss-20b",
        "license": "Apache-2.0",
        "parameters": "21B MoE (3.6B active)",
        "precision": "mxfp4",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "agentic", "moe", "tool-calling"]
      }
    }
