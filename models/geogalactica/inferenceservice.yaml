# GeoGalactica: 30B geoscience LLM (geobrain-ai/geogalactica). Galactica/OPT arch; ~60GB → TP2.
# Whole devices (no gpumem). Persisted helper venv + weights on RWX PVC (gemma-4 pattern);
# scale-to-zero, 15m idle. Context capped at 2048 (OPT hard limit). Gated — HF_TOKEN required.
# --disable-custom-all-reduce (L40S NODE topology, no NVLink P2P). chat-template from the snapshot.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: geogalactica
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    autoscaling.knative.dev/initial-scale: "0"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 1
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skip if config + tokenizer already present).
            if [ -f /data/model/config.json ] && [ -f /data/model/tokenizer_config.json ]; then
              echo "GeoGalactica weights already on PVC, skipping download."
            else
              echo "Downloading geobrain-ai/geogalactica (~60 GB) ..."
              /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="geobrain-ai/geogalactica",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
            # NB: the chat template is NOT in the HF repo — it's mounted from the
            # geogalactica-chat-template ConfigMap (see chat-template-configmap.yaml) at /chat-template.
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "8"
            memory: 32Gi
        volumeMounts:
          - name: geogalactica
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command: ["vllm", "serve", "/data/model"]
        args:
          - --served-model-name=geogalactica
          - --port=8080
          - --tensor-parallel-size=2
          - --max-model-len=2048
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
          - --disable-custom-all-reduce
          - --chat-template=/chat-template/chat_template.jinja
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: geogalactica
            mountPath: /data
          - name: chat-template
            mountPath: /chat-template
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: geogalactica
        persistentVolumeClaim:
          claimName: geogalactica
      - name: chat-template
        configMap:
          name: geogalactica-chat-template
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
