apiVersion: v1
kind: ConfigMap
metadata:
  name: geogalactica-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "geogalactica",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "geogalactica",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 2048,
        "max_completion_tokens": 2000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "2-4 min",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 1024
        },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "items": {"role": "string", "content": "string"},
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant). English only."
        },
        "max_tokens": {"type": "integer", "default": 1024, "max": 2000, "description": "Maximum tokens to generate"},
        "temperature": {"type": "float", "default": 0.7, "min": 0.0, "max": 2.0, "description": "Sampling temperature"},
        "top_p": {"type": "float", "default": 1.0, "min": 0.0, "max": 1.0, "description": "Nucleus sampling probability"},
        "stream": {"type": "boolean", "default": false, "description": "Stream responses via SSE"},
        "frequency_penalty": {"type": "float", "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty for repetition"}
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model identifier"},
        "choices": {"type": "array", "items": {"message": {"role": "string", "content": "string"}, "finish_reason": "string"}, "description": "Generated chat completions"},
        "usage": {"prompt_tokens": "int", "completion_tokens": "int", "total_tokens": "int"}
      },
      "catalog": {
        "description_short": "GeoGalactica 30B geoscience LLM. Further pre-trained Galactica on 65B geo tokens.",
        "description": "GeoGalactica is a 30B parameter geoscience LLM from Shanghai Jiao Tong University / GeoBRAIN.ai. Built on the Galactica architecture (OPT-style decoder-only, 48 layers, 56 heads, hidden=7168), further pre-trained on 65 billion geoscience tokens and supervised fine-tuned on 1M instruction pairs. Largest language model for the geoscience domain at time of publication. Expert at geoscience Q&A, geological analysis, mineralogy, and earth science reasoning. Very short context (2048 tokens) due to OPT architecture. English only. No tool calling, no vision, no reasoning mode. Apache 2.0 license.",
        "owned_by": "geobrain-ai",
        "source": "geobrain-ai/geogalactica",
        "source_url": "https://huggingface.co/geobrain-ai/geogalactica",
        "license": "Apache-2.0",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "30B",
        "tags": [
          "chat",
          "llm",
          "geoscience",
          "geology",
          "earth-science",
          "science"
        ]
      },
      "server_config": {
        "note": "vLLM v0.20.2, TP2 (2x L40S). --trust-remote-code for Galactica/OPT architecture. max-model-len=2048 (hard limit from OPT positional embeddings, cannot extend). Context is very short — not suitable for long documents."
      }
    }
