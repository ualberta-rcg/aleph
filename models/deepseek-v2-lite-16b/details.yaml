apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-v2-lite-16b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "deepseek-v2-lite-16b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "deepseek-v2-lite-16b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 131072,
        "max_completion_tokens": 8000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-3 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.3, "top_p": 1.0, "max_tokens": 4096 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant). Bilingual EN/ZH."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 4096,
          "max": 8000,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 0.3,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature"
        },
        "top_p": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "min": 0.0,
          "max": 1.0,
          "description": "Nucleus sampling probability"
        },
        "stream": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Stream responses via SSE"
        },
        "frequency_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "min": -2.0,
          "max": 2.0,
          "description": "Frequency penalty for repetition"
        }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model identifier" },
        "choices": { "type": "array", "items": { "message": { "role": "string", "content": "string" }, "finish_reason": "string" }, "description": "Generated chat completions" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "DeepSeek-V2-Lite-Chat 16B MoE (2.4B active), Multi-head Latent Attention, bilingual EN/ZH",
        "description": "DeepSeek-V2-Lite-Chat. 15.7B total / 2.4B active MoE (DeepSeekMoE: 2 shared + 64 routed experts, 6 activated). Uses Multi-head Latent Attention (MLA) for efficient KV-cache compression. Strong bilingual (English/Chinese) chat. No reasoning mode, no tool calling. Served TP1 on a HAMi GPU slice, bf16 (MLA attention runs WITHOUT --enforce-eager on vLLM v0.20.2 — removed in commit 1826eb2, 14/14 tests pass).",
        "owned_by": "deepseek-ai",
        "source": "deepseek-ai/DeepSeek-V2-Lite-Chat",
        "source_url": "https://huggingface.co/deepseek-ai/DeepSeek-V2-Lite-Chat",
        "license": "deepseek-license",
        "parameters": "16B MoE (2.4B active)",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "tags": ["chat", "llm", "moe", "mla", "bilingual"]
      }
    }
