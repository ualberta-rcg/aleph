apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-v2-lite-16b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "deepseek-v2-lite-16b",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "deepseek-v2-lite-16b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 8192,
        "max_completion_tokens": 8000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "2-3 minutes",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.3,
          "max_tokens": 4096
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "DeepSeek V2 Lite 16B MoE (2.4B active), MLA attention",
        "description": "DeepSeek V2 Lite 16B MoE Chat. 15.7B total params, 2.4B active per token. Uses Multi-head Latent Attention (MLA) for efficient KV cache compression and DeepSeekMoE (2 shared + 64 routed experts, 6 activated). Strong bilingual (EN/ZH) chat. No reasoning mode, no tool calling.",
        "owned_by": "deepseek-ai",
        "source": "deepseek-ai/DeepSeek-V2-Lite-Chat",
        "source_url": "https://huggingface.co/deepseek-ai/DeepSeek-V2-Lite-Chat",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "16B MoE (2.4B active)",
        "tags": ["chat", "llm", "code", "moe", "bilingual"]
      },
      "server_config": {
        "note": "Uses --enforce-eager (DeepSeek V2 MLA attention requires it). No --reasoning-parser or --tool-call-parser (not a reasoning model, no tool support). vLLM v0.20.2."
      }
    }
