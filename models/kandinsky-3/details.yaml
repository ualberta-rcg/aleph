apiVersion: v1
kind: ConfigMap
metadata:
  name: kandinsky-3-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "kandinsky-3",
      "status": "production",
      "type": "image",
      "endpoints": {
        "primary": "/v1/images/generations",
        "edit": "/v1/images/edits",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "kandinsky-3",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "prompt": {"type": "string", "required": true, "description": "Text prompt for image generation"},
        "negative_prompt": {"type": "string", "required": false, "default": "", "description": "What to avoid in the image"},
        "n": {"type": "integer", "required": false, "default": 1, "description": "Number of images (max 4)"},
        "size": {"type": "string", "required": false, "default": "1024x1024", "description": "WxH, e.g. 1024x1024"},
        "num_inference_steps": {"type": "integer", "required": false, "default": 25, "description": "Denoising steps"},
        "guidance_scale": {"type": "float", "required": false, "default": 3.0, "description": "Classifier-free guidance scale (model default 3.0; >1 enables guidance)"},
        "seed": {"type": "integer", "required": false, "description": "Deterministic seed"},
        "quality": {"type": "string", "required": false, "description": "Set to 'hd' for >=50 steps"},
        "image": {"type": "string", "required": false, "description": "img2img only (POST /v1/images/edits): source image as base64"},
        "strength": {"type": "float", "required": false, "default": 0.75, "description": "img2img only: how much to transform the source image (0-1)"}
      },
      "output_map": {
        "created": {"type": "integer", "description": "Unix timestamp"},
        "data": {"type": "array", "description": "List of {b64_json: base64-encoded PNG image}"}
      },
      "catalog": {
        "description_short": "Kandinsky 3 text-to-image + image-to-image generation (Sber AI, GPU)",
        "description": "Kandinsky 3.0 (kandinsky-community/kandinsky-3) is a ~11.9B text-to-image diffusion model by Sber AI: a Flan-UL2 text encoder (8.6B) + Latent Diffusion U-Net with BigGAN-deep blocks (3B) + Sber-MoVQGAN decoder (267M). Generates images from text and supports image editing (img2img) via diffusers AutoPipeline (fp16). Served as a standard KServe InferenceService custom predictor (FastAPI + diffusers) on a single L40S vGPU slice, with Knative scale-to-zero (0->3 on demand, releases the GPU ~15m after idle). OpenAI-compatible /v1/images/generations endpoint (img2img via /v1/images/edits). Apache-2.0.",
        "owned_by": "kandinsky-community",
        "source": "kandinsky-community/kandinsky-3",
        "source_url": "https://huggingface.co/kandinsky-community/kandinsky-3",
        "license": "Apache-2.0",
        "parameters": "~11.9B (Flan-UL2 text encoder 8.6B + U-Net 3B + MoVQ 267M)",
        "precision": "fp16",
        "framework": "diffusers",
        "domain": "image-generation",
        "subdomain": "text-to-image",
        "tags": ["image-generation", "text-to-image", "img2img", "gpu", "diffusion", "kserve"]
      }
    }
