# Nucleotide Transformer v2 500M: DNA/RNA foundation model
# GPU (~2GB VRAM), scale-to-zero. HF: InstaDeepAI/nucleotide-transformer-v2-500m-multi-species
# 17k downloads, Apache 2.0
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nucleotide-transformer-server
  namespace: models
data:
  server.py: |
    import os, asyncio, torch
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = "InstaDeepAI/nucleotide-transformer-v2-500m-multi-species"
    app = FastAPI()
    model = None
    tokenizer = None
    DEVICE = "cpu"

    def load():
        global model, tokenizer, DEVICE
        from transformers import AutoTokenizer, EsmModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading Nucleotide Transformer on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_ID, trust_remote_code=True)
        model = EsmModel.from_pretrained(MODEL_ID, ignore_mismatched_sizes=True,
            torch_dtype=torch.float16 if DEVICE == "cuda" else torch.float32)
        model = model.to(DEVICE).eval()
        print(f"Nucleotide Transformer ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "nucleotide-transformer"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "nucleotide-transformer", "object": "model", "created": 1700000000,
             "owned_by": "InstaDeepAI", "type": "embedding",
             "description": "DNA/RNA foundation model (500M params)"}
        ]}

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        
        sequences = request.get("input") or request.get("sequences")
        if isinstance(sequences, str):
            sequences = [sequences]
        if not sequences:
            return JSONResponse({"error": "'input' required (DNA/RNA sequences)"}, 400)

        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, sequences)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(sequences):
        enc = tokenizer(sequences, return_tensors="pt", padding=True, truncation=True, max_length=2048)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        
        with torch.no_grad():
            out = model(**enc)
        
        mask = enc["attention_mask"].unsqueeze(-1).float()
        emb = (out.last_hidden_state * mask).sum(1) / mask.sum(1)
        emb = emb.cpu().float().numpy()
        
        data = [{"object": "embedding", "index": i, "embedding": e.tolist()}
                for i, e in enumerate(emb)]
        return {"object": "list", "data": data, "model": "nucleotide-transformer",
                "usage": {"prompt_tokens": sum(len(s) for s in sequences), "total_tokens": sum(len(s) for s in sequences)}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: nucleotide-transformer
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_HOME
            value: "/data/hf_cache"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
            fi
            echo "Installing dependencies..."
            /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu121
            /data/venv/bin/pip install -q 'transformers<4.45' fastapi uvicorn huggingface_hub
            
            if [ ! -d /data/hf_cache/hub/models--InstaDeepAI--nucleotide-transformer-v2-500m-multi-species ]; then
              echo "Downloading model..."
              HF_HOME=/data/hf_cache /data/venv/bin/python -c "
            from transformers import AutoTokenizer, AutoModel
            import os; os.environ['HF_HOME']='/data/hf_cache'
            AutoTokenizer.from_pretrained('InstaDeepAI/nucleotide-transformer-v2-500m-multi-species', trust_remote_code=True)
            AutoModel.from_pretrained('InstaDeepAI/nucleotide-transformer-v2-500m-multi-species', trust_remote_code=True)
            print('Nucleotide Transformer cached')
            "
            else
              echo "Model cached"
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "4096" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: nucleotide-transformer-data }
      - name: app
        configMap: { name: nucleotide-transformer-server }
