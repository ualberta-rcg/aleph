apiVersion: v1
kind: ConfigMap
metadata:
  name: gena-lm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gena-lm",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": { "k8s_name": "gena-lm", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "1-2 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "DNA sequence(s); truncated to 512 tokens." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled DNA embeddings (last hidden state)" },
        "model": { "type": "string", "description": "Model name (gena-lm)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (sequence lengths)" }
      },
      "catalog": {
        "description_short": "GENA-LM bert-base-t2t — 768-dim DNA embeddings (GPU, scale-to-zero)",
        "description": "GENA-LM (AIRI-Institute/gena-lm-bert-base-t2t): a BERT-style DNA language model pre-trained on the T2T human genome. Produces 768-dim mean-pooled DNA embeddings (last hidden state) for genomics tasks. Max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (8 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "AIRI Institute",
        "source": "AIRI-Institute/gena-lm-bert-base-t2t",
        "source_url": "https://huggingface.co/AIRI-Institute/gena-lm-bert-base-t2t",
        "license": "Apache-2.0",
        "parameters": "110M",
        "precision": "fp16 (GPU)",
        "framework": "transformers AutoModel (custom FastAPI server, trust_remote_code)",
        "domain": "genomics", "subdomain": "dna-embeddings",
        "gpu": true, "embedding_dimensions": 768, "pooling": "mean", "max_input_tokens": 512,
        "tags": ["embedding", "science", "genomics", "dna", "bert"]
      }
    }
