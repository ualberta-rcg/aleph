apiVersion: v1
kind: ConfigMap
metadata:
  name: borzoi-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "borzoi",
      "type": "predict",
      "description_short": "RNA-seq prediction from 524kb genomic sequences (Calico, ~500M)",
      "description": "Borzoi from Calico Research predicts RNA-seq signal from 524,288 bp genomic DNA sequences. Predicts gene expression at base-pair resolution across multiple bins. Based on the Enformer architecture with modifications for RNA-seq prediction. 68K+ HF downloads. CC-BY-4.0 license.",
      "context_window": 524288,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "owned_by": "calico",
      "source": "johahi/borzoi-replicate-0",
      "source_url": "https://huggingface.co/johahi/borzoi-replicate-0",
      "license": "CC-BY-4.0",
      "parameters": "~500M",
      "precision": "float32",
      "architecture": "Borzoi (Enformer-variant for RNA-seq)",
      "framework": "borzoi-pytorch + transformers<4.51 + torch",
      "deployment": {"image": "python:3.11-slim", "gpu": true, "min_replicas": 0, "max_replicas": 5, "cpu_request": "2", "memory_request": "8Gi", "pvc": "borzoi-data", "pvc_size": "10Gi", "node_selector": "NVIDIA-L40S-SHARED", "timeout": 120},
      "routing": {"kserve_custom": true, "path_prefix": "/v1/", "isvc_name": "borzoi", "api_name": "borzoi"},
      "compatibility": {"openai_embeddings": false, "input_fields": ["sequence", "n_bins"]},
      "domain": "genomics",
      "subdomain": "rna-seq-prediction",
      "tags": ["predict", "science", "genomics", "dna", "rna-seq", "gene-expression", "gpu"],
      "content_types": ["text"],
      "languages": ["dna"],
      "input_map": {"sequence": "DNA sequence (~524kb bp)", "n_bins": "int (default 16) — number of center bins to return"},
      "output_map": {"model": "borzoi", "predictions": "[[[float]]] shape (n_bins, n_tracks)", "bins_returned": "int", "num_tracks": "int"},
      "tier": 1
    }
