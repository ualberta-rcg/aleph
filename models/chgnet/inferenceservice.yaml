# CHGNet: universal neural network potential (CederGroupHub/chgnet)
# GPU slice, scale-to-zero. API: POST /v1/science/energy
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: chgnet
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            if [ -f /data/checkpoint.pth ]; then
                echo "CHGNet weights already on PVC, skipping download."
            else
                pip install -q huggingface_hub
                python3 -u <<'PY'
            import os
            from huggingface_hub import hf_hub_download
            print("Downloading CHGNet weights...", flush=True)
            hf_hub_download(
                repo_id="CederGroupHub/chgnet",
                filename="checkpoint.pth",
                local_dir="/data",
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi

            if [ -d /data/venv/bin ]; then
                echo "venv already exists, skipping install."
            else
                echo "Creating venv and installing chgnet..."
                python3 -m venv /data/venv
                . /data/venv/bin/activate
                pip install -U pip
                pip install chgnet fastapi uvicorn
                echo "Install done."
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: chgnet-data
            mountPath: /data
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command:
          - bash
          - -c
        args:
          - |
            . /data/venv/bin/activate
            exec python3 /app/server.py
        env:
          - name: MODEL_DIR
            value: /data
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - name: chgnet-data
            mountPath: /data
          - name: app
            mountPath: /app
    volumes:
      - name: chgnet-data
        persistentVolumeClaim:
          claimName: chgnet-data
      - name: app
        configMap:
          name: chgnet-server
