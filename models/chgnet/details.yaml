apiVersion: v1
kind: ConfigMap
metadata:
  name: chgnet-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chgnet",
      "status": "production",
      "type": "force-field",
      "endpoints": {
        "primary": "/v1/science/energy",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "chgnet",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "structure": {
          "type": "object",
          "required": true,
          "description": "atomic structure: {elements:[\"Li\",\"Fe\",\"P\",\"O\"], positions:[[x,y,z],...], cell?(3x3), pbc?([bool,bool,bool])}. A large cubic box is synthesized for molecules (no cell)."
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "energy_eV": {"type": "number", "description": "total potential energy in eV (per-atom × n_atoms)"},
        "energy_eV_per_atom": {"type": "number", "description": "per-atom energy in eV"},
        "forces_eV_per_A": {"type": "array", "description": "per-atom forces [n_atoms][3] in eV/Angstrom"},
        "stress_GPa": {"type": "array", "description": "Voigt stress tensor in GPa (when available)"},
        "magmom_muB": {"type": "array", "description": "per-atom magnetic moments in mu_B (CHGNet-unique; when available)"},
        "n_atoms": {"type": "integer", "description": "atom count"}
      },
      "catalog": {
        "description_short": "CHGNet universal NN potential with magnetic moments + charge distribution for materials (battery/magnetic research).",
        "description": "CHGNet (Charge-Enhanced Graph Neural Network, UC Berkeley) is a universal graph neural network force field trained on Materials Project DFT. Unique among the force fields here for predicting **magnetic moments** and **charge distribution** alongside energy/forces/stress — valuable for battery and magnetic-materials research. Loaded via the `chgnet` pip package (bundled pretrained weights; the HF repo was removed). Pinned `chgnet==0.3.8` (0.4.x breaks the bundled graph converter).",
        "owned_by": "UC Berkeley",
        "source": "CederGroupHub/chgnet",
        "source_url": "https://github.com/CederGroupHub/chgnet",
        "license": "MIT",
        "parameters": "~2M",
        "precision": "float32",
        "framework": "chgnet + pymatgen + ASE + PyTorch",
        "domain": "materials-science",
        "subdomain": "interatomic-potentials",
        "tags": ["science", "materials", "force-field", "molecular-dynamics", "magnetism", "battery", "gpu"]
      }
    }
