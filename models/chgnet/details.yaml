apiVersion: v1
kind: ConfigMap
metadata:
  name: chgnet-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chgnet-v0.3",
      "type": "force-field",
      "description_short": "CHGNet universal neural network potential with magnetic moments and charge distribution for materials simulation.",
      "description": "CHGNet is a universal graph neural network force field from UC Berkeley (CederGroupHub) that includes magnetic moments and charge distribution prediction. Trained on Materials Project DFT data, it predicts energy, forces, stress, and magnetic moments from atomic structures. Critical for battery and magnetic materials research. Uses the chgnet pip package with ASE calculator interface.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/energy",
        "health": "/health"
      },
      "owned_by": "Berkeley",
      "source": "CederGroupHub/chgnet",
      "source_url": "https://github.com/CederGroupHub/chgnet",
      "license": "MIT",
      "parameters": "~2M",
      "precision": "float32",
      "architecture": "CHGNet (Charge-Enhanced Graph Neural Network)",
      "framework": "chgnet + ASE + PyTorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "gpu_type": "L40S-SHARED",
        "cpu_request": "2",
        "memory_request": "4Gi",
        "min_replicas": 0,
        "max_replicas": 3,
        "timeout": 120,
        "pvc": "chgnet-data",
        "image": "python:3.11-slim",
        "venv": true
      },
      "routing": {
        "kserve_custom": true,
        "k8s_name": "chgnet",
        "api_name": "chgnet-v0.3",
        "gateway_type": "force-field",
        "isvc_name_map": {"chgnet": "chgnet-v0.3"}
      },
      "compatibility": {
        "openai_compatible": false,
        "streaming": false
      },
      "domain": "materials-science",
      "subdomain": "interatomic-potentials",
      "tags": ["science", "materials", "force-field", "molecular-dynamics", "magnetism", "battery", "gpu"],
      "content_types": ["application/json"],
      "tier": 2,
      "input_map": {
        "structure": {
          "elements": "array of element symbols e.g. [\"Li\", \"Fe\", \"P\", \"O\"]",
          "positions": "array of [x,y,z] positions in Angstroms",
          "cell": "3x3 cell vectors",
          "pbc": "[bool, bool, bool] periodic boundary conditions"
        }
      },
      "output_map": {
        "energy_eV": "total potential energy in eV",
        "forces_eV_A": "per-atom forces in eV/Angstrom",
        "stress_eV_A3": "Voigt stress tensor"
      },
      "server_config": {
        "port": 8080,
        "health_path": "/health",
        "checkpoint_path": "/data/checkpoint.pth",
        "configmap_name": "chgnet-server"
      }
    }
