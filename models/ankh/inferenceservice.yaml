# Ankh Base: Protein language model from ElnaggarLab (TUM)
# GPU (~2GB VRAM), scale-to-zero. HF: ElnaggarLab/ankh-base
# 64k downloads, Apache 2.0
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ankh-server
  namespace: models
data:
  server.py: |
    import os, asyncio, torch
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = "ElnaggarLab/ankh-base"
    app = FastAPI()
    model = None
    tokenizer = None
    DEVICE = "cpu"

    def load():
        global model, tokenizer, DEVICE
        from transformers import AutoTokenizer, T5EncoderModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading Ankh on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
        # T5 encoders overflow to NaN/Inf in fp16; use fp32 (ankh-base is small).
        model = T5EncoderModel.from_pretrained(MODEL_ID, torch_dtype=torch.float32)
        model = model.to(DEVICE).eval()
        print(f"Ankh ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "ankh"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "ankh", "object": "model", "created": 1700000000,
             "owned_by": "ElnaggarLab", "type": "embedding",
             "description": "Ankh protein encoder (T5-based)"}
        ]}

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        
        sequences = request.get("input") or request.get("sequences")
        if isinstance(sequences, str):
            sequences = [sequences]
        if not sequences:
            return JSONResponse({"error": "'input' required (protein sequences)"}, 400)

        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, sequences)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(sequences):
        # Ankh expects space-separated amino acids
        spaced = [" ".join(list(s)) for s in sequences]
        enc = tokenizer(spaced, return_tensors="pt", padding=True, truncation=True, max_length=1024)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        
        with torch.no_grad():
            out = model(**enc)
        
        mask = enc["attention_mask"].unsqueeze(-1).float()
        emb = (out.last_hidden_state * mask).sum(1) / mask.sum(1)
        emb = emb.cpu().float()
        emb = torch.nan_to_num(emb, nan=0.0, posinf=0.0, neginf=0.0).numpy()
        
        data = [{"object": "embedding", "index": i, "embedding": e.tolist()}
                for i, e in enumerate(emb)]
        return {"object": "list", "data": data, "model": "ankh",
                "usage": {"prompt_tokens": sum(len(s) for s in sequences), "total_tokens": sum(len(s) for s in sequences)}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ankh
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "900s"
    autoscaling.knative.dev/initial-scale: "0"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 3
    scaleTarget: 8
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_HOME
            value: "/data/hf_cache"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
            fi
            echo "Installing dependencies..."
            /data/venv/bin/pip install -q 'torch>=2.6' --index-url https://download.pytorch.org/whl/cu126
            /data/venv/bin/pip install -q transformers sentencepiece fastapi uvicorn
            
            echo "Pre-downloading Ankh..."
            /data/venv/bin/python -c "
            from transformers import AutoTokenizer, T5EncoderModel
            AutoTokenizer.from_pretrained('ElnaggarLab/ankh-base')
            T5EncoderModel.from_pretrained('ElnaggarLab/ankh-base')
            print('Ankh cached')
            "
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: ankh, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "8192" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "8192" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: ankh, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: ankh
        persistentVolumeClaim: { claimName: ankh }
      - name: app
        configMap: { name: ankh-server }
