# DINOv3 ViT-L/16 (facebook/dinov3-vitl16-pretrain-lvd1689m) — vision embedding model.
# 303M params, 1024-dim CLS embeddings. Custom transformers FastAPI server, CPU.
# Scale-to-zero (initial-scale:0 global). HF token from secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dinov3-vitl16-server
  namespace: models
data:
  server.py: |
    """DINOv3 ViT-L/16 visual embedding server."""
    import os, io, base64, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_NAME = os.environ.get("MODEL_NAME", "dinov3-vitl16")
    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    model = None
    processor = None
    DEVICE = "cpu"

    def load():
        global model, processor, DEVICE
        import torch
        from transformers import AutoModel, AutoImageProcessor
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading DINOv3 ViT-L/16 on {DEVICE}...", flush=True)
        processor = AutoImageProcessor.from_pretrained(MODEL_DIR)
        model = AutoModel.from_pretrained(MODEL_DIR).to(DEVICE)
        model.eval()
        print(f"DINOv3 ViT-L/16 ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": MODEL_NAME, "object": "model", "type": "embed", "owned_by": "facebook"}]}

    def _infer(img_bytes):
        import torch
        from PIL import Image
        img = Image.open(io.BytesIO(img_bytes)).convert("RGB")
        inputs = processor(images=img, return_tensors="pt")
        inputs = {k: v.to(DEVICE) for k, v in inputs.items()}
        with torch.no_grad():
            out = model(**inputs)
        # CLS token embedding (last_hidden_state[:, 0, :])
        emb = out.last_hidden_state[:, 0, :].squeeze(0).cpu().tolist()
        return emb

    @app.post("/v1/vision/embed")
    @app.post("/v1/science/embed")
    async def visual_embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        b64 = request.get("image", "")
        if "," in b64:
            b64 = b64.split(",", 1)[1]
        if not b64:
            return JSONResponse({"error": "provide 'image' (base64)"}, 400)
        emb = await asyncio.get_event_loop().run_in_executor(None, _infer, base64.b64decode(b64))
        return {"model": MODEL_NAME, "task": "embed", "embedding": emb, "embeddings": emb, "dim": len(emb)}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: dinov3-vitl16
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    autoscaling.knative.dev/initial-scale: "0"
    serving.knative.dev/progress-deadline: "600s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 2
    scaleMetric: concurrency
    scaleTarget: 4
    timeout: 120
    volumes:
      - name: dinov3-vitl16
        persistentVolumeClaim:
          claimName: dinov3-vitl16
      - name: server-code
        configMap:
          name: dinov3-vitl16-server
    initContainers:
      - name: model-setup
        image: python:3.11-slim
        resources:
          requests: { cpu: "2", memory: "4Gi" }
          limits: { cpu: "4", memory: "8Gi" }
        volumeMounts:
          - { name: dinov3-vitl16, mountPath: /data }
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef: { name: hf-token, key: token }
          - name: HF_HOME
            value: /data/hf_cache
        command: ["bash", "-c"]
        args:
          - |
            set -e
            VENV=/data/venv
            if [ ! -f "$VENV/bin/python" ] || ! $VENV/bin/python -c "import transformers, torch, torchvision, fastapi" 2>/dev/null; then
              echo "Building venv..."
              python -m venv $VENV --clear
              $VENV/bin/pip install --quiet --upgrade pip
              $VENV/bin/pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
              $VENV/bin/pip install --quiet transformers Pillow fastapi uvicorn huggingface_hub
              echo "Venv ready"
            else
              echo "Venv OK"
            fi
            if [ ! -f /data/model/model.safetensors ]; then
              echo "Downloading facebook/dinov3-vitl16-pretrain-lvd1689m..."
              $VENV/bin/python -c "
            from huggingface_hub import snapshot_download; import os
            snapshot_download(repo_id='facebook/dinov3-vitl16-pretrain-lvd1689m', local_dir='/data/model', token=os.environ['HF_TOKEN'])
            print('Done', flush=True)
            "
            else
              echo "Weights already present"
            fi
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_NAME, value: "dinov3-vitl16" }
          - { name: MODEL_DIR, value: "/data/model" }
        resources:
          requests: { cpu: "2", memory: "4Gi" }
          limits: { cpu: "4", memory: "8Gi" }
        volumeMounts:
          - { name: dinov3-vitl16, mountPath: /data }
          - { name: server-code, mountPath: /app }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
