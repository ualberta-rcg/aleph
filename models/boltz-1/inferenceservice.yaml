# Boltz-1: Open-source biomolecular structure prediction (MIT)
# Predicts 3D structures of proteins, RNA, DNA, small molecules, glycans
# HF: boltz-community/boltz-1 (boltz1.ckpt 6.9GB + boltz1_conf.ckpt 3.6GB)
# Install: pip install boltz[cuda] — CLI tool, no Python API
# API: POST /v1/science/predict {"sequence": "MKTAYIAK...", "demo": true}
#      Returns: {"pdb_size": ..., "mean_plddt": ..., "confidence": {...}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boltz-1-server
  namespace: models
data:
  server.py: |
    import asyncio, json, os, subprocess, tempfile
    import uvicorn
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse

    app = FastAPI(title="Boltz-1 API")
    ready = False
    DEMO_SEQ = "MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQAPLAGKFLMQIQREQLDQIPQFP"

    @app.on_event("startup")
    async def startup():
        global ready
        if os.path.exists("/data/boltz_cache/boltz1.ckpt"):
            ready = True
            print("Boltz-1 ready (weights found).", flush=True)
        else:
            print("Warning: weights not found at /data/boltz_cache/boltz1.ckpt", flush=True)

    @app.get("/health")
    def health():
        return {"status": "ok" if ready else "loading", "model": "boltz-1"}

    @app.get("/v1/models")
    def models_list():
        return {"object": "list", "data": [{"id": "boltz-1", "object": "model",
            "description": "Boltz-1 biomolecular structure prediction (MIT license)"}]}

    @app.post("/v1/science/predict")
    async def predict(request: dict):
        if not ready:
            return JSONResponse({"error": "model loading or weights missing"}, 503)
        demo = request.get("demo", False)
        sequence = request.get("sequence", DEMO_SEQ if demo else None)
        if not sequence:
            return JSONResponse({"error": "sequence required (or set demo:true)"}, 400)
        entity_type = request.get("type", "protein")
        use_msa_server = request.get("use_msa_server", True)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _predict, sequence, entity_type, use_msa_server)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _predict(sequence, entity_type, use_msa_server):
        import yaml
        with tempfile.TemporaryDirectory() as tmpdir:
            # Write YAML input (preferred over deprecated FASTA)
            yaml_path = os.path.join(tmpdir, "input.yaml")
            input_data = {
                "version": 1,
                "sequences": [{entity_type: {"id": "A", "sequence": sequence}}]
            }
            with open(yaml_path, "w") as f:
                yaml.dump(input_data, f, default_flow_style=False)
            out_dir = os.path.join(tmpdir, "output")
            os.makedirs(out_dir, exist_ok=True)

            cmd = [
                "/data/venv/bin/boltz", "predict", yaml_path,
                "--out_dir", out_dir,
                "--cache", "/data/boltz_cache",
                "--checkpoint", "/data/boltz_cache/boltz1.ckpt",
                "--devices", "1",
                "--accelerator", "gpu",
                "--output_format", "pdb",
                "--recycling_steps", "3",
                "--sampling_steps", "200",
                "--no_kernels",
            ]
            if use_msa_server:
                cmd += ["--use_msa_server"]

            result = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
            if result.returncode != 0:
                raise RuntimeError(f"boltz failed: rc={result.returncode} stderr={result.stderr[-3000:]} stdout={result.stdout[-1000:]}")

            # Find output PDB
            pdb_files = []
            for root, dirs, files in os.walk(out_dir):
                for fn in files:
                    if fn.endswith(".pdb"):
                        pdb_files.append(os.path.join(root, fn))
            if not pdb_files:
                raise RuntimeError(f"No PDB output. stderr={result.stderr[-500:]}")

            pdb_content = open(pdb_files[0]).read()

            # Parse pLDDT from B-factor column
            plddt = []
            for line in pdb_content.split("\n"):
                if line.startswith("ATOM") or line.startswith("HETATM"):
                    try:
                        bfactor = float(line[60:66].strip())
                        plddt.append(bfactor)
                    except Exception:
                        pass

            confidence_files = [f for root, dirs, files in os.walk(out_dir)
                                 for f in files if 'confidence' in f.lower() and f.endswith('.json')]
            confidence = {}
            if confidence_files:
                try:
                    confidence = json.load(open(confidence_files[0]))
                except Exception:
                    pass

            return {
                "model": "boltz-1",
                "sequence": sequence[:100],
                "entity_type": entity_type,
                "pdb_size": len(pdb_content),
                "plddt_sample": plddt[:20],
                "mean_plddt": float(sum(plddt)/len(plddt)) if plddt else None,
                "num_atoms": len(plddt),
                "confidence": confidence,
            }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boltz-1-data
  namespace: models
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 25Gi
  storageClassName: nfs-client
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: boltz-1
  namespace: models
  annotations:
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.12-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.boltz1-ready-v3
            if [ -f "$SENTINEL" ]; then echo "Already set up."; exit 0; fi
            echo "Creating venv..."
            python3 -m venv /data/venv
            /data/venv/bin/pip install -q -U pip
            echo "Installing torch (CUDA) + boltz..."
            /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu126
            /data/venv/bin/pip install -q "boltz[cuda]" fastapi uvicorn pyyaml huggingface_hub
            echo "Downloading Boltz-1 weights (~10.5 GB)..."
            /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            import shutil, os
            path = snapshot_download('boltz-community/boltz-1')
            os.makedirs('/data/boltz_cache', exist_ok=True)
            for f in ['boltz1.ckpt', 'boltz1_conf.ckpt']:
                src = os.path.join(path, f)
                dst = f'/data/boltz_cache/{f}'
                if not os.path.exists(dst):
                    shutil.copy(src, dst)
                    print(f'Copied {f}')
                else:
                    print(f'{f} already exists')
            print('All weights downloaded.')
            "
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "4", memory: 16Gi }
          limits: { cpu: "8", memory: 32Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.12-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        resources:
          requests: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "20480" }
          limits: { cpu: "8", memory: 32Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "20480" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: server-config, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: boltz-1-data
      - name: server-config
        configMap:
          name: boltz-1-server
