apiVersion: v1
kind: ConfigMap
metadata:
  name: boltz-1-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "boltz-1",
      "type": "structure",
      "description_short": "Open-source biomolecular structure prediction (protein/RNA/DNA/ligand, MIT)",
      "description": "Boltz-1 from boltz-community is an open-source biomolecular structure prediction model (MIT). Predicts 3D structures of proteins, RNA, DNA, small molecules, and glycans. AlphaFold3-class capability. Weights ~10.5GB (boltz1.ckpt + boltz1_conf.ckpt). Uses MSA server by default. Supports recycling and sampling steps configuration.",
      "context_window": 2048,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "owned_by": "boltz-community",
      "source": "boltz-community/boltz-1",
      "source_url": "https://huggingface.co/boltz-community/boltz-1",
      "license": "MIT",
      "parameters": "~8B",
      "precision": "float32",
      "architecture": "Boltz-1 (diffusion-based structure prediction)",
      "framework": "boltz + torch",
      "deployment": {"image": "python:3.11-slim", "gpu": true, "min_replicas": 0, "max_replicas": 1, "cpu_request": "4", "memory_request": "16Gi", "pvc": "boltz-1-data", "pvc_size": "25Gi", "node_selector": "NVIDIA-L40S", "timeout": 600},
      "routing": {"kserve_custom": false, "path_prefix": "/v1/", "isvc_name": "boltz-1", "api_name": "boltz-1"},
      "compatibility": {"openai_embeddings": false, "input_fields": ["sequence", "type", "demo", "use_msa_server"]},
      "domain": "proteomics",
      "subdomain": "structure-prediction",
      "tags": ["structure", "science", "proteomics", "protein", "rna", "dna", "drug-discovery", "gpu"],
      "content_types": ["text"],
      "languages": ["protein"],
      "input_map": {"sequence": "amino acid or nucleotide sequence", "type": "protein|rna|dna", "demo": "bool", "use_msa_server": "bool (default true)"},
      "output_map": {"model": "boltz-1", "pdb": "PDB format string", "plddt": "[float]", "mean_plddt": "float", "confidence": "dict"},
      "tier": 1
    }
