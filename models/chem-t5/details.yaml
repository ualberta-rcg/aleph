apiVersion: v1
kind: ConfigMap
metadata:
  name: chem-t5-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chem-t5",
      "status": "production",
      "status_note": "Verified 2026-06-05: correct GT4SD prompt templates; caption+forward_synthesis work.",
      "type": "science-generate",
      "endpoints": {
        "primary": "/v1/science/generate",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "chem-t5",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {
        "task": "forward_synthesis"
      },
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Chem-T5 — multitask text+chemistry T5 (IBM GT4SD)",
        "description": "Chem-T5 (GT4SD/multitask-text-and-chemistry-t5-base-standard): multitask text and chemistry T5. Tasks via /v1/science/generate: forward_synthesis, retrosynthesis, molecular captioning, text-to-molecule generation, paragraph_to_actions. CPU.",
        "owned_by": "IBM GT4SD",
        "source": "GT4SD/multitask-text-and-chemistry-t5-base-standard",
        "source_url": "https://huggingface.co/GT4SD/multitask-text-and-chemistry-t5-base-standard",
        "license": "MIT",
        "parameters": "220M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "chemistry",
        "subdomain": "reaction-prediction",
        "tags": [
          "science",
          "chemistry",
          "reaction",
          "retrosynthesis",
          "t5",
          "cpu"
        ],
        "gpu": false,
        "max_input_tokens": 512,
        "input_format": {
          "model": "chem-t5",
          "task": "forward_synthesis|retrosynthesis|caption|generate|paragraph_to_actions",
          "input": "SMILES or text (task-dependent)"
        },
        "output_format": {
          "task": "str",
          "output": "generated SMILES or text"
        }
      }
    }
