apiVersion: v1
kind: ConfigMap
metadata:
  name: depth-anything-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "depth-anything-v2",
      "status": "production",
      "type": "depth",
      "endpoints": {
        "primary": "/v1/vision/depth",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "depth-anything",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "30-60 seconds"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (depth-anything-v2)"},
        "task": {"type": "string", "description": "Always \"depth\""},
        "width": {"type": "integer", "description": "Original image width in pixels"},
        "height": {"type": "integer", "description": "Original image height in pixels"},
        "depth_png_base64": {"type": "string", "description": "Base64-encoded grayscale PNG depth map at original resolution (0=far, 255=near)"},
        "depth_grid_64": {"type": "array", "description": "64x64 downsampled normalized depth grid (float 0-1) for programmatic use"},
        "stats": {
          "type": "object",
          "description": "Raw depth statistics",
          "properties": {
            "raw_min": "float — minimum raw depth value",
            "raw_max": "float — maximum raw depth value",
            "raw_mean": "float — mean raw depth value"
          }
        }
      },
      "catalog": {
        "description_short": "Depth Anything V2 Small — monocular depth estimation (24.8M params, ONNX, CPU)",
        "description": "Depth Anything V2 Small by TikTok/ByteDance (24.8M params, DPT + ViT-S/14). Monocular relative depth estimation from a single RGB image. Resizes input to 518x518, produces normalized depth map at original resolution. Returns depth as base64 PNG + 64x64 grid + raw stats. ONNX Runtime on CPU.",
        "owned_by": "depth-anything",
        "source": "onnx-community/depth-anything-v2-small",
        "source_url": "https://huggingface.co/onnx-community/depth-anything-v2-small",
        "license": "Apache-2.0",
        "parameters": "24.8M",
        "precision": "fp32",
        "framework": "onnxruntime",
        "domain": "computer-vision",
        "subdomain": "depth-estimation",
        "tags": ["vision", "depth", "monocular", "onnx", "cpu"]
      }
    }
