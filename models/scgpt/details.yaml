apiVersion: v1
kind: ConfigMap
metadata:
  name: scgpt-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "scgpt",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/embeddings"],
        "health": "/health"
      },
      "routing": { "k8s_name": "scgpt", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 512, "max_input_tokens": 512 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "catalog": {
        "description_short": "scGPT (bowang-lab) — 512-dim cell embeddings from single-cell gene expression.",
        "description": "scGPT (bowang-lab/scGPT) is a foundation model for single-cell gene-expression data, trained on 33M cells. Takes gene names + expression values per cell (tokenized via GeneVocab; unknown genes → <pad>) and returns a 512-dim cell embedding (mean-pooled). For cell-type classification, perturbation prediction, batch integration. Non-text domain model: gene-expression input; primary is /v1/science/embed (also OpenAI-style /v1/embeddings with `input` wrapping a cell dict). Response is OpenAI-format `data[].embedding`.",
        "owned_by": "bowang-lab",
        "source": "tdc/scGPT",
        "source_url": "https://huggingface.co/tdc/scGPT",
        "license": "Apache-2.0",
        "parameters": "~51M",
        "precision": "fp32",
        "framework": "scgpt (TransformerModel) + PyTorch",
        "domain": "transcriptomics",
        "subdomain": "single-cell",
        "tags": ["embedding", "science", "transcriptomics", "single-cell", "gene", "foundation", "gpu"],
        "gpu": true,
        "max_input_tokens": 512,
        "input_format": {
          "model": "scgpt",
          "input": "{\"genes\":[\"TP53\",...], \"values\":[1.2,...]} (a cell dict) or a list of cell dicts"
        },
        "embedding_dimensions": 512,
        "pooling": "mean-pool over token embeddings"
      }
    }
