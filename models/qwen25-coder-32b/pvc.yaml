# Qwen2.5-Coder-32B coding specialist: code gen, completion, repair.
# Weights (~65 GB) persist on NFS (nfs-client) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen25-coder-32b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
