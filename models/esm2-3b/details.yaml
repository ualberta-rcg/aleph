apiVersion: v1
kind: ConfigMap
metadata:
  name: esm2-3b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esm2-3b",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "esm2-3b",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 1022, "max_input_tokens": 1022 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 minutes (3B model load from PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Protein sequence(s) as 1-letter amino-acid codes; truncated to 1022 residues."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 2560]" }, "description": "2560-dim mean-pooled per-protein embeddings" },
        "model": { "type": "string", "description": "Model name (esm2-3b)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (residue counts)" }
      },
      "catalog": {
        "description_short": "Meta ESM-2 3B — largest ESM-2, 2560-dim protein embeddings (GPU, scale-to-zero)",
        "description": "ESM-2 3B (facebook/esm2_t36_3B_UR50D): the largest ESM-2 protein language model (3B params, 36 layers), trained on UniRef50. State-of-the-art per-protein embeddings for structure/function/variant prediction. Produces 2560-dim mean-pooled embeddings, max 1022 residues. Served via a custom transformers FastAPI server on a HAMi GPU slice (20 GiB, fp16, expandable_segments). Slow cold start (~3-6 min). Scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "Meta AI (FAIR)",
        "source": "facebook/esm2_t36_3B_UR50D",
        "source_url": "https://huggingface.co/facebook/esm2_t36_3B_UR50D",
        "license": "MIT",
        "parameters": "3B",
        "precision": "fp16 (GPU)",
        "framework": "transformers EsmModel (custom FastAPI server)",
        "domain": "proteomics",
        "subdomain": "protein-language-model",
        "gpu": true,
        "embedding_dimensions": 2560,
        "pooling": "mean",
        "max_input_tokens": 1022,
        "tags": ["embedding", "science", "proteomics", "protein", "large", "gpu"]
      }
    }
