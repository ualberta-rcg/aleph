# Phi-4 Reasoning: 14B reasoning model (microsoft/Phi-4-reasoning)
# Persisted helper venv + weights on a RWX PVC (gemma-4 pattern) so cold starts
# skip the reinstall/redownload; 1x whole L40S GPU via vLLM.
# API: POST /v1/chat/completions (OpenAI-style)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi-4-reasoning
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "Phi-4 Reasoning weights already on PVC, skipping download."
            else
                echo "Downloading microsoft/Phi-4-reasoning ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="microsoft/Phi-4-reasoning",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: phi-4-reasoning
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=phi-4-reasoning
          - --port=8080
          - --max-model-len=32768
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
          # --enable-reasoning removed in vLLM v0.20.2 (reasoning is implied by
          # --reasoning-parser); keeping it causes "unrecognized arguments".
          - --reasoning-parser=deepseek_r1
          - --reasoning-config
          - '{"reasoning_start_str": "<think>", "reasoning_end_str": "</think>"}'
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: phi-4-reasoning
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: phi-4-reasoning
        persistentVolumeClaim:
          claimName: phi-4-reasoning
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
