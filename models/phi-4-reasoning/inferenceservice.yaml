# Phi-4 Reasoning: 14B reasoning model (microsoft/Phi-4-reasoning)
# Dedicated PVC with init container download; 1x full L40S GPU via vLLM.
# API: POST /v1/chat/completions (OpenAI-style)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi-4-reasoning
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 150
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: hf-fetch
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            pip install -q huggingface_hub
            python3 -u <<'PY'
            import os
            from pathlib import Path
            if Path("/data/config.json").is_file():
                print("Phi-4 Reasoning weights already on PVC, skipping.", flush=True)
            else:
                from huggingface_hub import snapshot_download
                print("Downloading microsoft/Phi-4-reasoning ...", flush=True)
                snapshot_download(
                    repo_id="microsoft/Phi-4-reasoning",
                    local_dir="/data",
                    local_dir_use_symlinks=False,
                    token=os.environ.get("HF_TOKEN"),
                )
                print("Download finished.", flush=True)
            PY
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: phi4-data
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.8.4
        args:
          - --model=/data
          - --served-model-name=phi-4-reasoning
          - --port=8080
          - --max-model-len=32768
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
          - --enable-reasoning
          - --reasoning-parser=deepseek_r1
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "40960"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "40960"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: phi4-data
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: phi4-data
        persistentVolumeClaim:
          claimName: phi-4-reasoning-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
