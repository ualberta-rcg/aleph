apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-reasoning-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "phi-4-reasoning",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "phi-4-reasoning",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 16000, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-5 minutes (14B BF16 load; progress-deadline 2400s)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "budget",
          "budget_support": true,
          "answer_reserve": 512,
          "default_effort": "medium",
          "disabled_effort": "none",
          "off_max_tokens": 2048,
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "low", "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "xhigh", "max": "max"
          },
          "effort_map": {
            "none":  { "thinking_token_budget": 0 },
            "low":   { "thinking_token_budget": 1024 },
            "medium":{ "thinking_token_budget": 4096 },
            "high":  { "thinking_token_budget": 12288 },
            "xhigh": { "thinking_token_budget": 24576 },
            "max":   { "thinking_token_budget": null }
          },
          "note": "Managed thinking (budget mode). ON (medium/high) exposes the `reasoning` field. QUIRKS: phi-4 always emits a CoT trace, so requests need adequate max_tokens (>=~4000) or reasoning eats the whole budget and content comes back empty; the OFF path (budget 0) is unreliable on the vLLM V1 engine (redacted_thinking not always extracted -> empty content, vllm#18141). Give generous max_tokens."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 0.8,
          "top_p": 0.95,
          "max_tokens": 8192,
          "thinking": { "enabled": true, "effort": "medium" }
        },
        "meta_tasks": {
          "title":     { "max_tokens": 80,  "thinking": { "effort": "none" } },
          "tags":      { "max_tokens": 60,  "thinking": { "effort": "none" } },
          "followups": { "max_tokens": 220, "thinking": { "effort": "none" } }
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Microsoft Phi-4 Reasoning 14B, chain-of-thought math/science/code",
        "description": "Microsoft Phi-4-reasoning 14B dense decoder-only Transformer (SFT + RL on chain-of-thought). Native output: Thought inside redacted_thinking tags, then Solution. Verified PASS on cluster 230 (OpenAI + Anthropic) with adequate max_tokens. vLLM v0.20.2 --reasoning-parser=deepseek_r1; whole single L40S (no HAMi gpumem).",
        "owned_by": "microsoft",
        "source": "microsoft/Phi-4-reasoning",
        "source_url": "https://huggingface.co/microsoft/Phi-4-reasoning",
        "license": "MIT",
        "parameters": "14B",
        "precision": "bfloat16",
        "framework": "vllm",
        "container_image": "vllm/vllm-openai:v0.20.2",
        "gpu": "1x whole L40S (nvidia.com/gpu=1, no gpumem)",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "math", "science", "code"],
        "languages": ["english"],
        "verified": "PASS 2026-06-06",
        "known_quirks": [
          "max_tokens is one shared budget for Thought+Solution; small budgets exhaust on CoT before Solution appears",
          "vLLM deepseek_r1 parser splits on redacted_thinking tags; V1 engine may omit them (vllm#18141) leaving content empty",
          "Gateway maps effort/budget_tokens to thinking_token_budget (0=skip CoT); requires vLLM reasoning-config on ISVC",
          "HF recommends sampling (temp 0.8, top_k 50, top_p 0.95) and max_new_tokens up to 32768 for hard problems"
        ]
      }
    }
