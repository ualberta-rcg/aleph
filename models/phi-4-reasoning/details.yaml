apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-reasoning-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "phi-4-reasoning",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "phi-4-reasoning",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 16000, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-5 minutes (14B BF16 load; progress-deadline 2400s)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": true
      },
      "param_translation": {
        "thinking": {
          "mode": "always_on",
          "budget_support": false,
          "note": "Phi-4 always reasons; per-request disable not supported on vLLM"
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 0.8,
          "top_p": 0.95,
          "max_tokens": 4096,
          "thinking": { "enabled": true, "mode": "always_on" }
        },
        "meta_tasks": {
          "title":     { "max_tokens": 80,  "thinking": { "enabled": false } },
          "tags":      { "max_tokens": 60,  "thinking": { "enabled": false } },
          "followups": { "max_tokens": 220, "thinking": { "enabled": false } }
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Microsoft Phi-4 Reasoning 14B, chain-of-thought math/science/code",
        "description": "Microsoft Phi-4-reasoning 14B dense decoder-only Transformer (SFT + RL on chain-of-thought). Native output is Thought then Solution blocks. Verified PASS on cluster 230 (OpenAI + Anthropic). vLLM v0.20.2 with --reasoning-parser=deepseek_r1; whole single L40S (no HAMi gpumem). Gateway promotes reasoning fields to content when the parser leaves content empty, then strips thinking per card.",
        "owned_by": "microsoft",
        "source": "microsoft/Phi-4-reasoning",
        "source_url": "https://huggingface.co/microsoft/Phi-4-reasoning",
        "license": "MIT",
        "parameters": "14B",
        "precision": "bfloat16",
        "framework": "vllm",
        "container_image": "vllm/vllm-openai:v0.20.2",
        "gpu": "1x whole L40S (nvidia.com/gpu=1, no gpumem)",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "math", "science", "code"],
        "languages": ["english"],
        "verified": "PASS 2026-06-06",
        "known_quirks": [
          "deepseek_r1 parser does not fully split Phi-4 Thought/Solution; answer may arrive in reasoning fields",
          "use max_tokens>=4096 for multi-step reasoning; small budgets can exhaust on chain-of-thought",
          "HF recommends sampling (temp 0.8, top_k 50, top_p 0.95); greedy decoding discouraged"
        ]
      }
    }
