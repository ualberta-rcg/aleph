apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-reasoning-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "phi-4-reasoning",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "phi-4-reasoning",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 16000, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "budget",
          "default_effort": "low",
          "disabled_effort": "none",
          "answer_reserve": 512,
          "off_max_tokens": 4096,
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "low", "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "xhigh", "max": "max"
          },
          "effort_map": {
            "none":  { "thinking_token_budget": 512 },
            "low":   { "thinking_token_budget": 1024 },
            "medium":{ "thinking_token_budget": 4096 },
            "high":  { "thinking_token_budget": 12288 },
            "xhigh": { "thinking_token_budget": 24576 },
            "max":   { "thinking_token_budget": null }
          },
          "note": "Managed thinking (budget mode). Phi always emits Thought then Solution. Client reasoning_effort is translated to thinking_token_budget and forwarded to vLLM (that is the CoT cap). max_tokens is the OpenAI total-generation ceiling (Thought+Solution), not effort. If the client max_tokens is smaller than budget+answer_reserve, the gateway raises it so the answer can still fit. OFF (none) -> budget 512 (never 0; vLLM#18141) + strip. Never send thinking_token_budget 0."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 0.8,
          "top_p": 0.95,
          "top_k": 50,
          "max_tokens": 2048,
          "thinking": { "enabled": true, "effort": "low" }
        },
        "meta_tasks": {
          "title":     { "max_tokens": 1500,  "thinking": { "effort": "none" } },
          "tags":      { "max_tokens": 1500,  "thinking": { "effort": "none" } },
          "followups": { "max_tokens": 3000, "thinking": { "effort": "none" } }
        }
      },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages (system/user/assistant)" },
        "max_tokens": { "type": "integer", "required": false, "default": 2048, "max": 16000, "description": "OpenAI total-generation ceiling (Thought + Solution). Not the thinking effort. vLLM thinking_token_budget caps CoT separately." },
        "temperature": { "type": "float", "required": false, "default": 0.8, "min": 0.0, "max": 2.0, "description": "Sampling temperature (HF recommends 0.8)" },
        "top_p": { "type": "float", "required": false, "default": 0.95, "description": "Nucleus sampling threshold (HF recommends 0.95)" },
        "top_k": { "type": "integer", "required": false, "default": 50, "description": "Top-k sampling (HF recommends 50)" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty (0-2)" },
        "reasoning_effort": { "type": "string", "required": false, "enum": ["none","low","medium","high","xhigh","max"], "default": "low", "description": "Translated to vLLM thinking_token_budget via effort_map; not sent upstream as reasoning_effort. none=budget 512 + strip (never 0; vLLM#18141)." },
        "thinking_token_budget": { "type": "integer", "required": false, "description": "Direct CoT cap. Forwarded to vLLM as thinking_token_budget. Independent of max_tokens." }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (includes the `reasoning` field when thinking is ON)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "custom_params": { "passthrough": true },
      "catalog": {
        "description_short": "Microsoft Phi-4 Reasoning 14B, chain-of-thought math/science/code",
        "description": "Microsoft Phi-4-reasoning 14B dense decoder-only Transformer (SFT + RL on chain-of-thought). Native output: Thought then Solution. Always-up on 1 whole L40S (min 1 / max 2). vLLM v0.20.2 --reasoning-parser=deepseek_r1 + thinking_token_budget; default effort low.",
        "owned_by": "microsoft",
        "source": "microsoft/Phi-4-reasoning",
        "source_url": "https://huggingface.co/microsoft/Phi-4-reasoning",
        "license": "MIT",
        "parameters": "14B",
        "precision": "bfloat16",
        "framework": "vllm",
        "container_image": "vllm/vllm-openai:v0.20.2",
        "gpu": "1x whole L40S (nvidia.com/gpu=1, no gpumem)",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "math", "science", "code"],
        "languages": ["english"],
        "verified": "PASS 2026-08-19",
        "known_quirks": [
          "Phi always thinks by training; there is no enable_thinking=false. OFF is reduce (budget 512) + strip, not skip CoT",
          "vLLM v0.20.2 honors thinking_token_budget when --reasoning-parser + --reasoning-config are set; never send budget 0 (vllm#18141)",
          "vLLM deepseek_r1 parser splits on <think> tags; missing close tags can leave content empty",
          "HF sampling: temp 0.8, top_k 50, top_p 0.95; hard problems want a large max_tokens / effort max"
        ]
      }
    }
