apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-reasoning-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "phi-4-reasoning",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "phi-4-reasoning",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 16000, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "budget",
          "default_effort": "medium",
          "disabled_effort": "none",
          "answer_reserve": 512,
          "off_max_tokens": 4096,
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "low", "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "xhigh", "max": "max"
          },
          "effort_map": {
            "none":  { "thinking_token_budget": 512 },
            "low":   { "thinking_token_budget": 1024 },
            "medium":{ "thinking_token_budget": 4096 },
            "high":  { "thinking_token_budget": 12288 },
            "xhigh": { "thinking_token_budget": 24576 },
            "max":   { "thinking_token_budget": null }
          },
          "note": "Managed thinking (budget mode). phi-4 always reasons. ON (medium/high) exposes `reasoning` (budget controls depth). OFF (reasoning_effort none) -> budget 512 (REDUCE — not 0; budget 0 is mishandled per vLLM#18141, burns tokens/empty content) + strip the reasoning + cap max_tokens. Requests still need adequate max_tokens or reasoning eats the budget."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 0.8,
          "top_p": 0.95,
          "max_tokens": 8192,
          "thinking": { "enabled": true, "effort": "medium" }
        },
        "meta_tasks": {
          "title":     { "max_tokens": 1500,  "thinking": { "effort": "none" } },
          "tags":      { "max_tokens": 1500,  "thinking": { "effort": "none" } },
          "followups": { "max_tokens": 3000, "thinking": { "effort": "none" } }
        }
      },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages (system/user/assistant)" },
        "max_tokens": { "type": "integer", "required": false, "default": 8192, "max": 16000, "description": "Shared budget for Thought+Solution; give adequate room or CoT exhausts it" },
        "temperature": { "type": "float", "required": false, "default": 0.8, "min": 0.0, "max": 2.0, "description": "Sampling temperature (HF recommends 0.8)" },
        "top_p": { "type": "float", "required": false, "default": 0.95, "description": "Nucleus sampling threshold (HF recommends 0.95)" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty (0-2)" },
        "reasoning_effort": { "type": "string", "required": false, "enum": ["none","low","medium","high","xhigh","max"], "default": "medium", "description": "Thinking effort; mapped to thinking_token_budget via effort_map. none=reduce(budget 512)+strip+cap (vLLM#18141: budget 0 mishandled)." },
        "thinking_token_budget": { "type": "integer", "required": false, "description": "Direct cap on reasoning tokens (fakes a budget). Consumed by the gateway, not forwarded upstream." }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (includes the `reasoning` field when thinking is ON)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "custom_params": { "passthrough": true },
      "catalog": {
        "description_short": "Microsoft Phi-4 Reasoning 14B, chain-of-thought math/science/code",
        "description": "Microsoft Phi-4-reasoning 14B dense decoder-only Transformer (SFT + RL on chain-of-thought). Native output: Thought inside redacted_thinking tags, then Solution. Verified PASS on cluster 230 (OpenAI + Anthropic) with adequate max_tokens. vLLM v0.20.2 --reasoning-parser=deepseek_r1; whole single L40S (no HAMi gpumem).",
        "owned_by": "microsoft",
        "source": "microsoft/Phi-4-reasoning",
        "source_url": "https://huggingface.co/microsoft/Phi-4-reasoning",
        "license": "MIT",
        "parameters": "14B",
        "precision": "bfloat16",
        "framework": "vllm",
        "container_image": "vllm/vllm-openai:v0.20.2",
        "gpu": "1x whole L40S (nvidia.com/gpu=1, no gpumem)",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "math", "science", "code"],
        "languages": ["english"],
        "verified": "PASS 2026-06-06",
        "known_quirks": [
          "max_tokens is one shared budget for Thought+Solution; small budgets exhaust on CoT before Solution appears",
          "vLLM deepseek_r1 parser splits on redacted_thinking tags; V1 engine may omit them (vllm#18141) leaving content empty",
          "Gateway maps effort/budget_tokens to thinking_token_budget (0=skip CoT); requires vLLM reasoning-config on ISVC",
          "HF recommends sampling (temp 0.8, top_k 50, top_p 0.95) and max_new_tokens up to 32768 for hard problems"
        ]
      }
    }
