apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-1-dev-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "flux-1-dev",
      "status": "production",
      "type": "image",
      "endpoints": {
        "primary": "/v1/images/generations",
        "edit": "/v1/images/edits",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "flux-1-dev",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "prompt": {"type": "string", "required": true, "description": "Text prompt for image generation"},
        "n": {"type": "integer", "required": false, "default": 1, "description": "Number of images (max 4)"},
        "size": {"type": "string", "required": false, "default": "1024x1024", "description": "WxH, e.g. 1024x1024"},
        "num_inference_steps": {"type": "integer", "required": false, "default": 50, "description": "Denoising steps (FLUX.1-dev default 50)"},
        "guidance_scale": {"type": "float", "required": false, "default": 3.5, "description": "Distilled guidance scale (FLUX.1-dev default 3.5)"},
        "max_sequence_length": {"type": "integer", "required": false, "default": 512, "description": "Max prompt token length (<=512)"},
        "negative_prompt": {"type": "string", "required": false, "description": "Only applied when true_cfg_scale > 1 (FLUX.1-dev is guidance-distilled)"},
        "true_cfg_scale": {"type": "float", "required": false, "default": 1.0, "description": "Enable real CFG (>1) to honor negative_prompt; slower"},
        "seed": {"type": "integer", "required": false, "description": "Deterministic seed"},
        "image": {"type": "string", "required": false, "description": "img2img only (POST /v1/images/edits): source image as base64"},
        "strength": {"type": "float", "required": false, "default": 0.6, "description": "img2img only: how much to transform the source image (0-1)"}
      },
      "output_map": {
        "created": {"type": "integer", "description": "Unix timestamp"},
        "data": {"type": "array", "description": "List of {b64_json: base64-encoded PNG image}"}
      },
      "catalog": {
        "description_short": "Black Forest Labs FLUX.1-dev 12B rectified-flow text-to-image (GPU)",
        "description": "FLUX.1-dev (black-forest-labs/FLUX.1-dev) is a 12B rectified-flow transformer text-to-image model by Black Forest Labs, with state-of-the-art open-weight output quality and strong prompt following (guidance-distilled). Text encoders: T5-XXL + CLIP-L; VAE decoder. Served as a standard KServe InferenceService custom predictor (FastAPI + diffusers, bf16) on a whole L40S, with Knative scale-to-zero (0->3 on demand, releases the GPU ~15m after idle). OpenAI-compatible /v1/images/generations (img2img via /v1/images/edits). NON-COMMERCIAL license.",
        "owned_by": "black-forest-labs",
        "source": "black-forest-labs/FLUX.1-dev",
        "source_url": "https://huggingface.co/black-forest-labs/FLUX.1-dev",
        "license": "FLUX.1-dev Non-Commercial License",
        "parameters": "12B (rectified-flow transformer; + T5-XXL & CLIP-L text encoders, VAE)",
        "precision": "bf16",
        "framework": "diffusers",
        "domain": "image-generation",
        "subdomain": "text-to-image",
        "tags": ["image-generation", "text-to-image", "img2img", "gpu", "diffusion", "flux", "kserve", "non-commercial"]
      }
    }
