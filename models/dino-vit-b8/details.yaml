apiVersion: v1
kind: ConfigMap
metadata:
  name: dino-vit-b8-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "dino-vit-b8",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/vision/embed",
        "secondary": ["/v1/science/embed"],
        "health": "/health"
      },
      "routing": { "k8s_name": "dino-vit-b8", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "~30s (ONNX, CPU)" },
      "behavior": { "supports_vision": true, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (dino-vit-b8)"},
        "task": {"type": "string", "description": "Always \"embed\""},
        "embedding": {"type": "array", "description": "768-dim float embedding vector (CLS token)"},
        "dim": {"type": "integer", "description": "Embedding dimension (768)"}
      },
      "catalog": {
        "description_short": "DINO ViT-B/8 (Meta) — self-supervised 768-dim visual embeddings via ONNX.",
        "description": "DINO ViT-Base/8 (Meta AI, 86M) — self-supervised Vision Transformer trained with no labels via self-distillation. Patch size 8 (fine-grained); produces a 768-dim embedding of an image (resized to 224x224, ImageNet-normalized). Served via ONNX Runtime on CPU. Excellent for image similarity, clustering, zero-shot retrieval, copy detection. Non-text domain model: base64 image input, does NOT expose OpenAI /v1/embeddings; primary is /v1/vision/embed (/v1/science/embed kept as a backward-compatible alias).",
        "owned_by": "facebook",
        "source": "onnx-community/vit_base_patch8_224.dino-ONNX",
        "source_url": "https://huggingface.co/onnx-community/vit_base_patch8_224.dino-ONNX",
        "license": "Apache-2.0",
        "parameters": "86M",
        "precision": "onnx-fp32",
        "framework": "onnxruntime (CPUExecutionProvider)",
        "domain": "computer-vision",
        "subdomain": "visual-embeddings",
        "tags": ["embedding", "vision", "self-supervised", "dino", "onnx", "cpu"],
        "gpu": false,
        "max_input_tokens": 0,
        "input_format": {
          "model": "dino-vit-b8",
          "image": "base64-encoded JPEG/PNG (data-url prefix optional); resized to 224x224, ImageNet-normalized"
        },
        "embedding_dimensions": 768,
        "pooling": "cls token (ViT-B/8)"
      }
    }
