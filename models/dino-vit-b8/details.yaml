apiVersion: v1
kind: ConfigMap
metadata:
  name: dino-vit-b8-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "dino-vit-b8",
      "type": "embed",
      "description_short": "DINO ViT-B/8 — self-supervised visual embeddings (768-dim)",
      "description": "DINO ViT-Base/8 by Meta AI. 86M params. Self-supervised Vision Transformer trained with no labels using distillation. Produces 768-dimensional embeddings at patch size 8 (fine-grained). Excellent for image similarity, clustering, zero-shot retrieval, and copy detection. ONNX model from HuggingFace ONNX community.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/vision/embed",
        "health": "/health"
      },
      "owned_by": "facebook",
      "source": "onnx-community/vit_base_patch8_224.dino-ONNX",
      "source_url": "https://huggingface.co/onnx-community/vit_base_patch8_224.dino-ONNX",
      "license": "Apache-2.0",
      "parameters": "86M",
      "parameter_count": 86000000,
      "precision": "onnx-fp32",
      "architecture": "transformer",
      "framework": "onnxruntime",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 20,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "k8s_name": "dino-vit-b8",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": true,
        "reasoning_model": false
      },
      "domain": "computer-vision",
      "subdomain": "visual-embeddings",
      "tags": ["vision", "embed", "self-supervised", "dino", "onnx", "cpu"],
      "content_types": ["image"],
      "tier": "production",
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "media_types": ["image/jpeg", "image/png"],
          "max_size_bytes": 10485760,
          "description": "Base64-encoded JPEG or PNG image"
        }
      },
      "output_map": {
        "model": "string",
        "task": "string",
        "embedding": "[float x 768]",
        "dim": "int (768)"
      },
      "server_config": {
        "inference_backend": "onnxruntime",
        "onnx_opset": 17,
        "input_size": 224,
        "execution_provider": "CPUExecutionProvider",
        "intra_op_num_threads": 4,
        "normalization": "ImageNet mean/std"
      }
    }
