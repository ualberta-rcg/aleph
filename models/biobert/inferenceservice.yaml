# BioBERT: Biomedical NER and text model from DMIS Lab
# GPU (~1GB VRAM), scale-to-zero. HF: dmis-lab/biobert-base-cased-v1.1
# 124k downloads, Apache 2.0
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biobert-server
  namespace: models
data:
  server.py: |
    import os, asyncio, torch
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")
    app = FastAPI()
    model = None
    tokenizer = None
    DEVICE = "cpu"

    def load():
        global model, tokenizer, DEVICE
        from transformers import BertTokenizer, BertModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading BioBERT on {DEVICE}...", flush=True)
        tokenizer = BertTokenizer.from_pretrained(MODEL_DIR, local_files_only=True)
        model = BertModel.from_pretrained(MODEL_DIR, local_files_only=True, ignore_mismatched_sizes=True,
            torch_dtype=torch.float16 if DEVICE == "cuda" else torch.float32)
        model = model.to(DEVICE).eval()
        print(f"BioBERT ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "biobert"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "biobert", "object": "model", "created": 1700000000,
             "owned_by": "dmis-lab", "type": "embedding",
             "description": "BioBERT biomedical NER/text model"}
        ]}

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        
        texts = request.get("input") or request.get("texts")
        if isinstance(texts, str):
            texts = [texts]
        if not texts:
            return JSONResponse({"error": "'input' required"}, 400)

        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, texts)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(texts):
        enc = tokenizer(texts, return_tensors="pt", padding=True, truncation=True, max_length=512)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc)
        mask = enc["attention_mask"].unsqueeze(-1).float()
        emb = (out.last_hidden_state * mask).sum(1) / mask.sum(1)
        emb = emb.cpu().float().numpy()
        data = [{"object": "embedding", "index": i, "embedding": e.tolist()} for i, e in enumerate(emb)]
        return {"object": "list", "data": data, "model": "biobert", "usage": {"prompt_tokens": len(texts), "total_tokens": len(texts)}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: biobert
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_HOME
            value: "/data/hf_cache"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              python3 -m venv /data/venv && /data/venv/bin/pip install -U pip
            fi
            /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu121
            /data/venv/bin/pip install -q transformers==4.46.3 sentencepiece fastapi uvicorn
            if [ ! -f /data/model/config.json ]; then
              /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            snapshot_download('dmis-lab/biobert-base-cased-v1.1', local_dir='/data/model')
            "
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: "/data/model" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "3072" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: biobert-data }
      - name: app
        configMap: { name: biobert-server }
