apiVersion: v1
kind: ConfigMap
metadata:
  name: biobert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biobert",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "biobert",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text string or list of strings (max 512 tokens)"
        }
      },
      "output_map": {
        "object": {
          "type": "string",
          "description": "Object type (list)"
        },
        "data": {
          "type": "array",
          "items": {
            "object": "string",
            "index": "int",
            "embedding": "[float x 768]"
          },
          "description": "Embedding results (768-dim, mean-pooled)"
        },
        "model": {
          "type": "string",
          "description": "Model name"
        },
        "usage": {
          "type": "object",
          "description": "Token usage stats"
        }
      },
      "catalog": {
        "description_short": "BioBERT base v1.1 — 768-dim biomedical text embeddings (GPU, always-on)",
        "description": "BioBERT base (v1.1), BERT pre-trained on PubMed abstracts + PMC full text. Produces 768-dim biomedical text embeddings for NER, relation extraction and search. Served on a HAMi sub-GPU slice.",
        "owned_by": "DMIS Lab",
        "source": "dmis-lab/biobert-base-cased-v1.1",
        "source_url": "https://huggingface.co/dmis-lab/biobert-base-cased-v1.1",
        "license": "Apache-2.0",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "biomedical",
        "subdomain": "biomedical-nlp",
        "tags": [
          "embedding",
          "science",
          "biomedical",
          "nlp",
          "bert",
          "gpu"
        ],
        "gpu": true,
        "max_input_tokens": 512,
        "input_format": {
          "model": "biobert",
          "input": "biomedical text str or [str]"
        },
        "embedding_dimensions": 768,
        "pooling": "mean"
      }
    }
