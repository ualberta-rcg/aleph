apiVersion: v1
kind: ConfigMap
metadata:
  name: ernierna-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ernierna",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": { "k8s_name": "ernierna", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 1024, "max_input_tokens": 1024 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "10m", "cold_start_estimate": "<1 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {}, "custom_params": { "passthrough": true }, "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "RNA sequence(s) (AUGC); truncated to 1024 tokens." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled structure-aware RNA embeddings" },
        "model": { "type": "string", "description": "Model name (ernierna)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (sequence lengths)" }
      },
      "catalog": {
        "description_short": "ERNIE-RNA — structure-aware RNA embeddings (GPU, scale-to-zero)",
        "description": "ERNIE-RNA (multimolecule/ernierna, ~86M params): a structure-aware RNA foundation model pre-trained on RNAcentral with structure-aware objectives; outperforms RNA-FM on structure-prediction tasks. Produces 768-dim mean-pooled RNA embeddings. Max 1024 tokens. Served via a custom FastAPI server (multimolecule ErnieRnaModel) on a HAMi GPU slice (10 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "multimolecule",
        "source": "multimolecule/ernierna",
        "source_url": "https://huggingface.co/multimolecule/ernierna",
        "license": "AGPL-3.0",
        "parameters": "86M",
        "precision": "fp32",
        "framework": "multimolecule ErnieRnaModel (custom FastAPI server)",
        "domain": "genomics", "subdomain": "rna-embeddings",
        "gpu": true, "embedding_dimensions": 768, "pooling": "mean", "max_input_tokens": 1024,
        "tags": ["embedding", "science", "genomics", "rna", "structure-aware"]
      }
    }
