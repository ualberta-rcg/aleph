apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyllama-1-1b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "tinyllama-1-1b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "tinyllama-1-1b",
        "serialize": true,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 4096,
        "max_completion_tokens": 1800
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "~30 seconds (CPU, GGUF already on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": false,
        "reasoning_model": false,
        "strips_thinking": false,
        "needs_json_fixing": true
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.7, "top_p": 1.0, "max_tokens": 512 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant). Uses the Zephyr prompt template."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 512,
          "max": 1800,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 0.7,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature"
        },
        "top_p": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "min": 0.0,
          "max": 1.0,
          "description": "Nucleus sampling probability"
        },
        "stream": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Accepted but ignored — no_stream forces a non-streaming response."
        },
        "frequency_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "min": -2.0,
          "max": 2.0,
          "description": "Frequency penalty for repetition"
        }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model identifier" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Generated chat completions" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "TinyLlama 1.1B Chat (GGUF Q4_K_M), CPU inference via llama.cpp — small + fast",
        "description": "TinyLlama 1.1B Chat v1.0 quantized to GGUF Q4_K_M (~640 MB). Pretrained on 3 trillion tokens, fine-tuned with the Zephyr recipe (UltraChat + DPO on UltraFeedback). Same architecture/tokenizer as Llama 2. Runs on CPU via the llama-cpp-python server — no GPU required, very fast for short replies. No streaming, no tools, no vision, no reasoning.",
        "owned_by": "TinyLlama",
        "source": "TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF",
        "source_url": "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF",
        "original_source": "TinyLlama/TinyLlama-1.1B-Chat-v1.0",
        "license": "Apache-2.0",
        "parameters": "1.1B",
        "precision": "gguf_q4_k_m",
        "framework": "llama.cpp",
        "domain": "nlp",
        "subdomain": "small-language-model",
        "tags": ["chat", "llm", "cpu", "small", "gguf"]
      }
    }
