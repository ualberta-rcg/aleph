apiVersion: v1
kind: ConfigMap
metadata:
  name: xtts-v2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "xtts-v2",
      "status": "production",
      "type": "tts",
      "endpoints": {
        "primary": "/v1/audio/speech",
        "health": "/health",
        "clone": "/v1/audio/clone",
        "voices": "/v1/audio/voices"
      },
      "routing": {
        "k8s_name": "xtts-v2",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 0 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "always-on",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "custom_params": {
        "schema": {
          "input": { "type": "string", "required": true },
          "language": { "type": "string", "default": "en" },
          "voice": { "type": "string", "description": "built-in preset name OR a saved clone name (see /v1/audio/voices)" },
          "speed": { "type": "number", "default": 1.0 },
          "voice_sample": { "type": "string", "description": "base64-encoded reference WAV for /v1/audio/clone" },
          "save_as": { "type": "string", "description": "persist a cloned clip on the PVC to recall by name" }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Coqui XTTS-v2 multilingual TTS + voice cloning from a reference clip (17 langs, GPU)",
        "description": "XTTS-v2 (coqui/XTTS-v2) multilingual text-to-speech with voice cloning from a ~6s reference WAV. POST /v1/audio/clone to clone a voice (multipart 'file' upload or JSON base64 'voice_sample'); pass 'save_as=<name>' to persist the clip on the PVC and recall it by name via /v1/audio/speech {voice:\"<name>\"}. GET /v1/audio/voices lists built-in presets and saved clones. 17 languages, 24kHz WAV output. ~1.8B params, GPU (HAMi vGPU slice).",
        "owned_by": "coqui",
        "source": "coqui/XTTS-v2",
        "source_url": "https://huggingface.co/coqui/XTTS-v2",
        "license": "CPML",
        "parameters": "~1.8B",
        "precision": "fp32",
        "framework": "coqui-tts",
        "domain": "audio",
        "subdomain": "text-to-speech",
        "gpu": true,
        "output_format": "audio/wav",
        "languages": ["en", "es", "fr", "de", "it", "pt", "pl", "tr", "ru", "nl", "cs", "ar", "zh-cn", "ja", "hu", "ko", "hi"],
        "tags": ["tts", "voice-cloning", "speech-synthesis", "multilingual", "gpu"]
      }
    }
