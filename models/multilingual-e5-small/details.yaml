apiVersion: v1
kind: ConfigMap
metadata:
  name: multilingual-e5-small-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "multilingual-e5-small",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "multilingual-e5-small",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array",
          "required": true,
          "description": "Text (100+ languages) to embed. For retrieval, prefix queries with 'query: ' and passages with 'passage: '; generic embeddings are left as-is. Truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "description": "One {object:'embedding', index, embedding:[float x 384]} per input (mean-pooled, L2-normalized)" },
        "model": { "type": "string", "description": "Model name (multilingual-e5-small)" },
        "usage": { "type": "object", "description": "{prompt_tokens (word count), total_tokens}" }
      },
      "catalog": {
        "description_short": "intfloat multilingual-e5-small — 384-dim embeddings for 100+ languages (CPU, scale-to-zero)",
        "description": "Multilingual E5 Small (intfloat/multilingual-e5-small): ~118M params, 12-layer MiniLM (Multilingual-MiniLM-L12-H384), 384-dim embeddings supporting 100+ languages. Trained with contrastive learning on billions of multilingual text pairs. Mean-pooled and L2-normalized. For retrieval, prefix queries with 'query: ' and passages with 'passage: '. Served CPU-only via a custom transformers FastAPI server, scale-to-zero. Max 512 tokens.",
        "owned_by": "intfloat (Microsoft)",
        "source": "intfloat/multilingual-e5-small",
        "source_url": "https://huggingface.co/intfloat/multilingual-e5-small",
        "license": "Apache-2.0",
        "parameters": "118M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "nlp",
        "subdomain": "multilingual-embeddings",
        "gpu": false,
        "embedding_dimensions": 384,
        "pooling": "mean",
        "normalization": "l2",
        "max_input_tokens": 512,
        "language": "multilingual (100+)",
        "tags": ["embedding", "multilingual", "dense", "retrieval", "cpu"]
      }
    }
