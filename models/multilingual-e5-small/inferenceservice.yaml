# Multilingual-E5-Small: multilingual text embeddings (intfloat/multilingual-e5-small)
# 118M params, 512-dim, 100+ languages. CPU; scale-to-zero.
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multilingual-e5-small-server
  namespace: models
data:
  server.py: |
    """Multilingual-E5-Small embedding server (intfloat/multilingual-e5-small)."""
    import os, asyncio
    import numpy as np
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR  = os.environ.get("MODEL_DIR", "/data/model")
    MODEL_NAME = os.environ.get("MODEL_NAME", "multilingual-e5-small")
    MAX_LEN    = int(os.environ.get("MAX_LEN", "512"))

    app = FastAPI()
    tokenizer = None
    pt_model  = None

    def load():
        global tokenizer, pt_model
        from transformers import AutoTokenizer, AutoModel
        import torch
        print(f"Loading {MODEL_NAME} from {MODEL_DIR}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR)
        pt_model = AutoModel.from_pretrained(MODEL_DIR, torch_dtype=torch.float32)
        pt_model.eval()
        print(f"{MODEL_NAME} ready.", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if pt_model else "loading", "model": MODEL_NAME}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": MODEL_NAME, "object": "model", "owned_by": "intfloat", "type": "embedding"}
        ]}

    def _infer(texts):
        import torch
        # E5 models expect "query: " or "passage: " prefix for asymmetric retrieval;
        # for generic embedding we leave them as-is (symmetric use case).
        enc = tokenizer(texts, padding=True, truncation=True,
                        max_length=MAX_LEN, return_tensors="pt")
        with torch.no_grad():
            out = pt_model(**enc).last_hidden_state.numpy()
        mask = enc["attention_mask"].numpy().astype(np.float32)
        m = mask[:, :, np.newaxis]
        emb = (out * m).sum(1) / m.sum(1)
        # L2-normalize (E5 models are trained with normalised embeddings)
        norms = np.linalg.norm(emb, axis=1, keepdims=True)
        return (emb / np.maximum(norms, 1e-9)).tolist()

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if pt_model is None:
            return JSONResponse({"error": "model loading"}, status_code=503)
        inputs = request.get("input", "")
        if isinstance(inputs, str):
            inputs = [inputs]
        vecs = await asyncio.get_event_loop().run_in_executor(None, _infer, inputs)
        data = [{"object": "embedding", "index": i, "embedding": e}
                for i, e in enumerate(vecs)]
        return {"object": "list", "model": MODEL_NAME, "data": data,
                "usage": {"prompt_tokens": sum(len(s.split()) for s in inputs),
                          "total_tokens": 0}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: multilingual-e5-small
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 180
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            # Rebuild venv if wrong transformers version (need 4.44.2 for XLM-RoBERTa lazy import)
            NEED_REBUILD=0
            if ! /data/venv/bin/python -c "import sentencepiece" 2>/dev/null; then NEED_REBUILD=1; fi
            if ! /data/venv/bin/python -c "import transformers; assert transformers.__version__=='4.44.2'" 2>/dev/null; then NEED_REBUILD=1; fi
            if [ "$NEED_REBUILD" = "1" ]; then
              echo "Rebuilding venv..."
              rm -rf /data/venv
            fi
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip -q
              /data/venv/bin/pip install -q \
                --extra-index-url https://download.pytorch.org/whl/cpu \
                torch==2.5.1 transformers==4.44.2 sentencepiece fastapi uvicorn huggingface_hub
              echo "venv created."
            else
              echo "venv already exists."
            fi
            if [ -f /data/model/config.json ]; then
              echo "Model already on PVC."
            else
              echo "Downloading intfloat/multilingual-e5-small..."
              /data/venv/bin/python -c "
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id='intfloat/multilingual-e5-small',
                local_dir='/data/model',
                local_dir_use_symlinks=False,
                token=os.environ.get('HF_TOKEN'),
            )
            print('Download finished.')
            "
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - name: model-data
            mountPath: /data
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
          - { name: MODEL_NAME, value: multilingual-e5-small }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 2Gi }
          limits: { cpu: "4", memory: 4Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        volumeMounts:
          - name: model-data
            mountPath: /data
            readOnly: true
          - name: app
            mountPath: /app
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: multilingual-e5-small-data
      - name: app
        configMap:
          name: multilingual-e5-small-server
