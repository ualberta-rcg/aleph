# Qwen/Qwen2.5-VL-72B-Instruct-AWQ (4-bit quantized) on cluster 230 / HAMi. vLLM v0.20.2, TP2 (whole devices).
# HAMi TP>=2 recipe: request whole GPUs via nvidia.com/gpu=2, DO NOT set gpumem,
# and --disable-custom-all-reduce (L40S NODE topology: custom all-reduce stalls; NCCL is fast).
# VLLM_ATTENTION_BACKEND=TRITON_ATTN_VLLM_V1 required on L40S (SM89). Scale-to-zero, 15m idle.
# AWQ 4-bit weights: ~20 GiB/GPU with TP2. 64K context (128K OOMs on L40S 48GB).
# gpu-memory-utilization=0.92 → 44.2 GiB budget, ~24 GiB for KV+encoder after weights.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-vl-72b-awq
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 1
    scaleTarget: 8
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command: ["vllm"]
        args:
          - serve
          - /mnt/models
          - --served-model-name=qwen25-vl-72b-awq
          - --tensor-parallel-size=2
          - --max-model-len=65536
          - --dtype=auto
          - --gpu-memory-utilization=0.92
          - --max-num-seqs=4
          - '--limit-mm-per-prompt={"image": 20, "video": 1}'
          - --disable-custom-all-reduce
          - --port=8080
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_ATTENTION_BACKEND
            value: TRITON_ATTN_VLLM_V1
          - name: OMP_NUM_THREADS
            value: "1"
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
          limits:
            cpu: "16"
            memory: 128Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet: { path: /v1/models, port: 8080 }
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet: { path: /v1/models, port: 8080 }
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 60
        livenessProbe:
          httpGet: { path: /v1/models, port: 8080 }
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        volumeMounts:
          - name: model-data
            mountPath: /mnt/models
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: qwen25-vl-72b-awq-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
