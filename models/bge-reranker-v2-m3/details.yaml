apiVersion: v1
kind: ConfigMap
metadata:
  name: bge-reranker-v2-m3-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "bge-reranker-v2-m3",
      "status": "production",
      "type": "reranker",
      "endpoints": { "primary": "/v1/rerank", "health": "/health" },
      "routing": {
        "k8s_name": "bge-reranker-v2-m3",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 8192, "max_input_tokens": 8192 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "always-on",
        "cold_start_estimate": "10-40 seconds (weights on PVC; GPU image pull on first node placement)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": {
        "schema": {
          "top_n": { "type": "integer" },
          "return_documents": { "type": "boolean", "default": false }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "query": { "type": "string", "required": true, "description": "Search query" },
        "documents": { "type": "array", "required": true, "description": "Candidate passages to score against the query (gateway maps to TEI 'texts')" },
        "top_n": { "type": "integer", "required": false, "description": "Return only the top-N results (default: all)" },
        "return_documents": { "type": "boolean", "required": false, "default": false, "description": "Include each result's document text" }
      },
      "output_map": {
        "results": { "type": "array", "description": "Ranked [{index, relevance_score (0-1 sigmoid), document?}] sorted by relevance_score desc" },
        "model": { "type": "string", "description": "Model name" }
      },
      "catalog": {
        "description_short": "BAAI bge-reranker-v2-m3 multilingual cross-encoder reranker (TEI/GPU always-on)",
        "description": "BGE-Reranker v2-M3 is a multilingual cross-encoder for re-ranking retrieval results (the second-stage rerank in a hybrid RAG pipeline, after a retriever like bge-m3). ~568M params, XLM-RoBERTa backbone, 100+ languages, up to 8192 tokens. Served on GPU via HuggingFace TEI (Ada Lovelace / L40S image, fp16) on a HAMi vGPU slice — TEI's CUDA backend serves the safetensors weights directly (no ONNX/ORT export needed). The gateway exposes a Cohere/Jina-style /v1/rerank and translates it to the TEI native /rerank. Relevance scores are sigmoid-normalized to [0,1].",
        "owned_by": "BAAI",
        "source": "BAAI/bge-reranker-v2-m3",
        "source_url": "https://huggingface.co/BAAI/bge-reranker-v2-m3",
        "license": "MIT",
        "parameters": "568M",
        "precision": "fp16",
        "framework": "text-embeddings-inference (89-1.9, CUDA/Ada)",
        "domain": "nlp",
        "subdomain": "reranking",
        "gpu": true,
        "cross_encoder": true,
        "max_input_tokens": 8192,
        "tags": ["reranker", "multilingual", "cross-encoder", "rag", "cohere-compatible", "gpu"]
      }
    }
