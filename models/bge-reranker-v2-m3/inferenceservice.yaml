# bge-reranker-v2-m3: multilingual cross-encoder reranker — ported from the POC cluster.
# GPU via HuggingFace TEI (Ada Lovelace / L40S image, fp16) on a HAMi vGPU slice.
# Init container downloads HF safetensors weights (TEI's CUDA backend serves them
# directly — no ONNX/ORT export needed on GPU).
# Always-on (minReplicas 1). TEI serves native /rerank; the gateway exposes a
# Cohere-style /v1/rerank and translates {documents}->{texts} + response shape.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 1
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: hf-fetch-model
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            python3 -u <<'PY'
            import os
            from pathlib import Path
            if Path("/data/config.json").is_file():
                print("bge-reranker-v2-m3 weights already on PVC, skipping.", flush=True)
            else:
                import subprocess, sys
                subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "huggingface_hub"])
                from huggingface_hub import snapshot_download
                Path("/data").mkdir(parents=True, exist_ok=True)
                print("Downloading BAAI/bge-reranker-v2-m3 ...", flush=True)
                snapshot_download(
                    repo_id="BAAI/bge-reranker-v2-m3",
                    local_dir="/data",
                    local_dir_use_symlinks=False,
                    token=os.environ.get("HF_TOKEN"),
                )
                print("Download finished.", flush=True)
            PY
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: bge-reranker-data
            mountPath: /data
    containers:
      - name: kserve-container
        image: ghcr.io/huggingface/text-embeddings-inference:89-1.9
        args:
          - --model-id=/data
          - --port=8080
          - --dtype=float16
          - --max-client-batch-size=128
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
          - name: bge-reranker-data
            mountPath: /data
            readOnly: true
    volumes:
      - name: bge-reranker-data
        persistentVolumeClaim:
          claimName: bge-reranker-v2-m3-data
