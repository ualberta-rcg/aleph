# ClimateBERT: Climate-focused NLP foundation model (distilroberta-based)
# HuggingFace: climatebert/distilroberta-base-climate-f (MIT)
# Domain-adapted on climate/sustainability text for zero-shot + fine-tuned tasks
# API: POST /v1/science/classify — text → climate relevance + detection labels
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: climatebert-server
  namespace: models
data:
  server.py: |
    """
    ClimateBERT: Climate domain NLP model (DistilRoBERTa fine-tuned on climate text).
    Supports:
      - Climate text detection (is this climate-related?)
      - Climate sentiment analysis
      - Net-zero/reduction commitment detection
      - Climate token embeddings

    Endpoints:
      GET  /health                → {"status":"ok","model":"climatebert"}
      GET  /v1/models             → model card
      POST /v1/science/classify   → {"text":"...", "task":"detect|sentiment|netzero"}
      POST /v1/embeddings         → {"input":"...", "model":"climatebert"}
    """
    import os, asyncio
    from fastapi import FastAPI, HTTPException
    from fastapi.responses import JSONResponse
    import uvicorn

    # Models for each task
    BASE_MODEL   = "climatebert/distilroberta-base-climate-f"
    DETECT_MODEL = "climatebert/distilroberta-base-climate-detector"
    NETZERO_MODEL = "climatebert/netzero-reduction"

    DEVICE = "cpu"
    app = FastAPI()
    models = {}

    def load():
        global DEVICE
        import torch
        from transformers import AutoTokenizer, AutoModelForSequenceClassification, AutoModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading ClimateBERT models on {DEVICE}...", flush=True)

        # Base embedding model
        tok_base = AutoTokenizer.from_pretrained(BASE_MODEL)
        mdl_base = AutoModel.from_pretrained(BASE_MODEL).to(DEVICE).eval()
        models["base"] = (tok_base, mdl_base)

        # Climate detector (binary: climate / not-climate)
        tok_det = AutoTokenizer.from_pretrained(DETECT_MODEL)
        mdl_det = AutoModelForSequenceClassification.from_pretrained(DETECT_MODEL).to(DEVICE).eval()
        models["detect"] = (tok_det, mdl_det, list(mdl_det.config.id2label.values()))

        # Net-zero/reduction detector
        tok_nz = AutoTokenizer.from_pretrained(NETZERO_MODEL)
        mdl_nz = AutoModelForSequenceClassification.from_pretrained(NETZERO_MODEL).to(DEVICE).eval()
        models["netzero"] = (tok_nz, mdl_nz, list(mdl_nz.config.id2label.values()))

        print("ClimateBERT models ready.", flush=True)

    @app.on_event("startup")
    async def startup():
        loop = asyncio.get_event_loop()
        await loop.run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if models else "loading", "model": "climatebert"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "climatebert", "object": "model", "owned_by": "climatebert",
             "type": "climate-nlp", "license": "MIT",
             "description": "ClimateBERT DistilRoBERTa for climate text detection, sentiment, net-zero commitment classification"}
        ]}

    def _classify(text: str, task: str) -> dict:
        import torch
        if task == "detect":
            tok, mdl, labels = models["detect"]
        elif task == "netzero":
            tok, mdl, labels = models["netzero"]
        else:
            raise ValueError(f"Unknown task '{task}'. Use 'detect' or 'netzero'.")
        enc = tok(text, return_tensors="pt", max_length=512, truncation=True).to(DEVICE)
        with torch.no_grad():
            logits = mdl(**enc).logits
        probs = torch.softmax(logits, dim=-1)[0].cpu().tolist()
        scores = {labels[i]: round(probs[i], 4) for i in range(len(labels))}
        top_label = max(scores, key=scores.get)
        return {"text": text[:200], "task": task, "prediction": top_label,
                "scores": scores, "model": "climatebert"}

    def _embed(text: str) -> list:
        import torch
        tok, mdl = models["base"]
        enc = tok(text, return_tensors="pt", max_length=512, truncation=True).to(DEVICE)
        with torch.no_grad():
            out = mdl(**enc)
        hidden = out.last_hidden_state
        mask = enc.get("attention_mask", None)
        if mask is not None:
            mask = mask.unsqueeze(-1).float()
            emb = (hidden * mask).sum(1) / mask.sum(1)
        else:
            emb = hidden.mean(dim=1)
        return emb[0].cpu().float().tolist()

    @app.post("/v1/science/classify")
    async def classify(request: dict):
        if not models:
            raise HTTPException(503, "Models not loaded yet")
        text = request.get("text", "").strip()
        if not text:
            raise HTTPException(400, "text required")
        task = request.get("task", "detect")
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _classify, text, task)
        except ValueError as e:
            raise HTTPException(400, str(e))
        return JSONResponse(result)

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if not models:
            raise HTTPException(503, "Models not loaded yet")
        text = request.get("input", "").strip()
        if not text:
            raise HTTPException(400, "input required")
        loop = asyncio.get_event_loop()
        emb = await loop.run_in_executor(None, _embed, text)
        return JSONResponse({"object": "list", "data": [
            {"object": "embedding", "embedding": emb, "index": 0}
        ], "model": "climatebert"})

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: climatebert-data
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-models
  resources:
    requests:
      storage: 5Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: climatebert
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    timeout: 120
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf-home" }
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              python3 -m venv /data/venv && /data/venv/bin/pip install -U pip
              /data/venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                "torch==2.5.1" "transformers==4.46.3" fastapi uvicorn huggingface_hub
            fi
            if [ ! -f /data/.climatebert-cached ]; then
              /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            for r in ['climatebert/distilroberta-base-climate-f','climatebert/distilroberta-base-climate-detector','climatebert/netzero-reduction']:
                snapshot_download(r)
                print('cached', r, flush=True)
            "
              touch /data/.climatebert-cached
            fi
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "2", memory: 4Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf-home" }
          - { name: HF_HUB_OFFLINE, value: "1" }
        ports:
          - { containerPort: 8080, protocol: TCP }
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits:   { cpu: "2", memory: 4Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: server-config, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: climatebert-data }
      - name: server-config
        configMap:
          name: climatebert-server
