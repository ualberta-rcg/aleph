apiVersion: v1
kind: ConfigMap
metadata:
  name: brainlm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "brainlm",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/embeddings"],
        "health": "/health"
      },
      "routing": { "k8s_name": "brainlm", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 minutes (venv-on-PVC; weights already downloaded)"
      },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "fmri": "[[float]] — [n_rois=424, n_timepoints] fMRI ROI time-series (padded to 434x434 internally)",
        "model_size": "string — '650M' (default)"
      },
      "output_map": {
        "data": "[{index, embedding, object}] — OpenAI-format embedding list",
        "model": "brainlm"
      },
      "catalog": {
        "description_short": "BrainLM 650M fMRI foundation model (ViT-MAE) — 1280-dim brain-activity embeddings from 424-ROI time-series.",
        "description": "BrainLM (650M, vandijklab, ICLR 2024) is an fMRI foundation model based on ViT-MAE (Masked Autoencoder), trained on 6,700h of fMRI from UK Biobank + Human Connectome Project. Accepts fMRI ROI time-series (424 brain regions × timepoints), converts to a 3-channel 434×434 image (signal + spatial/temporal derivatives), and runs ViTMAEForPreTraining to extract a 1280-dim latent embedding (ViT-Huge hidden) per window. Downstream: disease classification, brain-state prediction, connectivity analysis. Non-text domain model: fMRI-array input, does NOT fit OpenAI /v1/embeddings (text-only) — primary is /v1/science/embed; /v1/embeddings kept as a secondary alias.",
        "owned_by": "vandijklab",
        "source": "vandijklab/BrainLM",
        "source_url": "https://huggingface.co/vandijklab/BrainLM",
        "license": "MIT",
        "parameters": "650M",
        "precision": "fp32",
        "framework": "transformers (ViTMAEForPreTraining) + PyTorch",
        "domain": "neuroscience",
        "subdomain": "fmri",
        "tags": ["embedding", "science", "neuroscience", "fmri", "foundation", "brain", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "input_format": {
          "model": "brainlm",
          "fmri": "[[roi1_t1,...], [roi2_t1,...], ...] shape [n_rois=424, n_timepoints] (padded to 434×434 internally)",
          "model_size": "\"650M\" (default)"
        },
        "embedding_dimensions": 1280,
        "pooling": "ViT-MAE latent (3-channel 434×434 image)"
      }
    }
