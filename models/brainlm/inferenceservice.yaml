# BrainLM: fMRI foundation model for brain activity dynamics (vandijklab/brainlm)
# 650M parameter ViT-MAE trained on 6,700 hours of fMRI recordings (UK Biobank + HCP).
# ICLR 2024. Returns latent embeddings from fMRI ROI time-series.
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: brainlm-server
  namespace: models
data:
  server.py: |
    """
    BrainLM: fMRI foundation model (vandijklab/brainlm, ICLR 2024).
    Accepts fMRI ROI time-series (424 brain regions), returns latent embeddings.
    API: POST /v1/embeddings
    Input: {"fmri": [[roi1_t1, roi1_t2, ...], [roi2_t1, ...], ...], "model_size": "650M"}
           fmri shape: [n_rois=424, n_timepoints] or [batch, 424, timepoints]
    Returns: {"embeddings": [[...]], "model": "brainlm"}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading BrainLM 650M on {DEVICE}...", flush=True)

        from transformers import ViTMAEForPreTraining, ViTMAEConfig
        import json

        model_dir = os.path.join(MODEL_DIR, "vitmae_650M")
        config_path = os.path.join(model_dir, "config.json")

        if os.path.exists(config_path):
            with open(config_path) as f:
                cfg_dict = json.load(f)
            cfg = ViTMAEConfig(**cfg_dict)
            cfg.mask_ratio = 0.0  # disable MAE random masking -> deterministic embeddings
            m = ViTMAEForPreTraining(cfg)
            weights_path = os.path.join(model_dir, "pytorch_model.bin")
            state = torch.load(weights_path, map_location=DEVICE, weights_only=False)
            m.load_state_dict(state, strict=False)
        else:
            # Fall back to HuggingFace auto-load
            m = ViTMAEForPreTraining.from_pretrained(
                "vandijklab/brainlm",
                subfolder="vitmae_650M",
                cache_dir=MODEL_DIR,
            )

        m.to(DEVICE).eval()
        model = m
        print(f"BrainLM ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "brainlm"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "brainlm", "object": "model", "owned_by": "vandijklab",
             "type": "fmri-embedding"}
        ]}

    @app.post("/v1/embeddings")
    @app.post("/v1/science/embed")
    async def embeddings(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(req):
        import torch
        import numpy as np

        fmri = req.get("fmri")
        if fmri is None:
            raise ValueError("fmri required: [n_rois=424, n_timepoints] time-series")

        arr = np.array(fmri, dtype=np.float32)
        if arr.ndim == 2:
            arr = arr[np.newaxis]  # [1, n_rois, timepoints]

        # BrainLM HF model is ViTMAEForPreTraining expecting [batch, 3, 434, 434] images.
        # Convert fMRI [batch, 424_rois, timepoints] -> [batch, 3, 434, 434] image:
        #   - Pad 424 -> 434 (add 10 zero rows for missing ROIs)
        #   - Use timepoints as width, pad/truncate to 434
        #   - Replicate across 3 channels (or zeros for unused channels)
        batch, n_rois, n_tp = arr.shape
        img_size = 434
        img = np.zeros((batch, 3, img_size, img_size), dtype=np.float32)
        roi_pad = min(n_rois, img_size)
        tp_pad = min(n_tp, img_size)
        # Channel 0: fMRI signal (ROIs × timepoints)
        img[:, 0, :roi_pad, :tp_pad] = arr[:, :roi_pad, :tp_pad]
        # Channel 1: spatial derivative (differences between adjacent ROIs)
        if roi_pad > 1:
            img[:, 1, :roi_pad-1, :tp_pad] = np.diff(arr[:, :roi_pad, :tp_pad], axis=1)
        # Channel 2: temporal derivative (differences between adjacent timepoints)
        if tp_pad > 1:
            img[:, 2, :roi_pad, :tp_pad-1] = np.diff(arr[:, :roi_pad, :tp_pad], axis=2)

        x = torch.tensor(img).to(DEVICE)
        with torch.inference_mode():
            outputs = model.vit(pixel_values=x, noise=None)
            embeddings = outputs.last_hidden_state[:, 0, :]  # CLS token

        return {
            "object": "list",
            "model": "brainlm",
            "data": [{"index": i, "embedding": e.tolist(), "object": "embedding"}
                     for i, e in enumerate(embeddings.cpu())]
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: brainlm
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e

            if [ ! -d /data/venv ] || ! /data/venv/bin/python -c 'import torch' 2>/dev/null; then
              echo "Creating venv..."
              rm -rf /data/venv
              python3 -m venv /data/venv
              /data/venv/bin/pip install -q -U pip
              /data/venv/bin/pip install -q \
                "torch>=2.6" --index-url https://download.pytorch.org/whl/cu126
              /data/venv/bin/pip install -q \
                transformers fastapi uvicorn huggingface_hub
              echo "Venv ready."
            else
              echo "Venv exists."
            fi

            if [ ! -d /data/model/vitmae_650M ]; then
              echo "Downloading BrainLM 650M..."
              mkdir -p /data/model
                /data/venv/bin/python -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            token = os.environ.get('HF_TOKEN')
            snapshot_download(
                repo_id='vandijklab/brainlm',
                local_dir='/data/model',
                local_dir_use_symlinks=False,
                token=token,
                ignore_patterns=['old_13M/*'],
            )
            print('BrainLM downloaded.', flush=True)
            PY
            else
              echo "BrainLM already on PVC."
            fi
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits:   { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: brainlm-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
          - { name: HF_HOME,   value: /data/hf_cache }
        ports:
          - { containerPort: 8080, protocol: TCP }
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits:   { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "8192" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 40
        volumeMounts:
          - { name: brainlm-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: brainlm-data
        persistentVolumeClaim:
          claimName: brainlm-data
      - name: app
        configMap:
          name: brainlm-server
