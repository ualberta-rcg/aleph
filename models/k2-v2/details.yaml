apiVersion: v1
kind: ConfigMap
metadata:
  name: k2-v2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "k2-v2",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "k2-v2",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 32768
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 8192
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "LLM360 K2-V2 70B: fully open (weights + data + code + evals). Citable.",
        "description": "LLM360 K2-V2 70B: fully open (weights + data + code + evals). Citable.",
        "owned_by": "LLM360",
        "source": "LLM360/K2-V2",
        "source_url": "https://huggingface.co/LLM360/K2-V2",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "TP4",
        "tags": [
          "chat",
          "llm",
          "fully-open"
        ]
      }
    }
