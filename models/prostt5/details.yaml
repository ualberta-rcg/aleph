apiVersion: v1
kind: ConfigMap
metadata:
  name: prostt5-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "prostt5",
      "status": "production",
      "type": "translate",
      "endpoints": {
        "primary": "/v1/translate",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "prostt5",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min (venv + ~800M load + first translate)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string",
          "required": true,
          "description": "amino-acid sequence(s) (seq2struct) or 3Di structure tokens (struct2seq); accepts a single string or array"
        },
        "direction": {
          "type": "string",
          "required": false,
          "default": "seq2struct",
          "description": "seq2struct (AA→3Di, default) or struct2seq (3Di→AA)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "results": {"type": "array", "description": "translated sequences"},
        "direction": {"type": "string", "description": "direction used"}
      },
      "catalog": {
        "description_short": "ProstT5 — protein AA-sequence ↔ 3Di structure-token translation (Rostlab).",
        "description": "ProstT5 (Rostlab, ~800M) is a T5 seq2seq model that translates between protein amino-acid sequences and 3Di (3-state discrete) structure tokens — fast structure prediction without MSA. Supports seq2struct (AA→3Di) and struct2seq (3Di→AA). Pinned `transformers==4.40.2` + sentencepiece.",
        "owned_by": "Rostlab",
        "source": "Rostlab/ProstT5",
        "source_url": "https://huggingface.co/Rostlab/ProstT5",
        "license": "MIT",
        "parameters": "~800M",
        "precision": "fp16 (GPU) / fp32 (CPU)",
        "framework": "transformers==4.40.2 (T5ForConditionalGeneration) + torch",
        "domain": "proteomics",
        "subdomain": "structure-prediction",
        "tags": ["science", "translate", "proteomics", "protein", "structure", "gpu"]
      }
    }
