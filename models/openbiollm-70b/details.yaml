apiVersion: v1
kind: ConfigMap
metadata:
  name: openbiollm-70b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "openbiollm-70b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "openbiollm-70b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 8192,
        "max_completion_tokens": 8000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "3-6 min",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.3,
          "max_tokens": 4096
        },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "items": {"role": "string", "content": "string"},
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant)"
        },
        "max_tokens": {"type": "integer", "default": 4096, "max": 8000, "description": "Maximum tokens to generate"},
        "temperature": {"type": "float", "default": 0.3, "min": 0.0, "max": 2.0, "description": "Sampling temperature (0.0 recommended for less verbosity)"},
        "top_p": {"type": "float", "default": 1.0, "min": 0.0, "max": 1.0, "description": "Nucleus sampling probability"},
        "stream": {"type": "boolean", "default": false, "description": "Stream responses via SSE"},
        "frequency_penalty": {"type": "float", "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty for repetition"}
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model identifier"},
        "choices": {"type": "array", "items": {"message": {"role": "string", "content": "string"}, "finish_reason": "string"}, "description": "Generated chat completions"},
        "usage": {"prompt_tokens": "int", "completion_tokens": "int", "total_tokens": "int"}
      },
      "catalog": {
        "description_short": "Llama3-OpenBioLLM-70B biomedical fine-tune. SOTA on 9 medical benchmarks (86% avg).",
        "description": "Llama3-OpenBioLLM-70B is a 70B parameter biomedical domain model fine-tuned from Meta-Llama-3-70B-Instruct using DPO and QLoRA (r=128, alpha=256). Trained on a custom medical instruction dataset on 8x H100 GPUs. Achieves 86.06% average across 9 biomedical benchmarks (MedQA, PubMedQA, Clinical KG, Medical Genetics, etc.), outperforming GPT-4 and Med-PaLM-2. Excels at clinical entity recognition, medical text summarization, biomarker extraction, disease classification, and PII de-identification. Uses Llama-3 instruct chat template. No reasoning mode, no tool calling, no vision. Context: 8192 tokens.",
        "owned_by": "Saama",
        "source": "aaditya/Llama3-OpenBioLLM-70B",
        "source_url": "https://huggingface.co/aaditya/Llama3-OpenBioLLM-70B",
        "license": "Llama 3 Community",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "70B",
        "tags": [
          "chat",
          "llm",
          "biomedical",
          "medical",
          "science",
          "dpo",
          "qlora"
        ]
      },
      "server_config": {
        "note": "vLLM v0.20.2, TP4 (4x L40S). --disable-custom-all-reduce for L40S NODE topology. VLLM_ATTENTION_BACKEND=TRITON_ATTN_VLLM_V1 required for SM89. No --reasoning-parser or --tool-call-parser. Recommended temperature 0.0 for less verbosity (card default 0.3 for flexibility)."
      }
    }
