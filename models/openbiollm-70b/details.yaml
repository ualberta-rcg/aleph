apiVersion: v1
kind: ConfigMap
metadata:
  name: openbiollm-70b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "openbiollm-70b",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "openbiollm-70b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 8192
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 8192
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Llama3-OpenBioLLM-70B biomedical fine-tune. Strong on bio benchmarks.",
        "description": "Llama3-OpenBioLLM-70B biomedical fine-tune. Strong on bio benchmarks.",
        "owned_by": "Saama",
        "source": "aaditya/Llama3-OpenBioLLM-70B",
        "source_url": "https://huggingface.co/aaditya/Llama3-OpenBioLLM-70B",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "TP4",
        "tags": [
          "chat",
          "llm",
          "biomedical",
          "science"
        ]
      }
    }
