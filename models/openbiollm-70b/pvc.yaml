# Llama3-OpenBioLLM-70B biomedical fine-tune. Strong on bio benchmarks.
# Weights (~140 GB) persist on NFS (nfs-models) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbiollm-70b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 200Gi
