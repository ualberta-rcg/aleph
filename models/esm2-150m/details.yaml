apiVersion: v1
kind: ConfigMap
metadata:
  name: esm2-150m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esm2-150m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "esm2-150m",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 1024, "max_input_tokens": 1024 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Protein sequence(s) as 1-letter amino-acid codes (alias: 'sequences'); truncated to 1024 residues."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "description": "One {object:'embedding', index, embedding:[float x 640]} per input (mean-pooled over residues)" },
        "model": { "type": "string", "description": "Model name (esm2-150m)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (residue counts)" }
      },
      "catalog": {
        "description_short": "Meta ESM-2 150M protein language model — 640-dim embeddings (GPU, scale-to-zero)",
        "description": "ESM-2 150M (facebook/esm2_t30_150M_UR50D): mid-size variant of Meta's ESM-2 protein language model family, 150M params / 30 layers, trained on UniRef50. Good speed/accuracy balance. Produces 640-dim mean-pooled per-protein embeddings of amino-acid sequences (up to 1024 residues) for structure/function/variant tasks. Served via a custom transformers FastAPI server on a HAMi GPU slice (fp16). Scale-to-zero.",
        "owned_by": "Meta AI (FAIR)",
        "source": "facebook/esm2_t30_150M_UR50D",
        "source_url": "https://huggingface.co/facebook/esm2_t30_150M_UR50D",
        "license": "MIT",
        "parameters": "150M",
        "precision": "fp16 (GPU)",
        "framework": "transformers (custom FastAPI server)",
        "domain": "proteomics",
        "subdomain": "protein-language-model",
        "gpu": true,
        "embedding_dimensions": 640,
        "pooling": "mean",
        "max_input_tokens": 1024,
        "tags": ["embedding", "science", "proteomics", "protein", "gpu"]
      }
    }
