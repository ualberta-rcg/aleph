apiVersion: v1
kind: ConfigMap
metadata:
  name: yolov8n-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "yolov8n",
      "status": "production",
      "type": "detect",
      "endpoints": {
        "primary": "/v1/vision/detect",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "yolov8n",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "30-60 seconds"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (yolov8n)"},
        "task": {"type": "string", "description": "Always \"detect\""},
        "detections": {
          "type": "array",
          "items": {
            "label": "string — COCO class name (80 classes)",
            "score": "float — confidence 0-1",
            "box": "[x1, y1, x2, y2] pixel coordinates (original scale)"
          },
          "description": "Detections above conf=0.25 after NMS (iou=0.45)"
        }
      },
      "catalog": {
        "description_short": "YOLOv8 Nano — fastest COCO object detector (80 classes, ONNX, CPU)",
        "description": "YOLOv8 Nano by Ultralytics (3.2M params, 8.7B FLOPs). Anchor-free detection head, 80 COCO classes. ONNX Runtime on CPU. Exports from PyTorch to ONNX on first boot. Conf threshold 0.25, IoU NMS 0.45 (hardcoded). 37.3 mAP@50-95 on COCO.",
        "owned_by": "Ultralytics",
        "source": "ultralytics/yolov8n",
        "source_url": "https://docs.ultralytics.com/models/yolov8/",
        "license": "AGPL-3.0",
        "parameters": "3.2M",
        "precision": "fp32",
        "framework": "onnxruntime",
        "domain": "computer-vision",
        "subdomain": "object-detection",
        "tags": ["vision", "detect", "coco", "realtime", "onnx", "cpu"]
      }
    }
