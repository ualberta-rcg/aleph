apiVersion: v1
kind: ConfigMap
metadata:
  name: crysta-llm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "crysta-llm",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/science/generate",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "crysta-llm",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 1024,
        "max_completion_tokens": 1024
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "supports_streaming": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "formula": {
          "type": "string",
          "required": true,
          "description": "Chemical formula e.g. \"NaCl\", \"LiFePO4\""
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "description": "Sampling temperature"
        },
        "max_new_tokens": {
          "type": "integer",
          "required": false,
          "default": 1024,
          "description": "Maximum tokens to generate"
        },
        "num_samples": {
          "type": "integer",
          "required": false,
          "default": 1,
          "description": "Number of structures to generate"
        }
      },
      "output_map": {
        "model": { "type": "string", "description": "Model name" },
        "structures": { "type": "array", "description": "Generated CIF-format crystal structure strings" }
      },
      "catalog": {
        "description_short": "CrystaLLM — generates CIF-format crystal structures from a chemical formula (~25M, GPT-2)",
        "description": "CrystaLLM-pi_base (c-bone) is a GPT-2-based language model (~25M params) fine-tuned to generate crystal structures in CIF format. It uses a custom character-level CIF tokenizer (vocab=377, from lantunes/CrystaLLM). Given a chemical formula prompt, it generates valid CIF crystal-structure representations. Served by a custom FastAPI server on a HAMi GPU slice. MIT license.",
        "owned_by": "c-bone",
        "source": "c-bone/CrystaLLM-pi_base",
        "source_url": "https://huggingface.co/c-bone/CrystaLLM-pi_base",
        "license": "MIT",
        "parameters": "~25M",
        "precision": "float16",
        "framework": "transformers (GPT2LMHeadModel) + custom CIF tokenizer",
        "domain": "materials-science",
        "subdomain": "crystal-generation",
        "tags": ["science", "materials", "crystal", "generate", "cif", "gpu"]
      }
    }
