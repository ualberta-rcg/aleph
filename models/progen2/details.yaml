apiVersion: v1
kind: ConfigMap
metadata:
  name: progen2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "progen2",
      "type": "completions",
      "endpoints": {
        "primary": "/v1/completions",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "progen2",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 2048,
        "max_completion_tokens": 1024
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "2-3 minutes (custom server, 6.4B transformers)",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "supports_streaming": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "defaults": {
        "completions": {
          "temperature": 1.0,
          "max_tokens": 256
        }
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "ProGen2-XLarge 6.4B protein sequence generation. Give it amino acids, get proteins.",
        "description": "ProGen2-XLarge is a 6.4B parameter protein language model from Salesforce Research (Nijkamp et al.). It generates novel protein sequences via autoregressive language modeling trained on ~1 trillion amino acids from UniRef and BFD databases. NOT a natural language model — operates on amino acid tokens only. Completions-only API (no chat). Custom FastAPI server using transformers AutoModelForCausalLM with trust_remote_code. BSD-3 license.\n\nINPUT: Amino acid sequence using single-letter codes (A,C,D,E,F,G,H,I,K,L,M,N,P,Q,R,S,T,V,W,Y). Example: 'MKTIIAL' (methionine-lysine-threonine...).\n\nOUTPUT: Continued amino acid sequence. Example: 'MKTIIALFVLAAAGMAAAQPITLSGSLAAG...'\n\nAPI: POST /v1/completions with {prompt: '<amino_acids>', max_tokens: 100, temperature: 1.0}. Higher temperature = more diverse/creative sequences. Lower temperature = more conservative predictions. max_tokens controls sequence length (1 token = 1 amino acid).\n\nNo chat, no tools, no vision, no streaming, no system prompts.",
        "owned_by": "Salesforce",
        "source": "hugohrban/progen2-xlarge",
        "source_url": "https://huggingface.co/hugohrban/progen2-xlarge",
        "framework": "transformers-custom",
        "domain": "biology",
        "subdomain": "protein-generation",
        "parameters": "6.4B",
        "tags": [
          "science",
          "biology",
          "protein",
          "generation",
          "salesforce"
        ]
      },
      "server_config": {
        "note": "Custom FastAPI server (server.py ConfigMap). Uses transformers AutoModelForCausalLM with trust_remote_code. NOT vLLM. HAMi vGPU slice nvidia.com/gpumem: 30720 (30GB). Venv on PVC. transformers<4.45 pinned for compatibility with ProGen2 custom code. No streaming. Health at /health."
      }
    }
