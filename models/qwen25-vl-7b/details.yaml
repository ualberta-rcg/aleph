apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen25-vl-7b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen25-vl-7b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen25-vl-7b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 16384, "context_window": 65536 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-3 minutes"
      },
      "behavior": {
        "supports_vision": true,
        "supports_video": true,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.2, "top_p": 0.9, "max_tokens": 4096 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": {
        "schema": {
          "temperature": { "type": "float", "default": 0.2, "min": 0.0, "max": 2.0 },
          "top_p": { "type": "float", "default": 0.9, "min": 0.0, "max": 1.0 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages; content may include image_url objects" },
        "max_tokens": { "type": "integer", "required": false, "default": 4096, "max": 16384, "description": "Maximum tokens to generate" },
        "temperature": { "type": "float", "required": false, "default": 0.7, "min": 0.0, "max": 2.0, "description": "Sampling temperature" },
        "top_p": { "type": "float", "required": false, "default": 0.8, "description": "Nucleus sampling threshold" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "tools": { "type": "array", "required": false, "description": "OpenAI-format tool definitions (hermes parser)" },
        "tool_choice": { "type": "string", "required": false, "description": "Tool choice: auto, none, or specific tool (force the function for reliable use)" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty" },
        "presence_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Presence penalty" },
        "top_k": { "type": "integer", "required": false, "default": -1, "description": "Top-k sampling (-1 = disabled)" },
        "stop": { "type": "array|string", "required": false, "description": "Stop sequence(s)" },
        "seed": { "type": "integer", "required": false, "description": "Random seed for reproducibility" },
        "image": { "type": "string", "required": false, "description": "Base64-encoded image or URL via image_url in messages (dynamic-resolution, up to 20/prompt)" }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (may include image analysis or tool_calls)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "Qwen2.5-VL 7B vision-language: images, video, OCR, charts, docs (multimodal)",
        "description": "Qwen2.5-VL 7B Instruct vision-language model. Accepts text + images + video in OpenAI chat format (image_url / video_url with base64 or URL). Strong at OCR, chart/document parsing, visual localization and structured extraction. Runs on a HAMi vGPU slice. Tool calling is supported (hermes parser); the model is conservative on tool_choice='auto', so pass an explicit tool_choice (force the function) for reliable tool use.",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen2.5-VL-7B-Instruct",
        "source_url": "https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct",
        "license": "Apache-2.0",
        "parameters": "7B (+ ViT)",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "vision-language",
        "tags": ["chat", "llm", "vision", "video", "multimodal", "ocr", "agentic"],
        "input_format": {
          "messages": "[{role, content:[{type:'text',text:'...'},{type:'image_url',image_url:{url:'data:image/jpeg;base64,...'}}]}]",
          "max_tokens": "int",
          "stream": "bool"
        }
      }
    }
