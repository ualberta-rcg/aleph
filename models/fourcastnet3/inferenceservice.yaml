# FourCastNet3 (FCNv3): NVIDIA Spherical Neural Operator Weather Model
# nvidia/fourcastnet3 — weights auto-downloaded via earth2studio from NGC
# Spherical Fourier Neural Operator (SFNO), 0.25° global, 73 variables
# API: POST /v1/science/forecast → ERA5 initial state → 6h forecast steps
# Similar to climax/aurora already deployed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fourcastnet3-server
  namespace: models
data:
  server.py: |
    """
    FourCastNet3 (FCNv3) — NVIDIA Spherical Fourier Neural Operator.
    nvidia/fourcastnet3. Spherical Neural Operator, 73 ERA5 variables, 0.25°.
    Weights auto-downloaded from NVIDIA NGC via earth2studio on first startup.

    API: POST /v1/science/forecast
    Input:
      {
        "variables": {"t2m": [[float]], "u10": [[float]], "v10": [[float]]},  # dict of (lat, lon) arrays
        "steps": 4,    # number of 6h forecast steps to run (default 4 = 24h)
        "demo": true
      }
    Returns:
      {
        "forecasts": [{"step": 1, "lead_hours": 6, "variables": {...}}, ...],
        "model": "fourcastnet3"
      }
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading FourCastNet3 on {DEVICE}...", flush=True)
        os.environ.setdefault("MODEL_REGISTRY", "/data/model_registry")
        os.makedirs("/data/model_registry", exist_ok=True)
        try:
            # earth2studio 0.15 exposes FourCastNet v3 as FCN3 (older name FourCastNet
            # was removed). Weights auto-download from NGC into MODEL_REGISTRY.
            from earth2studio.models.px import FCN3
            m = FCN3.load_model(FCN3.load_default_package())
            m = m.to(DEVICE)
            model = m
            print("FourCastNet3 (FCN3) ready via earth2studio.", flush=True)
        except Exception as e:
            import traceback; traceback.print_exc()
            print(f"earth2studio FCN3 load failed: {e}. Demo mode only.", flush=True)
            model = {"_demo": True}

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "fourcastnet3"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "fourcastnet3", "object": "model",
             "owned_by": "nvidia", "type": "weather-forecast-sfno"}
        ]}

    @app.post("/v1/science/forecast")
    async def forecast(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _forecast, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _forecast(req):
        import numpy as np

        steps = int(req.get("steps", 4))
        if req.get("demo") or isinstance(model, dict):
            return {
                "model": "fourcastnet3",
                "forecasts": [
                    {"step": s + 1, "lead_hours": (s + 1) * 6,
                     "variables": {"t2m": [[280.0 + s * 0.5]]}}
                    for s in range(steps)
                ],
                "demo": True,
                "note": "real weights unavailable; demo output",
            }

        # Real autoregressive rollout via earth2studio FCN3.
        # Build an initial condition tensor matching the model's input coords. A real
        # IC can be supplied as req['ic'] (nested list); otherwise we use zeros to
        # exercise the model end-to-end. Output grids are summarized (global grids are
        # ~hundreds of MB of JSON and would exceed the gateway body limit).
        import torch, numpy as np
        from collections import OrderedDict
        ic_coords = model.input_coords()
        var = list(ic_coords["variable"]); lat = ic_coords["lat"]; lon = ic_coords["lon"]
        shape = [1, 1, len(var), len(lat), len(lon)]  # batch, time, variable, lat, lon
        if req.get("ic") is not None:
            x = torch.tensor(np.asarray(req["ic"], dtype=np.float32)).reshape(shape)
        else:
            x = torch.zeros(shape, dtype=torch.float32)
        x = x.to(DEVICE)
        coords = OrderedDict([
            ("batch", np.array([0])), ("time", np.array([np.datetime64("2024-01-01")])),
            ("variable", np.array(var)), ("lat", lat), ("lon", lon),
        ])
        results = []
        it = model.create_iterator(x, coords)
        next(it)  # first yield is the initial state (lead_time 0)
        for s in range(steps):
            out_x, out_coords = next(it)
            arr = out_x.detach().float().cpu().numpy().reshape(len(var), len(lat), len(lon))
            t2m_idx = var.index("t2m") if "t2m" in var else 0
            t2m = arr[t2m_idx]
            sy = max(1, t2m.shape[0] // 8); sx = max(1, t2m.shape[1] // 8)
            results.append({
                "step": s + 1, "lead_hours": (s + 1) * 6,
                "variables_count": len(var),
                "t2m_summary": {"min": float(t2m.min()), "max": float(t2m.max()),
                                "mean": float(t2m.mean()),
                                "preview_downsampled": t2m[::sy, ::sx].tolist()},
            })
        return {"model": "fourcastnet3", "grid": [len(lat), len(lon)],
                "variables": len(var), "forecasts": results,
                "note": "summary only; supply ic + full handling for raw grids"}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fourcastnet3
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.fourcastnet3-ready-v2
            if [ -f "$SENTINEL" ]; then echo "Already set up."; exit 0; fi
            apt-get update -qq && apt-get install -y -qq curl
            pip install -q torch --index-url https://download.pytorch.org/whl/cu126
            # FCN3 requires earth2studio's 'fcn3' extra (torch_harmonics, makani, etc.)
            pip install -q "earth2studio[fcn3]" fastapi uvicorn || \
              pip install -q earth2studio torch_harmonics makani fastapi uvicorn || \
              pip install -q earth2studio torch_harmonics fastapi uvicorn
            # earth2studio will auto-download FCNv3 weights from NGC on first run
            mkdir -p /data/model_registry
            python3 -c "
            import os
            os.environ['MODEL_REGISTRY'] = '/data/model_registry'
            print('earth2studio installed; weights will download on first inference request')
            print('Model registry at /data/model_registry')
            "
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11
        command: ["bash", "-c"]
        args:
          - |
            pip install -q torch --index-url https://download.pytorch.org/whl/cu126
            pip install -q "earth2studio>=0.15,<0.16" fastapi uvicorn
            # NOTE: real FCN3 weights need NVIDIA makani + torch-harmonics compiled
            # against a pinned torch/torchvision/CUDA stack. That matrix is not
            # resolvable via runtime pip here (makani clobbers torchvision; the
            # torch-harmonics _C extension then mismatches the torch CUDA major).
            # A purpose-built image is required for real inference. The server falls
            # back to a correctly-shaped demo response when FCN3 cannot load.
            export MODEL_REGISTRY=/data/model_registry
            python /app/server.py
        env:
          - { name: MODEL_REGISTRY, value: /data/model_registry }
          - { name: HF_HOME, value: /tmp }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "30720" }
          limits: { cpu: "8", memory: 32Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "30720" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 180
          periodSeconds: 15
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: fourcastnet3-data }
      - name: app
        configMap: { name: fourcastnet3-server }
