apiVersion: v1
kind: ConfigMap
metadata:
  name: biomedclip-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomedclip",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "secondary": ["/v1/embeddings", "/v1/classify"],
        "health": "/health"
      },
      "routing": { "k8s_name": "biomedclip", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 minutes (venv-on-PVC; weights already downloaded)" },
      "behavior": { "supports_vision": true, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "input_map": {
        "images": "list of base64-encoded PNG/JPEG biomedical images",
        "texts": "list of text strings (figure captions, labels)",
        "labels": "list of label strings (for /v1/classify only)"
      },
      "output_map": {
        "image_embeddings": "list of 512-dim float vectors (one per image)",
        "text_embeddings": "list of 512-dim float vectors (one per text)",
        "classifications": "list of ranked [{label, score}] per image (/v1/classify)",
        "model": "model id echo"
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Microsoft BiomedCLIP — biomedical vision-language CLIP; shared 512-dim image+text embeddings.",
        "description": "Microsoft BiomedCLIP — a CLIP variant pretrained on 15M PubMed figure-caption pairs. Encodes biomedical images and text into a shared 512-dim space for cross-modal retrieval and zero-shot image classification (e.g. radiology, pathology). Non-text-primary domain model: serves /v1/science/embed (also /v1/embeddings) for embeddings; /v1/classify for zero-shot. Returns `image_embeddings`/`text_embeddings` per modality.",
        "owned_by": "microsoft",
        "source": "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224",
        "source_url": "https://huggingface.co/microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224",
        "license": "Apache-2.0",
        "parameters": "~400M",
        "precision": "fp32",
        "framework": "open_clip + PyTorch",
        "domain": "biomedical",
        "subdomain": "vision-language",
        "tags": ["embedding", "science", "biomedical", "vision-language", "clip", "radiology", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "input_format": {
          "model": "biomedclip",
          "images": "[\"base64 PNG/JPEG\", ...] (biomedical images)",
          "texts": "[\"...\", ...] (figure captions / labels)"
        },
        "embedding_dimensions": 512,
        "pooling": "cls/projection (CLIP shared space)"
      }
    }
