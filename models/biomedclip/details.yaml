apiVersion: v1
kind: ConfigMap
metadata:
  name: biomedclip-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomedclip",
      "type": "embed",
      "description_short": "BiomedCLIP biomedical vision-language model",
      "description": "Microsoft BiomedCLIP — CLIP variant pre-trained on 15M PubMed figure-caption pairs. State-of-the-art biomedical image classification and cross-modal retrieval. Shared 512-dim space for images and text. Custom FastAPI server on GPU.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {"primary": "/v1/embeddings", "health": "/health"},
      "owned_by": "microsoft",
      "source": "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224",
      "source_url": "https://huggingface.co/microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224",
      "license": "Apache-2.0",
      "parameters": "~400M",
      "precision": "fp32",
      "architecture": "clip",
      "framework": "custom",
      "deployment": {"gpu": true, "gpu_count": 1, "gpu_type": "L40S", "min_replicas": 0, "max_replicas": 3, "container_image": "python:3.11-slim"},
      "routing": {"path_prefix": "/v1/"},
      "compatibility": {"supports_streaming": false, "supports_vision": true, "reasoning_model": false},
      "domain": "biomedical",
      "subdomain": "vision-language",
      "tags": ["science", "biomedical", "vision", "embed", "clip", "gpu"],
      "content_types": ["image", "text"],
      "tier": "production"
    }
