apiVersion: v1
kind: ConfigMap
metadata:
  name: biogpt-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biogpt",
      "status": "production",
      "type": "completions",
      "endpoints": {
        "primary": "/v1/completions",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "biogpt",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 1024,
        "max_input_tokens": 1024
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "prompt": {
          "type": "string",
          "required": true,
          "description": "biomedical text prompt (a seed phrase / question)"
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 100,
          "description": "max tokens to generate"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "choices": {"type": "array", "description": "[{text, index, finish_reason}]"}
      },
      "catalog": {
        "description_short": "BioGPT — biomedical text generation (Microsoft, GPT-2 style on PubMed).",
        "description": "BioGPT (Microsoft, 347M) is a GPT-2-style autoregressive LM pre-trained on 15M PubMed abstracts. Generates biomedical text — descriptions of drugs/proteins/diseases, relation extraction. Completions-style endpoint: prompt → continuation. fp16 on GPU. Max input 1024 tokens.",
        "owned_by": "microsoft",
        "source": "microsoft/biogpt",
        "source_url": "https://huggingface.co/microsoft/biogpt",
        "license": "MIT",
        "parameters": "347M",
        "precision": "fp16",
        "framework": "transformers (BioGptForCausalLM) + torch",
        "domain": "biomedical",
        "subdomain": "biomedical-text-generation",
        "tags": ["science", "completions", "biomedical", "nlp", "pubmed", "text-generation", "gpu"]
      }
    }
