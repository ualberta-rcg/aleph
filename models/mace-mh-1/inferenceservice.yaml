# MACE-MH-1: Multi-Head Foundation Force Field (mace-foundations/mace-mh-1)
# Cross-domain: inorganic crystals, molecules, surfaces, reactive organic chemistry
# 89 elements, 7 heads (omat_pbe/omol/spice/rgd1/oc20/matpes_r2scan)
# License: ASL (academic/non-commercial)
# API: POST /v1/science/predict {elements, positions, lattice?, head?}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mace-mh-1-server
  namespace: models
data:
  server.py: |
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    app = FastAPI(title="MACE-MH-1 API")
    calc_cache = {}
    MODEL_PATH = "/data/models/mace-mh-1.model"
    DEVICE = "cpu"
    VALID_HEADS = ["omat_pbe", "omol", "spice_wB97M", "rgd1_b3lyp", "oc20_usemppbe", "matpes_r2scan"]

    def get_calc(head="omat_pbe"):
        if head not in calc_cache:
            from mace.calculators import MACECalculator
            import torch
            calc_cache[head] = MACECalculator(
                model_paths=MODEL_PATH,
                device=DEVICE,
                default_dtype="float64",
                head=head,
            )
        return calc_cache[head]

    def load():
        global DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading MACE-MH-1 on {DEVICE}...", flush=True)
        get_calc("omat_pbe")
        print("MACE-MH-1 ready.", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if "omat_pbe" in calc_cache else "loading", "model": "mace-mh-1"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [{"id": "mace-mh-1", "object": "model",
            "description": "MACE-MH-1 multi-head foundation MLIP (89 elements, 7 heads)",
            "heads": VALID_HEADS}]}

    @app.post("/v1/science/predict")
    async def predict(request: dict):
        if not calc_cache:
            return JSONResponse({"error": "model loading"}, 503)
        demo = request.get("demo", False)
        if demo:
            request = {"elements": ["Cu", "Cu", "Cu", "Cu"],
                       "positions": [[0,0,0],[1.8,1.8,0],[1.8,0,1.8],[0,1.8,1.8]],
                       "lattice": [[3.6,0,0],[0,3.6,0],[0,0,3.6]],
                       "head": "omat_pbe"}
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _predict, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _predict(req):
        from ase import Atoms
        elements = req.get("elements")
        positions = req.get("positions")
        lattice   = req.get("lattice")
        head      = req.get("head", "omat_pbe")
        if head not in VALID_HEADS:
            raise ValueError(f"Invalid head. Choose from: {VALID_HEADS}")
        if not elements or not positions:
            raise ValueError("elements and positions required")
        atoms = Atoms(symbols=elements, positions=positions,
                      cell=lattice if lattice else None, pbc=bool(lattice))
        atoms.calc = get_calc(head)
        energy = float(atoms.get_potential_energy())
        forces = atoms.get_forces().tolist()
        result = {"model": "mace-mh-1", "head": head,
                  "energy_eV": energy, "forces_eV_per_Ang": forces}
        if lattice:
            try:
                result["stress_eV_per_Ang3"] = atoms.get_stress(voigt=True).tolist()
            except Exception:
                pass
        return result

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mace-mh-1-data
  namespace: models
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-models
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mace-mh-1
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/venv/.mace-mh1-ready
            if [ ! -f "$SENTINEL" ]; then
              echo "Installing venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -q -U pip
              /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu126
              /data/venv/bin/pip install -q "mace-torch>=0.3" ase huggingface_hub fastapi uvicorn
              touch "$SENTINEL"
              echo "Venv ready."
            else
              echo "Venv exists."
            fi
            mkdir -p /data/models
            if [ ! -f /data/models/mace-mh-1.model ]; then
              echo "Downloading MACE-MH-1 weights from HF..."
              /data/venv/bin/python3 -c "
            from huggingface_hub import hf_hub_download
            import shutil
            path = hf_hub_download('mace-foundations/mace-mh-1', filename='mace-mh-1.model')
            shutil.copy(path, '/data/models/mace-mh-1.model')
            print('MACE-MH-1 downloaded')
            "
            else
              echo "MACE-MH-1 already downloaded."
            fi
        resources:
          requests: { cpu: "4", memory: 8Gi }
          limits: { cpu: "8", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            exec /data/venv/bin/python3 /app/server.py
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        resources:
          requests: { cpu: "4", memory: 8Gi }
          limits:
            cpu: "8"
            memory: 16Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "16384"
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: server-config, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: mace-mh-1-data
      - name: server-config
        configMap:
          name: mace-mh-1-server
