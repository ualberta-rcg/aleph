apiVersion: v1
kind: ConfigMap
metadata:
  name: mace-mh-1-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "mace-mh-1",
      "status": "production",
      "type": "force-field",
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "mace-mh-1",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "elements": {
          "type": "array",
          "required": true,
          "description": "array of element symbols e.g. [\"Cu\", \"Cu\", \"Cu\", \"Cu\"]"
        },
        "positions": {
          "type": "array",
          "required": true,
          "description": "array of [x,y,z] positions in Angstroms, one per atom"
        },
        "lattice": {
          "type": "array",
          "required": false,
          "description": "optional 3x3 cell vectors for periodic systems; omit for molecules"
        },
        "head": {
          "type": "string",
          "required": false,
          "default": "omat_pbe",
          "description": "chemistry head: omat_pbe (inorganic solids, default), omol (molecules), spice_wB97M (SPICE), rgd1_b3lyp (RGD1 reactions), oc20_usemppbe (catalysis), matpes_r2scan (Materials Project PES)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "head": {"type": "string", "description": "head used"},
        "energy_eV": {"type": "number", "description": "total potential energy in eV"},
        "forces_eV_per_Ang": {"type": "array", "description": "per-atom forces [n_atoms][3] in eV/Angstrom"},
        "stress_eV_per_Ang3": {"type": "array", "description": "Voigt 6-component stress tensor (periodic systems only)"}
      },
      "catalog": {
        "description_short": "MACE-MH-1 multi-head foundation force field for cross-domain atomistic simulation (inorganic, molecular, surfaces, reactive chemistry).",
        "description": "MACE-MH-1 is a multi-head foundation ML interatomic potential (MLIP) from mace-foundations, covering 89 elements across 7 specialized heads (omat_pbe, omol, spice_wB97M, rgd1_b3lyp, oc20_usemppbe, matpes_r2scan). Each head targets a different chemical domain. Equivariant MACE architecture, float64 precision. Input: elements + positions + optional lattice + head. Returns energy, per-atom forces, and (periodic) stress.",
        "owned_by": "mace-foundations",
        "source": "mace-foundations/mace-mh-1",
        "source_url": "https://huggingface.co/mace-foundations/mace-mh-1",
        "license": "ASL (academic/non-commercial)",
        "parameters": "~50M",
        "precision": "float64",
        "framework": "mace-torch + ASE + PyTorch",
        "domain": "materials-science",
        "subdomain": "interatomic-potentials",
        "tags": ["science", "materials", "force-field", "molecular-dynamics", "chemistry", "multi-head", "gpu", "mace"]
      }
    }
