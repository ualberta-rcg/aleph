apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyllama-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "tinyllama",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "tinyllama",
        "serialize": true,
        "no_stream": true,
        "upstream_model_id": "tinyllama-1.1b"
      },
      "limits": {
        "context_window": 4096,
        "max_completion_tokens": 1800
      },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "cold_start_estimate": "30 seconds",
        "idle_retention": "always-on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": true,
        "reasoning_model": false,
        "strips_thinking": false,
        "supports_streaming": false,
        "needs_json_fixing": true
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 512
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "TinyLlama 1.1B GGUF Q4_K_M, CPU inference via llama.cpp",
        "description": "TinyLlama 1.1B Chat v1.0 quantized to GGUF Q4_K_M (0.67 GB). Pretrained on 3 trillion tokens, fine-tuned with Zephyr recipe (UltraChat + DPO on UltraFeedback). Same architecture and tokenizer as Llama 2. Runs on CPU via llama-cpp-python server. No streaming support. Good for quick tests and simple tasks.",
        "owned_by": "TinyLlama",
        "source": "TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF",
        "source_url": "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF",
        "original_source": "TinyLlama/TinyLlama-1.1B-Chat-v1.0",
        "framework": "llama.cpp",
        "domain": "nlp",
        "subdomain": "small-language-model",
        "parameters": "1.1B",
        "tags": ["chat", "llm", "cpu", "small", "gguf"]
      },
      "server_config": {
        "inference_backend": "llama.cpp",
        "container_image": "ghcr.io/abetlen/llama-cpp-python@sha256:8528cd3c39357e4138a4fd80f17449b6617206e56f0397016c5cb536f89a87d8",
        "gguf_quantization": "Q4_K_M",
        "gguf_file_size": "0.67 GB",
        "prompt_template": "zephyr",
        "note": "CPU-only inference. llama-cpp-python server does not support streaming. No reasoning, no tools, no vision."
      }
    }
