apiVersion: v1
kind: ConfigMap
metadata:
  name: hyenadna-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "hyenadna-6.5m",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "hyenadna",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 8192, "max_input_tokens": 8192 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "30-60 seconds (venv + model on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "DNA sequence(s) over ACGT (model supports up to 160K bp; this deployment truncates to 8192 bp)."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 256]" }, "description": "256-dim mean-pooled (attention-masked) DNA embeddings" },
        "model": { "type": "string", "description": "Model name (hyenadna-160k)" },
        "usage": { "type": "object", "description": "{prompt_tokens (seq length), total_tokens}" }
      },
      "catalog": {
        "description_short": "HyenaDNA medium-160k — long-range DNA embeddings, 256-dim (CPU, scale-to-zero)",
        "description": "HyenaDNA (LongSafari/hyenadna-medium-160k-seqlen-hf): a state-space model using Hyena operators (sub-quadratic, no attention) for long-range DNA modeling — natively handles up to 160K base pairs. This deployment (6.5M params) truncates to 8192 bp and produces 256-dim mean-pooled embeddings for regulatory genomics, promoter prediction, and chromatin-accessibility tasks. Requires einops + trust_remote_code. Served CPU-only via a custom transformers FastAPI server, scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "LongSafari (Hazy Research)",
        "source": "LongSafari/hyenadna-medium-160k-seqlen-hf",
        "source_url": "https://huggingface.co/LongSafari/hyenadna-medium-160k-seqlen-hf",
        "license": "MIT",
        "parameters": "6.5M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server, trust_remote_code)",
        "domain": "genomics",
        "subdomain": "dna-embeddings",
        "gpu": false,
        "embedding_dimensions": 256,
        "pooling": "mean (attention-masked)",
        "max_input_tokens": 8192,
        "tags": ["embedding", "science", "genomics", "dna", "long-range", "state-space", "cpu"]
      }
    }
