apiVersion: v1
kind: ConfigMap
metadata:
  name: hyenadna-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "hyenadna-6.5m",
      "type": "embedding",
      "description_short": "HyenaDNA — long-range DNA embeddings (256-dim, up to 160K bp)",
      "description": "HyenaDNA by HyenaDNA/LongSafari. 6.5M params (medium variant). State-space model using Hyena operators instead of attention, enabling sequence lengths up to 1 million base pairs. This deployment uses the 160K-seqlen variant with max 8192 bp context. Produces 256-dimensional DNA embeddings for long-range regulatory genomics, promoter prediction, and chromatin accessibility. Requires einops and trust_remote_code. Max deployed context 8192 bp (model supports up to 160K).",
      "context_window": 32768,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "LongSafari",
      "source": "LongSafari/hyenadna-medium-160k-seqlen-hf",
      "source_url": "https://huggingface.co/LongSafari/hyenadna-medium-160k-seqlen-hf",
      "license": "MIT",
      "parameters": "6.5M",
      "parameter_count": 6500000,
      "precision": "fp32",
      "architecture": "state-space",
      "framework": "pytorch",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "k8s_name": "hyenadna",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "genomics",
      "subdomain": "dna-embeddings",
      "tags": ["embedding", "science", "genomics", "dna", "long-range"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "DNA sequence(s) using ACGT characters (up to 8192 bp per sequence)"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 256]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace, trust_remote_code=True)",
        "max_seq_length": 8192,
        "model_max_seq_length": 160000,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 256,
        "extra_deps": ["einops"],
        "notes": "Uses Hyena state-space operators instead of attention for sub-quadratic scaling"
      }
    }
