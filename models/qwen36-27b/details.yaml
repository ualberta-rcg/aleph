apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-27b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen36-27b",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "qwen36-27b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 131072,
        "max_completion_tokens": 32768
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "4-5 minutes",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": true,
        "supports_system_prompt": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "default_effort": "medium",
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "none",
            "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "high", "max": "high"
          },
          "on":  {"chat_template_kwargs": {"enable_thinking": true}},
          "off": {"chat_template_kwargs": {"enable_thinking": false}},
          "off_max_tokens": 2048,
          "note": "Managed thinking. Binary enable_thinking (real off). ON (medium/high) exposes `reasoning`; OFF (none/low -> enable_thinking false) -> no reasoning + max_tokens capped to off_max_tokens."
        }
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 32768,
          "thinking": {"enabled": true, "effort": "medium"}
        },
        "meta_tasks": {
          "title": {"max_tokens": 80, "thinking": {"enabled": false}},
          "tags": {"max_tokens": 60, "thinking": {"enabled": false}},
          "followups": {"max_tokens": 220, "thinking": {"enabled": false}}
        }
      },
      "schema_version": 2,
      "custom_params": {
        "schema": {
          "reasoning_effort": {"type": "string", "enum": ["none","low","medium","high"], "default": "medium"}
        },
        "passthrough": true
      },
      "input_map": {
        "messages": {"type": "array", "required": true, "description": "Chat messages [{role, content|content[]}] (content may include image_url blocks)"},
        "max_tokens": {"type": "integer", "required": false, "default": 32768, "max": 32768},
        "temperature": {"type": "float", "required": false, "default": 0.7, "min": 0.0, "max": 2.0},
        "top_p": {"type": "float", "required": false, "default": 0.8},
        "top_k": {"type": "integer", "required": false, "default": 20},
        "stream": {"type": "boolean", "required": false, "default": false},
        "reasoning_effort": {"type": "string", "required": false, "enum": ["none","low","medium","high"], "default": "medium", "description": "none/low = thinking off; medium/high = on"},
        "tools": {"type": "array", "required": false, "description": "OpenAI tool definitions (qwen3_coder parser)"},
        "tool_choice": {"type": "string", "required": false},
        "image": {"type": "string", "required": false, "description": "Base64 image or URL (vision)"}
      },
      "output_map": {
        "id": {"type": "string"}, "object": {"type": "string"}, "model": {"type": "string"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (includes the `reasoning` field when thinking is ON)"},
        "usage": {"type": "object", "description": "prompt_tokens, completion_tokens, total_tokens"}
      },
      "catalog": {
        "description_short": "Qwen3.6-27B: Gated-DeltaNet hybrid, thinking mode, tool calling, vision, 131K context.",
        "description": "Qwen3.6-27B dense model with novel Gated-DeltaNet hybrid architecture. Supports thinking/reasoning mode (on by default), agentic tool calling (qwen3_coder parser), vision (images + video), and 131K context window. Requires vLLM >= 0.19.0.",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen3.6-27B",
        "source_url": "https://huggingface.co/Qwen/Qwen3.6-27B",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "27B dense, TP2",
        "tags": [
          "chat",
          "llm",
          "reasoning",
          "tool-calling",
          "vision",
          "multimodal",
          "novel-arch",
          "agentic"
        ]
      }
    }
