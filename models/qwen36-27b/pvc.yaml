# Qwen3.6-27B dense, novel Gated-DeltaNet hybrid arch (needs newer vLLM).
# Weights (~54 GB) persist on NFS (nfs-models) so scale-from-zero cold starts skip
# re-download. Staged by the ISVC initContainer (gemma-4 venv-on-PVC pattern).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen36-27b
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 110Gi
