# ProtGPT2: Protein sequence generation from nferruz
# GPU (~2GB VRAM), scale-to-zero. HF: nferruz/ProtGPT2
# 28k downloads, MIT
# API: POST /v1/completions
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: protgpt2-server
  namespace: models
data:
  server.py: |
    import os, asyncio, torch
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = "nferruz/ProtGPT2"
    app = FastAPI()
    model = None
    tokenizer = None
    DEVICE = "cpu"

    def load():
        global model, tokenizer, DEVICE
        from transformers import AutoTokenizer, GPT2LMHeadModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading ProtGPT2 on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
        model = GPT2LMHeadModel.from_pretrained(MODEL_ID,
            torch_dtype=torch.float16 if DEVICE == "cuda" else torch.float32)
        model = model.to(DEVICE).eval()
        print(f"ProtGPT2 ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "protgpt2"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "protgpt2", "object": "model", "created": 1700000000,
             "owned_by": "nferruz", "type": "text-generation",
             "description": "ProtGPT2 protein sequence generation"}
        ]}

    @app.post("/v1/completions")
    async def completions(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        prompt = request.get("prompt", "")
        max_tokens = request.get("max_tokens", 100)
        temperature = request.get("temperature", 1.0)
        num_return = request.get("n", 1)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _generate, prompt, max_tokens, temperature, num_return)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _generate(prompt, max_tokens, temperature, num_return):
        enc = tokenizer(prompt, return_tensors="pt")
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            outputs = model.generate(**enc, max_new_tokens=max_tokens,
                temperature=temperature if temperature > 0 else 1.0,
                do_sample=temperature > 0, num_return_sequences=num_return,
                pad_token_id=tokenizer.eos_token_id)
        sequences = [tokenizer.decode(o, skip_special_tokens=True) for o in outputs]
        choices = [{"text": s, "index": i, "finish_reason": "length"} for i, s in enumerate(sequences)]
        return {"id": "gen-1", "object": "text_completion", "model": "protgpt2", "choices": choices}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: protgpt2-data
  namespace: models
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: protgpt2
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_HOME
            value: "/data/hf_cache"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              python3 -m venv /data/venv && /data/venv/bin/pip install -U pip
            fi
            /data/venv/bin/pip install -q 'torch>=2.6' --index-url https://download.pytorch.org/whl/cu126
            /data/venv/bin/pip install -q transformers fastapi uvicorn
            /data/venv/bin/python -c "
            from transformers import AutoTokenizer, GPT2LMHeadModel
            AutoTokenizer.from_pretrained('nferruz/ProtGPT2')
            GPT2LMHeadModel.from_pretrained('nferruz/ProtGPT2')
            "
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "8192" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "8192" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: protgpt2-data }
      - name: app
        configMap: { name: protgpt2-server }
