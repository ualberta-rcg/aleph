apiVersion: v1
kind: ConfigMap
metadata:
  name: protgpt2-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "protgpt2",
      "status": "production",
      "type": "completions",
      "endpoints": {
        "primary": "/v1/completions",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "protgpt2",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 1024,
        "max_completion_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "supports_streaming": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "prompt": {
          "type": "string",
          "required": true,
          "description": "Seed amino-acid sequence (a start methionine \"M\" works). An empty prompt crashes the server — always provide a seed."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 120,
          "max": 512,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 0.7,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature"
        },
        "num_sequences": {
          "type": "integer",
          "required": false,
          "default": 1,
          "description": "Number of sequences to generate"
        }
      },
      "output_map": {
        "model": { "type": "string", "description": "Model name" },
        "sequences": { "type": "array", "description": "Generated protein sequences (amino-acid strings)" }
      },
      "catalog": {
        "description_short": "ProtGPT2 — generates novel protein sequences (amino-acid strings) from a seed (~1.5B, GPT-2)",
        "description": "ProtGPT2 (nferruz) is a protein language model (~1.5B params, GPT-2 architecture) trained on natural protein sequences to generate novel, stable proteins. It generates from scratch or continues a partial seed sequence. Served by a custom FastAPI server on a HAMi GPU slice (~2 GB VRAM). MIT license.",
        "owned_by": "nferruz",
        "source": "nferruz/ProtGPT2",
        "source_url": "https://huggingface.co/nferruz/ProtGPT2",
        "license": "MIT",
        "parameters": "~1.5B",
        "precision": "float16",
        "framework": "transformers (GPT2LMHeadModel) + PyTorch",
        "domain": "biology",
        "subdomain": "protein-generation",
        "tags": ["science", "biology", "protein", "generate", "gpu"]
      }
    }
