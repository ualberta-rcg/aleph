apiVersion: v1
kind: ConfigMap
metadata:
  name: maskrcnn-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "maskrcnn-resnet50",
      "status": "production",
      "type": "segment",
      "endpoints": {
        "primary": "/v1/vision/segment",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "maskrcnn",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "description": "Base64-encoded JPEG or PNG image (data-URI prefix stripped automatically)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "Model name (maskrcnn-resnet50)"},
        "task": {"type": "string", "description": "Always \"segment\""},
        "detections": {
          "type": "array",
          "items": {
            "label": "string — COCO class name (80 classes)",
            "score": "float — confidence 0-1",
            "box": "[x1, y1, x2, y2] pixel coordinates"
          },
          "description": "Instances with score >= 0.5 (hardcoded threshold)"
        }
      },
      "catalog": {
        "description_short": "Mask R-CNN ResNet-50 FPN v2 — instance segmentation (80 COCO classes, torchvision)",
        "description": "Mask R-CNN ResNet-50 FPN v2 from torchvision (46.4M params). Two-stage instance segmentation trained on COCO. Detects objects and returns bounding boxes with class labels and confidence scores. 47.4 mAP@50-95 on COCO. Runs on CPU via PyTorch. Confidence threshold hardcoded at 0.5.",
        "owned_by": "torchvision",
        "source": "torchvision.models.detection.maskrcnn_resnet50_fpn_v2",
        "source_url": "https://pytorch.org/vision/stable/models/mask_rcnn.html",
        "license": "BSD-3-Clause",
        "parameters": "46.4M",
        "precision": "fp32",
        "framework": "pytorch",
        "domain": "computer-vision",
        "subdomain": "instance-segmentation",
        "tags": ["vision", "segment", "instance-segmentation", "coco", "cpu"]
      }
    }
