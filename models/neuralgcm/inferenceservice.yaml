# NeuralGCM: Google DeepMind hybrid physics/ML atmospheric model (CC-BY-SA 4.0)
# Combines neural networks with spectral-dynamics GCM physics
# Uses JAX + dm-haiku. Weights from gs://neuralgcm/models/v1/ (public GCS)
# Resolutions: 2.8°, 1.4°, 0.7° (deterministic and stochastic)
# API: GET /v1/science/info         (model config)
#      POST /v1/science/predict     {"demo": true}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralgcm-server
  namespace: models
data:
  server.py: |
    import asyncio, json
    import numpy as np
    import uvicorn
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse

    app = FastAPI(title="NeuralGCM API")
    model_state = {}

    @app.on_event("startup")
    async def startup():
        loop = asyncio.get_event_loop()
        loop.run_in_executor(None, load)

    @app.get("/health")
    def health():
        return {"status": "ok" if model_state else "loading", "model": "neuralgcm"}

    @app.get("/v1/science/info")
    def info():
        if not model_state:
            return JSONResponse({"error": "model loading"}, 503)
        m = model_state["model"]
        return {
            "model": "NeuralGCM",
            "variant": model_state["variant"],
            "description": "Hybrid ML/physics atmospheric model (Google DeepMind, CC-BY-SA 4.0)",
            "resolution_deg": 2.8,
            "input_variables": ["temperature", "u_wind", "v_wind", "specific_humidity",
                                 "geopotential", "surface_pressure", "precipitation"],
            "output_variables": ["temperature", "u_wind", "v_wind", "specific_humidity",
                                  "geopotential", "surface_pressure"],
            "time_step_hours": 6,
            "n_levels": 37,
        }

    @app.post("/v1/science/predict")
    async def predict(request: dict):
        if not model_state:
            return JSONResponse({"error": "model loading"}, 503)
        demo = request.get("demo", False)
        if not demo:
            return JSONResponse({"error": "Only demo=true supported via API (returns model config)"}, 400)
        m = model_state["model"]
        return {
            "model": "neuralgcm",
            "variant": model_state["variant"],
            "demo": True,
            "description": "NeuralGCM hybrid physics/ML GCM. Pass ERA5 initial conditions for real forecasts.",
            "model_config": {
                "resolution_deg": 2.8,
                "n_pressure_levels": 37,
                "time_step_hours": 6,
            },
        }

    def load():
        print("Loading NeuralGCM...", flush=True)
        try:
            import pickle
            import neuralgcm
            LOCAL_CKPT = "/data/neuralgcm_2_8_deg.pkl"
            with open(LOCAL_CKPT, "rb") as f:
                ckpt = pickle.load(f)
            model = neuralgcm.PressureLevelModel.from_checkpoint(ckpt)
            model_state["model"] = model
            model_state["variant"] = "v1/deterministic_2_8_deg"
            print("NeuralGCM ready (2.8° deterministic).", flush=True)
        except Exception as e:
            import traceback; traceback.print_exc()
            print(f"NeuralGCM load failed: {e}", flush=True)

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neuralgcm-data
  namespace: models
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 2Gi
  storageClassName: nfs-client
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: neuralgcm
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 2
    scaleMetric: concurrency
    initContainers:
      - name: setup
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.neuralgcm-ready-v1
            if [ -f "$SENTINEL" ]; then echo "Already set up."; exit 0; fi
            echo "Installing neuralgcm and dependencies..."
            pip install -q neuralgcm jax jaxlib gcsfs
            echo "Pre-downloading NeuralGCM 2.8° checkpoint from GCS..."
            python3 -c "
            import pickle, gcsfs
            gcs = gcsfs.GCSFileSystem(token='anon')
            with gcs.open('gs://neuralgcm/models/v1/deterministic_2_8_deg.pkl', 'rb') as f:
                ckpt = pickle.load(f)
            with open('/data/neuralgcm_2_8_deg.pkl', 'wb') as f:
                pickle.dump(ckpt, f)
            print('checkpoint saved, params count:', len(ckpt['params']))
            "
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "4", memory: 8Gi }
          limits: { cpu: "8", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
          - |
            pip install -q neuralgcm jax jaxlib dm-haiku fastapi uvicorn 2>&1 | tail -3
            exec python3 /app/server.py
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: JAX_PLATFORMS
            value: "cpu"
        resources:
          requests: { cpu: "4", memory: 8Gi }
          limits: { cpu: "8", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
          - { name: server-config, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: neuralgcm-data
      - name: server-config
        configMap:
          name: neuralgcm-server
