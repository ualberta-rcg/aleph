apiVersion: v1
kind: ConfigMap
metadata:
  name: esm2-35m-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "esm2-35m",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "esm2-35m",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 1024,
        "max_input_tokens": 1024
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Protein sequence string or list of strings (1-letter amino acid codes, max 1024 residues)"
        }
      },
      "output_map": {
        "object": {
          "type": "string",
          "description": "Object type (list)"
        },
        "data": {
          "type": "array",
          "items": {
            "object": "string",
            "index": "int",
            "embedding": "[float x 480]"
          },
          "description": "Embedding results (480-dim, mean-pooled)"
        },
        "model": {
          "type": "string",
          "description": "Model name"
        },
        "usage": {
          "type": "object",
          "description": "Token usage stats"
        }
      },
      "catalog": {
        "description_short": "Meta ESM-2 35M, the smallest ESM-2 protein encoder.",
        "description": "Meta ESM-2 35M, the smallest ESM-2 protein encoder. Mean-pooled 480-dim embeddings of amino-acid sequences for fast protein featurization. Served fp16 on a HAMi sub-GPU slice.",
        "owned_by": "Meta AI (FAIR)",
        "source": "facebook/esm2_t12_35M_UR50D",
        "source_url": "https://huggingface.co/facebook/esm2_t12_35M_UR50D",
        "license": "MIT",
        "parameters": "35M",
        "precision": "fp16",
        "framework": "transformers",
        "domain": "proteomics",
        "subdomain": "protein-language-model",
        "tags": [
          "embedding",
          "science",
          "proteomics",
          "protein",
          "tiny",
          "gpu"
        ],
        "gpu": true,
        "max_input_tokens": 1024,
        "input_format": {
          "model": "esm2-35m",
          "input": "protein sequence str or [str] (1-letter AA, <=1024)"
        },
        "embedding_dimensions": 480,
        "pooling": "mean"
      }
    }
