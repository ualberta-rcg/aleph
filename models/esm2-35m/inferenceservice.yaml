# ESM2 35M: Tiny protein encoder from Meta
# GPU (~0.5GB VRAM), scale-to-zero. HF: facebook/esm2_t12_35M_UR50D
# 266k downloads, MIT
# API: POST /v1/embeddings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: esm2-35m-server
  namespace: models
data:
  server.py: |
    import os, asyncio, torch
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = "facebook/esm2_t12_35M_UR50D"
    app = FastAPI()
    model = None
    tokenizer = None
    DEVICE = "cpu"

    def load():
        global model, tokenizer, DEVICE
        from transformers import AutoTokenizer, EsmModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading ESM2-35M on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
        model = EsmModel.from_pretrained(MODEL_ID,
            torch_dtype=torch.float16 if DEVICE == "cuda" else torch.float32)
        model = model.to(DEVICE).eval()
        print(f"ESM2-35M ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "esm2-35m"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "esm2-35m", "object": "model", "created": 1700000000,
             "owned_by": "Meta", "type": "embedding",
             "description": "ESM2 35M tiny protein encoder"}
        ]}

    @app.post("/v1/embeddings")
    async def embeddings(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        sequences = request.get("input") or request.get("sequences")
        if isinstance(sequences, str):
            sequences = [sequences]
        if not sequences:
            return JSONResponse({"error": "'input' required"}, 400)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, sequences)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(sequences):
        enc = tokenizer(sequences, return_tensors="pt", padding=True, truncation=True, max_length=1024)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc)
        mask = enc["attention_mask"].unsqueeze(-1).float()
        emb = (out.last_hidden_state * mask).sum(1) / mask.sum(1)
        emb = emb.cpu().float().numpy()
        data = [{"object": "embedding", "index": i, "embedding": e.tolist()} for i, e in enumerate(emb)]
        return {"object": "list", "data": data, "model": "esm2-35m", "usage": {"prompt_tokens": sum(len(s) for s in sequences), "total_tokens": sum(len(s) for s in sequences)}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esm2-35m-data
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 15Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: esm2-35m
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_HOME
            value: "/data/hf_cache"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              python3 -m venv /data/venv && /data/venv/bin/pip install -U pip
            fi
            /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu121
            /data/venv/bin/pip install -q transformers==4.46.3 fastapi uvicorn
            /data/venv/bin/python -c "
            from transformers import AutoTokenizer, EsmModel
            AutoTokenizer.from_pretrained('facebook/esm2_t12_35M_UR50D')
            EsmModel.from_pretrained('facebook/esm2_t12_35M_UR50D')
            "
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "4", memory: 8Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "3072" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: esm2-35m-data }
      - name: app
        configMap: { name: esm2-35m-server }
