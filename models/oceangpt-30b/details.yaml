apiVersion: v1
kind: ConfigMap
metadata:
  name: oceangpt-30b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "oceangpt-30b",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "oceangpt-30b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 65536,
        "max_completion_tokens": 64000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "2-4 minutes (TP2, MoE 30B)",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 4096
        }
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "items": {"role": "string", "content": "string"},
          "required": true,
          "description": "Chat messages in OpenAI format (system/user/assistant/tool). Bilingual EN/ZH."
        },
        "max_tokens": {"type": "integer", "default": 4096, "max": 64000, "description": "Maximum tokens to generate"},
        "temperature": {"type": "float", "default": 0.7, "min": 0.0, "max": 2.0, "description": "Sampling temperature"},
        "top_p": {"type": "float", "default": 1.0, "min": 0.0, "max": 1.0, "description": "Nucleus sampling probability"},
        "stream": {"type": "boolean", "default": false, "description": "Stream responses via SSE"},
        "tools": {"type": "array", "description": "OpenAI-format tool definitions for function calling (hermes parser)"},
        "tool_choice": {"type": "string", "description": "Tool choice mode: auto, none, or specific tool name"},
        "frequency_penalty": {"type": "float", "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty for repetition"}
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model identifier"},
        "choices": {"type": "array", "items": {"message": {"role": "string", "content": "string"}, "finish_reason": "string"}, "description": "Generated chat completions, may include tool_calls when tools are provided"},
        "usage": {"prompt_tokens": "int", "completion_tokens": "int", "total_tokens": "int"}
      },
      "catalog": {
        "description_short": "OceanGPT 30B MoE ocean science model. 128 experts, 8 active, bilingual EN/ZH.",
        "description": "OceanGPT-basic-30B-A3B-Instruct is a 30.5B parameter MoE model based on Qwen3 MoE architecture, fine-tuned for ocean science (marine biology, oceanography, climate, fisheries). 128 experts with 8 active per token (~3B active params). Trained on Huawei Ascend 910B. Bilingual English and Chinese. Chat template includes full tool calling support (Qwen3/hermes XML format). Context: 262K native, limited to 64K on 2x L40S with 4.2x KV headroom. No reasoning mode, no vision.",
        "owned_by": "zjunlp",
        "source": "zjunlp/OceanGPT-basic-30B-A3B-Instruct",
        "source_url": "https://huggingface.co/zjunlp/OceanGPT-basic-30B-A3B-Instruct",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "30.5B MoE (3B active)",
        "tags": [
          "chat",
          "llm",
          "ocean",
          "marine",
          "science",
          "moe",
          "bilingual",
          "tools"
        ]
      },
      "server_config": {
        "note": "vLLM v0.20.2, TP2 (2x L40S). --disable-custom-all-reduce for L40S. --trust-remote-code for Qwen3 MoE. --tool-call-parser hermes + --enable-auto-tool-choice for tool calling. max-model-len=65536 (64K) with 4.2x KV headroom on 2x L40S. VRAM guard script checks 25GB free before starting."
      }
    }
