# OceanGPT-30B-A3B-Instruct: ocean science LLM (zjunlp/OceanGPT-basic-30B-A3B-Instruct).
# Qwen3-MoE: 30.5B total (128 experts, 8 active), ~3B active. ~61GB → 2x L40S TP.
# Persisted helper venv + weights on RWX PVC (gemma-4 pattern); scale-to-zero, 15m idle.
# Tools (hermes). --disable-custom-all-reduce (L40S NODE topology, no NVLink P2P).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: oceangpt-30b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "3600s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model. Verify config + tokenizer (not just config),
            # so an interrupted download is re-run.
            if [ -f /data/model/config.json ] && { [ -f /data/model/tokenizer.json ] || [ -f /data/model/tokenizer_config.json ]; }; then
                echo "OceanGPT weights already on PVC, skipping download."
            else
                echo "Downloading zjunlp/OceanGPT-basic-30B-A3B-Instruct ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="zjunlp/OceanGPT-basic-30B-A3B-Instruct",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: oceangpt-30b
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command: ["vllm", "serve", "/data/model"]
        args:
          - --served-model-name=oceangpt-30b
          - --port=8080
          - --tensor-parallel-size=2
          - --max-model-len=65536
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
          - --disable-custom-all-reduce
          - --tool-call-parser=hermes
          - --enable-auto-tool-choice
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 48Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: oceangpt-30b
            mountPath: /data
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: oceangpt-30b
        persistentVolumeClaim:
          claimName: oceangpt-30b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
