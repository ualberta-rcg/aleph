apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen25-vl-72b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen25-vl-72b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen25-vl-72b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 32768, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.7, "top_p": 0.8, "max_tokens": 8192 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": {
        "schema": {
          "top_k": { "type": "integer", "default": 20 },
          "repetition_penalty": { "type": "number", "default": 1.05 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages; content may include image_url objects" },
        "max_tokens": { "type": "integer", "required": false, "default": 4096, "max": 32768, "description": "Maximum tokens to generate" },
        "temperature": { "type": "float", "required": false, "default": 0.7, "min": 0.0, "max": 2.0, "description": "Sampling temperature" },
        "top_p": { "type": "float", "required": false, "default": 0.8, "description": "Nucleus sampling threshold" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty" },
        "presence_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Presence penalty" },
        "top_k": { "type": "integer", "required": false, "default": -1, "description": "Top-k sampling (-1 = disabled)" },
        "stop": { "type": "array|string", "required": false, "description": "Stop sequence(s)" },
        "seed": { "type": "integer", "required": false, "description": "Random seed for reproducibility" },
        "image": { "type": "string", "required": false, "description": "Base64-encoded image or URL via image_url in messages (dynamic-resolution, up to 5/prompt)" }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (may include image analysis)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "Qwen2.5-VL-72B — large vision-language model for images, video & visual grounding (4x L40S)",
        "description": "Qwen2.5-VL-72B-Instruct is a large vision-language model. 72.2B dense, GQA (64Q/8KV), 128K max positions, 32K deployed context (BF16 weights at 34.43 GiB/GPU limit KV headroom on L40S 48 GiB; use AWQ variant for 64K context). Supports dynamic-resolution images, video, and up to 5 images per prompt. Visual grounding for GUI agents. No structured tool/function calling. Deployed in BF16 on 4x L40S with TP4.",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen2.5-VL-72B-Instruct",
        "source_url": "https://huggingface.co/Qwen/Qwen2.5-VL-72B-Instruct",
        "license": "Qwen License",
        "parameters": "72.2B dense",
        "precision": "bf16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "vision-language-model",
        "tags": ["chat", "vlm", "vision", "multimodal", "video", "visual-grounding"]
      }
    }
