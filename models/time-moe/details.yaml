apiVersion: v1
kind: ConfigMap
metadata:
  name: time-moe-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "time-moe",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "time-moe",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 10000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min (venv + TimeMoE load + first forecast)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "time_series": {
          "type": "array",
          "required": true,
          "description": "univariate numeric observations (min ~100 values)"
        },
        "prediction_length": {
          "type": "integer",
          "required": false,
          "default": 96,
          "description": "future steps — MUST be one of {1, 96, 192, 336, 720} (others return empty)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "forecast": {"type": "array", "description": "forecasted values (length = prediction_length)"},
        "prediction_length": {"type": "integer", "description": "horizon used"}
      },
      "catalog": {
        "description_short": "TimeMoE-50M mixture-of-experts universal time-series forecasting (Tsinghua).",
        "description": "TimeMoE-50M (Maple728/TimeMoE-50M, Tsinghua, arXiv 2409.16040) is a universal time-series forecasting model using a mixture-of-experts decoder-only transformer. Zero-shot; supports standard prediction lengths {1, 96, 192, 336, 720}. Served via transformers AutoModelForCausalLM (trust_remote_code). bf16 on GPU.",
        "owned_by": "Maple728",
        "source": "Maple728/TimeMoE-50M",
        "source_url": "https://huggingface.co/Maple728/TimeMoE-50M",
        "license": "Apache-2.0",
        "parameters": "50M",
        "precision": "bf16 (GPU) / fp32 (CPU)",
        "framework": "transformers (AutoModelForCausalLM) + torch",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "moe", "gpu"]
      }
    }
