# GLM-Z1-Rumination-32B deep-research model: multi-step synthesis.
# Weights (~65 GB) persist on NFS (nfs-client) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glm-z1-rumination-32b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
