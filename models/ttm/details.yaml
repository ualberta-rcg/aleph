apiVersion: v1
kind: ConfigMap
metadata:
  name: ttm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ttm",
      "status": "production",
      "type": "forecast",
      "description_short": "IBM TinyTimeMixer (TTM-R2) lightweight multi-variate time-series forecasting model (1-5M params).",
      "description": "IBM TinyTimeMixer (TTM-R2) from IBM Granite is an extremely lightweight time-series forecasting model achieving state-of-the-art zero-shot performance with only 1-5M parameters. Supports multi-variate forecasting with configurable context lengths (512-1024) and channel mixing. Uses the granite-tsfm/tsfm_public library. Apache 2.0 license. GPU-capable.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/forecast",
        "health": "/health"
      },
      "owned_by": "ibm-granite",
      "source": "ibm-granite/granite-timeseries-ttm-r2",
      "source_url": "https://huggingface.co/ibm-granite/granite-timeseries-ttm-r2",
      "license": "Apache-2.0",
      "parameters": "1-5M",
      "precision": "float32",
      "architecture": "TinyTimeMixer (lightweight channel-mixing transformer)",
      "framework": "tsfm_public + PyTorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "gpu_type": "L40S-SHARED",
        "min_replicas": 0,
        "max_replicas": 3,
        "timeout": 120,
        "pvc": "ttm-data",
        "image": "python:3.11-slim",
        "venv": true,
        "venv_path": "/data/venv2"
      },
      "routing": {
        "kserve_custom": true,
        "k8s_name": "ttm",
        "api_name": "ttm",
        "gateway_type": "forecast"
      },
      "compatibility": {
        "openai_compatible": false,
        "streaming": false
      },
      "domain": "time-series",
      "subdomain": "forecasting",
      "tags": ["science", "timeseries", "forecast", "efficient", "gpu", "ibm", "granite"],
      "content_types": ["application/json"],
      "tier": 2,
      "input_map": {
        "context": "univariate [v1,v2,...] or multi-variate [[ch1...],[ch2...]]",
        "prediction_length": "future steps (default: 96)",
        "context_length": "historical context length (default: 512)"
      },
      "output_map": {
        "forecast": "predicted values (single or multi-channel)"
      },
      "server_config": {
        "port": 8080,
        "health_path": "/health",
        "model_path": "/data/model",
        "hf_model_id": "ibm-granite/granite-timeseries-ttm-r2"
      }
    }
