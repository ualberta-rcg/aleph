apiVersion: v1
kind: ConfigMap
metadata:
  name: ttm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ttm",
      "status": "production",
      "type": "forecast",
      "endpoints": { "primary": "/v1/science/forecast", "health": "/health" },
      "routing": { "k8s_name": "ttm", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 512, "max_input_tokens": 512 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "context": { "type": "array", "required": true, "description": "numeric observations (univariate [v1,...] or multivariate [[ch1...],[ch2...]])" },
        "prediction_length": { "type": "integer", "required": false, "default": 96, "description": "future steps" },
        "context_length": { "type": "integer", "required": false, "default": 512, "description": "context window (should match model config: 512)" }
      },
      "output_map": {
        "model": { "type": "string" }, "forecast": { "type": "array", "description": "forecasted values [channels][horizon] or [horizon]" }
      },
      "catalog": {
        "description_short": "IBM TinyTimeMixer (TTM) — efficient zero-shot time-series forecasting (1-5M params).",
        "description": "IBM TinyTimeMixer (TTM) is a lightweight MLP-mixer-based time-series foundation model (1-5M params) achieving state-of-the-art zero-shot forecasting. Supports uni- and multi-variate input. 512-context / 96-prediction config.",
        "owned_by": "ibm", "source": "ibm-granite/granite-tinytime-pytorch", "source_url": "https://huggingface.co/ibm-granite/granite-tinytime-pytorch",
        "license": "Apache-2.0", "parameters": "1-5M", "precision": "fp32",
        "framework": "tsfm-public (TinyTimeMixer) + torch",
        "domain": "time-series", "subdomain": "forecasting", "tags": ["science", "timeseries", "forecast", "ibm", "gpu"]
      }
    }
