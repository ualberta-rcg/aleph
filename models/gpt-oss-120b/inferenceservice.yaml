apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-120b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.12-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            pip install -q huggingface_hub
            if [ -f /data/config.json ] && { [ -f /data/tokenizer.json ] || [ -f /data/tokenizer_config.json ]; }; then
                echo "Model already on PVC, skipping download."
            else
                echo "Downloading openai/gpt-oss-120b ..."
                python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="openai/gpt-oss-120b",
                local_dir="/data",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: gpt-oss-120b
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data
          - --served-model-name
          - gpt-oss-120b
          - --port
          - "8080"
          - --tensor-parallel-size
          - "2"
          - --max-model-len
          - "131072"
          - --gpu-memory-utilization
          - "0.90"
          # Mirror the proven gpt-oss-20b recipe (only TP size + gpumem differ).
          # Do NOT add fp8 kv-cache or --enable-prefix-caching: gpt-oss has attention
          # sinks; on L40S the backend is TRITON_ATTN, and TP>1 + prefix-caching
          # returns empty responses (vllm#31422); fp8 breaks sinks.
          - --max-num-seqs
          - "8"
          # L40S TP=2 are NODE topology (PCIe via CPU, no NVLink). vLLM's custom
          # all-reduce busy-waits on a P2P path that stalls here (100% util / ~95W,
          # ~0.25 tok/s). Disabling it falls back to NCCL for correct fast transport.
          - --disable-custom-all-reduce
          - --reasoning-parser
          - openai_gptoss
          - --tool-call-parser
          - openai
          - --enable-auto-tool-choice
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          # NOTE: intentionally NOT forcing VLLM_ATTENTION_BACKEND. Leaving it auto
          # (matches the proven POC cluster 232 config which runs stable on L40S).
          - name: OMP_NUM_THREADS
            value: "1"
        ports:
          - containerPort: 8080
            protocol: TCP
        # Big multi-GPU model: request WHOLE GPUs (no nvidia.com/gpumem) so HAMi does
        # NOT enter vGPU mode. Requesting gpumem triggers libvgpu.so CUDA interception
        # which breaks GPU P2P. Whole devices + --disable-custom-all-reduce (in args)
        # give native NCCL speed. (CUDA_DISABLE_CONTROL proven unnecessary — verified.)
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: gpt-oss-120b
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: gpt-oss-120b
        persistentVolumeClaim:
          claimName: gpt-oss-120b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
