apiVersion: v1
kind: ConfigMap
metadata:
  name: gpt-oss-120b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "gpt-oss-120b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "gpt-oss-120b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 131072,
        "max_completion_tokens": 32768
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "default_effort": "medium",
          "effort_aliases": {
            "none": "low", "minimal": "low", "disabled": "low",
            "low": "low",
            "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "high", "max": "high"
          },
          "on":  { "reasoning_effort": "medium" },
          "off": { "reasoning_effort": "low" },
          "off_max_tokens": 2048,
          "note": "Managed thinking. ON: expose the `reasoning` field; effort low/med/high controls depth; a caller-supplied thinking_token_budget fakes a cap via max_tokens. OFF: effort low + strip reasoning + cap max_tokens to off_max_tokens, so the client sees only a direct answer (no reasoning). gpt-oss always reasons internally; there is no fully-off mode."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": {
          "temperature": 1.0,
          "top_p": 1.0,
          "max_tokens": 16384,
          "thinking": { "enabled": true, "effort": "medium" }
        },
        "meta_tasks": {
          "title":     { "max_tokens": 384, "thinking": { "enabled": false } },
          "tags":      { "max_tokens": 384, "thinking": { "enabled": false } },
          "followups": { "max_tokens": 384, "thinking": { "enabled": false } }
        }
      },
      "custom_params": {
        "schema": {
          "reasoning_effort": { "type": "string", "enum": ["low","medium","high"], "default": "medium" }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": {
          "type": "array",
          "required": true,
          "description": "Chat messages in OpenAI format. Uses harmony response format internally."
        },
        "max_tokens": {
          "type": "integer",
          "required": false,
          "default": 16384,
          "max": 32768,
          "description": "Maximum tokens to generate"
        },
        "temperature": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "min": 0.0,
          "max": 2.0,
          "description": "Sampling temperature"
        },
        "top_p": {
          "type": "float",
          "required": false,
          "default": 1.0,
          "description": "Nucleus sampling threshold"
        },
        "stream": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Enable streaming responses"
        },
        "reasoning_effort": {
          "type": "string",
          "required": false,
          "enum": ["low", "medium", "high"],
          "default": "medium",
          "description": "Configurable reasoning effort. Always-on (no fully-off mode)."
        },
        "tools": {
          "type": "array",
          "required": false,
          "description": "OpenAI-format tool definitions for native harmony function calling"
        },
        "tool_choice": {
          "type": "string",
          "required": false,
          "description": "Tool choice: auto, none, or required"
        },
        "frequency_penalty": {
          "type": "float",
          "required": false,
          "default": 0.0,
          "description": "Frequency penalty (0-2)"
        }
      },
      "output_map": {
        "id": {"type": "string", "description": "Chat completion ID"},
        "object": {"type": "string", "description": "\"chat.completion\""},
        "model": {"type": "string", "description": "Model name"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (includes the `reasoning` field when thinking is ON)"},
        "usage": {"type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)"}
      },
      "catalog": {
        "description_short": "OpenAI GPT-OSS 120B MoE, configurable reasoning + native tools (TP2, 2x L40S)",
        "description": "OpenAI GPT-OSS 120B MoE (MXFP4, 117B total / 5.1B active params, 128 experts, 4 active). Text-only model with configurable reasoning effort (low/medium/high via reasoning_effort), native function calling via harmony format, structured outputs, and agentic capabilities. 128K context (deployed at 131K). Trained with same RL techniques as o3/o4-mini. Near-parity with o4-mini on reasoning benchmarks. Always reasons — no fully-off mode (lowest effort='low'). Apache 2.0 license.",
        "owned_by": "openai",
        "source": "openai/gpt-oss-120b",
        "source_url": "https://huggingface.co/openai/gpt-oss-120b",
        "license": "Apache-2.0",
        "parameters": "117B MoE (5.1B active, 128 experts)",
        "precision": "mxfp4",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "agentic", "moe", "openai", "tool-calling", "text-only", "harmony"]
      }
    }
