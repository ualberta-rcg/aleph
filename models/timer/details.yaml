apiVersion: v1
kind: ConfigMap
metadata:
  name: timer-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "timer",
      "status": "production",
      "type": "forecast",
      "endpoints": { "primary": "/v1/forecast", "health": "/health" },
      "routing": { "k8s_name": "timer", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 0, "max_input_tokens": 10000 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "2-4 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "time_series": { "type": "array", "required": true, "description": "numeric observations" },
        "prediction_length": { "type": "integer", "required": false, "default": 96, "description": "future steps" }
      },
      "output_map": {
        "model": { "type": "string" }, "forecast": { "type": "array", "description": "forecasted values (length=prediction_length)" }
      },
      "catalog": {
        "description_short": "Timer-base-84M universal zero-shot time-series forecasting (THUML/Tsinghua).",
        "description": "Timer (thuml/timer-base-84m, THUML/Tsinghua, 2024) is a universal zero-shot time-series forecasting model — decoder-only transformer pretrained on multi-domain data. 84M params. Configurable prediction lengths. transformers AutoModelForCausalLM (trust_remote_code).",
        "owned_by": "thuml", "source": "thuml/timer-base-84m", "source_url": "https://huggingface.co/thuml/timer-base-84m",
        "license": "Apache-2.0", "parameters": "84M", "precision": "fp16 (GPU)/fp32 (CPU)",
        "framework": "transformers (AutoModelForCausalLM, trust_remote_code) + torch",
        "domain": "time-series", "subdomain": "forecasting", "tags": ["science", "timeseries", "forecast", "gpu"]
      }
    }
