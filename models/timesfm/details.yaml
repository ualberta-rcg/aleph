apiVersion: v1
kind: ConfigMap
metadata:
  name: timesfm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "timesfm",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/forecast",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "timesfm",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 10000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "values": {
          "type": "array",
          "required": true,
          "description": "numeric observations (the time series); accepts values/time_series/series"
        },
        "horizon": {
          "type": "integer",
          "required": false,
          "default": 12,
          "description": "future steps to forecast"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "horizon": {"type": "integer", "description": "forecast horizon"},
        "mean": {"type": "array", "description": "point forecast (length = horizon)"},
        "median": {"type": "array", "description": "median forecast"},
        "quantiles": {"type": "object", "description": "quantile forecasts keyed by level"}
      },
      "catalog": {
        "description_short": "Google TimesFM (500M) decoder-only time-series foundation model.",
        "description": "TimesFM (google/timesfm-2.0-500m-pytorch, ~500M) is a decoder-only foundation model for time-series forecasting — patch-decoder trained on real-world time-series. Returns point + median + quantile forecasts via the timesfm package (TimesFmModelForPrediction).",
        "owned_by": "google",
        "source": "google/timesfm-2.0-500m-pytorch",
        "source_url": "https://huggingface.co/google/timesfm-2.0-500m-pytorch",
        "license": "Apache-2.0",
        "parameters": "~500M",
        "precision": "fp32",
        "framework": "timesfm + torch",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "google", "gpu"]
      }
    }
