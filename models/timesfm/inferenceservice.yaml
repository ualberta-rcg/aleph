# TimesFM 2.0: Google time-series foundation model
# GPU, scale-to-zero. API: POST /v1/forecast
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timesfm-server
  namespace: models
data:
  server.py: |
    """
    TimesFM 2.0: Google's time-series foundation model (google/timesfm-2.0-500m-pytorch).
    Uses HuggingFace Transformers TimesFmModelForPrediction (v2.0/500M).
    API: POST /v1/forecast — returns point forecasts + quantiles.
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_ID = "google/timesfm-2.0-500m-pytorch"

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        from transformers import TimesFmModelForPrediction
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading TimesFM 2.0 on {DEVICE}...", flush=True)
        model = TimesFmModelForPrediction.from_pretrained(
            MODEL_ID, attn_implementation="sdpa"
        )
        model = model.to(torch.float32).to(DEVICE).eval()
        print(f"TimesFM 2.0 ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "timesfm", "device": DEVICE}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "timesfm-500m", "object": "model", "created": 1700000000,
             "owned_by": "google", "type": "forecast"}
        ]}

    @app.post("/v1/forecast")
    async def forecast(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)

        values = request.get("values") or request.get("time_series") or request.get("series")
        if not values or not isinstance(values, list):
            return JSONResponse({"error": "'values' field required"}, 400)

        horizon = request.get("horizon", 12)

        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _predict, values, horizon)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _predict(values, horizon):
        import torch
        import numpy as np

        # TimesFM patch_length=32, pad if needed
        patch_len = 32
        if len(values) < patch_len:
            mean_val = sum(values) / len(values)
            padded = [mean_val] * (patch_len - len(values)) + list(values)
        else:
            padded = list(values)

        past_values = [torch.tensor(padded, dtype=torch.float32).to(DEVICE)]
        freq = torch.tensor([0], dtype=torch.long).to(DEVICE)  # 0=low freq

        with torch.no_grad():
            outputs = model(past_values=past_values, freq=freq, return_dict=True)

        mean_preds = outputs.mean_predictions[0].cpu().numpy()[:horizon].tolist()

        result = {
            "model": "timesfm-500m",
            "horizon": horizon,
            "mean": mean_preds,
            "mean_sample": mean_preds[:5],
        }

        if hasattr(outputs, 'full_predictions') and outputs.full_predictions is not None:
            full = outputs.full_predictions[0].cpu().numpy()
            # full shape: (num_quantiles, horizon) or (horizon, num_quantiles)
            result["quantile_shape"] = list(full.shape)
            result["quantile_sample"] = full[:, :horizon].tolist() if full.ndim == 2 else full[:horizon].tolist()

        result["input_len"] = len(padded)
        return result

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: timesfm
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.timesfm-ready-v3
            if [ -f "$SENTINEL" ]; then echo "Already set up."; exit 0; fi
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -q -U pip
            fi
            echo "Installing dependencies..."
            /data/venv/bin/pip install -q 'torch>=2.5' --index-url https://download.pytorch.org/whl/cu126
            /data/venv/bin/pip install -q 'transformers>=4.51,<4.53' numpy fastapi uvicorn huggingface_hub
            echo "Downloading TimesFM 2.0 weights..."
            HF_HOME=/data/hf_cache /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            snapshot_download('google/timesfm-2.0-500m-pytorch', local_dir='/data/model',
                local_dir_use_symlinks=False)
            print('Weights downloaded.')
            "
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: timesfm-data
      - name: app
        configMap:
          name: timesfm-server
