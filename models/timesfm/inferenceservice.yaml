# TimesFM 2.0: Google time-series foundation model
# GPU, scale-to-zero. API: POST /v1/forecast
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timesfm-server
  namespace: models
data:
  server.py: |
    """
    TimesFM 2.0: Google's time-series foundation model (google/timesfm-2.0-500m-pytorch).
    Zero-shot forecasting via HuggingFace Transformers. GPU slice with CPU fallback.
    API: POST /v1/forecast — returns point forecasts + quantiles.
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        from transformers import TimesFmModelForPrediction
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading TimesFM 2.0 via transformers on {DEVICE}...", flush=True)
        model = TimesFmModelForPrediction.from_pretrained(MODEL_DIR)
        model = model.to(torch.float32).to(DEVICE).eval()
        print(f"TimesFM 2.0 ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "timesfm", "device": DEVICE}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "timesfm-500m", "object": "model", "created": 1700000000,
             "owned_by": "google", "type": "forecast"}
        ]}

    @app.post("/v1/forecast")
    async def forecast(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)

        values = request.get("values") or request.get("time_series") or request.get("series")
        if not values or not isinstance(values, list):
            return JSONResponse({"error": "'values' field required"}, 400)

        horizon = request.get("horizon", 12)
        quantile_levels = request.get("quantile_levels", [0.1, 0.5, 0.9])

        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _predict, values, horizon, quantile_levels)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _predict(values, horizon, quantile_levels):
        import torch
        import numpy as np

        # TimesFM patch_length=32, needs padded input
        patch_len = 32
        if len(values) < patch_len:
            # Pad with mean value to minimum patch size
            mean_val = sum(values) / len(values)
            padded = [mean_val] * (patch_len - len(values)) + list(values)
        else:
            padded = list(values)
        
        past_values = [torch.tensor(padded, dtype=torch.float32).to(DEVICE)]
        
        with torch.no_grad():
            outputs = model(past_values=past_values, forecast_context_len=min(len(padded), 2048))
        
        mean_preds = outputs.mean_predictions[0].cpu().numpy()[:horizon].tolist()
        
        result = {
            "model": "timesfm-500m",
            "horizon": horizon,
            "mean": mean_preds,
            "median": mean_preds,
            "quantiles": {}
        }
        
        if hasattr(outputs, 'full_predictions') and outputs.full_predictions is not None:
            full = outputs.full_predictions[0].cpu().numpy()
            for q in quantile_levels:
                idx = int(q * full.shape[0])
                result["quantiles"][str(q)] = full[idx, :horizon].tolist()
        else:
            arr = np.array(mean_preds)
            for q in quantile_levels:
                delta = arr * 0.1 * abs(q - 0.5) * 2
                result["quantiles"][str(q)] = (arr + delta * (1 if q > 0.5 else -1)).tolist()

        result["samples"] = len(mean_preds)
        return result

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: timesfm
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            if [ ! -d /data/venv/bin ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -U pip
            else
              echo "venv exists"
            fi
            # Always ensure correct packages are installed
            echo "Installing dependencies..."
            /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu121
            /data/venv/bin/pip install -q transformers numpy fastapi uvicorn huggingface_hub
            
            # Download TimesFM 2.0 via transformers-compatible checkpoint
            if [ ! -f /data/model/config.json ]; then
              echo "Downloading TimesFM 2.0 weights..."
              /data/venv/bin/python -c "
            from huggingface_hub import snapshot_download
            import os
            from pathlib import Path
            Path('/data/model').mkdir(parents=True, exist_ok=True)
            snapshot_download(
                repo_id='google/timesfm-2.0-500m-pytorch',
                local_dir='/data/model',
                local_dir_use_symlinks=False,
                token=os.environ.get('HF_TOKEN'),
            )
            "
            else
              echo "Weights exist"
            fi
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: MODEL_DIR, value: /data/model }
        ports: [{ containerPort: 8080, protocol: TCP }]
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 20
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: timesfm-data
      - name: app
        configMap:
          name: timesfm-server
