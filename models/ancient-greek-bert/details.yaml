apiVersion: v1
kind: ConfigMap
metadata:
  name: ancient-greek-bert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ancient-greek-bert",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": {
        "k8s_name": "ancient-greek-bert",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": false,
        "min_replicas": 1,
        "idle_retention": "15m",
        "cold_start_estimate": "Always on"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Ancient/Byzantine Greek text (Unicode); truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim [CLS]-pooled embeddings" },
        "model": { "type": "string", "description": "Model name (ancient-greek-bert)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "Ancient Greek BERT — 768-dim embeddings for Ancient/Byzantine Greek",
        "description": "Ancient Greek BERT (pranaydeeps/Ancient-Greek-BERT): 110M BERT-base pre-trained on Ancient Greek texts for Digital Humanities / classical studies. Supports text embeddings and masked-token prediction for Ancient/Byzantine Greek corpora — philological analysis, authorship attribution, textual similarity. 768-dim [CLS]-pooled embeddings, max 512 tokens. Served via a custom transformers FastAPI server. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "pranaydeeps",
        "source": "pranaydeeps/Ancient-Greek-BERT",
        "source_url": "https://huggingface.co/pranaydeeps/Ancient-Greek-BERT",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "nlp",
        "subdomain": "digital-humanities",
        "gpu": false,
        "embedding_dimensions": 768,
        "pooling": "cls",
        "max_input_tokens": 512,
        "tags": ["embedding", "ancient-greek", "digital-humanities", "classics", "nlp", "philology"]
      }
    }
