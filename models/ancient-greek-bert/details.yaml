apiVersion: v1
kind: ConfigMap
metadata:
  name: ancient-greek-bert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "ancient-greek-bert",
      "status": "production",
      "type": "embedding",
      "description_short": "Ancient Greek BERT — embeddings for Ancient and Byzantine Greek (768-dim)",
      "description": "Ancient Greek BERT by pranaydeeps. 110M params. BERT-base model pre-trained on Ancient Greek texts for Digital Humanities and classical studies. Supports masked token prediction and text embeddings for Ancient and Byzantine Greek corpora. Useful for philological analysis, authorship attribution, and textual similarity in classical texts. Max sequence length 512 tokens.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "owned_by": "pranaydeeps",
      "source": "pranaydeeps/Ancient-Greek-BERT",
      "source_url": "https://huggingface.co/pranaydeeps/Ancient-Greek-BERT",
      "license": "MIT",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "min_replicas": 0,
        "max_replicas": 1,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "path_prefix": "/v1/",
        "serialize": false,
        "no_stream": false
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "scientific-nlp",
      "subdomain": "digital-humanities",
      "tags": ["embedding", "ancient-greek", "digital-humanities", "classics", "nlp", "philology"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "text": {
          "type": "string",
          "required": true,
          "description": "Ancient Greek text (Unicode)"
        },
        "texts": {
          "type": "array of strings",
          "required": false,
          "description": "Batch of Ancient Greek texts"
        }
      },
      "output_map": {
        "embeddings": "[[float x 768]]",
        "model": "string",
        "dim": "int (768)"
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 512,
        "pooling": "cls",
        "embedding_dim": 768
      }
    }
