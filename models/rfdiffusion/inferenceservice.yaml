# RFdiffusion: Protein design / backbone generation
# NVIDIA NIM container — pre-built
# NIM: nvcr.io/nim/ipd/rfdiffusion
# API: POST /biology/ipd/rfdiffusion/generate
#      Input: {"input_pdb": "ATOM ...", "contigs": "A19-68/0 5-10", ...}
#      Returns: {"output_pdb": "ATOM ..."}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: rfdiffusion
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: nvcr.io/nim/ipd/rfdiffusion:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ngc-api-key
                key: NGC_API_KEY
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - name: rfdiffusion
            mountPath: /opt/nim/.cache
          - name: shm
            mountPath: /dev/shm
    imagePullSecrets:
      - name: ngc-registry-secret
    volumes:
      - name: rfdiffusion
        persistentVolumeClaim:
          claimName: rfdiffusion
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
