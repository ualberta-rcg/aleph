apiVersion: v1
kind: ConfigMap
metadata:
  name: rnabert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "rnabert",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": { "k8s_name": "rnabert", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 440, "max_input_tokens": 440 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "10m", "cold_start_estimate": "30-60 seconds (venv + model on PVC)" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {}, "custom_params": { "passthrough": true }, "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "RNA sequence(s) (AUGC); truncated to 440 tokens." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 120]" }, "description": "120-dim mean-pooled RNA embeddings" },
        "model": { "type": "string", "description": "Model name (rnabert)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (sequence lengths)" }
      },
      "catalog": {
        "description_short": "RNA-BERT — 768-dim RNA embeddings from structured-alignment pre-training (GPU, scale-to-zero)",
        "description": "RNA-BERT (multimolecule/rnabert, ~86M params): BERT pre-trained on Rfam database structured alignments for RNA secondary-structure and functional-element prediction. Produces 768-dim mean-pooled RNA embeddings. Max 440 tokens. Served via a custom FastAPI server (multimolecule RnaBertModel) on a HAMi GPU slice (8 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "multimolecule",
        "source": "multimolecule/rnabert",
        "source_url": "https://huggingface.co/multimolecule/rnabert",
        "license": "AGPL-3.0",
        "parameters": "86M",
        "precision": "fp32",
        "framework": "multimolecule RnaBertModel (custom FastAPI server)",
        "domain": "genomics", "subdomain": "rna-embeddings",
        "gpu": true, "embedding_dimensions": 120, "pooling": "mean", "max_input_tokens": 440,
        "tags": ["embedding", "science", "genomics", "rna", "structure"]
      }
    }
