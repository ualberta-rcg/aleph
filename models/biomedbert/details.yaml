apiVersion: v1
kind: ConfigMap
metadata:
  name: biomedbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomedbert-110m",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "biomedbert",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text string or list of strings (max 512 tokens)"
        }
      },
      "output_map": {
        "object": {
          "type": "string",
          "description": "Object type (list)"
        },
        "data": {
          "type": "array",
          "items": {
            "object": "string",
            "index": "int",
            "embedding": "[float x 768]"
          },
          "description": "Embedding results (768-dim, mean-pooled)"
        },
        "model": {
          "type": "string",
          "description": "Model name"
        },
        "usage": {
          "type": "object",
          "description": "Token usage stats"
        }
      },
      "catalog": {
        "description_short": "BiomedBERT \u2014 biomedical text embeddings (768-dim)",
        "description": "BiomedBERT (microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract) by Microsoft, 110M params, BERT-base pre-trained from scratch on biomedical text (PubMed abstracts + PMC full text). Produces 768-dim mean-pooled embeddings for biomedical literature mining, clinical NLP, NER and relation extraction. Max 512 tokens. CPU-only.",
        "owned_by": "Microsoft",
        "source": "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
        "source_url": "https://huggingface.co/microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "biomedical",
        "subdomain": "biomedical-nlp",
        "tags": [
          "embedding",
          "science",
          "biomedical",
          "nlp",
          "bert",
          "cpu"
        ],
        "gpu": false,
        "max_input_tokens": 512,
        "input_format": {
          "model": "biomedbert-110m",
          "input": "biomedical text str or [str]"
        },
        "embedding_dimensions": 768,
        "pooling": "mean"
      }
    }
