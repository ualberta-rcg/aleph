# FinBERT: BERT fine-tuned for financial sentiment analysis (ProsusAI/finbert)
# 110M params, Apache 2.0. 6.4M HuggingFace downloads - one of the most popular science-adjacent BERT models.
# Predicts positive/negative/neutral financial sentiment from text.
# API: POST /v1/science/classify  (financial text → sentiment scores)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finbert-server
  namespace: models
data:
  server.py: |
    """
    FinBERT: Financial sentiment classification (positive/negative/neutral).
    API: POST /v1/science/classify -> {"text": "..."} -> {"positive": 0.9, "negative": 0.05, "neutral": 0.05}
         POST /v1/science/embed   -> {"text": "..."} -> {"embedding": [...]}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")
    app = FastAPI()
    tokenizer = None
    model = None
    DEVICE = "cpu"

    def load():
        global tokenizer, model, DEVICE
        import torch
        from transformers import AutoTokenizer, AutoModelForSequenceClassification
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading FinBERT on {DEVICE}...", flush=True)
        tokenizer = AutoTokenizer.from_pretrained(MODEL_DIR)
        model = AutoModelForSequenceClassification.from_pretrained(MODEL_DIR).to(DEVICE)
        model.eval()
        print(f"FinBERT ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "finbert"}

    @app.get("/v1/models")
    async def list_models():
        return {"models": [{"id": "finbert", "description": "FinBERT financial sentiment (6.4M downloads)"}]}

    @app.post("/v1/science/classify")
    async def classify(payload: dict):
        import torch, torch.nn.functional as F
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        texts = payload.get("texts") or ([payload.get("text")] if payload.get("text") else None)
        if not texts:
            return JSONResponse({"error": "provide text or texts"}, 400)
        enc = tokenizer(texts, return_tensors="pt", padding=True, truncation=True, max_length=512)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            logits = model(**enc).logits
        probs = F.softmax(logits, dim=-1).cpu().tolist()
        labels = model.config.id2label
        results = [dict(zip([labels[i] for i in range(len(p))], p)) for p in probs]
        return {"predictions": results, "model": "finbert"}

    @app.post("/v1/science/embed")
    async def embed(payload: dict):
        import torch
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        texts = payload.get("texts") or ([payload.get("text")] if payload.get("text") else None)
        if not texts:
            return JSONResponse({"error": "provide text or texts"}, 400)
        enc = tokenizer(texts, return_tensors="pt", padding=True, truncation=True, max_length=512)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model.bert(**enc)
        embeddings = out.last_hidden_state[:, 0, :].cpu().tolist()
        return {"embeddings": embeddings, "model": "finbert", "dim": len(embeddings[0])}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finbert-data
  namespace: models
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 15Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: finbert
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 1
    scaleMetric: concurrency
    nodeSelector:
      gpu: "on"
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: finbert-data
      - name: server-code
        configMap:
          name: finbert-server
    initContainers:
      - name: model-setup
        image: python:3.11-slim
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
          - name: model-data
            mountPath: /data
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HOME
            value: /data/hf_cache
        command: ["bash", "-c"]
        args:
          - |
            set -e
            VENV=/data/venv
            if [ ! -f "$VENV/bin/python" ] || ! $VENV/bin/python -c "import torch" 2>/dev/null; then
              python -m venv $VENV --clear
              $VENV/bin/pip install --quiet --upgrade pip
              $VENV/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cu121
            fi
            # Pin transformers to a cu121-torch-compatible version (>=4.48 imports
            # torch.float8_e8m0fnu, which the cu121 torch wheel lacks). Idempotent.
            $VENV/bin/pip install --quiet "transformers==4.46.3" huggingface_hub fastapi uvicorn
            if [ ! -f /data/model/config.json ]; then
              $VENV/bin/python -c "
            from huggingface_hub import snapshot_download; import os
            snapshot_download(repo_id='ProsusAI/finbert', local_dir='/data/model', token=os.environ['HF_TOKEN'], ignore_patterns=['*.msgpack','flax_model*','tf_model*'])
            print('Done')
            "
            fi
    containers:
      - name: kserve-container
        image: python:3.11-slim
        # HAMi sub-GPU slice: 3 GiB (FinBERT 110M is tiny; mostly CUDA context).
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "3072"
        volumeMounts:
          - name: model-data
            mountPath: /data
          - name: server-code
            mountPath: /app
        env:
          - name: MODEL_DIR
            value: /data/model
          - name: HF_HOME
            value: /data/hf_cache
          - name: HF_HUB_OFFLINE
            value: "1"
        command: ["bash", "-c"]
        args:
          - |
            /data/venv/bin/python /app/server.py
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 10
