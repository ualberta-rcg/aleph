apiVersion: v1
kind: ConfigMap
metadata:
  name: finbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "finbert",
      "status": "production",
      "type": "classify",
      "endpoints": { "primary": "/v1/science/classify", "health": "/health" },
      "routing": { "k8s_name": "finbert", "no_stream": true, "upstream_model_id": null },
      "limits": { "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false, "supports_tools": false,
        "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "catalog": {
        "description_short": "FinBERT financial sentiment classification (positive/negative/neutral)",
        "description": "ProsusAI FinBERT (110M), a BERT model fine-tuned for financial-text sentiment. Returns calibrated positive/negative/neutral probabilities for a sentence or list of sentences; also exposes a CLS embedding. One of the most downloaded finance NLP models. Served on a HAMi sub-GPU slice.",
        "owned_by": "ProsusAI",
        "source": "ProsusAI/finbert",
        "source_url": "https://huggingface.co/ProsusAI/finbert",
        "license": "Apache-2.0",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "finance",
        "subdomain": "text-classification",
        "labels": ["positive", "negative", "neutral"],
        "embedding_dimensions": 768,
        "max_input_tokens": 512,
        "tags": ["classification", "sentiment", "finance", "nlp", "gpu"],
        "gpu": true,
        "input_format": {
          "model": "finbert",
          "text": "single financial sentence, or",
          "texts": "a list of sentences"
        },
        "output_format": { "predictions": "[{positive: float, negative: float, neutral: float}]" }
      }
    }
