apiVersion: v1
kind: ConfigMap
metadata:
  name: mace-mp-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "mace-mp",
      "status": "production",
      "type": "force-field",
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "mace-mp",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "elements": {
          "type": "array",
          "required": true,
          "description": "array of element symbols e.g. [\"Si\", \"Si\"]"
        },
        "positions": {
          "type": "array",
          "required": true,
          "description": "array of [x,y,z] positions in Angstroms, one per atom"
        },
        "lattice": {
          "type": "array",
          "required": false,
          "description": "optional 3x3 cell vectors for periodic systems; omit for molecules"
        },
        "variant": {
          "type": "string",
          "required": false,
          "default": "medium",
          "description": "model size: \"small\" | \"medium\" (default) | \"large\" (the \"model\" field is the gateway routing id)"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "variant": {"type": "string", "description": "model size used"},
        "energy_eV": {"type": "number", "description": "total potential energy in eV"},
        "forces_eV_per_Ang": {"type": "array", "description": "per-atom forces [n_atoms][3] in eV/Angstrom"},
        "stress_eV_per_Ang3": {"type": "array", "description": "Voigt 6-component stress tensor (periodic systems only)"}
      },
      "catalog": {
        "description_short": "MACE-MP-0 universal ML interatomic potential (89 elements) with small/medium/large variants.",
        "description": "MACE-MP-0 is a universal machine-learning interatomic potential trained on the Materials Project, covering 89 elements via the equivariant MACE architecture. Predicts energy, per-atom forces, and stress from an atomic structure. Three model sizes: small (~2M), medium (~10M, default), large (~30M). Input: elements + positions + optional lattice + model size. Weights from ACEsuit/mace-mp-0.",
        "owned_by": "Cambridge/DeepMind",
        "source": "ACEsuit/mace-mp-0",
        "source_url": "https://huggingface.co/ACEsuit/mace-mp-0",
        "license": "MIT",
        "parameters": "~10M (medium)",
        "precision": "float64",
        "framework": "mace-torch + ASE + PyTorch",
        "domain": "materials-science",
        "subdomain": "interatomic-potentials",
        "tags": ["science", "materials", "force-field", "molecular-dynamics", "chemistry", "physics", "mace", "gpu"]
      }
    }
