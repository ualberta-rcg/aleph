apiVersion: v1
kind: ConfigMap
metadata:
  name: medcpt-query-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "medcpt-query",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "medcpt-query",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 64, "max_input_tokens": 64 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Medical search query/queries (short; the query encoder truncates to 64 tokens). Pair with medcpt-article for asymmetric retrieval."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim [CLS] query embeddings" },
        "model": { "type": "string", "description": "Model name (medcpt-query)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "MedCPT-Query-Encoder — 768-dim medical search-query embeddings (GPU, scale-to-zero)",
        "description": "MedCPT-Query-Encoder (ncbi/MedCPT-Query-Encoder, NCBI/NLM): the query side of MedCPT, a sentence encoder trained on biomedical relevance (PubMed clicks + citation context) for biomedical retrieval. Produces 768-dim [CLS] query embeddings (max 64 tokens) — pair with medcpt-article (the article encoder) for asymmetric query→article search. Served via a custom transformers FastAPI server on a HAMi GPU slice (8 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "NCBI (NLM/NIH)",
        "source": "ncbi/MedCPT-Query-Encoder",
        "source_url": "https://huggingface.co/ncbi/MedCPT-Query-Encoder",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp16 (GPU)",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "retrieval",
        "gpu": true,
        "embedding_dimensions": 768,
        "pooling": "cls",
        "max_input_tokens": 64,
        "tags": ["embedding", "biomedical", "retrieval", "query-encoder", "medcpt"]
      }
    }
