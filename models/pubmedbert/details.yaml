apiVersion: v1
kind: ConfigMap
metadata:
  name: pubmedbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "pubmedbert",
      "type": "embedding",
      "description_short": "PubMedBERT — biomedical text embeddings from Microsoft (768-dim)",
      "description": "PubMedBERT by Microsoft. 110M params. BERT-base model pre-trained from scratch on PubMed abstracts (no general-domain pre-training). Produces 768-dimensional dense embeddings for biomedical NLP. Outperforms BioBERT on domain-specific tasks because vocabulary and pre-training are entirely biomedical. Max sequence length 512 tokens.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "microsoft",
      "source": "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract",
      "source_url": "https://huggingface.co/microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract",
      "license": "MIT",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 1,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "k8s_name": "pubmedbert",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "biomedical",
      "subdomain": "biomedical-text-embeddings",
      "tags": ["embedding", "biomedical", "nlp", "pubmed", "biology", "microsoft"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 768]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 512,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 768
      }
    }
