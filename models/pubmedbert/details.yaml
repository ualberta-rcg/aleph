apiVersion: v1
kind: ConfigMap
metadata:
  name: pubmedbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "pubmedbert",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "pubmedbert",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "30-60 seconds (venv + model on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text (abstract/snippet) to embed; truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled (attention-masked) embeddings" },
        "model": { "type": "string", "description": "Model name (pubmedbert)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "Microsoft PubMedBERT — 768-dim biomedical embeddings, domain-specific vocab (CPU, scale-to-zero)",
        "description": "PubMedBERT (microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract): 110M BERT-base pre-trained from scratch on PubMed abstracts (no general-domain pre-training, domain-specific vocabulary). Outperforms BioBERT on domain-specific tasks. 768-dim mean-pooled dense embeddings, max 512 tokens. Served CPU-only via a custom transformers FastAPI server, scale-to-zero.",
        "owned_by": "Microsoft",
        "source": "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract",
        "source_url": "https://huggingface.co/microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "biomedical-text-embeddings",
        "gpu": false,
        "embedding_dimensions": 768,
        "pooling": "mean (attention-masked)",
        "max_input_tokens": 512,
        "tags": ["embedding", "biomedical", "nlp", "pubmed", "domain-specific", "cpu"]
      }
    }
