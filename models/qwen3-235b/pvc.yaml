# Qwen3-235B-A22B-Instruct-2507-AWQ weights (~118 GB, int4 AWQ) persist on NFS
# (nfs-models default SC) so scale-from-zero cold starts skip the multi-hour
# re-download. Populated once by download-job.yaml. Pad 118 GB -> 160 Gi.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-235b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 160Gi
