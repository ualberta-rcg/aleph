# Qwen3-235B-A22B-Instruct-2507-AWQ — large MoE, 235B total / 22B active, int4 AWQ ~118 GB.
# Ported from POC (232) to cluster 230 / HAMi. 4x L40S tensor parallel.
# Source repo: QuantTrio/Qwen3-235B-A22B-Instruct-2507-AWQ (232's tclf90/... was removed
# from HF; QuantTrio is the maintained, vLLM-compatible AWQ replacement).
#
# Changes vs POC (232):
#   - Runtime: kserve/huggingfaceserver -> raw vLLM (vllm/vllm-openai:v0.20.2), matching
#     the rest of 230's LLM fleet.
#   - nodeSelector: gpu: "on" only (unpinned). Takes 4 whole cards (a whole GPU node).
#   - HAMi 4-card recipe on v2.9.0: nvidia.com/gpu: "4" + an EXPLICIT nvidia.com/gpumem (45000
#     MiB/card, just under the 46068 registered). Leaving gpumem UNSET (the documented "exclusive"
#     path) AND gpumem-percentage:100 both hit the broken exclusive code path on v2.9.0
#     (Project-HAMi/HAMi#1781): the scheduler computes MemPercentagereq=100 -> phantom
#     CardInsufficientMemory and the pod stays Pending on every node even when a GPU node is fully
#     empty. A concrete gpumem value takes the normal memory-fit path (same as the other working
#     models here) and schedules. libvgpu then caps visible VRAM to 45000; vLLM
#     --gpu-memory-utilization is relative to that. (On the 232 POC nvidia.com/gpu just worked
#     because 232 runs the stock nvidia-device-plugin; aleph has no nvidia-device-plugin — HAMi
#     is sole, so every request goes through its vGPU accounting.)
#     --disable-custom-all-reduce is still needed because
#     L40S here are NODE topology (PCIe via CPU, no NVLink P2P): vLLM custom all-reduce
#     hangs at engine init; NCCL fallback is correct + fast.
#   - VLLM_ATTENTION_BACKEND=TRITON_ATTN_VLLM_V1 (L40S/SM89: FlashAttention-3 unavailable).
#   - --quantization awq_marlin for the fast AWQ kernel on SM89.
#   - minReplicas: 0 (Knative scale-to-zero) so the 4-GPU node frees when idle.
#   - weights pre-staged on PVC by download-job.yaml (mounted RO at /mnt/models).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-235b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "30m"
    serving.knative.dev/progress-deadline: "3000s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 1
    scaleTarget: 4
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - --model=/mnt/models
          - --served-model-name=qwen3-235b
          - --tensor-parallel-size=4
          - --quantization=awq_marlin
          - --max-model-len=131072
          - --dtype=float16
          - --gpu-memory-utilization=0.90
          - --max-num-seqs=4
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
          # TP=4 on HAMi/L40S: custom all-reduce hangs at init (no NVLink P2P).
          # Disable -> NCCL native speed.
          - --disable-custom-all-reduce
          - --port=8080
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_ATTENTION_BACKEND          # REQUIRED on L40S (SM89)
            value: TRITON_ATTN_VLLM_V1
          - name: OMP_NUM_THREADS
            value: "1"
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "4"
            nvidia.com/gpumem: "45000"
          limits:
            cpu: "16"
            memory: 128Gi
            nvidia.com/gpu: "4"
            nvidia.com/gpumem: "45000"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 80
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        volumeMounts:
          - name: qwen3-data
            mountPath: /mnt/models
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: qwen3-data
        persistentVolumeClaim:
          claimName: qwen3-235b-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
