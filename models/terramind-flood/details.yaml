apiVersion: v1
kind: ConfigMap
metadata:
  name: terramind-flood-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "terramind-flood",
      "status": "production",
      "type": "classify",
      "endpoints": {
        "primary": "/v1/science/classify",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "terramind-flood",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "5-10 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "S2L2A": "[[[[12 floats], ...], ...], ...] — (C=12, T=4, H=256, W=256) Sentinel-2 L2A bands",
        "S1RTC": "[[[[2 floats], ...], ...], ...] — (C=2, T=4, H=256, W=256) Sentinel-1 RTC VV+VH",
        "DEM": "[[[[1 float], ...], ...], ...] — (C=1, T=4, H=256, W=256) digital elevation model",
        "demo": "boolean — returns synthetic flood mask"
      },
      "output_map": {
        "flood_mask": "[[int]] — (H, W) 0=no-flood, 1=flood",
        "flood_prob": "[[float]] — (H, W) probability [0,1]",
        "flood_area_pct": "float — percentage of scene flooded",
        "model": "terramind-flood"
      },
      "catalog": {
        "description_short": "IBM/ESA TerraMind-base-Flood multi-sensor flood detection. Sentinel-1 + Sentinel-2 + DEM, 256x256.",
        "description": "TerraMind-base-Flood is a multi-sensor flood detection model fine-tuned from TerraMind-1.0-base by IBM and ESA. It uses a ViT encoder + UPerNet decoder architecture processing Sentinel-2 (12 bands), Sentinel-1 RTC (2 bands), and DEM (1 band) data across 4 time steps at 256x256 resolution. Trained on the ImpactMesh-Flood dataset, it produces binary flood segmentation masks with per-pixel probability scores. Apache 2.0 license.",
        "owned_by": "ibm-esa-geospatial",
        "source": "ibm-esa-geospatial/TerraMind-base-Flood",
        "source_url": "https://huggingface.co/ibm-esa-geospatial/TerraMind-base-Flood",
        "license": "Apache-2.0",
        "parameters": "N/A (TerraMind-1.0-base scale)",
        "precision": "fp32",
        "framework": "terratorch 1.2.1 + PyTorch",
        "domain": "earth-observation",
        "subdomain": "flood-detection",
        "tags": ["classify", "science", "earth-observation", "flood", "sentinel-1", "sentinel-2", "dem", "disaster", "segmentation", "gpu"],
        "gpu": true,
        "max_input_tokens": 0
      }
    }
