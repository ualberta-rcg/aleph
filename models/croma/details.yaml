apiVersion: v1
kind: ConfigMap
metadata:
  name: croma-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "croma",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "croma",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "sar_images": "list of [2, H, W] arrays — VV, VH channels (Sentinel-1 SAR)",
        "optical_images": "list of [12, H, W] arrays — Sentinel-2 MSI bands",
        "modality": "both|sar|optical (default: both)"
      },
      "output_map": {
        "data": "[{index, embedding, object}] — per-patch embeddings",
        "model": "croma",
        "object": "list"
      },
      "catalog": {
        "description_short": "CROMA cross-modal remote sensing foundation model. SAR + optical paired satellite imagery. ~300M.",
        "description": "CROMA (Cross-modal Remote sensing foundation model) is a self-supervised model pre-trained on paired SAR (Sentinel-1) and optical (Sentinel-2) satellite imagery. It produces patch embeddings from either or both modalities simultaneously. SAR input is 2-channel (VV, VH) and optical is 12-channel (Sentinel-2 bands). Useful for land classification, change detection, and crop mapping. Returns per-patch embeddings via the PretrainedCROMA interface.",
        "owned_by": "antofuller",
        "source": "antofuller/CROMA",
        "source_url": "https://huggingface.co/antofuller/CROMA",
        "license": "MIT",
        "parameters": "~300M",
        "precision": "fp32",
        "framework": "PyTorch + CROMA repo",
        "domain": "earth-observation",
        "subdomain": "remote-sensing",
        "tags": ["embedding", "science", "earth-observation", "satellite", "sar", "sentinel-1", "sentinel-2", "cross-modal", "gpu"],
        "gpu": true,
        "max_input_tokens": 0,
        "embedding_dimensions": "variable (GAP pooled)",
        "pooling": "GAP (Global Average Pooling)"
      }
    }
