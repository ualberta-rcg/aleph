apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen25-vl-3b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen25-vl-3b",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen25-vl-3b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 2048, "context_window": 4096 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "~2 minutes (6 GB BF16, 1x L40S slice)"
      },
      "behavior": {
        "supports_vision": true,
        "supports_video": true,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.2, "top_p": 0.9, "max_tokens": 2048 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "schema_version": 2,
      "catalog": {
        "description_short": "Qwen2.5-VL-3B — compact vision-language for images, video, OCR & docs (1x GPU slice)",
        "description": "Qwen2.5-VL-3B-Instruct is a compact vision-language model. 3B dense + ViT (36 layers, GQA 16Q/2KV), 32K native context deployed at 4K. Supports dynamic-resolution images, video up to 1+ hour, up to 20 images per prompt, OCR, chart/document parsing, and visual grounding. No tool/function calling. Fits on a single HAMi GPU slice (24 GB).",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen2.5-VL-3B-Instruct",
        "source_url": "https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct",
        "license": "Apache-2.0",
        "parameters": "3B (+ ViT)",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "vision-language",
        "tags": ["chat", "llm", "vision", "video", "multimodal", "ocr"]
      }
    }
