apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen25-vl-3b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen25-vl-3b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen25-vl-3b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 4096, "context_window": 65536 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_video": true,
        "supports_tools": false,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.2, "top_p": 0.9, "max_tokens": 4096 },
        "meta_tasks": {
          "title":     { "max_tokens": 80 },
          "tags":      { "max_tokens": 60 },
          "followups": { "max_tokens": 220 }
        }
      },
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages; content may include image_url objects" },
        "max_tokens": { "type": "integer", "required": false, "default": 2048, "max": 4096, "description": "Maximum tokens to generate" },
        "temperature": { "type": "float", "required": false, "default": 0.2, "min": 0.0, "max": 2.0, "description": "Sampling temperature" },
        "top_p": { "type": "float", "required": false, "default": 0.9, "description": "Nucleus sampling threshold" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty" },
        "presence_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Presence penalty" },
        "top_k": { "type": "integer", "required": false, "default": -1, "description": "Top-k sampling (-1 = disabled)" },
        "stop": { "type": "array|string", "required": false, "description": "Stop sequence(s)" },
        "seed": { "type": "integer", "required": false, "description": "Random seed for reproducibility" },
        "image": { "type": "string", "required": false, "description": "Base64-encoded image or URL via image_url in messages (dynamic-resolution, up to 20/prompt)" }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (may include image analysis)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "Qwen2.5-VL-3B — compact vision-language for images, video, OCR & docs, 32K ctx (1x GPU slice)",
        "description": "Qwen2.5-VL-3B-Instruct is a compact vision-language model. 3B dense + ViT (36 layers, GQA 16Q/2KV), 128K max positions, 64K deployed context. Supports dynamic-resolution images, video up to 1+ hour, up to 20 images per prompt, OCR, chart/document parsing, and visual grounding. No tool/function calling. Fits on a single HAMi GPU slice (24 GB).",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen2.5-VL-3B-Instruct",
        "source_url": "https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct",
        "license": "Apache-2.0",
        "parameters": "3B (+ ViT)",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "vision-language",
        "tags": ["chat", "llm", "vision", "video", "multimodal", "ocr"]
      }
    }
