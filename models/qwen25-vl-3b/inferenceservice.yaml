# Qwen2.5-VL-3B-Instruct: vision-language model. TP1 (1 vGPU slice, 24GB gpumem; 3B+ViT ~6GB so a
# <40GB slice is correct). 64K ctx. Persisted helper venv + weights on RWX PVC (gemma-4 pattern);
# scale-to-zero, 15m idle. API: POST /v1/chat/completions (OpenAI-style with image support).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-vl-3b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 150
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "Qwen2.5-VL-3B weights already on PVC, skipping download."
            else
                echo "Downloading Qwen/Qwen2.5-VL-3B-Instruct ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="Qwen/Qwen2.5-VL-3B-Instruct",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: qwen25-vl-3b
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=qwen25-vl-3b
          - --port=8080
          - --max-model-len=65536
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.90
          - --trust-remote-code
          - '--limit-mm-per-prompt={"image": 20, "video": 1}'
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: 12Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "24576"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "24576"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: qwen25-vl-3b
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: qwen25-vl-3b
        persistentVolumeClaim:
          claimName: qwen25-vl-3b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
