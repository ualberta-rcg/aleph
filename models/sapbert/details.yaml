apiVersion: v1
kind: ConfigMap
metadata:
  name: sapbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "sapbert",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": { "k8s_name": "sapbert", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 25, "max_input_tokens": 25 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "15m", "cold_start_estimate": "1-2 min" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {}, "custom_params": { "passthrough": true }, "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "Biomedical entity mention(s) — short text; truncated to 25 tokens (entity encoder)." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim [CLS] entity embeddings" },
        "model": { "type": "string", "description": "Model name (sapbert)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "SapBERT — 768-dim biomedical entity-linking embeddings (GPU, scale-to-zero)",
        "description": "SapBERT (cambridgeltl/SapBERT-from-PubMedBERT-fulltext): self-alignment pre-trained on PubMedBERT for biomedical entity linking — maps biomedical mentions (diseases, drugs, etc.) to UMLS concept embeddings. Produces 768-dim [CLS] embeddings; max 25 tokens (short entity mentions). Served via a custom transformers FastAPI server on a HAMi GPU slice (8 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "Cambridge LTL",
        "source": "cambridgeltl/SapBERT-from-PubMedBERT-fulltext",
        "source_url": "https://huggingface.co/cambridgeltl/SapBERT-from-PubMedBERT-fulltext",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical", "subdomain": "entity-linking",
        "gpu": true, "embedding_dimensions": 768, "pooling": "cls", "max_input_tokens": 25,
        "tags": ["embedding", "biomedical", "entity-linking", "ner", "concept-normalization"]
      }
    }
