apiVersion: v1
kind: ConfigMap
metadata:
  name: sapbert-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "sapbert",
      "status": "production",
      "type": "embedding",
      "description_short": "SapBERT — biomedical entity linking embeddings (768-dim)",
      "description": "SapBERT by Cambridge LTL. 110M params. Self-alignment pre-trained BERT for biomedical entity linking. Maps biomedical entity mentions (drug names, disease names, gene symbols) to UMLS concept embeddings. Trained on UMLS knowledge graph for named entity normalization, medical concept retrieval, and clinical NLP. Uses CLS token with short context (max 25 tokens). Max sequence length 25 tokens (entity-focused).",
      "context_window": 25,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "owned_by": "cambridgeltl",
      "source": "cambridgeltl/SapBERT-from-PubMedBERT-fulltext",
      "source_url": "https://huggingface.co/cambridgeltl/SapBERT-from-PubMedBERT-fulltext",
      "license": "MIT",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "min_replicas": 0,
        "max_replicas": 1,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "path_prefix": "/v1/",
        "serialize": false,
        "no_stream": false
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "biomedical",
      "subdomain": "entity-linking",
      "tags": ["embedding", "biomedical", "nlp", "entity-linking", "umls", "ner", "concept-normalization"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "text": {
          "type": "string",
          "required": true,
          "description": "Biomedical entity mention (drug name, disease, gene symbol)"
        },
        "texts": {
          "type": "array of strings",
          "required": false,
          "description": "Batch of entity mentions"
        }
      },
      "output_map": {
        "embeddings": "[[float x 768]]",
        "model": "string",
        "dim": "int (768)"
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 25,
        "pooling": "cls",
        "embedding_dim": 768
      }
    }
