apiVersion: v1
kind: ConfigMap
metadata:
  name: science-embed-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "science-embed",
      "type": "embedding",
      "description_short": "Shared embedding service backing ESM2-650M, Nucleotide Transformer 500M, and ESM2-3B models.",
      "description": "Science-embed is a shared standalone Deployment (not an InferenceService) that serves multiple science embedding models from a single pod. Currently hosts: esm2-650m (CPU), nucleotide-transformer-500m (CPU), and esm2-3b (GPU). Uses a single FastAPI server that routes based on the 'model' field in the request. Models are loaded from the shared small-models PVC. The nucleotide-transformer-500m model is exposed to users via the gateway as an EXTRA_MODELS backend.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": ["/v1/embeddings"],
      "owned_by": "shared",
      "source": "multiple",
      "source_url": "multiple",
      "license": "various",
      "parameters": "multiple",
      "precision": "float32 (CPU) / float16 (GPU)",
      "architecture": "Shared multi-model embedding server",
      "framework": "transformers (ESM + AutoModel) + PyTorch",
      "deployment": {
        "type": "standalone-deployment",
        "not_inferenceservice": true,
        "replicas": 1,
        "cpu_request": "4",
        "memory_request": "16Gi",
        "image": "python:3.11-slim",
        "pvc": "small-models (readOnly)",
        "models_dir": "/mnt/models/cpu-models",
        "serviced_models": ["esm2-650m", "nucleotide-transformer-500m", "esm2-3b"]
      },
      "routing": {
        "backend": "http://science-embed.models.svc.cluster.local:8080",
        "gateway_type": "extra_models",
        "exposed_as": "nucleotide-transformer-500m"
      },
      "compatibility": {
        "openai_compatible": true,
        "streaming": false
      },
      "domain": "shared-infrastructure",
      "subdomain": "embedding-backend",
      "tags": ["shared", "embedding", "esm2", "nucleotide-transformer", "protein", "genomics", "backend"],
      "content_types": ["application/json"],
      "tier": 1,
      "input_map": {
        "model": "one of: esm2-650m, nucleotide-transformer-500m, esm2-3b",
        "input": "string or array of strings"
      },
      "output_map": {
        "data": "array of embedding objects",
        "model": "model name used"
      },
      "server_config": {
        "port": 8080,
        "health_path": "/health",
        "max_lengths": {"esm2-650m": 1022, "esm2-3b": 1022, "nucleotide-transformer-500m": 2048}
      }
    }
