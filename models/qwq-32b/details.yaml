apiVersion: v1
kind: ConfigMap
metadata:
  name: qwq-32b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwq-32b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwq-32b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 32768, "context_window": 32768 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "~3 minutes (64 GB FP16, 2x L40S)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "always_on",
          "off_max_tokens": 4096,
          "note": "Managed always-on thinking. qwq always reasons (deepseek_r1 parser). Default ON -> expose the `reasoning` field. OFF (reasoning_effort none / meta-task) -> can't stop reasoning, so strip the reasoning + cap max_tokens to off_max_tokens (reduce what fits). Meta-tasks may still come back short/empty (qwq thinks a lot)."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 0.6, "top_p": 0.95, "max_tokens": 32768 },
        "meta_tasks": {
          "title":     { "max_tokens": 1500, "thinking": {"enabled": false} },
          "tags":      { "max_tokens": 1500, "thinking": {"enabled": false} },
          "followups": { "max_tokens": 3000, "thinking": {"enabled": false} }
        }
      },
      "custom_params": {
        "schema": {
          "top_k": { "type": "integer", "default": 40 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": { "type": "array", "required": true, "description": "Chat messages (system/user/assistant)" },
        "max_tokens": { "type": "integer", "required": false, "default": 32768, "max": 32768, "description": "Maximum tokens to generate" },
        "temperature": { "type": "float", "required": false, "default": 0.6, "min": 0.0, "max": 2.0, "description": "Sampling temperature (HF recommends 0.6)" },
        "top_p": { "type": "float", "required": false, "default": 0.95, "description": "Nucleus sampling threshold (HF recommends 0.95)" },
        "stream": { "type": "boolean", "required": false, "default": false, "description": "Enable streaming responses" },
        "tools": { "type": "array", "required": false, "description": "OpenAI-format tool definitions (hermes parser)" },
        "tool_choice": { "type": "string", "required": false, "description": "Tool choice: auto, none, or specific tool" },
        "frequency_penalty": { "type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty (0-2)" },
        "reasoning_effort": { "type": "string", "required": false, "description": "Always-on. 'none' triggers the managed off path (strip reasoning + cap to off_max_tokens); other values are accepted but qwq always reasons." }
      },
      "output_map": {
        "id": { "type": "string", "description": "Chat completion ID" },
        "object": { "type": "string", "description": "\"chat.completion\"" },
        "model": { "type": "string", "description": "Model name" },
        "choices": { "type": "array", "items": { "message": "object", "finish_reason": "string" }, "description": "Response choices (includes the `reasoning` field; may include tool_calls)" },
        "usage": { "type": "object", "description": "Token usage (prompt_tokens, completion_tokens, total_tokens)" }
      },
      "catalog": {
        "description_short": "QwQ-32B reasoning model — always-on CoT thinking, tools, strong STEM (2x L40S)",
        "description": "QwQ-32B is Qwen's dedicated reasoning model. Always-on chain-of-thought with <think/> blocks (deepseek_r1 parser). Based on Qwen2.5 architecture, 32.5B dense params, GQA (40Q/8KV), 131K native context deployed at 32K. Supports tool/function calling via hermes parser. HF recommends temperature 0.6 / top_p 0.95 / top_k 20-40. Always reasons — no thinking toggle needed.",
        "owned_by": "Qwen",
        "source": "Qwen/QwQ-32B",
        "source_url": "https://huggingface.co/Qwen/QwQ-32B",
        "license": "Apache-2.0",
        "parameters": "32.5B dense",
        "precision": "fp16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "tags": ["chat", "llm", "reasoning", "tool-calling", "stem"]
      }
    }
