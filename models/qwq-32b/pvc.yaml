# Qwen QwQ-32B reasoning model. Strong STEM, distinct style from R1 distills.
# Weights (~65 GB) persist on NFS (nfs-client) so scale-from-zero cold starts skip
# re-download. Populated once by download-job.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwq-32b-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
