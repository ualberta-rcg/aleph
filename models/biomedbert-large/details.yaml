apiVersion: v1
kind: ConfigMap
metadata:
  name: biomedbert-large-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomedbert-large",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": {
        "k8s_name": "biomedbert-large",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "10m",
        "cold_start_estimate": "30-60 seconds (venv + model on PVC)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text (abstract/snippet); truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 1024]" }, "description": "1024-dim [CLS]-pooled embeddings" },
        "model": { "type": "string", "description": "Model name (biomedbert-large)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "BiomedBERT-large — 1024-dim biomedical embeddings, PubMed-pretrained (GPU, scale-to-zero)",
        "description": "BiomedBERT-large (microsoft/BiomedNLP-BiomedBERT-large-uncased-abstract): 340M BERT-large pre-trained from scratch on PubMed abstracts (domain-specific vocabulary). State-of-the-art on BioASQ / PubMedQA / BLURB. Produces 1024-dim [CLS]-pooled dense embeddings, max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (10 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "Microsoft",
        "source": "microsoft/BiomedNLP-BiomedBERT-large-uncased-abstract",
        "source_url": "https://huggingface.co/microsoft/BiomedNLP-BiomedBERT-large-uncased-abstract",
        "license": "MIT",
        "parameters": "340M",
        "precision": "fp32",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "biomedical-nlp",
        "gpu": true,
        "embedding_dimensions": 1024,
        "pooling": "cls",
        "max_input_tokens": 512,
        "tags": ["embedding", "biomedical", "nlp", "pubmed", "domain-specific", "bert-large"]
      }
    }
