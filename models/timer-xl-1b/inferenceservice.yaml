# Timer-XL: Universal Time Series Forecasting (1B parameter decoder-only transformer)
# thuml/Timer-XL-1B, Apache 2.0, Tsinghua 2025
# Larger version of Timer-base-84m: stronger zero-shot forecasting across domains
# API: POST /v1/forecast {time_series: [...], prediction_length: 96}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timer-xl-server
  namespace: models
data:
  server.py: |
    """
    Timer-XL: Large Universal Time Series Forecasting Model (1B params)
    Tsinghua / THUML, 2025. Decoder-only transformer pretrained on multi-domain TS data.
    Apache 2.0. HF: thuml/Timer-XL-1B

    API: POST /v1/forecast
    Input:  {"time_series": [v1, v2, ...], "prediction_length": 96}
            time_series: list of floats (univariate). Min 96 values recommended.
            prediction_length: how many future steps to predict (default 96)
    Returns: {"forecast": [...], "model": "timer-xl-1b", "input_length": N, "prediction_length": N}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    app = FastAPI()
    model = None
    DEVICE = "cpu"
    MODEL_ID = "thuml/Timer-XL-1B"

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading Timer-XL-1B on {DEVICE}...", flush=True)
        from transformers import AutoModelForCausalLM, AutoConfig
        AutoConfig.from_pretrained(MODEL_ID, trust_remote_code=True)
        model = AutoModelForCausalLM.from_pretrained(
            MODEL_ID,
            trust_remote_code=True,
            torch_dtype=torch.float16 if DEVICE == "cuda" else torch.float32,
        ).to(DEVICE).eval()
        print("Timer-XL-1B ready.", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model else "loading", "model": "timer-xl-1b"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "timer-xl-1b", "object": "model", "owned_by": "thuml",
             "type": "time-series-forecasting"}
        ]}

    @app.post("/v1/forecast")
    async def forecast(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _forecast, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _forecast(req):
        import torch, numpy as np

        ts = req.get("time_series", [])
        pred_len = req.get("prediction_length", 96)
        if not ts:
            raise ValueError("time_series required")

        ts_arr = np.array(ts, dtype=np.float32)
        if len(ts_arr) < 96:
            pad = np.full(96 - len(ts_arr), ts_arr[0] if len(ts_arr) else 0.0, dtype=np.float32)
            ts_arr = np.concatenate([pad, ts_arr])

        mean, std = ts_arr.mean(), ts_arr.std() + 1e-8
        ts_norm = (ts_arr - mean) / std

        tensor = torch.tensor(ts_norm[-2048:], dtype=torch.float32).unsqueeze(0).to(DEVICE)
        with torch.no_grad():
            output = model.generate(inputs=tensor, max_new_tokens=pred_len)

        forecast = (output[0, -pred_len:].cpu().numpy() * std + mean).tolist()
        return {
            "model": "timer-xl-1b",
            "input_length": len(ts),
            "prediction_length": pred_len,
            "forecast": forecast,
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: timer-xl-1b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 120
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/venv/.timer-xl-ready
            if [ ! -f "$SENTINEL" ]; then
              echo "Creating venv..."
              python3 -m venv /data/venv
              /data/venv/bin/pip install -q -U pip
              /data/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cu126
              /data/venv/bin/pip install -q transformers huggingface_hub fastapi uvicorn
              touch "$SENTINEL"
              echo "Venv ready."
            else
              echo "Venv exists, skipping."
            fi

            if [ ! -d /data/hf_cache/models--thuml--Timer-XL-1B ]; then
              echo "Downloading Timer-XL-1B weights..."
              HF_HOME=/data/hf_cache /data/venv/bin/python -c "
            from transformers import AutoModelForCausalLM, AutoConfig
            AutoConfig.from_pretrained('thuml/Timer-XL-1B', trust_remote_code=True)
            AutoModelForCausalLM.from_pretrained('thuml/Timer-XL-1B', trust_remote_code=True)
            print('Timer-XL-1B cached.')
            "
            else
              echo "Timer-XL-1B already cached."
            fi
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python", "/app/server.py"]
        env:
          - { name: HF_HOME, value: "/data/hf_cache" }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
          limits: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: timer-xl-data }
      - name: app
        configMap: { name: timer-xl-server }
