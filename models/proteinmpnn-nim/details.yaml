apiVersion: v1
kind: ConfigMap
metadata:
  name: proteinmpnn-nim-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "proteinmpnn-nim",
      "status": "production",
      "type": "predict",
      "endpoints": {
        "primary": "/v1/biology/ipd/proteinmpnn/predict",
        "health": "/v1/health/ready"
      },
      "routing": {
        "k8s_name": "proteinmpnn-nim",
        "no_stream": true,
        "strip_v1_prefix": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-3 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input_pdb": {
          "type": "string",
          "required": true,
          "description": "Input protein PDB content (or file name if assets are used)"
        },
        "num_seq_per_target": {
          "type": "integer",
          "required": false,
          "default": 1,
          "min": 1,
          "max": 100,
          "description": "Number of sequences to generate per target structure"
        },
        "sampling_temp": {
          "type": "array",
          "required": false,
          "default": [0.1],
          "description": "Sampling temperatures (0-1) controlling design diversity"
        },
        "ca_only": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Use CA-only model"
        },
        "use_soluble_model": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Use soluble model variant"
        }
      },
      "output_map": {
        "sequences": {
          "type": "array",
          "description": "Designed amino-acid sequences and scores"
        }
      },
      "catalog": {
        "description_short": "ProteinMPNN protein sequence design (NVIDIA NIM).",
        "description": "ProteinMPNN predicts amino-acid sequences from protein backbone structures via the NVIDIA NIM container nvcr.io/nim/ipd/proteinmpnn:1.1.0.",
        "owned_by": "IPD / NVIDIA",
        "source": "nvcr.io/nim/ipd/proteinmpnn:1.1.0",
        "source_url": "https://build.nvidia.com/ipd/proteinmpnn",
        "license": "NVIDIA AI Product Agreement",
        "parameters": "",
        "precision": "fp16",
        "framework": "nim",
        "domain": "biology",
        "subdomain": "protein-design",
        "tags": ["science", "biology", "protein", "design", "nim", "gpu"]
      }
    }
