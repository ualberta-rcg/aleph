# RNA-FM: RNA foundation model for non-coding RNA (multimolecule/rnafm)
# 100M params, RNA-FM license. Trained on 23.7M ncRNA sequences (RNAcentral).
# Embeddings and masked token prediction for RNA sequences.
# API: POST /v1/science/embed  (RNA sequence → embeddings)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rnafm-server
  namespace: models
data:
  server.py: |
    """
    RNA-FM: RNA foundation model embeddings for non-coding RNA sequences.
    API: POST /v1/science/embed -> {"sequence": "AUGCAUGC..."} -> {"embedding": [...]}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    MODEL_DIR = os.environ.get("MODEL_DIR", "/data/model")

    app = FastAPI()
    tokenizer = None
    model = None
    DEVICE = "cpu"

    def load():
        global tokenizer, model, DEVICE
        import torch
        import multimolecule  # registers multimolecule model types
        from multimolecule import RnaTokenizer, RnaFmModel
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading RNA-FM on {DEVICE}...", flush=True)
        tokenizer = RnaTokenizer.from_pretrained(MODEL_DIR)
        model = RnaFmModel.from_pretrained(MODEL_DIR)
        model = model.to(DEVICE)
        model.eval()
        print(f"RNA-FM ready on {DEVICE}", flush=True)

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "rnafm"}

    @app.get("/v1/models")
    async def list_models():
        return {"models": [{"id": "rnafm", "description": "RNA-FM non-coding RNA embeddings (23.7M ncRNA training)"}]}

    @app.post("/v1/science/embed")
    async def embed(payload: dict):
        import torch
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        seqs = payload.get("sequences") or ([payload.get("sequence")] if payload.get("sequence") else None)
        if not seqs:
            return JSONResponse({"error": "provide sequence or sequences"}, 400)
        enc = tokenizer(seqs, return_tensors="pt", padding=True, truncation=True, max_length=1024)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc)
        # Mean pool over sequence length (excluding special tokens)
        attention_mask = enc["attention_mask"]
        token_embeds = out.last_hidden_state
        mask_expanded = attention_mask.unsqueeze(-1).float()
        embeddings = (token_embeds * mask_expanded).sum(1) / mask_expanded.sum(1)
        return {"embeddings": embeddings.cpu().tolist(), "model": "rnafm", "dim": embeddings.shape[-1]}

    @app.post("/v1/embeddings")
    async def openai_embeddings(payload: dict):
        # OpenAI-style: {model, input(str|list of RNA seq)} -> {object, data:[{embedding}], model, usage}
        import torch
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        inp = payload.get("input")
        if inp is None:
            inp = payload.get("sequences") or ([payload.get("sequence")] if payload.get("sequence") else None)
        seqs = [inp] if isinstance(inp, str) else list(inp or [])
        if not seqs or not seqs[0]:
            return JSONResponse({"error": "provide 'input' (RNA sequence string or list)"}, 400)
        enc = tokenizer(seqs, return_tensors="pt", padding=True, truncation=True, max_length=1024)
        enc = {k: v.to(DEVICE) for k, v in enc.items()}
        with torch.no_grad():
            out = model(**enc)
        mask = enc["attention_mask"].unsqueeze(-1).float()
        emb = ((out.last_hidden_state * mask).sum(1) / mask.sum(1)).cpu().tolist()
        data = [{"object": "embedding", "index": i, "embedding": e} for i, e in enumerate(emb)]
        pt = sum(len(s) for s in seqs)
        return JSONResponse({"object": "list", "data": data, "model": payload.get("model", "rnafm"),
                             "usage": {"prompt_tokens": pt, "total_tokens": pt}})

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: rnafm
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "10m"
    autoscaling.knative.dev/scaleToZeroPodRetentionPeriod: "10m"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 1
    scaleMetric: concurrency
    nodeSelector:
      gpu: "on"
    volumes:
      - name: model-data
        persistentVolumeClaim:
          claimName: rnafm-data
      - name: server-code
        configMap:
          name: rnafm-server
    initContainers:
      - name: model-setup
        image: python:3.11-slim
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
          - name: model-data
            mountPath: /data
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HOME
            value: /data/hf_cache
        command: ["bash", "-c"]
        args:
          - |
            set -e
            VENV=/data/venv
            if [ ! -f "$VENV/bin/python" ] || ! $VENV/bin/python -c "import multimolecule, fastapi; from multimolecule import RnaFmModel" 2>/dev/null; then
              echo "Creating venv..."
              python -m venv $VENV --clear
              $VENV/bin/pip install --quiet --upgrade pip
              $VENV/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
              $VENV/bin/pip install --quiet "multimolecule" transformers huggingface_hub fastapi uvicorn
              echo "Venv ready"
            else
              echo "Venv OK"
            fi
            if [ ! -f /data/model/config.json ]; then
              echo "Downloading RNA-FM..."
              $VENV/bin/python -c "
            from huggingface_hub import snapshot_download
            import os
            snapshot_download(
              repo_id='multimolecule/rnafm',
              local_dir='/data/model',
              token=os.environ['HF_TOKEN'],
              ignore_patterns=['*.msgpack','flax_model*','tf_model*','*.h5'],
            )
            print('Download complete')
            "
            else
              echo "Model already downloaded"
            fi
    containers:
      - name: kserve-container
        image: python:3.11-slim
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
          limits:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "8192"
        volumeMounts:
          - name: model-data
            mountPath: /data
          - name: server-code
            mountPath: /app
        env:
          - name: MODEL_DIR
            value: /data/model
          - name: HF_HOME
            value: /data/hf_cache
          - name: HF_HUB_OFFLINE
            value: "1"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            /data/venv/bin/python /app/server.py
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 10
