apiVersion: v1
kind: ConfigMap
metadata:
  name: rnafm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "rnafm",
      "status": "production",
      "type": "embedding",
      "description_short": "RNA foundation model for non-coding RNA (100M, RNAcentral)",
      "description": "RNA-FM from multimolecule is a 100M parameter foundation model trained on 23.7M ncRNA sequences from RNAcentral. Produces embeddings for non-coding RNA functional prediction and structure analysis. Uses multimolecule RnaTokenizer and RnaFmModel. RNA-FM license (non-commercial).",
      "context_window": 1024,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "owned_by": "multimolecule",
      "source": "multimolecule/rnafm",
      "source_url": "https://huggingface.co/multimolecule/rnafm",
      "license": "RNA-FM License (non-commercial)",
      "parameters": "100M",
      "precision": "float32",
      "architecture": "RNA-FM (Transformer, trained on RNAcentral)",
      "framework": "multimolecule + transformers + torch",
      "deployment": {"image": "python:3.11-slim", "gpu": true, "min_replicas": 0, "max_replicas": 1, "cpu_request": "1", "memory_request": "2Gi", "pvc": "rnafm-data", "pvc_size": "5Gi", "node_selector": "NVIDIA-L40S-SHARED", "timeout": 120},
      "routing": {"kserve_custom": true, "path_prefix": "/v1/", "isvc_name": "rnafm", "api_name": "rnafm"},
      "compatibility": {"openai_embeddings": false, "input_fields": ["sequence", "sequences"]},
      "domain": "genomics",
      "subdomain": "rna-embedding",
      "tags": ["embedding", "science", "genomics", "rna", "ncRNA", "gpu"],
      "content_types": ["text"],
      "languages": ["rna"],
      "input_map": {"sequence": "RNA sequence (AUGC)", "sequences": "[str] multiple sequences"},
      "output_map": {"embeddings": "[[float]]", "model": "rnafm", "dim": "int"},
      "tier": 2
    }
