apiVersion: v1
kind: ConfigMap
metadata:
  name: rnafm-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "rnafm",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "secondary": ["/v1/science/embed"], "health": "/health" },
      "routing": { "k8s_name": "rnafm", "serialize": false, "no_stream": true, "upstream_model_id": null },
      "limits": { "max_completion_tokens": 0, "context_window": 1024, "max_input_tokens": 1024 },
      "scaling": { "scale_to_zero": true, "min_replicas": 0, "idle_retention": "10m", "cold_start_estimate": "30-60 seconds (venv + model on PVC)" },
      "behavior": { "supports_vision": false, "supports_tools": false, "supports_system_prompt": false, "reasoning_model": false, "strips_thinking": false },
      "param_translation": { "thinking": { "mode": "none" }, "max_tokens": { "field": null } },
      "defaults": {}, "custom_params": { "passthrough": true }, "schema_version": 2,
      "input_map": { "input": { "type": "string or array of strings", "required": true, "description": "RNA sequence(s) (AUGC); truncated to 1024 tokens." } },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 640]" }, "description": "640-dim mean-pooled RNA embeddings" },
        "model": { "type": "string", "description": "Model name (rnafm)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens} (sequence lengths)" }
      },
      "catalog": {
        "description_short": "RNA-FM — non-coding RNA embeddings, 640-dim (GPU, scale-to-zero)",
        "description": "RNA-FM (multimolecule/rnafm, ~100M params): a foundation model for non-coding RNA, trained on 23.7M ncRNA sequences from RNAcentral. Produces 640-dim mean-pooled RNA embeddings for structure/function prediction. Max 1024 tokens. Served via a custom FastAPI server (multimolecule RnaFmModel) on a HAMi GPU slice (8 GiB), scale-to-zero. Serves the standard OpenAI /v1/embeddings (legacy /v1/science/embed kept).",
        "owned_by": "multimolecule",
        "source": "multimolecule/rnafm",
        "source_url": "https://huggingface.co/multimolecule/rnafm",
        "license": "AGPL-3.0",
        "parameters": "100M",
        "precision": "fp32",
        "framework": "multimolecule RnaFmModel (custom FastAPI server)",
        "domain": "genomics", "subdomain": "rna-embeddings",
        "gpu": true, "embedding_dimensions": 640, "pooling": "mean", "max_input_tokens": 1024,
        "tags": ["embedding", "science", "genomics", "rna", "non-coding"]
      }
    }
