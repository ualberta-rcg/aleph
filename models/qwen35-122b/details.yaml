apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen35-122b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen35-122b",
      "status": "production",
      "type": "chat",
      "endpoints": { "primary": "/v1/chat/completions", "health": "/v1/models" },
      "routing": {
        "k8s_name": "qwen35-122b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 32768, "context_window": 131072 },
      "scaling": { "scale_to_zero": false, "min_replicas": 1, "idle_retention": "15m", "cold_start_estimate": "Always on" },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "toggle",
          "on":  { "chat_template_kwargs": { "enable_thinking": true } },
          "off": { "chat_template_kwargs": { "enable_thinking": false } },
          "off_max_tokens": 2048,
          "note": "Managed thinking. Binary enable_thinking. ON exposes `reasoning`; OFF -> no reasoning + max_tokens capped to off_max_tokens."
        },
        "max_tokens": { "field": "max_tokens" },
        "stop": { "field": "stop" }
      },
      "defaults": {
        "chat": { "temperature": 1.0, "top_p": 0.95, "max_tokens": 32768, "thinking": { "enabled": true } },
        "meta_tasks": {
          "title":     { "max_tokens": 80,  "thinking": { "enabled": false } },
          "tags":      { "max_tokens": 60,  "thinking": { "enabled": false } },
          "followups": { "max_tokens": 220, "thinking": { "enabled": false } }
        }
      },
      "custom_params": {
        "schema": {
          "enable_thinking": { "type": "boolean", "default": true },
          "top_k": { "type": "integer", "default": 20 }
        },
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "messages": {"type": "array", "required": true, "description": "Chat messages [{role, content}]"},
        "max_tokens": {"type": "integer", "required": false, "default": 32768, "max": 32768},
        "temperature": {"type": "float", "required": false, "default": 1.0, "min": 0.0, "max": 2.0},
        "top_p": {"type": "float", "required": false, "default": 0.95},
        "stream": {"type": "boolean", "required": false, "default": false},
        "reasoning_effort": {"type": "string", "required": false, "description": "none = off; medium/high = on"},
        "tools": {"type": "array", "required": false, "description": "OpenAI tool definitions (qwen3_coder)"},
        "frequency_penalty": {"type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty (0-2)"}
      },
      "output_map": {
        "id": {"type": "string"}, "object": {"type": "string"}, "model": {"type": "string"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (includes the `reasoning` field when thinking is ON)"},
        "usage": {"type": "object", "description": "prompt_tokens, completion_tokens, total_tokens"}
      },
      "catalog": {
        "description_short": "Qwen3.5 122B MoE FP8, toggleable thinking + native tools (4x L40S)",
        "description": "Qwen3.5 122B MoE FP8 - configurable thinking mode via <think/> tags, sparse MoE (256 experts, 8 routed + 1 shared per token), 122B total / 10B active params. 262K native context, served at 131K on 4x L40S. Tool calling + streaming. Deployed language-model-only (vision encoder disabled to save VRAM).",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen3.5-122B-A10B-FP8",
        "source_url": "https://huggingface.co/Qwen/Qwen3.5-122B-A10B-FP8",
        "license": "Apache-2.0",
        "parameters": "122B total / 10B active",
        "precision": "fp8",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "reasoning",
        "tags": ["chat", "llm", "reasoning", "moe", "fp8", "tool-calling", "large"]
      }
    }
