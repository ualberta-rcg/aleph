# Qwen3.5-122B-A10B-FP8 — MoE reasoning, 122B total / 10B active, FP8 ~122 GB. 4x L40S TP.
# Whole devices (nvidia.com/gpu: 4, no gpumem — >40GB/card). Persisted helper venv + weights on
# RWX PVC (gemma-4 pattern); scale-to-zero, 15m idle.
# Toggle thinking (qwen3 parser) + tools (qwen3_coder), language-model-only (vision off).
# --disable-custom-all-reduce (L40S NODE topology, no NVLink P2P). TRITON_ATTN_VLLM_V1 (SM89).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen35-122b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 1
    maxReplicas: 2
    scaleTarget: 4
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub hf_transfer
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "Qwen3.5-122B-A10B-FP8 weights already on PVC, skipping download."
            else
                echo "Downloading Qwen/Qwen3.5-122B-A10B-FP8 (~122 GB) ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="Qwen/Qwen3.5-122B-A10B-FP8",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - name: qwen35-122b
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=qwen35-122b
          - --tensor-parallel-size=4
          - --max-model-len=131072
          - --dtype=auto
          - --gpu-memory-utilization=0.95
          - --max-num-seqs=4
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --language-model-only
          # TP=4 on HAMi/L40S: custom all-reduce busy-waits on a P2P path that stalls. NCCL native.
          - --disable-custom-all-reduce
          - --port=8080
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_ATTENTION_BACKEND          # REQUIRED on L40S (SM89)
            value: TRITON_ATTN_VLLM_V1
          - name: OMP_NUM_THREADS
            value: "1"
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 64Gi
          limits:
            cpu: "16"
            memory: 128Gi
            nvidia.com/gpu: "4"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        volumeMounts:
          - name: qwen35-122b
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: qwen35-122b
        persistentVolumeClaim:
          claimName: qwen35-122b
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
