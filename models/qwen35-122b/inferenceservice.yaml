# Qwen3.5-122B-A10B-FP8 — MoE reasoning model, 122B total / 10B active, FP8 ~122 GB.
# Ported from POC (232) to cluster 230 / HAMi vGPU.
#
# Changes vs POC:
#   - nodeSelector: gpu: "on" only (unpinned from a specific host; scheduler picks a
#     node with 4 free L40S). This model takes 4 whole cards.
#   - HAMi resources for TP>=2: request whole devices via `nvidia.com/gpu: "4"` and
#     DO NOT set nvidia.com/gpumem (vGPU mode triggers a custom all-reduce P2P stall).
#     Combined with --disable-custom-all-reduce this gives native NCCL speed.
#   - ADD env VLLM_ATTENTION_BACKEND=TRITON_ATTN_VLLM_V1 (REQUIRED on L40S/SM89 —
#     FlashAttention-3 unavailable; same fix gpt-oss needed).
#   - RawDeployment -> Knative serverless (scale-to-zero) so the 4-GPU node is freed
#     when idle. 30m idle retention (cold start ~5 min loading 122 GB).
#   - weights pre-staged on nfs-models PVC by download-job.yaml (mounted RO at /mnt/models).
#   - --gpu-memory-utilization 0.90 -> 0.93 and add --max-num-seqs 4 to bound KV under
#     the 46 GB/slice cap.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen35-122b
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    scaleTarget: 4
    scaleMetric: concurrency
    timeout: 600
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - --model=/mnt/models
          - --served-model-name=qwen35-122b
          - --tensor-parallel-size=4
          - --max-model-len=131072
          - --dtype=auto
          - --gpu-memory-utilization=0.95
          - --max-num-seqs=4
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --language-model-only
          # TP=4 on HAMi: custom all-reduce busy-waits on a P2P path that stalls
          # (100% util / low watt / ~0.25 tok/s). Disable -> NCCL native speed.
          - --disable-custom-all-reduce
          - --port=8080
        env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_ATTENTION_BACKEND          # REQUIRED on L40S (SM89)
            value: TRITON_ATTN_VLLM_V1
          - name: OMP_NUM_THREADS
            value: "1"
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 64Gi
          limits:
            cpu: "16"
            memory: 128Gi
            nvidia.com/gpu: "4"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        volumeMounts:
          - name: qwen35-data
            mountPath: /mnt/models
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: qwen35-data
        persistentVolumeClaim:
          claimName: qwen35-122b-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
