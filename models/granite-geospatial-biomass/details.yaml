apiVersion: v1
kind: ConfigMap
metadata:
  name: granite-geospatial-biomass-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "granite-geospatial-biomass",
      "status": "production",
      "type": "classify",
      "endpoints": {
        "primary": "/v1/science/predict",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "granite-geospatial-biomass",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "5-10 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "image": "[[[[6 floats], ...], ...], ...] — (C=6, H, W) HLS bands: Blue, Green, Red, NIR, SWIR1, SWIR2",
        "demo": "boolean — returns synthetic biomass map"
      },
      "output_map": {
        "biomass_map": "[[float]] — (H, W) predicted biomass Mg/ha per pixel",
        "biomass_mean": "float — scene mean biomass in Mg/ha",
        "model": "granite-geospatial-biomass"
      },
      "catalog": {
        "description_short": "IBM Granite Geospatial Biomass — above-ground biomass estimation from HLS imagery. Swin-B + UPerNet.",
        "description": "IBM Granite Geospatial Biomass is an above-ground biomass estimation model fine-tuned from a Prithvi-EO backbone (Swin-B + UPerNet architecture) on GEDI L4A biomass labels across 15 biomes globally. It accepts 6-band HLS satellite imagery (Blue, Green, Red, NIR, SWIR1, SWIR2) and produces per-pixel biomass predictions in Mg/ha. The model was developed by IBM Research for carbon stock monitoring and deforestation tracking. Apache 2.0 license.",
        "owned_by": "ibm-granite",
        "source": "ibm-granite/granite-geospatial-biomass",
        "source_url": "https://huggingface.co/ibm-granite/granite-geospatial-biomass",
        "license": "Apache-2.0",
        "parameters": "~350MB checkpoint",
        "precision": "fp32",
        "framework": "terratorch + LightningInferenceModel",
        "domain": "earth-observation",
        "subdomain": "biomass",
        "tags": ["classify", "science", "earth-observation", "biomass", "hls", "gedi", "carbon", "forest", "gpu"],
        "gpu": true,
        "max_input_tokens": 0
      }
    }
