apiVersion: v1
kind: ConfigMap
metadata:
  name: clay-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "clay",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "clay",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "context_window": 0, "max_input_tokens": 0 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "3-6 min"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "pixels": "[[[band_values...],...],...] — [num_bands, H, W] reflectance",
        "waves": "[float] — wavelengths in µm e.g. [0.665, 0.56, 0.49]",
        "gsd": "float — ground sampling distance, meters (default 10.0)",
        "lat": "float — center latitude (optional metadata)",
        "lon": "float — center longitude (optional metadata)",
        "time": "string — datetime string (optional metadata)"
      },
      "output_map": {
        "embeddings": "[float] — CLS embedding vector",
        "cls_embedding": "[float] — alias for embeddings",
        "embedding_dim": "int — embedding dimensionality",
        "n_bands": "int — number of input bands used",
        "model": "clay"
      },
      "catalog": {
        "description_short": "Clay Foundation Model ~330M geospatial MAE — any-band satellite-image CLS embeddings.",
        "description": "The Clay Foundation Model (large variant, ~330M) is a Masked Autoencoder that generates semantic embeddings from multi-band satellite imagery. Accepts any-band image patches ([bands,H,W]) with per-band wavelengths (µm), ground sampling distance (m), and optional geolocation/time metadata (encoded as sin/cos). The encoder produces a CLS-token embedding for land classification, change detection, environmental monitoring. Non-text domain model: image+metadata input, does NOT expose OpenAI /v1/embeddings; stays on /v1/science/embed. Output returns both `embeddings` and `cls_embedding` (alias) + `embedding_dim`.",
        "owned_by": "Clay Foundation",
        "source": "made-with-clay/Clay",
        "source_url": "https://huggingface.co/made-with-clay/Clay",
        "license": "Apache-2.0",
        "parameters": "~330M (large)",
        "precision": "fp32",
        "framework": "lightning + claymodel + einops",
        "domain": "earth-observation",
        "subdomain": "remote-sensing",
        "tags": ["embedding", "science", "earth-observation", "satellite", "mae", "geospatial", "any-band", "cpu"],
        "gpu": false,
        "max_input_tokens": 0,
        "input_format": {
          "model": "clay",
          "pixels": "[[[band_values...],...],...] — [num_bands, H, W] reflectance",
          "waves": "wavelengths in µm e.g. [0.665, 0.56, 0.49]",
          "gsd": "ground sampling distance, meters (default 10.0)",
          "lat": "center latitude (optional metadata)",
          "lon": "center longitude (optional metadata)",
          "time": "datetime string (optional metadata)"
        },
        "embedding_dimensions": 1024,
        "pooling": "cls_token (large encoder)"
      }
    }
