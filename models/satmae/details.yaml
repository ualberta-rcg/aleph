apiVersion: v1
kind: ConfigMap
metadata:
  name: satmae-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "satmae",
      "status": "production",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/science/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "satmae",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 minutes (venv-on-PVC; weights already downloaded)"
      },
      "behavior": {
        "supports_vision": true,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": { "thinking": { "mode": "none" } },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "image": "[[[R,G,B],...],...] — HxW RGB image, values 0-255 (auto-resized to 224x224, fMoW-normalized)"
      },
      "output_map": {
        "embeddings": "[float] — 1024-dim CLS embedding vector",
        "cls_embedding": "[float] — alias for embeddings",
        "patch_embeddings": "[[float]] — per-patch embedding vectors",
        "dim": "int — embedding dimensionality (1024)",
        "model": "satmae"
      },
      "catalog": {
        "description_short": "SatMAE ViT-Large masked autoencoder pretrained on fMoW satellite imagery. 1024-dim CLS embeddings.",
        "description": "SatMAE is a Masked Autoencoder (ViT-Large) pretrained on functional Map of the World (fMoW) satellite imagery (MVRL). Zero-mask-ratio forward_encoder extracts the [CLS] token as a 1024-dim embedding of an RGB satellite image patch (auto-resized to 224x224, normalized with fMoW mean/std). Useful for satellite-image classification, retrieval, and change detection. Non-text domain model: image input only, does NOT expose OpenAI /v1/embeddings; stays on /v1/science/embed. Loaded offline via MaskedAutoencoderViT.from_pretrained(local dir).",
        "owned_by": "MVRL",
        "source": "MVRL/satmae-vitlarge-fmow-pretrain-800",
        "source_url": "https://huggingface.co/MVRL/satmae-vitlarge-fmow-pretrain-800",
        "license": "Apache-2.0",
        "parameters": "~300M (ViT-Large)",
        "precision": "fp32",
        "framework": "PyTorch + timm + safetensors",
        "domain": "earth-observation",
        "subdomain": "remote-sensing",
        "tags": ["embedding", "science", "earth-observation", "satellite", "mae", "fmow", "vit", "cpu"],
        "gpu": false,
        "max_input_tokens": 0,
        "input_format": {
          "model": "satmae",
          "image": "[[[R,G,B],...],...] — HxW RGB image, values 0-255 (auto-resized to 224x224, fMoW-normalized)"
        },
        "embedding_dimensions": 1024,
        "pooling": "cls_token (zero-mask forward_encoder)"
      }
    }
