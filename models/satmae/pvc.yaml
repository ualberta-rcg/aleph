# Venv + SatMAE ViT-L weights persist on NFS (ReadWriteMany, nfs-client). Split out of the ISVC
# 2026-06-19 (was inline + RWO). Migrated RWO→RWX by copying the venv + HF snapshot from the old
# RWO PVC (satmae-data) into this new RWX PVC (satmae-data-rwx) — preserves the venv, no re-download.
# Old satmae-data PVC deleted after the copy + repoint.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: satmae-data-rwx
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
