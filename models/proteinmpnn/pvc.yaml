apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proteinmpnn-data
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  # nfs-models default (OneFS-safe 128Ki wsize) so the ~5 GB torch venv + weights persist
  # across scale-to-zero. First cold start builds the venv (slow); later ones reuse it.
  storageClassName: nfs-models
  resources:
    requests:
      storage: 15Gi
