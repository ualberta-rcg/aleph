apiVersion: v1
kind: ConfigMap
metadata:
  name: biomed-roberta-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomed-roberta",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "biomed-roberta",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text; truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim mean-pooled (attention-masked) embeddings" },
        "model": { "type": "string", "description": "Model name (biomed-roberta)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "BioMed-RoBERTa-base — 768-dim biomedical embeddings (GPU, scale-to-zero)",
        "description": "BioMed-RoBERTa-base (allenai/biomed_roberta_base): RoBERTa pre-trained from scratch on PubMed + PMC + MIMIC-III biomedical text. Produces 768-dim mean-pooled dense embeddings for biomedical NLP, max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (8 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "AllenAI",
        "source": "allenai/biomed_roberta_base",
        "source_url": "https://huggingface.co/allenai/biomed_roberta_base",
        "license": "Apache-2.0",
        "parameters": "125M",
        "precision": "fp16",
        "framework": "transformers (custom FastAPI server)",
        "domain": "biomedical",
        "subdomain": "biomedical-nlp",
        "gpu": true,
        "embedding_dimensions": 768,
        "pooling": "mean",
        "max_input_tokens": 512,
        "tags": ["embedding", "biomedical", "nlp", "roberta"]
      }
    }
