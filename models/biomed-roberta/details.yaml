apiVersion: v1
kind: ConfigMap
metadata:
  name: biomed-roberta-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "biomed-roberta",
      "status": "production",
      "type": "embedding",
      "description_short": "BioMed-RoBERTa — biomedical text embeddings from Allen AI (768-dim)",
      "description": "BioMed-RoBERTa by Allen AI. 110M params. RoBERTa-base model pre-trained on biomedical text (PubMed abstracts + PMC full text). Produces 768-dimensional dense embeddings for biomedical NLP tasks including NER, relation extraction, and document classification. Max sequence length 512 tokens.",
      "context_window": 512,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "owned_by": "allenai",
      "source": "allenai/biomed_roberta_base",
      "source_url": "https://huggingface.co/allenai/biomed_roberta_base",
      "license": "Apache-2.0",
      "parameters": "110M",
      "parameter_count": 110000000,
      "precision": "fp32",
      "architecture": "transformer",
      "framework": "pytorch",
      "deployment": {
        "gpu": true,
        "gpu_count": 1,
        "min_replicas": 0,
        "max_replicas": 5,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 120
      },
      "routing": {
        "path_prefix": "/v1/",
        "serialize": false,
        "no_stream": false
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": false,
        "reasoning_model": false
      },
      "domain": "biomedical",
      "subdomain": "biomedical-text-embeddings",
      "tags": ["embedding", "biomedical", "nlp", "roberta", "pubmed", "biology"],
      "content_types": ["text"],
      "tier": "production",
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Biomedical text"
        }
      },
      "output_map": {
        "object": "string (list)",
        "model": "string",
        "data": {
          "type": "array",
          "items": {
            "object": "string (embedding)",
            "index": "int",
            "embedding": "[float x 768]"
          }
        },
        "usage": {"prompt_tokens": "int", "total_tokens": "int"}
      },
      "server_config": {
        "inference_backend": "pytorch",
        "framework": "transformers (HuggingFace)",
        "max_seq_length": 512,
        "pooling": "mean (attention-masked)",
        "embedding_dim": 768
      }
    }
