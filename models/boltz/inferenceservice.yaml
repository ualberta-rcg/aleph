# Boltz-2: Biomolecular structure prediction + binding affinity (MIT license)
# NVIDIA NIM container — pre-built with TensorRT, no pip compile needed
# Repo: github.com/jwohlwend/boltz | NIM: nvcr.io/nim/mit/boltz2
# API: POST /biology/mit/boltz2/predict
#      Input: {"polymers": [{"id":"A","molecule_type":"protein","sequence":"MKTAY..."}]}
#      Returns: structure + confidence + optional affinity
# Note: NIM v1.7.0 has a confidence_score KeyError — patched at startup below
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boltz-nim-cache
  namespace: models
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 30Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: boltz
  namespace: models
  annotations:
    serving.knative.dev/progress-deadline-seconds: "600"
spec:
  predictor:
    minReplicas: 0
    nodeSelector:
      gpu: "on"
    containers:
      - name: kserve-container
        image: nvcr.io/nim/mit/boltz2:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Patch NIM v1.7.0 bug: model.predict_step doesn't return 'confidence_score'
            PIPELINE=/opt/nim/lib/boltz_assist/boltz_pipeline.py
            if grep -q 'pred_data\["confidence_score"\]' "$PIPELINE" 2>/dev/null; then
              echo "Patching confidence_score bug in NIM pipeline..."
              sed -i 's/conf = pred_data\["confidence_score"\]/conf = pred_data.get("confidence_score", 0.0)/' "$PIPELINE"
              echo "Patch applied."
            else
              echo "Patch already applied or not needed."
            fi
            # Start the NIM server
            exec /opt/nim/start_server.sh
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                name: ngc-api-key
                key: NGC_API_KEY
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "20480"
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "20480"
        readinessProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet:
            path: /v1/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - name: nim-cache
            mountPath: /opt/nim/.cache
    imagePullSecrets:
      - name: ngc-registry-secret
    volumes:
      - name: nim-cache
        persistentVolumeClaim:
          claimName: boltz-nim-cache
