apiVersion: v1
kind: ConfigMap
metadata:
  name: scincl-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "scincl",
      "status": "production",
      "type": "embedding",
      "endpoints": { "primary": "/v1/embeddings", "health": "/health" },
      "routing": {
        "k8s_name": "scincl",
        "serialize": false,
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": { "max_completion_tokens": 0, "context_window": 512, "max_input_tokens": 512 },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 min"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": { "mode": "none" },
        "max_tokens": { "field": null }
      },
      "defaults": {},
      "custom_params": { "passthrough": true },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "Scientific text (title/abstract) to embed; truncated to 512 tokens."
        }
      },
      "output_map": {
        "object": { "type": "string", "description": "\"list\" (OpenAI embeddings shape)" },
        "data": { "type": "array", "items": { "object": "string", "index": "int", "embedding": "[float x 768]" }, "description": "768-dim [CLS]-pooled embeddings" },
        "model": { "type": "string", "description": "Model name (scincl)" },
        "usage": { "type": "object", "description": "{prompt_tokens, total_tokens}" }
      },
      "catalog": {
        "description_short": "ScINCL — 768-dim scientific citation embeddings (GPU, scale-to-zero)",
        "description": "ScINCL (malteos/scincl): a scientific-text embedding model trained with in-category learning on citation triplets — strong for scientific document similarity, citation recommendation, and classification. 768-dim [CLS]-pooled embeddings, max 512 tokens. Served via a custom transformers FastAPI server on a HAMi GPU slice (10 GiB), scale-to-zero. OpenAI-compliant /v1/embeddings (batch + usage).",
        "owned_by": "malteos",
        "source": "malteos/scincl",
        "source_url": "https://huggingface.co/malteos/scincl",
        "license": "MIT",
        "parameters": "110M",
        "precision": "fp16 (GPU)",
        "framework": "transformers (custom FastAPI server)",
        "domain": "nlp",
        "subdomain": "scientific-text-embeddings",
        "gpu": true,
        "embedding_dimensions": 768,
        "pooling": "cls",
        "max_input_tokens": 512,
        "tags": ["embedding", "science", "nlp", "citation", "scientific-text"]
      }
    }
