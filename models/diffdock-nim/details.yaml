apiVersion: v1
kind: ConfigMap
metadata:
  name: diffdock-nim-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "diffdock-nim",
      "status": "production",
      "type": "chemistry",
      "endpoints": {
        "primary": "/v1/molecular-docking/diffdock/generate",
        "health": "/v1/health/ready"
      },
      "routing": {
        "k8s_name": "diffdock-nim",
        "no_stream": true,
        "strip_v1_prefix": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-3 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "protein": {
          "type": "string",
          "required": false,
          "description": "Protein structure as PDB string"
        },
        "ligand": {
          "type": "string",
          "required": false,
          "description": "Ligand as SMILES/SDF/MOL2 string"
        },
        "ligand_file_type": {
          "type": "string",
          "required": false,
          "enum": ["mol2", "sdf", "txt"],
          "default": "txt",
          "description": "Format of the ligand string"
        },
        "num_poses": {
          "type": "integer",
          "required": false,
          "default": 10,
          "min": 1,
          "max": 100,
          "description": "Number of poses to generate"
        },
        "steps": {
          "type": "integer",
          "required": false,
          "default": 18,
          "min": 1,
          "max": 18,
          "description": "Number of diffusion steps"
        },
        "time_divisions": {
          "type": "integer",
          "required": false,
          "default": 20,
          "min": 3,
          "max": 20,
          "description": "Number of time divisions"
        },
        "save_trajectory": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Return diffusion trajectory"
        },
        "skip_gen_conformer": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Skip ligand conformer generation"
        },
        "is_staged": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Return staged output"
        }
      },
      "output_map": {
        "ligand_positions": {
          "type": "array",
          "description": "Predicted docked ligand poses"
        }
      },
      "catalog": {
        "description_short": "DiffDock molecular blind docking (NVIDIA NIM).",
        "description": "DiffDock is a generative diffusion model for drug discovery molecular blind docking via the NVIDIA NIM container nvcr.io/nim/mit/diffdock:2.3.",
        "owned_by": "MIT / NVIDIA",
        "source": "nvcr.io/nim/mit/diffdock:2.3",
        "source_url": "https://build.nvidia.com/mit/diffdock",
        "license": "NVIDIA AI Product Agreement",
        "parameters": "",
        "precision": "fp16",
        "framework": "nim",
        "domain": "chemistry",
        "subdomain": "molecular-docking",
        "tags": ["science", "chemistry", "docking", "diffusion", "nim", "gpu"]
      }
    }
