apiVersion: v1
kind: ConfigMap
metadata:
  name: moment-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "moment",
      "status": "production",
      "type": "forecast",
      "endpoints": {
        "primary": "/v1/forecast",
        "secondary": "/v1/embed",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "moment",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 min (venv + MOMENT load + first forecast)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "time_series": {
          "type": "array",
          "required": true,
          "description": "numeric observations (needs a 512-length input for best results; shorter is padded)"
        },
        "prediction_length": {
          "type": "integer",
          "required": false,
          "default": 96,
          "description": "future steps to forecast"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "forecast": {"type": "array", "description": "forecasted values (length = prediction_length)"},
        "prediction_length": {"type": "integer", "description": "horizon returned"}
      },
      "catalog": {
        "description_short": "MOMENT-1-large (385M) open time-series foundation model (CMU AutonLab).",
        "description": "MOMENT-1-large (AutonLab/CMU, 2024) is an open time-series foundation model — T5-based encoder-decoder, 385M params — supporting forecasting, classification, anomaly detection, and imputation. Loaded via the `momentfm` library (MOMENTPipeline). This deployment exposes forecasting (`/v1/forecast`) and embeddings (`/v1/embed`).",
        "owned_by": "AutonLab-CMU",
        "source": "AutonLab/MOMENT-1-large",
        "source_url": "https://huggingface.co/AutonLab/MOMENT-1-large",
        "license": "Apache-2.0",
        "parameters": "385M",
        "precision": "fp32",
        "framework": "momentfm + torch",
        "domain": "time-series",
        "subdomain": "forecasting",
        "tags": ["science", "timeseries", "forecast", "classification", "anomaly-detection", "gpu"]
      }
    }
