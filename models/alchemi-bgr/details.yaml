apiVersion: v1
kind: ConfigMap
metadata:
  name: alchemi-bgr-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "alchemi-bgr-nim",
      "status": "production",
      "type": "chemistry",
      "endpoints": {
        "primary": "/v1/infer",
        "health": "/v1/health/ready"
      },
      "routing": {
        "k8s_name": "alchemi-bgr",
        "no_stream": true,
        "strip_v1_prefix": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 0
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-3 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "atoms": {
          "type": "array",
          "required": true,
          "description": "List of AtomicData objects to relax"
        },
        "opttol": {
          "type": "number",
          "required": false,
          "default": 0.02,
          "description": "Force tolerance in eV/Å"
        },
        "opttol_pressure": {
          "type": "number",
          "required": false,
          "description": "Pressure tolerance in kBar"
        },
        "cellopt": {
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Enable cell optimization"
        },
        "info": {
          "type": "string",
          "required": false,
          "description": "Metadata echoed in response"
        }
      },
      "output_map": {
        "atoms": {
          "type": "array",
          "description": "Optimized structures with energies, forces, stress"
        },
        "status": {
          "type": "string",
          "description": "Success or error status"
        },
        "info": {
          "type": "string",
          "description": "Echoed request metadata"
        }
      },
      "catalog": {
        "description_short": "Alchemi BGR batched geometry relaxation (NVIDIA NIM).",
        "description": "Alchemi BGR is a high-performance engine for batched geometry relaxation using the MACE-MPA-O model and FIRE2 optimizer via the NVIDIA NIM container nvcr.io/nim/nvidia/alchemi-bgr:1.0.0.",
        "owned_by": "NVIDIA",
        "source": "nvcr.io/nim/nvidia/alchemi-bgr:1.0.0",
        "source_url": "https://build.nvidia.com/nvidia/alchemi-bgr",
        "license": "NVIDIA AI Product Agreement",
        "parameters": "",
        "precision": "fp16",
        "framework": "nim",
        "domain": "chemistry",
        "subdomain": "geometry-relaxation",
        "tags": ["science", "chemistry", "geometry", "relaxation", "mace", "nim", "gpu"]
      }
    }
