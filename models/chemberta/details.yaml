apiVersion: v1
kind: ConfigMap
metadata:
  name: chemberta-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "chemberta-125m",
      "type": "embedding",
      "endpoints": {
        "primary": "/v1/embeddings",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "chemberta",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 512,
        "max_input_tokens": 512
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "1-2 minutes"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "none"
        }
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "input": {
          "type": "string or array of strings",
          "required": true,
          "description": "SMILES string or list of SMILES strings (max 512 tokens)"
        }
      },
      "output_map": {
        "object": {
          "type": "string",
          "description": "Object type (list)"
        },
        "data": {
          "type": "array",
          "items": {
            "object": "string",
            "index": "int",
            "embedding": "[float x 768]"
          },
          "description": "Embedding results (768-dim, mean-pooled)"
        },
        "model": {
          "type": "string",
          "description": "Model name"
        },
        "usage": {
          "type": "object",
          "description": "Token usage stats"
        }
      },
      "catalog": {
        "description_short": "ChemBERTa \u2014 SMILES/chemistry embeddings",
        "description": "ChemBERTa (seyonec/ChemBERTa-zinc-base-v1), a RoBERTa-style model pre-trained on ZINC SMILES. Produces mean-pooled embeddings of chemical SMILES strings for molecular property prediction, similarity search and cheminformatics. CPU.",
        "owned_by": "seyonec",
        "source": "seyonec/ChemBERTa-zinc-base-v1",
        "source_url": "https://huggingface.co/seyonec/ChemBERTa-zinc-base-v1",
        "license": "MIT",
        "parameters": "125M",
        "precision": "fp32",
        "framework": "transformers",
        "domain": "chemistry",
        "subdomain": "cheminformatics",
        "tags": [
          "embedding",
          "science",
          "chemistry",
          "smiles",
          "molecules",
          "cpu"
        ],
        "gpu": false,
        "max_input_tokens": 512,
        "input_format": {
          "model": "chemberta-125m",
          "input": "SMILES string or [SMILES]"
        },
        "embedding_dimensions": 768,
        "pooling": "mean"
      }
    }
