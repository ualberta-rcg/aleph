# DeepSeek-R1 reasoning distilled into Llama-70B. Strong open chain-of-thought.
# Weights (~140 GB) persist on NFS (nfs-models) so scale-from-zero cold starts skip
# re-download. Staged by the ISVC initContainer (gemma-4 venv-on-PVC pattern).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: r1-distill-llama-70b
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 200Gi
