# AstroCLIP: Cross-Modal Contrastive Learning for Galaxy Images + Spectra
# polymathic-ai/astroclip — MIT license, ~1.7GB Lightning checkpoint
# DINOv2 image encoder + spectrum transformer, contrastive pre-training
# API: POST /v1/science/embed → galaxy image or spectrum → 512-dim embedding
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: astroclip-server
  namespace: models
data:
  server.py: |
    """
    AstroCLIP — cross-modal CLIP for galaxy images and optical spectra.
    MIT license. polymathic-ai/astroclip. DINOv2 + spectrum transformer.
    Trained on 90K galaxies from DESI. 512-dim joint embedding space.

    API: POST /v1/science/embed
    Input (one of):
      {"image": [[[R,G,B], ...], ...], "modality": "image"}  # (H, W, 3) galaxy image
      {"spectrum": [float, ...], "modality": "spectrum"}      # (wavelength_bins,) normalized flux
      {"demo": true}
    Returns:
      {"embeddings": [...], "shape": [1024], "model": "astroclip", "modality": "image|spectrum"}
    """
    import os, asyncio
    from fastapi import FastAPI
    from fastapi.responses import JSONResponse
    import uvicorn

    app = FastAPI()
    model = None
    DEVICE = "cpu"

    def load():
        global model, DEVICE
        import torch
        DEVICE = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"Loading AstroCLIP on {DEVICE}...", flush=True)
        import sys
        sys.path.insert(0, "/data/src/astroclip")
        try:
            # PyTorch 2.6+ defaults torch.load to weights_only=True, but the AstroCLIP
            # Lightning checkpoint stores full encoder modules (pickled objects), so it
            # needs weights_only=False. Lightning's load_from_checkpoint forwards **kwargs
            # to __init__, not torch.load, so we monkeypatch torch.load to flip the default
            # for this process (checkpoint source is the official polymathic-ai/astroclip).
            _orig_load = torch.load
            def _load(*a, **kw):
                # FORCE False — Lightning's pl_load explicitly passes weights_only=True,
                # so setdefault would be a no-op. We trust the official checkpoint.
                kw["weights_only"] = False
                return _orig_load(*a, **kw)
            torch.load = _load
            # Official load path (per AstroCLIP README). The checkpoint stores the
            # image/spectrum encoders via save_hyperparameters(), so load_from_checkpoint
            # reconstructs them. strict=False tolerates any minor key drift.
            from astroclip.models import AstroClipModel
            m = AstroClipModel.load_from_checkpoint(
                checkpoint_path="/data/astroclip.ckpt",
                map_location="cpu",
                strict=False,
            )
            m = m.to(DEVICE).eval()
            model = m
            print(f"AstroCLIP ready on {DEVICE} "
                  f"(image_encoder={type(m.image_encoder).__name__}, "
                  f"spectrum_encoder={type(m.spectrum_encoder).__name__}).", flush=True)
        except Exception as e:
            import traceback; traceback.print_exc()
            print(f"AstroCLIP load FAILED ({e}); falling back to demo-only.", flush=True)
            model = {"_raw": True}

    @app.on_event("startup")
    async def startup():
        await asyncio.get_event_loop().run_in_executor(None, load)

    @app.get("/health")
    async def health():
        return {"status": "ok" if model is not None else "loading", "model": "astroclip"}

    @app.get("/v1/models")
    async def list_models():
        return {"object": "list", "data": [
            {"id": "astroclip", "object": "model",
             "owned_by": "polymathic-ai", "type": "galaxy-multimodal-embedding"}
        ]}

    @app.post("/v1/science/embed")
    async def embed(request: dict):
        if model is None:
            return JSONResponse({"error": "model loading"}, 503)
        loop = asyncio.get_event_loop()
        try:
            result = await loop.run_in_executor(None, _embed, request)
            return result
        except Exception as e:
            import traceback; traceback.print_exc()
            return JSONResponse({"error": str(e)}, 500)

    def _embed(req):
        import torch, numpy as np

        if req.get("demo"):
            return {
                "model": "astroclip",
                "embeddings": [0.0] * 1024,
                "shape": [1024],
                "modality": req.get("modality", "image"),
                "demo": True,
            }

        if isinstance(model, dict) and model.get("_raw"):
            return {"error": "AstroCLIP library not installed; pass demo:true"}

        modality = req.get("modality", "image")
        if modality == "image":
            image = req.get("image")
            if image is None:
                raise ValueError("image required for modality=image")
            img = torch.tensor(image, dtype=torch.float32)
            if img.shape[-1] == 3:
                img = img.permute(2, 0, 1)
            img = img.unsqueeze(0).to(DEVICE)
            # Duplicate to a batch of 2: AstroCLIP's CrossAttentionHead.forward does
            # `return x, attentions[1]` where attentions is the (batch,1,d) output, so it
            # indexes the 2nd batch element and crashes for batch_size<2. Cross-attention
            # is per-sample, so emb[0] == a true single-sample embedding. We take [0].
            img = img.expand(2, *img.shape[1:])
            with torch.no_grad():
                emb = model.image_encoder(img)[0]
        else:
            spectrum = req.get("spectrum")
            if spectrum is None:
                raise ValueError("spectrum required for modality=spectrum")
            spec = torch.tensor(spectrum, dtype=torch.float32).unsqueeze(0).unsqueeze(-1).to(DEVICE)
            spec = spec.expand(2, *spec.shape[1:])  # batch of 2 (see image comment)
            with torch.no_grad():
                emb = model.spectrum_encoder(spec)[0]

        emb_list = emb.cpu().float().numpy().tolist()
        return {
            "model": "astroclip",
            "embeddings": emb_list,
            "shape": [len(emb_list)],
            "modality": modality,
        }

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: astroclip
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 5
    scaleMetric: concurrency
    timeout: 180
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command: ["bash", "-c"]
        args:
          - |
            set -e
            SENTINEL=/data/.astroclip-ready-v3
            if [ -f "$SENTINEL" ]; then echo "Venv + deps already set up."; exit 0; fi
            # Download checkpoint if not on PVC (PVC recreation resilience)
            if [ ! -f /data/astroclip.ckpt ]; then
              echo "Downloading AstroCLIP checkpoint (~1.7GB)..."
              pip install -q huggingface_hub
              python3 -c "
            import os
            from huggingface_hub import hf_hub_download
            hf_hub_download(repo_id='polymathic-ai/astroclip', filename='astroclip.ckpt', local_dir='/data', local_dir_use_symlinks=False, token=os.environ.get('HF_TOKEN'))
            print('Checkpoint downloaded.')
            "
            fi
            VENV=/data/venv
            apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
            # Create venv + install torch ONLY if not already present (preserves torch across
            # restarts; for a true fresh start, delete the PVC and re-apply).
            if [ ! -x "$VENV/bin/python" ]; then
              echo "Creating venv at $VENV..."
              python3 -m venv $VENV
              $VENV/bin/pip install -U pip
              echo "Installing torch + torchvision (cu126)..."
              $VENV/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
            else
              echo "Venv exists (torch preserved)."
            fi
            echo "Installing lightning + server deps..."
            $VENV/bin/pip install lightning fastapi uvicorn huggingface_hub jaxtyping astropy scikit-learn
            echo "Installing AstroCLIP runtime deps (needed by astroclip/__init__.py import chain)..."
            $VENV/bin/pip install datasets h5py python-dotenv scikit-image joblib matplotlib aiohttp pillow tqdm wandb
            echo "Installing DINOv2 (facebookresearch, pinned commit, --no-deps to avoid torch downgrade)..."
            $VENV/bin/pip install --no-deps "dinov2 @ git+https://github.com/facebookresearch/dinov2.git@2302b6bf46953431b969155307b9bed152754069"
            $VENV/bin/pip install fvcore omegaconf iopath
            echo "Installing AstroCLIP library (--no-deps; runtime deps installed explicitly above)..."
            # Clone if not on PVC (so a fresh/recreated PVC rebuilds itself)
            if [ ! -d /data/src/astroclip/astroclip ]; then
              mkdir -p /data/src
              git clone --depth=1 https://github.com/PolymathicAI/AstroCLIP /data/src/astroclip
            fi
            $VENV/bin/pip install --no-deps -e /data/src/astroclip
            touch "$SENTINEL"
            echo "Setup complete."
        resources:
          requests: { cpu: "2", memory: 8Gi }
          limits: { cpu: "4", memory: 16Gi }
        volumeMounts:
          - { name: model-data, mountPath: /data }
    containers:
      - name: kserve-container
        image: python:3.11-slim
        command: ["/data/venv/bin/python"]
        args: ["/app/server.py"]
        env:
          - { name: HF_HOME, value: /tmp }
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
          limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "10240" }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 30
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - { name: model-data, mountPath: /data, readOnly: true }
          - { name: app, mountPath: /app }
    volumes:
      - name: model-data
        persistentVolumeClaim: { claimName: astroclip-data }
      - name: app
        configMap: { name: astroclip-server }
