apiVersion: v1
kind: ConfigMap
metadata:
  name: mace-mp-0-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "mace-mp-0",
      "status": "production",
      "type": "force-field",
      "endpoints": {
        "primary": "/v1/science/energy",
        "health": "/health"
      },
      "routing": {
        "k8s_name": "mace-mp-0",
        "no_stream": true,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 0,
        "max_input_tokens": 1000
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "idle_retention": "15m",
        "cold_start_estimate": "2-4 minutes (mace-torch import + medium model load on CPU)"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": false,
        "supports_system_prompt": false,
        "reasoning_model": false,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {"mode": "none"}
      },
      "defaults": {},
      "custom_params": {
        "passthrough": true
      },
      "schema_version": 2,
      "input_map": {
        "structure": {
          "type": "object",
          "required": true,
          "description": "atomic structure: {elements:[\"Si\",\"Si\"], positions:[[x,y,z],...], cell?(3x3), pbc?([bool,bool,bool] when cell given; else false for molecules)}"
        }
      },
      "output_map": {
        "model": {"type": "string", "description": "model name"},
        "energy_eV": {"type": "number", "description": "total potential energy in eV"},
        "forces_eV_A": {"type": "array", "description": "per-atom forces [n_atoms][3] in eV/Angstrom"},
        "stress_eV_A3": {"type": "array", "description": "Voigt 6-component stress tensor (periodic only; null for molecules)"}
      },
      "catalog": {
        "description_short": "MACE-MP-0 universal ML force field (medium variant, mace_mp() loader) — energy/forces/stress on CPU.",
        "description": "MACE-MP-0 universal machine-learning force field (Cambridge/DeepMind), loaded via the mace-torch mace_mp() convenience helper (medium variant, the GitHub-released 2023-12-03-mace-128-L1_epoch-199 checkpoint). Predicts energy (eV), per-atom forces, and stress from an atomic structure using the equivariant MACE architecture. Trained on Materials Project DFT across 89 elements. This deployment is CPU-only, float32. (See the companion `mace-mp` service for the GPU /v1/science/predict variant with small/medium/large selection.)",
        "owned_by": "Cambridge/DeepMind",
        "source": "ACEsuit/mace-mp-0",
        "source_url": "https://github.com/ACEsuit/mace",
        "license": "MIT",
        "parameters": "~10M (medium)",
        "precision": "float32",
        "framework": "mace-torch (mace_mp) + ASE + PyTorch (CPU)",
        "domain": "materials-science",
        "subdomain": "interatomic-potentials",
        "tags": ["science", "materials", "force-field", "molecular-dynamics", "chemistry", "physics", "mace", "cpu"]
      }
    }
