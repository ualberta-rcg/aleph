apiVersion: v1
kind: ConfigMap
metadata:
  name: yolov8s-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "yolov8s",
      "type": "detect",
      "description_short": "YOLOv8 Small — balanced speed/accuracy COCO detector (80 classes)",
      "description": "YOLOv8 Small by Ultralytics. 11.2M params, 28.6B FLOPs. Anchor-free detection head, 80 COCO classes (person, car, dog, etc.). ONNX runtime for fast CPU inference. Exports from PyTorch to ONNX on first boot. Returns bounding boxes with class labels and confidence scores. 44.9 mAP@50-95 on COCO. Default detector on the platform.",
      "context_window": 0,
      "max_completion_tokens": 0,
      "endpoints": {
        "primary": "/v1/vision/detect",
        "health": "/health"
      },
      "owned_by": "Ultralytics",
      "source": "https://github.com/ultralytics/ultralytics",
      "source_url": "https://docs.ultralytics.com/models/yolov8/",
      "license": "AGPL-3.0",
      "parameters": "11.2M",
      "parameter_count": 11200000,
      "precision": "onnx-fp32",
      "architecture": "cnn",
      "framework": "onnxruntime",
      "deployment": {
        "gpu": false,
        "gpu_count": 0,
        "min_replicas": 0,
        "max_replicas": 2,
        "startup_seconds": 30,
        "container_image": "python:3.11-slim",
        "timeout": 180
      },
      "routing": {
        "k8s_name": "yolov8s",
        "no_stream": true,
        "upstream_model_id": null
      },
      "compatibility": {
        "supports_streaming": false,
        "supports_vision": true,
        "reasoning_model": false
      },
      "domain": "computer-vision",
      "subdomain": "object-detection",
      "tags": ["vision", "detect", "coco", "onnx", "cpu"],
      "content_types": ["image"],
      "tier": "production",
      "input_map": {
        "image": {
          "type": "string",
          "required": true,
          "format": "base64",
          "media_types": ["image/jpeg", "image/png"],
          "max_size_bytes": 10485760,
          "description": "Base64-encoded JPEG or PNG image"
        }
      },
      "output_map": {
        "model": "string",
        "task": "string",
        "detections": {
          "type": "array",
          "items": {
            "label": "string (COCO class name)",
            "score": "float (0-1 confidence)",
            "box": "[x1, y1, x2, y2] pixel coordinates"
          }
        }
      },
      "server_config": {
        "inference_backend": "onnxruntime",
        "onnx_opset": 17,
        "input_size": 640,
        "confidence_threshold": 0.25,
        "iou_threshold": 0.45,
        "execution_provider": "CPUExecutionProvider",
        "intra_op_num_threads": 4
      }
    }
