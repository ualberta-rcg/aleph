apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-32b-details
  namespace: models
  labels:
    model-details: "true"
data:
  details.json: |
    {
      "id": "qwen3-32b",
      "status": "production",
      "type": "chat",
      "endpoints": {
        "primary": "/v1/chat/completions",
        "health": "/v1/models"
      },
      "routing": {
        "k8s_name": "qwen3-32b",
        "serialize": false,
        "no_stream": false,
        "upstream_model_id": null
      },
      "limits": {
        "context_window": 40960,
        "max_completion_tokens": 32768
      },
      "scaling": {
        "scale_to_zero": true,
        "min_replicas": 0,
        "cold_start_estimate": "3-6 min",
        "idle_retention": "15m"
      },
      "behavior": {
        "supports_vision": false,
        "supports_tools": true,
        "supports_system_prompt": true,
        "supports_streaming": true,
        "reasoning_model": true,
        "strips_thinking": false
      },
      "param_translation": {
        "thinking": {
          "mode": "effort",
          "default_effort": "medium",
          "effort_aliases": {
            "none": "none", "minimal": "none", "disabled": "none",
            "low": "none",
            "medium": "medium", "med": "medium",
            "high": "high", "xhigh": "high", "max": "high"
          },
          "on":  {"chat_template_kwargs": {"enable_thinking": true}},
          "off": {"chat_template_kwargs": {"enable_thinking": false}},
          "off_max_tokens": 2048,
          "note": "Managed thinking. Qwen3-32B has a binary enable_thinking switch (a real off, unlike gpt-oss). ON (medium/high) exposes the `reasoning` field; OFF (reasoning_effort none/low -> enable_thinking false) produces no reasoning + caps max_tokens to off_max_tokens."
        }
      },
      "defaults": {
        "chat": {
          "temperature": 0.7,
          "max_tokens": 32768,
          "thinking": {"enabled": true, "effort": "medium"}
        },
        "meta_tasks": {
          "title": {"max_tokens": 80, "thinking": {"enabled": false}},
          "tags": {"max_tokens": 60, "thinking": {"enabled": false}},
          "followups": {"max_tokens": 220, "thinking": {"enabled": false}}
        }
      },
      "schema_version": 2,
      "custom_params": {
        "schema": {
          "reasoning_effort": {"type": "string", "enum": ["none","low","medium","high"], "default": "medium"}
        },
        "passthrough": true
      },
      "input_map": {
        "messages": {"type": "array", "required": true, "description": "Chat messages [{role, content}]"},
        "max_tokens": {"type": "integer", "required": false, "default": 32768, "max": 32768, "description": "Maximum tokens to generate"},
        "temperature": {"type": "float", "required": false, "default": 0.7, "min": 0.0, "max": 2.0},
        "top_p": {"type": "float", "required": false, "default": 0.8},
        "top_k": {"type": "integer", "required": false, "default": 20},
        "stream": {"type": "boolean", "required": false, "default": false},
        "reasoning_effort": {"type": "string", "required": false, "enum": ["none","low","medium","high"], "default": "medium", "description": "none/low = thinking off; medium/high = on"},
        "tools": {"type": "array", "required": false, "description": "OpenAI tool definitions (hermes parser)"},
        "tool_choice": {"type": "string", "required": false},
        "frequency_penalty": {"type": "float", "required": false, "default": 0.0, "min": -2.0, "max": 2.0, "description": "Frequency penalty (0-2)"}
      },
      "output_map": {
        "id": {"type": "string"}, "object": {"type": "string"}, "model": {"type": "string"},
        "choices": {"type": "array", "items": {"message": "object", "finish_reason": "string"}, "description": "Response choices (includes the `reasoning` field when thinking is ON)"},
        "usage": {"type": "object", "description": "prompt_tokens, completion_tokens, total_tokens"}
      },
      "catalog": {
        "description_short": "Qwen3-32B dense flagship: thinking mode, tool calling, 100+ languages, 40K context.",
        "description": "Qwen3-32B dense model (32.8B params, 64 layers, GQA). Supports thinking/reasoning mode (binary enable_thinking switch, on by default), agentic tool calling (hermes parser), and 100+ languages. Native context 32K, extended to 131K with YaRN. Best sampling: thinking mode → temp=0.6/topP=0.95; non-thinking → temp=0.7/topP=0.8/topK=20. Requires vLLM >= 0.8.5 with --reasoning-parser=qwen3.",
        "owned_by": "Qwen",
        "source": "Qwen/Qwen3-32B",
        "source_url": "https://huggingface.co/Qwen/Qwen3-32B",
        "license": "Apache-2.0",
        "precision": "bfloat16",
        "framework": "vllm",
        "domain": "nlp",
        "subdomain": "large-language-model",
        "parameters": "32.8B dense, TP2",
        "tags": [
          "chat",
          "llm",
          "reasoning",
          "tool-calling",
          "multilingual",
          "agentic"
        ]
      }
    }
