# Qwen3-32B dense flagship: thinking mode, tool calling, 100+ languages.
# Weights (~65 GB) persist on NFS (nfs-models) so scale-from-zero cold starts skip
# re-download. Staged by the ISVC initContainer (gemma-4 venv-on-PVC pattern).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-32b
  namespace: models
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-models
  resources:
    requests:
      storage: 100Gi
