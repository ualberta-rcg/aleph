# medgemma-27b-it — Google MedGemma 27B IT (Gemma 3-based, medical multimodal).
# vLLM v0.20.2, BF16, TP2 on 2x L40S. SigLIP medical image encoder.
# Persisted helper venv + weights on RWX PVC (gemma-4 pattern); scale-to-zero, 15m idle.
# max-model-len=32768 (27B BF16 ~54GB on 2x L40S limits practical ctx; 32K for KV headroom).
# --disable-custom-all-reduce required for TP>=2 on HAMi (P2P busy-wait stall → NCCL).
# Gated: HF_TOKEN must have google/medgemma-27b-it access.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: medgemma-27b-it
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-down-delay: "5m"
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15m"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    minReplicas: 0
    maxReplicas: 1
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 300
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: setup
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            # Persisted helper venv on the PVC so cold starts skip the reinstall.
            if [ ! -d /data/venv/bin ]; then
                echo "Creating venv..."
                python3 -m venv /data/venv
                /data/venv/bin/pip install -U pip
                /data/venv/bin/pip install huggingface_hub
                echo "venv ready."
            else
                echo "venv exists, skipping."
            fi
            # Download weights to /data/model (skips if already present).
            if [ -f /data/model/config.json ]; then
                echo "medgemma-27b-it weights already on PVC, skipping download."
            else
                echo "Downloading google/medgemma-27b-it (gated) ..."
                /data/venv/bin/python3 -u <<'PY'
            import os
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="google/medgemma-27b-it",
                local_dir="/data/model",
                local_dir_use_symlinks=False,
                token=os.environ.get("HF_TOKEN"),
            )
            print("Download finished.", flush=True)
            PY
            fi
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: medgemma-27b-it
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.20.2
        command:
          - vllm
        args:
          - serve
          - /data/model
          - --served-model-name=medgemma-27b-it
          - --port=8080
          - --tensor-parallel-size=2
          - --max-model-len=32768
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.92
          - --trust-remote-code
          - '--limit-mm-per-prompt={"image": 5}'
          - --disable-custom-all-reduce
          - --max-num-seqs=4
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: medgemma-27b-it
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: medgemma-27b-it
        persistentVolumeClaim:
          claimName: medgemma-27b-it
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
