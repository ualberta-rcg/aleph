apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: medgemma-27b-it
  namespace: models
  annotations:
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: "900s"
    serving.knative.dev/progress-deadline: "2400s"
spec:
  predictor:
    minReplicas: 0
    scaleTarget: 3
    scaleMetric: concurrency
    timeout: 150
    nodeSelector:
      gpu: "on"
    initContainers:
      - name: hf-fetch
        image: python:3.11-slim
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        command:
          - bash
          - -c
        args:
          - |
            set -e
            pip install -q huggingface_hub
            python3 -u <<'PY'
            import os
            from pathlib import Path
            if Path("/data/config.json").is_file():
                print("Model already on PVC, skipping download.", flush=True)
            else:
                from huggingface_hub import snapshot_download
                print("Downloading google/medgemma-27b-it (gated; HF_TOKEN required) ...", flush=True)
                snapshot_download(
                    repo_id="google/medgemma-27b-it",
                    local_dir="/data",
                    local_dir_use_symlinks=False,
                    token=os.environ.get("HF_TOKEN"),
                )
                print("Download finished.", flush=True)
            PY
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: medgemma-27b-it
            mountPath: /data
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.8.4
        args:
          - --model=/data
          - --served-model-name=medgemma-27b-it
          - --port=8080
          - --tensor-parallel-size=2
          - --max-model-len=8192
          - --dtype=bfloat16
          - --gpu-memory-utilization=0.92
          - --trust-remote-code
          - --limit-mm-per-prompt=image=5
        env:
          - name: HF_HUB_CACHE
            value: /tmp/hf-cache
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "2"
            nvidia.com/gpumem: "40960"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
            nvidia.com/gpumem: "40960"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
          - name: medgemma-27b-it
            mountPath: /data
            readOnly: true
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: medgemma-27b-it
        persistentVolumeClaim:
          claimName: medgemma-27b-it
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
