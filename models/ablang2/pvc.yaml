# NOTE: AbLang-2 weights come from Zenodo (non-HF), so the RWX migration is DEFERRED to the last
# batch (will cp from this RWO PVC to a new RWX one to avoid a slow Zenodo re-download). This file
# matches the live bound PVC (ReadWriteOnce, nfs-client) for now — repo = live.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ablang2-data
  namespace: models
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
