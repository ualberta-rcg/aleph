# Venv + ablang2-paired weights persist on NFS (ReadWriteMany, nfs-models). NON-HF (Zenodo weights
# via the ablang2 package) — migrated RWO→RWX 2026-06-19 by copying from the old RWO PVC (ablang2-data)
# into this new RWX PVC (ablang2-data-rwx), NOT re-downloading (Zenodo is slow). The old ablang2-data
# PVC is deleted after the copy + repoint.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ablang2-data-rwx
  namespace: models
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-models
  resources:
    requests:
      storage: 2Gi
