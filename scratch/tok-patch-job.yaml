apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER-tokfix
  namespace: models
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: patch
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              import json
              p="/data/tokenizer_config.json"
              c=json.load(open(p))
              old=c.get("tokenizer_class")
              if old and "Llama" in old:
                  c["tokenizer_class"]="PreTrainedTokenizerFast"
                  json.dump(c,open(p,"w"))
                  print("patched tokenizer_class", old, "->", "PreTrainedTokenizerFast")
              else:
                  print("no change; tokenizer_class=", old)
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: PLACEHOLDER-data
